# Analysis binding for the SELF-BIASED 3-stage SMC OTA (no ibias port) — uses the class's
# ibias-free template variant so no external current source is left driving a dangling node.
# Two-tone IIP3 in the unity buffer: 6.25 mV tones at 90/100 kHz share the F0 = gcd = 10 kHz
# fundamental (n1=9, n2=10), so the IM3 products at 80/110 kHz (bins 8/11) and the IM5
# products at 70/120 kHz (bins 7/12) land on exact F0 bins — the in-deck coherent DFT then
# has no leakage. GRID: fresh ac_open_loop @ ihp-sg13g2 tt (2026-08-01, landed sizing) reads
# ugf = 6.64 MHz — the 3-30 MHz campaign band, so the whole 0.9/1.0 MHz default grid is
# divided by 10 (9:10 tone ratio kept exactly).
# COHERENT WINDOW: TSTART = 100u = 1 whole beat period (1/F0), >> 20x the measured 170.8 ns
# settling (tran_step t_settle, same run) — the integer-beat contract is load-bearing;
# TSTOP-TSTART = 2m = 20 beat periods; TSTEP = 50n = 1/(200*F2).
# DRIVE: ASIG = 6.25 mV per tone — the class default (see the iip3.spice header's measured
# valid-window sweep). Plain decimal (0.00625), never a SPICE suffix — ASIG/F0/F1/F2 reach
# .control arithmetic.
# REPORTING: `produces:` stays empty DELIBERATELY — it names datasheet metric ids and the
# datasheet binds iip3_dbv through its own extract block. The measures (iip3_dbv, im3_dbc,
# a_f1/a_f2/a_drv, gain_tone, a_im3l/h, a_im5l/h, a_floor, im5_im3_db, iip3_comp_db) ride
# the recorded `corners.<corner>.analyses.iip3.measures` block. TRUST CHECKS: a_im3 must sit
# well above a_floor; gain_tone < 0.5 means the dead-output guard fired and iip3_dbv is the
# -999 sentinel.
schema: spicexplorer/analysis@1
id: iip3
template: iip3_selfbias
description: "IIP3 — two-tone intermodulation intercept; tran+coherent DFT (ngspice) / native PSS (Spectre)."
enabled: true
params: {VDD: 1.8, VCM: 300m, CL: 10p, ASIG: 0.00625, F0: 1.0e4, F1: 0.9e5, F2: 1.0e5, TSTEP: 50n, TSTART: 100u, TSTOP: 2.1m}
flags: []
produces: []
