# Sizing for the sky130 binding — geometry re-noted to sky130's bare-µm convention and clamped to
# the sky130 W/L bin floor (min_w 0.42, min_l 0.15). Same abstract symbols + pair W-ratio as ihp.
schema: spicexplorer/sizing@1
pdk: sky130
variables:
  - {name: x_dut_xm3_w, description: "PMOS mirror device width",       default: 2, min: 0.42, max: 30, unit: m}
  - {name: x_dut_xm3_l, description: "PMOS mirror device length",      default: 1, min: 0.15, max: 20, unit: m}
  - {name: x_dut_xm0_w,    description: "Degenerated NMOS (XM0) width",   default: 8, min: 0.42, max: 30, unit: m}
  - {name: x_dut_xm1_w,  description: "Diode NMOS (XM1) width",         default: 2, min: 0.42, max: 30, unit: m}
  - {name: x_dut_xm0_l,   description: "NMOS pair length",              default: 1, min: 0.15, max: 20, unit: m}
  - {name: x_r0,        description: "Degeneration resistor (ohms)",   default: 20000, min: 1000, max: 500000, unit: ohm}
  # Frozen per-device literals (P4 atomic sweep): defaults reproduce the authored
  # netlist literals exactly; freeze keeps them out of the search space.
  - {name: x_dut_xm3_m, description: "XM3 m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
  - {name: x_dut_xm4_m, description: "XM4 m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
  - {name: x_dut_xm0_m, description: "XM0 m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
  - {name: x_dut_xm1_m, description: "XM1 m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
