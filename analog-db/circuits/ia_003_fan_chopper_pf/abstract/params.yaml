groups:
- name: pair_xm2_xm3
  kind: matched_pair
  members: [XM2, XM3]
  tie: [w, l, m]
  description: PMOS input differential pair of the embedded core (structural detection; shared source
    = tail).
- name: pair_xm4_xm5
  kind: shared_geometry
  members: [XM4, XM5]
  tie: [w, l, m]
  description: First-stage NMOS current sinks at the two fold nodes (gates on vb1) — symmetric halves.
- name: pair_xm12_xm13
  kind: shared_geometry
  members: [XM12, XM13]
  tie: [w, l, m]
  description: Folded NMOS cascodes over the two first-stage output branches (gates on vb2).
- name: pair_xm10_xm11
  kind: shared_geometry
  members: [XM10, XM11]
  tie: [w, l, m]
  description: PMOS cascodes of the first-stage load (gates on vb3).
- name: pair_xm6_xm7
  kind: shared_geometry
  members: [XM6, XM7]
  tie: [w, m]
  description: PMOS fold current sources (gates on vb4); L tied through sources_vb4_l.
- name: pair_xm8_xm9
  kind: shared_geometry
  members: [XM8, XM9]
  tie: [w, m]
  description: Class-A output PMOS current sources (gates on vb4); L tied through sources_vb4_l.
- name: sources_vb4_l
  kind: shared_geometry
  members: [XM1, XM6, XM7, XM8, XM9]
  tie: [l]
  description: All vb4-gated PMOS current sources (tail + fold sources + output sources) share one gate
    net — same L so their current densities track off the single bias level (mirror-style tie; the kind
    checker requires a diode-connected anchor for mirror_length, and vb4 is a knob source).
- name: pair_xm14_xm15
  kind: shared_geometry
  members: [XM14, XM15]
  tie: [w, l, m]
  description: Class-A output NMOS common-source devices (gates on the output-chopper nodes g2_p/g2_n).
- name: chout_tg_nmos
  kind: shared_geometry
  members: [XM16, XM18, XM32, XM34]
  tie: [w, l, m]
  description: NMOS pass devices of the embedded output chopper's four transmission gates (straight XM16/XM18
    + cross XM32/XM34) — all gates must match for symmetric on-resistance and charge injection across
    both chop phases.
- name: chout_tg_pmos
  kind: shared_geometry
  members: [XM17, XM19, XM33, XM35]
  tie: [w, l, m]
  description: PMOS pass devices of the embedded output chopper's four gates (straight + cross); n and
    p halves stay independent (different mobility).
- name: chin_tg_nmos
  kind: shared_geometry
  members: [XM24, XM26, XM36, XM38]
  tie: [w, l, m]
  description: NMOS pass devices of the input chopper's four gates (straight XM24/XM26 + cross XM36/XM38)
    — gate symmetry on the differential signal across both chop phases.
- name: chin_tg_pmos
  kind: shared_geometry
  members: [XM25, XM27, XM37, XM39]
  tie: [w, l, m]
  description: PMOS pass devices of the input chopper's four gates (straight + cross).
- name: chfb_chpf_tg_nmos
  kind: shared_geometry
  members: [XM20, XM22, XM28, XM30, XM40, XM42, XM44, XM46]
  tie: [w, l, m]
  description: NMOS pass devices of the two output-tapping choppers (feedback straight XM20/XM22 + cross
    XM40/XM42; positive feedback straight XM28/XM30 + cross XM44/XM46) — one drawn chopper-diff cell reused,
    all eight gates hang on voutp/voutn, so the whole set ties (also covers the structural matched-pair
    detections among gates sharing voutp/voutn as source nets).
- name: chfb_chpf_tg_pmos
  kind: shared_geometry
  members: [XM21, XM23, XM29, XM31, XM41, XM43, XM45, XM47]
  tie: [w, l, m]
  description: PMOS pass devices of the two output-tapping choppers (feedback + positive feedback, straight
    + cross); n and p halves stay independent (different mobility).
- name: pair_cin
  kind: shared_geometry
  members: [CIN1, CIN2]
  tie: [Value]
  description: Input coupling caps — the two legs must match; sets the closed-loop gain numerator (gain
    = Cin/Cfb).
- name: pair_cfb
  kind: shared_geometry
  members: [CFB1, CFB2]
  tie: [Value]
  description: Feedback caps — the two legs must match; sets the closed-loop gain denominator.
- name: pair_cpf
  kind: shared_geometry
  members: [CPF1, CPF2]
  tie: [Value]
  description: Positive-feedback caps — the two legs must match; Cpf = Cfb is the drawn input-impedance-boost
    intent (Fan et al. §II-B).
- name: pair_cm
  kind: shared_geometry
  members: [CM1, CM2]
  tie: [Value]
  description: Per-side Miller caps must match (the originally-drawn Cm_1=1p (now symbolic Cm at source, DRAWING_REVIEW item 5) was an unedited xschem default; Cm_2
    was symbolic Cm).
- name: pair_rb
  kind: shared_geometry
  members: [RB1, RB2]
  tie: [Value]
  description: Summing-node bias resistors to vref — the two legs must match (input CM + high-pass corner
    symmetry).
