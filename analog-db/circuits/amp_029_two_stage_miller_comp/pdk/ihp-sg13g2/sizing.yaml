# Design variables for the ihp-sg13g2 binding. Hand-seeded gm/ID floor at VDD=1.2 V
# (~10 uA/side stage 1, ~30 uA/side stage 2) — the source drawing used identical
# minimum-size devices and a 1 mA bias literal. Group representatives only (see
# abstract/params.yaml): XM2<-XM1, XM4<-XM3, XM9<-XM5, XM10<-XM7 (w,m), R2<-R1,
# C2<-C1, l(XM7/XM10/XM8)<-XM6.
# vbl is the KNIFE-EDGE stage-1 CM knob (no CMFB drawn — see the netlist header):
# XM3/XM4's current at vsg=VDD-vbl must equal tail/2 at gds level.
schema: spicexplorer/sizing@1
pdk: ihp-sg13g2
variables:
  - {name: x_dut_xm1_w,  description: "NMOS input pair width", default: 10u, min: 0.15u, max: 100u, unit: m}
  - {name: x_dut_xm1_l,  description: "NMOS input pair length", default: 0.5u, min: 0.13u, max: 10u, unit: m}
  - {name: x_dut_xm3_w,  description: "Stage-1 PMOS current-source load width", default: 10u, min: 0.15u, max: 100u, unit: m}
  - {name: x_dut_xm3_l,  description: "Stage-1 load length (long for load gds)", default: 1u, min: 0.13u, max: 10u, unit: m}
  - {name: x_dut_xm5_w,  description: "Stage-2 PMOS driver width", default: 12u, min: 0.15u, max: 100u, unit: m}
  - {name: x_dut_xm5_l,  description: "Stage-2 PMOS driver length", default: 0.5u, min: 0.13u, max: 10u, unit: m}
  - {name: x_dut_xm6_w,  description: "Bias diode width (ref current density)", default: 2u, min: 0.15u, max: 50u, unit: m}
  - {name: x_dut_xm6_l,  description: "Bias diode length (mirror L for tail + sinks)", default: 1u, min: 0.13u, max: 10u, unit: m}
  - {name: x_dut_xm7_w,  description: "Output sink width (mirror ratio vs XM6 sets stage-2 current)", default: 6u, min: 0.15u, max: 100u, unit: m}
  - {name: x_dut_xm8_w,  description: "Tail mirror width (ratio vs XM6 sets the tail current)", default: 2u, min: 0.15u, max: 100u, unit: m}
  - {name: x_dut_r1_value, description: "Per-side Miller zero-nulling resistor", default: 30k, min: 100, max: 50k, unit: ohm}
  - {name: x_dut_c1_value, description: "Per-side Miller compensation cap (0.3p: the open-CM settle tail scales with the Miller cap — 1p put t_settle at 9.3 us vs the 5 us spec; 0.3p settles 3.1 us with pm 77)", default: 0.4p, min: 0.05p, max: 20p, unit: F}
  - {name: i_bias, description: "Bias reference current into the XM6 diode (drawn as a 1 mA literal — re-seeded)", default: 20u, min: 1u, max: 500u, unit: A}
  - {name: vbl, description: "Stage-1 PMOS load gate bias (the drawing's floating net X; knife-edge CM knob; see notes — the tt interior window is ~0.2 mV wide, so this default is centered to 4 decimals; ANY perturbation rails the OP, which is the structural cm_interior_pts finding)", default: 0.7087, min: 0.0, max: 1.2, unit: V}
  # Frozen per-device m literals
  - {name: x_dut_xm1_m, description: "XM1 m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
  - {name: x_dut_xm3_m, description: "XM3 m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
  - {name: x_dut_xm5_m, description: "XM5 m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
  - {name: x_dut_xm6_m, description: "XM6 m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
  - {name: x_dut_xm7_m, description: "XM7 m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
  - {name: x_dut_xm8_m, description: "XM8 m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
