schema: spicexplorer/datasheet@1
cace_format: '5.2'
default_conditions:
  supply:
    unit: V
    typical: 1.5
  vcm:
    unit: V
    typical: 0.5
  ibias:
    unit: A
    typical: 0
  cload:
    unit: pF
    typical: 10
  corner:
    typical: tt
  temp:
    unit: degC
    typical: 27
metrics:
  dc_gain_db:
    display: DC open-loop gain (bias-wrapped)
    unit: dB
    analysis: ac_open_loop
    extract:
      meas: dcgain
    spec:
      min: 40
      unit: dB
  ugf_hz:
    display: Unity-gain frequency (100 nA into 10 pF)
    unit: Hz
    analysis: ac_open_loop
    extract:
      meas: ugf
    spec:
      unit: Hz
      min: 2000000.0
  pm_deg:
    display: Phase margin
    unit: deg
    analysis: ac_open_loop
    extract:
      meas: pm
    spec:
      unit: deg
      min: 60.0
      max: 90
  cmrr_db:
    display: Common-mode rejection
    description: CMRR in the unity-buffer config, DC-band floor (gap fill 2026-07-24).
    unit: dB
    analysis: cmrr_vcm
    extract:
      meas: cmrr_db
    spec:
      min: 40
      unit: dB
  psrr_vdd_db:
    display: Positive-supply rejection
    description: PSRR+ in the unity-buffer config, DC-band floor (gap fill 2026-07-24).
    unit: dB
    analysis: psrr_vdd
    extract:
      meas: psrr_vdd_db
    spec:
      min: 40.0
      unit: dB
  i_supply:
    display: Supply current
    unit: A
    analysis: dc_op
    extract:
      meas: i_supply
    spec:
      max: 5.0e-06
      unit: A
  vn_in_integrated:
    display: Total integrated input-referred noise (1 Hz - 1 MHz, buffer)
    description: ngspice inoise_total is volts rms already integrated over the swept
      band (standardized 1 Hz - 1 MHz, unity-buffer bias config, CL=10p) — the paper's
      uniform noise column. Replaces the old vn_in entry, which bound the same measure
      under V/sqrt(Hz) (dimensionally wrong; inoise_total is not a spot density).
    unit: V
    analysis: noise
    extract:
      meas: inoise_total
  t_settle:
    display: Unity-gain step settling time (0.2 V step)
    unit: s
    analysis: tran_step
    extract:
      meas: t_settle
    spec:
      max: 0.0005
      unit: s
  thd_pct:
    display: Total harmonic distortion (100 mV @ 10 kHz, buffer)
    description: tran+FFT on ngspice; native PSS harmonics on Spectre. F0 = 10 kHz —
      the campaign grid for this sub-3-MHz cell (fresh ugf 152 kHz @ ihp-sg13g2 tt,
      2026-08-01); ~15x under the closed-loop rolloff, same in-band placement as
      amp_022 at its bandwidth.
    unit: '%'
    analysis: thd
    extract:
      meas: thd_pct
      f0: 1.0e4
    spec:
      max: 2.0
      unit: '%'
  iip3_dbv:
    display: Input IP3 (two-tone 9/10 kHz, 6.25 mV/tone, buffer)
    description: Single-point IM3 extrapolation; tran+coherent DFT on ngspice, native
      PSS on Spectre. Tones on the campaign grid for this sub-3-MHz cell (fresh ugf
      152 kHz), exact 9:10 ratio so IM3/IM5 land on F0 = 1 kHz bins. ampl_in below
      MUST track the analysis binding's ASIG (it is the intercept's input reference).
    unit: dBV
    analysis: iip3
    extract:
      meas: iip3_dbv
      f1: 9.0e3
      f2: 1.0e4
      ampl_in: 0.00625
    spec:
      min: -10
      unit: dBV
  pm_loop_deg:
    display: Loop phase margin (stb, unity buffer)
    description: Phase margin of the Middlebrook-probed buffer loop (VIPRB marker);
      crosschecks ac_open_loop's pm_deg. -999 sentinel = no crossover (fails the min
      spec by design). Spec floor mirrors the existing pm_deg min.
    unit: deg
    analysis: stb
    extract:
      meas: pm_loop
    spec:
      min: 60
      unit: deg
  loopgain_db:
    display: DC loop gain (stb, unity buffer)
    description: Loop-gain magnitude read at FSTART; crosschecks ac_open_loop's
      dcgain. Report-only.
    unit: dB
    analysis: stb
    extract:
      meas: loopgain_db
  ugf_loop_hz:
    display: Loop unity-gain frequency (stb)
    unit: Hz
    analysis: stb
    extract:
      meas: ugf_loop
  gm_loop_db:
    display: Loop gain margin (stb)
    description: Gain margin at the phase crossover; ngspice measure name is gm_loop
      (the Spectre bench emits gm_loop_db — the split is absorbed here). -999 sentinel =
      no phase crossover in-band. Report-only.
    unit: dB
    analysis: stb
    extract:
      meas: gm_loop
