# Analysis binding for the SELF-BIASED 3-stage NMCF OTA (no ibias port — internal I0
# bias) — uses the class's ibias-free template variant so no external current source is
# left driving a dangling node.
# Loop-gain / stability probe in the unity buffer: ngspice does Middlebrook voltage
# injection at the VIPRB marker (`alter @VIPRB[acmag]=1` in .control — netlist bytes
# unchanged); the Spectre lane composes a native `stb stb probe=VIPRB` off the same
# marker. Injection at the DC-short keeps the op point the CLOSED-loop buffer one.
# FSTART = 0.01 Hz is the class value (see the stb template's "CHOOSING FSTART").
# MEASURED @ ihp-sg13g2 tt (2026-08-01, this sizing): pm_loop = 62.734 deg vs the fresh
# same-day ac_open_loop pm = 62.807 deg (delta 0.07 deg — two independent routes probing
# the same loop); ugf_loop = 3.1635 MHz vs ugf = 3.1640 MHz (~0.02%); loopgain_db =
# 89.355 = the ac_open_loop dcgain bit-identical; phref_dev = -5.0e-3 deg. gm_loop =
# +15.88 dB is a REAL in-band -180 deg crossing (3-stage loop), not the -999 sentinel.
# REPORTING: `produces:` names DATASHEET METRIC IDS — the loop metrics are now canonical
# (_shared/classes/amplifier/metrics.yaml) and wired in datasheet.yaml. The measures
# (loopgain_db, ugf_loop, pm_loop, gm_loop, pm_loop_first, phref_dev, phref_ok) ride the
# recorded `corners.<corner>.analyses.stb.measures` block. pm_loop = -999 is the "no
# crossing measured" sentinel; phref_ok = 0 says the phase-reference guard tripped.
schema: spicexplorer/analysis@1
id: stb
template: stb_selfbias
description: "Loop gain (stb) of the unity buffer — loopgain_db/ugf_loop/pm_loop/gm_loop; Middlebrook injection at VIPRB on ngspice, native stb on Spectre."
# FSTART 0.01 -> 1e-4 (2026-08-04): the stb bench anchors phase at its first swept point and
# blanks pm_loop/gm_loop to the -999 sentinel when |phref_dev| > 30 deg. For a high-gain amp
# the dominant pole f_p = UGF/A0 is sub-Hz, so 0.01 Hz already sits PAST it — and because
# every stabilising move lowers UGF (hence f_p), the guard fires HARDER on a correct fix than
# on the broken design. Measured on amp_006@gf180: the committed (unstable) sizing reports
# pm_loop -16.5, while the stabilised one reports -999 at 0.01 Hz and +66.0 at 1e-4. pm_loop
# and gm_loop are FSTART-INVARIANT; only the guard moves.
params:
  VDD: 1.8
  VCM: 0.3
  CL: 10p
  FSTART: 1e-4     # class value; see the stb template's "CHOOSING FSTART"
  FSTOP: 1G
  PPD: 101
flags: []
produces: [pm_loop_deg, loopgain_db, ugf_loop_hz, gm_loop_db]
