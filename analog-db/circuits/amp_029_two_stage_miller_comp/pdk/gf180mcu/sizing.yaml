# Sizing for the gf180mcu binding — generated by `analog-db add-binding` from the
# ihp-sg13g2 sizing (geometry re-noted to gf180mcu's unit convention + bin-clamped).
# A starting point; re-tune defaults/bounds for gf180mcu device physics as needed.
schema: spicexplorer/sizing@1
pdk: gf180mcu
variables:
- name: x_dut_xm1_w
  description: NMOS input pair width
  default: 10u
  min: 0.22u
  max: 100u
  unit: m
- name: x_dut_xm1_l
  description: NMOS input pair length
  default: 0.5u
  min: 0.28u
  max: 10u
  unit: m
- name: x_dut_xm3_w
  description: Stage-1 PMOS current-source load width
  default: 10u
  min: 0.22u
  max: 100u
  unit: m
- name: x_dut_xm3_l
  description: Stage-1 load length (long for load gds)
  default: 1u
  min: 0.28u
  max: 10u
  unit: m
- name: x_dut_xm5_w
  description: Stage-2 PMOS driver width
  default: 12u
  min: 0.22u
  max: 100u
  unit: m
- name: x_dut_xm5_l
  description: Stage-2 PMOS driver length
  default: 0.5u
  min: 0.28u
  max: 10u
  unit: m
- name: x_dut_xm6_w
  description: Bias diode width (ref current density)
  default: 2u
  min: 0.22u
  max: 50u
  unit: m
- name: x_dut_xm6_l
  description: Bias diode length (mirror L for tail + sinks)
  default: 1u
  min: 0.28u
  max: 10u
  unit: m
- name: x_dut_xm7_w
  description: Output sink width (mirror ratio vs XM6 sets stage-2 current)
  default: 6u
  min: 0.22u
  max: 100u
  unit: m
- name: x_dut_xm8_w
  description: Tail mirror width (ratio vs XM6 sets the tail current)
  default: 2u
  min: 0.22u
  max: 100u
  unit: m
- name: x_dut_r1_value
  description: Per-side Miller zero-nulling resistor
  default: 45k
  min: 100
  max: 50k
  unit: ohm
- name: x_dut_c1_value
  description: "Per-side Miller compensation cap (0.3p: the open-CM settle tail scales with the Miller\
    \ cap \u2014 1p put t_settle at 9.3 us vs the 5 us spec; 0.3p settles 3.1 us with pm 77)"
  default: 0.4p
  min: 0.05p
  max: 20p
  unit: F
- name: i_bias
  description: "Bias reference current into the XM6 diode (drawn as a 1 mA literal \u2014 re-seeded)"
  default: 20u
  min: 1u
  max: 500u
  unit: A
- name: vbl
  description: "Stage-1 PMOS load gate bias (the drawing's floating net X; knife-edge CM knob; see notes\
    \ \u2014 the gf180mcu tt interior window at VDD=3.3/VCM=1.65 is ~12 uV wide (2.283293-2.283305,\
    \ 1 uV dc sweep 2026-08-03), so this default is centered to 6 decimals; ANY perturbation rails\
    \ the OP, which is the structural cm_interior_pts finding)"
  default: 2.283299
  min: 0.0
  max: 3.3
  unit: V
- name: x_dut_xm1_m
  description: XM1 m (frozen literal)
  default: 1
  min: 1
  max: 16
  freeze: true
  is_integer: true
- name: x_dut_xm3_m
  description: XM3 m (frozen literal)
  default: 1
  min: 1
  max: 16
  freeze: true
  is_integer: true
- name: x_dut_xm5_m
  description: XM5 m (frozen literal)
  default: 1
  min: 1
  max: 16
  freeze: true
  is_integer: true
- name: x_dut_xm6_m
  description: XM6 m (frozen literal)
  default: 1
  min: 1
  max: 16
  freeze: true
  is_integer: true
- name: x_dut_xm7_m
  description: XM7 m (frozen literal)
  default: 1
  min: 1
  max: 16
  freeze: true
  is_integer: true
- name: x_dut_xm8_m
  description: XM8 m (frozen literal)
  default: 1
  min: 1
  max: 16
  freeze: true
  is_integer: true

# Per-PDK re-bias (platform convention: analyses params are the AUTHORED operating point;
# per-PDK deltas live here — pattern: amp_017_tan_clia/pdk/FOUNDRY-n65). amp_029 is authored
# on the ihp-sg13g2 1.2 V rail; gf180mcu's 03v3 devices (VT ~0.7-0.8 V) cannot bias a
# two-stage + tail stack at 1.2 V, so this binding runs the 3.3 V device-nominal rail,
# VCM at mid-rail. vbl re-centered for this rail (see its entry).
analysis_params:
  VDD: 3.3
  VCM: 1.65
