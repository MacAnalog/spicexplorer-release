# ldo_010_capless_lowiq — DUT parameterization (spicexplorer/params@1; contract: _shared/PARAMS.md).
#
# DO NOT run `analog-db gen-params --circuit ldo_010_capless_lowiq --write` on this entry.
# Everywhere else `devices:` is GENERATED from abstract/topology.cgraph.json and a refresh is
# free; here it is AUTHORED, because this entry carries the certified design's DRAWN DEVICE SET
# rather than the schematic shorthand. The generator's params@1 rule D-1 gives every MOS field
# its own mechanical per-instance symbol (`x_dut_xm1a_w`), and that rule cannot express the three
# things this port depends on:
#
#   * one sizing symbol shared across the half-width cards of a common-centroid pair
#     (`XM1A`/`XM1B` are the two halves of ONE device: `w: '{x_dut_xm1_w/2}'`);
#   * `l` shared with the device a card mirrors (`XM6`/`XMT` take `x_dut_xmbp_l`);
#   * the pass device's finger split (`x_dut_xmp_nf_mult` divides w and multiplies m).
#
# A refresh would replace all of that with 30-odd new free symbols that have no sizing.yaml row
# (Tier-1 `params:sizing` turns red) and would silently re-lower the certified point to a
# different device set. The rows below are the netlist's OWN bindings, echoed verbatim, so the
# generated deck reproduces `decks/candidate/` device for device.
#
# `groups:`/`ratios:` are AUTHORED default tying (plan D-2). This entry declares NONE on purpose:
# the tie block would shadow the bindings above, and the certified point already carries its
# matching in the netlist. `gen-params` reports the untied mirrors it detects as warnings — they
# are the intended state here, not a to-do.
