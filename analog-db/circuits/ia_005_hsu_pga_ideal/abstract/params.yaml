  description: Bit-D1 switched cap of each bank (m=2) — cross-bank side matching.
- name: caps_bit2_m
  kind: shared_geometry
  members: [CA4, CB4]
  tie: [m]
  description: Bit-D2 switched cap of each bank (m=4) — cross-bank side matching.
