# amp_033_ti_ldo_ref_selfbias — DUT parameterization (spicexplorer/params@1; contract: _shared/PARAMS.md).
# `devices:` is GENERATED from abstract/topology.cgraph.json — refresh with
# `analog-db gen-params --circuit amp_033_ti_ldo_ref_selfbias --write` (it preserves the authored sections).
# `groups:`/`ratios:` are AUTHORED default tying, reviewed by a human (plan D-2):
# recommendations tagged with WHY, which an upstream user may accept, edit, or dissolve.
schema: spicexplorer/params@1
devices:
  CC: {Value: c_comp}
  RZ: {Value: r_z}
  XM1: {l: x_dut_xm1_l, w: x_dut_xm1_w}
  XM2: {l: x_dut_xm2_l, w: x_dut_xm2_w}
  XM3: {l: x_dut_xm3_l, w: x_dut_xm3_w}
  XM4: {l: x_dut_xm4_l, w: x_dut_xm4_w}
  XM5: {l: x_dut_xm5_l, w: x_dut_xm5_w}
  XMB0: {l: x_dut_xmb0_l, w: x_dut_xmb0_w}
  XMBC: {l: x_dut_xmbc_l, m: x_dut_xmbc_m, w: x_dut_xmbc_w}
  XMBO: {l: x_dut_xmbo_l, m: x_dut_xmbo_m, w: x_dut_xmbo_w}
  XMBP: {l: x_dut_xmbp_l, w: x_dut_xmbp_w}
groups:
- name: pair_xm3_xm4
  kind: matched_pair
  members: [XM3, XM4]
  tie: [w, l]
  description: 'PMOS current-mirror load. AUTHORED OVERRIDE of the generator''s proposal, which
    tied only [l] (kind: mirror_length). Width MUST be tied too: a 1:1 mirror load with unequal
    widths forces the two first-stage branches to unequal currents, which the loop corrects by
    developing an input-referred SYSTEMATIC OFFSET. Low offset is this block''s entire reason for
    existing (it sets the LDO output level, and vos lands at VOUT x (R1+R2)/R2), so the mirror
    ratio is not something to hand the optimizer. Contrast amp_032, where an intentionally ratioed
    sink buys headroom and costs ~93 mV of irreducible offset.'
- name: pair_xm1_xm2
  kind: matched_pair
  members: [XM1, XM2]
  tie: [w, l]
  description: 'Input differential pair - must match or the amp has a systematic offset.'
- name: mirror_xmb0_l
  kind: mirror_length
  members: [XMB0, XMBC, XMBO]
  tie: [l]
  description: 'Bias diode + tail sink + output sink share one channel length (mirror matching).
    Widths stay INDEPENDENT on purpose: the tail-to-output current ratio is the primary gm1-vs-gm5
    lever (UGF vs phase margin) in a two-stage Miller amp, so tying the widths would remove the
    main compensation degree of freedom.'
