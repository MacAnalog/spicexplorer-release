# Design variables for the ihp-sg13g2 binding. Validated against sizing.schema.json.
# 28nm geometry re-noted to 130nm lv devices; per-finger widths with upstream ratios (tail 2x
# diode, pass 80u -> m=20 x 8u = 160 um). The va_vref's 10 kohm rout is kept as x_rref.
schema: spicexplorer/sizing@1
pdk: ihp-sg13g2
variables:
  - {name: x_dut_xmnb_w,   description: "NMOS bias diode / tail width (tail m=2)", default: 4u, min: 0.18u, max: 50u, unit: m}
  - {name: x_dut_xmnb_l,   description: "NMOS bias length",                     default: 0.4u, min: 0.13u, max: 10u, unit: m}
  - {name: x_dut_xmip_w,   description: "5T pair width (per finger, m=2)",      default: 8u,   min: 0.18u, max: 50u, unit: m}
  - {name: x_dut_xmip_l,   description: "5T pair length",                       default: 0.4u, min: 0.13u, max: 10u, unit: m}
  - {name: x_dut_xmld_w,   description: "PMOS mirror load width",               default: 4u,   min: 0.18u, max: 50u, unit: m}
  - {name: x_dut_xmld_l,   description: "PMOS mirror load length",              default: 0.4u, min: 0.13u, max: 10u, unit: m}
  - {name: x_dut_xmp_w, description: "PMOS pass width (per finger, m=20)",   default: 8u,   min: 0.18u, max: 50u, unit: m}
  - {name: x_dut_xmp_l, description: "PMOS pass length",                     default: 0.2u, min: 0.13u, max: 10u, unit: m}
  - {name: x_cmil,   description: "Miller cap vout -> pass gate (F)",     default: 2e-12, min: 1e-13, max: 2e-11, unit: F}
  - {name: x_cout,   description: "On-board output decap (F)",            default: 50e-12, min: 1e-12, max: 5e-10, unit: F}
  - {name: x_rbleed, description: "No-load bleed resistor (ohms)",       default: 1e5,  min: 1e4, max: 1e7, unit: ohm}
  - {name: x_rref,   description: "Reference output resistance (ohms)",   default: 10000, min: 100, max: 1e5, unit: ohm}
  - {name: x_vref_val,  description: "Internal ideal reference (V)",      default: 0.9,  min: 0.4, max: 1.2, unit: V, freeze: true}
  - {name: x_ibias_val, description: "Internal bias current (A)",         default: 20e-6, min: 1e-6, max: 1e-4, unit: A, freeze: true}
  # Frozen per-device literals (P4 atomic sweep): defaults reproduce the authored
  # netlist literals exactly; freeze keeps them out of the search space.
  - {name: x_dut_xmnb_m, description: "XMNB m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
  - {name: x_dut_xmnt_m, description: "XMNT m (frozen literal)", default: 2, min: 1, max: 16, freeze: true, is_integer: true}
  - {name: x_dut_xmip_m, description: "XMIP m (frozen literal)", default: 2, min: 1, max: 16, freeze: true, is_integer: true}
  - {name: x_dut_xmin_m, description: "XMIN m (frozen literal)", default: 2, min: 1, max: 16, freeze: true, is_integer: true}
  - {name: x_dut_xmld_m, description: "XMLD m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
  - {name: x_dut_xmlm_m, description: "XMLM m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
  - {name: x_dut_xmp_m, description: "XMP m (frozen literal)", default: 20, min: 1, max: 20, freeze: true, is_integer: true}
