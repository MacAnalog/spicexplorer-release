# Datasheet (plan D-3/D-5/D-12). Validated against _shared/schema/datasheet.schema.json.
# SUPERSET of cace_format 5.2. See _shared/CACE_FORMAT.md for the field-overlap mapping (O-1).
# Spec bands are sanity targets for the hand-seeded behavioral defaults (see
# pdk/*/sizing.yaml), not the Hsu-paper numbers — the paper characterizes the full CCIA.
# Re-classed support -> cmfb 2026-07-20 (was sup_002_cmfb_servo): full cmfb-class suite
# bound. This member is the INVERTED-polarity behavioral servo (vcmfb = A*(vref-sensed))
# — cmfb_slope and step_delta_v spec bands are NEGATIVE on purpose (the polarity IS the
# spec). Unclamped-macromodel caveats: no output rails (vcmfb_min/max not produced) and
# vcmfb_nat rests at 0 V (its vss reference), unlike a real error amp whose natural
# output sits mid-rail (cmfb_002/003).
schema: spicexplorer/datasheet@1
cace_format: "5.2"
default_conditions:
  supply: {unit: V, typical: 1.2}
  cload:  {unit: fF, typical: 50}
  corner: {typical: tt}
  temp:   {unit: degC, typical: 27}
  vcm:    {unit: V, typical: 0.6}
metrics:
  cmfb_slope:
    display: "Signed CM transfer slope"
    description: "d(vcmfb)/d(vcm_sense) at vref, two-point +/-20 mV — NEGATIVE (inverted polarity, ~ -gm*rout = -1000); the sign is the polarity contract for non-inverting plants (B5 rule)"
    unit: V/V
    analysis: dc_cmfb_transfer
    extract: {meas: cmfb_slope}
    spec: {max: -500, unit: V/V}
  gain_servo_db:
    display: "CM servo path gain"
    description: "Common-mode sense -> vcmfb low-frequency gain (both inputs AC-driven together about VCM), db(v(vcmfb)) at FSTART"
    unit: dB
    analysis: ac_servo
    extract: {meas: gain_servo_db}
    spec: {min: 40, unit: dB}
  bw_servo_hz:
    display: "CM servo -3 dB bandwidth"
    description: "-3 dB rolloff of the servo transfer into the 50 fF control-node load"
    unit: Hz
    analysis: ac_servo
    extract: {meas: bw_servo_hz}
    spec: {min: 1.0e5, unit: Hz}
  ugf_servo_hz:
    display: "CM servo unity-gain frequency"
    description: "|servo transfer| 0 dB crossing into 50 fF (single-pole: ~gain*pole ~ 106 MHz)"
    unit: Hz
    analysis: ac_servo
    extract: {meas: ugf_servo_hz}
    spec: {min: 5.0e7, unit: Hz}
  vcmfb_nat:
    display: "Zero-error natural output"
    description: "vcmfb at sensed == vref: 0 V for this macromodel (rests at its vss reference) — a real error amp's actuator-matching level sits mid-rail instead"
    unit: V
    analysis: dc_cmfb_transfer
    extract: {meas: vcmfb_nat}
    spec: {min: -0.05, max: 0.05, unit: V}
  step_delta_v:
    display: "Step response settled shift"
    description: "Settled vcmfb shift for a +1 mV sensed-CM step — NEGATIVE (time-domain polarity cross-check of cmfb_slope; ~ -1 V for the gain-1000 macromodel)"
    unit: V
    analysis: tran_cmfb_step
    extract: {meas: step_delta_v}
    spec: {max: -0.5, unit: V}
  ring_v:
    display: "Plateau ringing half-amplitude"
    description: "(max-min)/2 of vcmfb over the settled half of the step plateau — ~0 for this single-pole servo; >0 flags an underdamped error amp"
    unit: V
    analysis: tran_cmfb_step
    extract: {meas: ring_v}
    spec: {max: 0.01, unit: V}
  t_cm_settle:
    display: "Step release settle time"
    description: "Release-edge recovery to |vcmfb - final| < 1 mV (time constant rout*(cout+CL) = 1.5 us -> ~7 tau = 10 us)"
    unit: s
    analysis: tran_cmfb_step
    extract: {meas: t_cm_settle}
    spec: {max: 5.0e-5, unit: s}
  i_supply:
    display: "Supply current"
    description: "op supply draw — ~0: the behavioral macromodel leaves vdd no-connect (realization honesty check)"
    unit: A
    analysis: dc_cmfb_transfer
    extract: {meas: i_supply}
    spec: {max: 1.0e-9, unit: A}
