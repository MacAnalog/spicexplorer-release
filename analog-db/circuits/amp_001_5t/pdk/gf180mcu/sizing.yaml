# Sizing for the gf180mcu binding — generated by `analog-db add-binding` from the
# ihp-sg13g2 sizing (geometry re-noted to gf180mcu's unit convention + bin-clamped).
# A starting point; re-tune defaults/bounds for gf180mcu device physics as needed.
# Keyed on the FREE atomic symbols after default tying (abstract/params.yaml, plan D-4):
# tied members (XM2 tracks XM1, XM4 tracks XM3) come from the generated tie block.
# Defaults/bounds numerically identical to the pre-atomic knobs.
schema: spicexplorer/sizing@1
pdk: gf180mcu
variables:
- name: x_dut_xm1_w
  description: Input pair width (XM1; XM2 tied)
  default: 0.5u
  min: 0.22u
  max: 10u
  unit: m
- name: x_dut_xm1_l
  description: Input pair length (XM1; XM2 tied)
  default: 5u
  min: 0.28u
  max: 10u
  unit: m
- name: x_dut_xm3_w
  description: PMOS mirror-load width (XM3; XM4 tied)
  default: 1.5u
  min: 0.22u
  max: 10u
  unit: m
- name: x_dut_xm3_l
  description: PMOS mirror-load length (XM3; XM4 tied)
  default: 5u
  min: 0.28u
  max: 10u
  unit: m
- name: x_dut_xm5_w
  description: Tail device width
  default: 2u
  min: 0.22u
  max: 10u
  unit: m
- name: x_dut_xm5_l
  description: Tail device length
  default: 5u
  min: 0.28u
  max: 10u
  unit: m
- name: x_dut_xm6_w
  description: Mirror reference width
  default: 2u
  min: 0.22u
  max: 10u
  unit: m
- name: x_dut_xm6_l
  description: Mirror reference length
  default: 5u
  min: 0.28u
  max: 10u
  unit: m
- name: x_dut_xm1_m
  description: Input pair fingers (frozen)
  default: 1
  min: 1
  max: 16
  freeze: true
  is_integer: true
- name: x_dut_xm3_m
  description: Mirror-load fingers (frozen)
  default: 1
  min: 1
  max: 16
  freeze: true
  is_integer: true
- name: x_dut_xm5_m
  description: Tail device fingers (frozen)
  default: 1
  min: 1
  max: 16
  freeze: true
  is_integer: true
- name: x_dut_xm6_m
  description: Mirror reference fingers (frozen)
  default: 1
  min: 1
  max: 16
  freeze: true
  is_integer: true
