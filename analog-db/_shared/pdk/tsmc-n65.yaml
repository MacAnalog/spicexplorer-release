# PDK-level registry for TSMC N65 (CRN65, 65 nm — low-Vt core flavour).
#
# Licensing note: TSMC's kit is commercial, so this registry records only device/corner
# *identifiers* + public geometry rules (standard TSMC nomenclature), not the model files
# themselves. Corner libraries stay out-of-repo: `corners.lib_file` is a neutral wrapper
# filename the operator supplies at simulation time (a `.lib`/section indirection onto the
# licensed models), resolved against `model_lib_root` on the Spectre path. The committed repo
# carries generic corner labels (tt/ss/ff/sf/fs); the operator wrapper maps tt->tt_lvt,
# ss->ss_lvt, … so no kit-specific section name needs to land in git either.
#
# Live simulation runs **Spectre via the virtuoso-bridge** (native, licensed), NOT the open-PDK
# ngspice path: there is deliberately no `_NATIVE_PDK` runner entry, so `analog-db verify --sim`
# skips TSMC N65 by design (Tier 0-2 offline verification still applies).
pdk: tsmc-n65
sim_engine: spectre                      # native lane: licensed Spectre via virtuoso-bridge (no ngspice; see NDA note above)
supply: {default: 1.2, unit: V}          # nominal 1.2 V core rail (CRN65 core devices)
# Device identifiers (public CRN65 nomenclature only — no kit bytes, no model text).
#
# The kit's names decompose as  <base>[_flavor][_domain][_dnw][_mac][x]:
#   base      nch / pch
#   flavor    (none)=SVT | _lvt | _hvt | _na (native, near-zero Vt)
#   domain    (none)=1.2 V core | _25 = 2.5 V I/O device
#             _25ud18 = the 2.5 V device UNDER-driven at 1.8 V
#             _25od33 = the 2.5 V device OVER-driven at 3.3 V
#   _dnw      deep-n-well (isolated bulk) companion of any of the above
#   _mac      model variant that derives AS/AD/PS/PD from the instance itself
#   x         alternate/extracted companion (…x, _macx, _dnwx)
# Every combination in the kit list follows that grammar, e.g. nch_lvt_dnw_macx.
#
# ⚠ The DOMAIN voltages above are read off the naming convention, NOT confirmed against the
# kit (which must not be read here). Confirm `_25ud18`=1.8 V and `_25od33`=3.3 V with the
# operator BEFORE retargeting any circuit onto them — getting it wrong reintroduces exactly
# the oxide-overvoltage problem these entries exist to solve.
#
# ⚠ gm/ID LUTs exist ONLY for lvt (nch_lvt/pch_lvt). Declaring a flavor here does NOT make it
# sizable: each needs its own `gmid-extract-spectre` pass. Same operator work that blocks
# svt/hvt today.
#
# ⚠ The I/O devices carry their own geometry rules (larger min L than the 0.06 µm core figure
# below). `geometry:` is core-device only; do not apply it to a _25* device.
devices:
  nmos:
    core: nch_lvt       # back-compat alias — core flavour used by existing bindings
    lvt: nch_lvt
    svt: nch
    hvt: nch_hvt
    native: nch_na
    io25: nch_25        # 2.5 V I/O
    io18: nch_25ud18    # 1.8 V rail  (unconfirmed — see note above)
    io33: nch_25od33    # 3.3 V rail  (unconfirmed — see note above)
  pmos:
    core: pch_lvt
    lvt: pch_lvt
    svt: pch
    hvt: pch_hvt
    native: pch_na
    io25: pch_25
    io18: pch_25ud18
    io33: pch_25od33
corners:
  lib_file: tsmc_n65_models.scs           # neutral operator-supplied wrapper (see NDA note above)
  sections: [tt, ss, ff, sf, fs]
geometry: {min_l: 0.06u, min_w: 0.12u, max_l: 10u, max_w: 100u}
# gm/ID LUT characterization — the SPECTRE lane (`analog-db gmid-extract-spectre`), not the
# open-PDK ngspice `gmid-extract` flow. Characterizes BOTH core flavours (devices.{nmos,pmos})
# in one pass through the licensed kit; the deck references only the neutral wrapper above.
# LUTs land OUT-OF-REPO (`out_root`, mirroring the committed `_shared/gmid/<pdk>/` layout) —
# committing licensed-kit tables is an owner decision.
gmid:
  family: bsim4
  engine: spectre
  corners: [tt, ss, ff, sf, fs]           # `--corner all` extracts each registered corner
  flavors: [lvt, svt, hvt]                # `--flavor all` sweeps each Vt class (devices.{nmos,pmos}[flavor])
  width_um: 5                             # characterization finger width; apply sizings with
  nfing: 1                                #   ~2-10 µm fingers + m (narrow fingers deviate)
  finger_widths: [0.5, 1, 5]              # characterised finger widths (µm); 5 = nominal (untagged), 0.5/1 = narrow companions
  temp_k: 300.15                          # 27 °C
  sweep:                                  # 25 mV bias grids: validated ≤0.3 % gm/ID interp error
    vgs: [0, 0.025, 1.5]                  #   (start, step, stop) V
    vds: [0, 0.025, 1.8]                  # covers the 1.8 V-rail drawings (amp_003)
    vsb: [0, 0.1, 1.0]                    # stored magnitudes; deck mirrors signs per polarity
    length_um: [0.06, 0.08, 0.1, 0.13, 0.18, 0.25, 0.35, 0.5, 0.7,
                1.0, 1.5, 2.0, 3.0, 4.5, 6.0, 8.0, 10.0]
  info: "TSMC N65 core LVT pair, native Spectre"
  out_root: ~/.spicexplorer/gmid          # out-of-repo (licensed kit; see note above)
  simulator:                              # optional Spectre fan-out knobs
    workers: 12                           # parallel jobs (one per (L, VSB) pair)
    timeout_s: 1200                       # per-job wall clock [s]
