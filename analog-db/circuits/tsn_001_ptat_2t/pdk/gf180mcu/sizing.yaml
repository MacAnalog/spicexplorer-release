# Sizing for the gf180mcu binding — generated by `analog-db add-binding` from the
# ihp-sg13g2 sizing (geometry re-noted to gf180mcu's unit convention + bin-clamped).
# A starting point; re-tune defaults/bounds for gf180mcu device physics as needed.
schema: spicexplorer/sizing@1
pdk: gf180mcu
variables:
- name: x_dut_xm0_w
  description: Top (Vgs=0) device width
  default: 8u
  min: 0.22u
  max: 10u
  unit: m
- name: x_dut_xm0_l
  description: Top (Vgs=0) device length
  default: 0.28u
  min: 0.28u
  max: 10u
  unit: m
- name: x_dut_xm0_m
  description: Top device multiplier
  default: 8
  is_integer: true
- name: x_dut_xm1_w
  description: Bottom diode-connected width
  default: 4u
  min: 0.22u
  max: 10u
  unit: m
- name: x_dut_xm1_l
  description: Bottom diode-connected length
  default: 1u
  min: 0.28u
  max: 10u
  unit: m
- name: x_dut_xm1_m
  description: Bottom device multiplier
  default: 8
  is_integer: true
