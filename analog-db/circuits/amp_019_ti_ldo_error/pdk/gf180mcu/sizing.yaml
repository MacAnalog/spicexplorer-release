# Native gf180mcu binding — matches the source design's own device family (nfet_06v0/pfet_06v0
# at a 3.3 V rail). The source .sch carries WIP placeholder geometry (W=0.3u everywhere); these
# are coarse hand-sizes for the 1 mA class bias (I_error_amp_ref) instead — see README.
schema: spicexplorer/sizing@1
pdk: gf180mcu
variables:
- name: x_dut_xmb0_w
  default: 10u
  description: "Bias-mirror NMOS unit (1 mA/branch at ~0.3 V vdsat)"
- name: x_dut_xmb0_l
  default: 2u
- name: x_dut_xmbc_m
  default: '1'
- name: x_dut_xmbo_m
  default: '1'
- name: x_dut_xm1_w
  default: 40u
  description: "Input pair"
- name: x_dut_xm1_l
  default: 0.7u
- name: x_dut_xm3_w
  default: 100u
  description: "Level-shifted PMOS mirror (M3m/M5)"
- name: x_dut_xm3_l
  default: 0.5u
- name: x_dut_xm4_w
  default: 10u
  description: "M4 compound-diode level shifter (~zero DC current)"
- name: x_dut_xm4_l
  default: 0.5u
- name: x_dut_xm7_w
  default: 40u
  description: "M7 second-stage diode (stacked on the first-stage output node)"
- name: x_dut_xm7_l
  default: 0.5u
- name: x_dut_xm6_w
  default: 100u
  description: "M6 output PMOS"
- name: x_dut_xm6_l
  default: 0.5u
- name: r_z
  default: 470
  description: "Upstream RZ ppolyf_u_3k placeholder geometry -> coarse 1k"
- name: c_comp
  default: 25p
  description: "Upstream param block says 100p, instance says 1p; coarse 2p"
- name: x_dut_xmbe_w
  default: 0.4u
  description: "M_mirror_e sink — MUST be < tail/2 for a valid first-stage op point (see netlist note)"
- name: x_dut_xmbf_w
  default: 5u
  description: "M_mirror_f sink (level-shifter anchor; carries ~0 by design)"
- name: r_nd
  default: 500k
  min: 10k
  max: 10MEG
  unit: ohm
  description: "Level-shifted-mirror gate-rail tie na->nd (DC-defines nd; ~0 current — fix 2026-07-25, see abstract netlist)"
