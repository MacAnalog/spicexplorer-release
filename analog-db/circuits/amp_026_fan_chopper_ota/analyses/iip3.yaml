template: iip3_diff
description: "IIP3 — FD follower two-tone intermodulation; tran + in-deck coherent DFT."
params: {VDD: 1.2, VCM: 0.6, CL: 10p, ASIG: 0.00625, F0: 1.0e4, F1: 0.9e5, F2: 1.0e5, TSTEP: 50n, TSTART: 100u, TSTOP: 2100u}
flags: []
produces: [iip3_dbv]
