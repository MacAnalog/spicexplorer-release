# Sizing for the sky130 binding — generated by `analog-db add-binding` from the
# gf180mcu sizing (geometry re-noted to sky130's unit convention + bin-clamped).
# A starting point; re-tune defaults/bounds for sky130 device physics as needed.
# HAND-FIXED after generation: the gf180 source stores geometry defaults in RAW METERS
# (6.8542e-05), which the converter misread as µm and clamped to the bin floor
# (0.42/0.15). Defaults below are the gf180 landed values re-noted to sky130's
# bare-µm convention (.option scale=1u decks).
schema: spicexplorer/sizing@1
pdk: sky130
variables:
- name: x_dut_xmbp_w
  default: 41.49398303677232
  min: 2
  max: 64
  unit: m
  description: On-chip reference PMOS (diode-connected, vdd->ibias). PRIMARY power/PSRR trade knob.
- name: x_dut_xmbp_l
  default: 2.329224498945873
  min: 0.5
  max: 10
  unit: m
  description: Reference PMOS length; longer = lower current, better matching.
- name: x_dut_xmb0_w
  default: 58.50180313844321
  min: 2
  max: 100
  unit: m
  description: Bias-mirror NMOS unit
- name: x_dut_xmb0_l
  default: 1.482196715977639
  min: 0.5
  max: 10
  unit: m
- name: x_dut_xmbc_m
  default: 1
  is_integer: true
  min: 1
  max: 8
  description: Tail mirror multiplicity
- name: x_dut_xmbo_m
  default: 1
  is_integer: true
  min: 1
  max: 8
  description: Output sink multiplicity
- name: x_dut_xm1_w
  default: 54.99700606429666
  min: 4
  max: 100
  unit: m
  description: Input pair
- name: x_dut_xm1_l
  default: 0.47938582647537475
  min: 0.28
  max: 10
  unit: m
- name: x_dut_xm3_w
  default: 87.01219712226481
  min: 4
  max: 100
  unit: m
  description: Level-shifted PMOS mirror (M3m/M5)
- name: x_dut_xm3_l
  default: 3.4338542074883858
  min: 0.28
  max: 10
  unit: m
- name: x_dut_xm4_w
  default: 96.52927518861148
  min: 2
  max: 100
  unit: m
  description: M4 compound-diode level shifter (~zero DC current by design)
- name: x_dut_xm4_l
  default: 4.243509159874362
  min: 0.28
  max: 10
  unit: m
- name: x_dut_xm6_w
  default: 22.347200240809872
  min: 8
  max: 100
  unit: m
  description: M6 output PMOS
- name: x_dut_xm6_l
  default: 1.08924987055143
  min: 0.28
  max: 10
  unit: m
- name: r_z
  default: 30158.889051230384
  min: 100
  max: 50k
  unit: ohm
  description: Nulling resistor (Miller compensation)
- name: c_comp
  default: 1.0277210259907484e-11
  min: 0.2p
  max: 20p
  unit: F
  description: Miller capacitor
- name: x_dut_xmbf_w
  default: 9.512915640352748
  min: 1
  max: 40
  unit: m
  description: M_mirror_f sink (level-shifter anchor; carries ~0 by design)
- name: r_nd
  default: 7561703.647450356
  min: 10k
  max: 10MEG
  unit: ohm
  description: "Level-shifted-mirror gate-rail tie na->nd (DC-defines nd; ~0 current \u2014 fix 2026-07-25,\
    \ see abstract netlist)"

# Per-PDK re-bias (platform convention: analyses params are the AUTHORED operating point;
# per-PDK deltas live here). amp_032 is authored on gf180mcu's 3.3 V / 6V-device rail
# (VDD 3.3, VCM 1.2). sky130's core fets are a 1.8 V family, so the authored rail would
# overdrive them. Re-biased to the registry rail; VCM picked by a coarse dc sweep of the
# bias-wrapped op point.
analysis_params:
  VDD: 1.8
  VCM: 0.9
