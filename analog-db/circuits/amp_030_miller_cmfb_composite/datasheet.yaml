schema: spicexplorer/datasheet@1
cace_format: '5.2'
default_conditions:
  supply:
    unit: V
    typical: 1.2
  cload:
    unit: fF
    typical: 50
  corner:
    typical: tt
  temp:
    unit: degC
    typical: 27
  vcm:
    unit: V
    typical: 0.6
metrics:
  dc_gain_db:
    display: DC open-loop differential gain
    description: "Differential large-signal DC gain \u2014 REACHABLE here (vs amp_029's\
      \ structural skip): the composed cmfb_001_ideal_rsense_servo servo holds the\
      \ interior operating point"
    unit: dB
    analysis: ac_open_loop
    extract:
      meas: dcgain
    spec:
      min: 50
      unit: dB
  ugf_hz:
    display: Unity-gain frequency
    unit: Hz
    analysis: ac_open_loop
    extract:
      meas: ugf
    spec:
      unit: Hz
      min: 5000000.0
  pm_deg:
    display: Phase margin
    description: Two-stage with per-side Miller R+C (core = amp_029)
    unit: deg
    analysis: ac_open_loop
    extract:
      meas: pm
    spec:
      unit: deg
      min: 60.0
      max: 90
  vos:
    display: Output offset
    description: voutp - voutn at matched DC inputs (differential offset; the CM level
      is servo-held)
    unit: V
    analysis: dc_op
    extract:
      meas: vos
    spec:
      typ: 0
      max: 100e-3
      min: -100e-3
      unit: V
  i_supply:
    display: Supply current
    unit: A
    analysis: dc_op
    extract:
      meas: i_supply
    spec:
      max: 500e-6
      unit: A
  vn_in:
    display: Input-referred noise (integrated)
    description: "ngspice inoise_total = total noise INTEGRATED over the bench band\
      \ (see analyses/noise.yaml FSTART..FSTOP) \u2014 a voltage, not a density; the\
      \ bound is a characterization band at the family's measured magnitude"
    unit: V
    analysis: noise
    extract:
      meas: inoise_total
    spec:
      max: 0.001
      unit: V
  t_settle:
    display: Settling time
    description: Unity-gain differential-follower settling (see tran_step_diff.spice)
    unit: s
    analysis: tran_step
    extract:
      meas: t_settle
    spec:
      max: 5.0e-06
      unit: s
  cm_interior_pts:
    display: Interior operating points across the vcm_ref sweep
    description: 'P4 COMPOSITION ACCEPTANCE: of 5 commanded vcm_ref samples (0.50-0.70
      V), how many put vocm inside VCM +/- 0.15 V. amp_029 alone commits 0 (no interior
      DC point); the composed cmfb_001_ideal_rsense_servo CMFB must track the command
      at all 5'
    unit: ''
    analysis: dc_cm_bias_sweep
    extract:
      meas: cm_interior_pts
    spec:
      min: 5
  zcm_lf_ohm:
    display: CM output impedance (low frequency)
    description: CM stiffness the composed behavioral servo achieves at the outputs
    unit: Ohm
    analysis: ac_cm_reg
    extract:
      meas: zcm_lf_ohm
    spec:
      max: 100e3
      unit: Ohm
  cm_peaking_db:
    display: CM impedance peaking
    description: "20*log10(Zcm peak / Zcm LF) \u2014 >6 dB flags an underdamped CM\
      \ loop (uniform CM-health criterion). RECORDED SKIP with context: the gain-1\
      \ servo regulates Zcm(LF) to ~8 Ohm, so the ratio reads ~47 dB even though the\
      \ ABSOLUTE peak (~1.7 kOhm @ 22 MHz) is stiffer than amp_020's flat 14.6 kOhm\
      \ at every frequency, and the kick response is damped (20% overshoot ratio,\
      \ zero residual). The ratio metric conflates 'very stiff LF' with 'underdamped'\
      \ for high-stiffness servos \u2014 class metric follow-up: an absolute-peak\
      \ or vs-open-loop criterion"
    unit: dB
    analysis: ac_cm_reg
    extract:
      meas: cm_peaking_db
    spec:
      max: 6
      unit: dB
  cm_resid_v:
    display: CM kick residual
    description: "vocm displacement remaining after a released CM current kick \u2014\
      \ nonzero flags CM bistability/latch-up"
    unit: V
    analysis: tran_cm_kick
    extract:
      meas: cm_resid_v
    spec:
      min: -5e-3
      max: 5e-3
      unit: V
  t_cm_settle:
    display: CM kick recovery time
    unit: s
    analysis: tran_cm_kick
    extract:
      meas: t_cm_settle
    spec:
      max: 5.0e-06
      unit: s
