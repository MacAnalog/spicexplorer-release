# SUPER-DSL manifest — the TI-application-note LDO REFERENCE amplifier in its self-biased form:
# a 9-transistor two-stage Miller OTA (NMOS pair, matched PMOS mirror load, PMOS common-source
# output) that buffers and gains the LDO's internal reference. Companion accession to
# amp_032_ti_ldo_error_selfbias; together they are the two active blocks of ldo_005_buffered_ref.
#
# In the LDO this amp is wired as a NON-INVERTING GAIN STAGE (outer R1/R2 divider into vinn), so
# v_ref_out = VREF*(R1+R2)/R2 and — because the error amp compares VOUT to the filtered v_ref_out
# with no further divider — this block sets the LDO's output level AND its DC accuracy. Its
# input-referred offset lands at VOUT multiplied by the same (R1+R2)/R2. That is why the plain
# matched mirror load was kept here rather than the error amp's level-shifted ratioed variant.
#
# Bench convention: the amplifier class benches wrap the DUT as a UNITY buffer. That is the
# conservative stability case (maximum loop gain) and it exercises the true in-LDO input common
# mode (VCM = VREF = 0.8 V from ldo_005's sizing), so it is the right harness even though the
# in-system closed-loop gain is 2.
