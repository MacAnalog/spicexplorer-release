# Sizing for the tsmc-n65 binding — originally generated by `analog-db add-binding` from
# the ihp-sg13g2 sizing (geometry re-noted to tsmc-n65's unit convention + bin-clamped).
#
# RE-SIZED 2026-08-04 (live Spectre, tt / 27 C / VDD 1.2 / VCM 0.6 / CL 10 p).
# The previous defaults came from an optimizer run that pushed every L toward the 10 um
# bound and INVERTED the stage-1/stage-2 current split: the XM6 bias diode was 34.4 um
# wide, which collapsed the XM7/XM6 output-sink ratio to 0.187 (open PDKs: 3.00) and
# ballooned the XM8/XM6 tail ratio to 2.352 (open PDKs: 1.00). Stage 1 then drew 146 uA
# of the 217 uA budget while stage 2 got 10 uA, so (a) XM5's gm collapsed to 64.8 uS and
# p2 = gm5/(2*pi*CL) fell to 1.03 MHz — 13.5x BELOW the 13.9 MHz crossover — and (b) the
# output pull-up lost to the pull-down and XM7/XM10 sat in triode (-112 mV headroom).
# With R1 = 701 ohm = 1/22 of 1/gm5 the Miller zero also stayed in the RIGHT half plane
# at 889 kHz. Measured consequence: dc_gain 23.0 dB, pm -81.3 deg — and the closed-loop
# step response was a SUSTAINED 1.66 MHz limit cycle swinging 0.53-0.93 V.
#
# The fix restores the open-PDK mirror ratios (XM7/XM6 = 3, XM8/XM6 = 1), shortens the
# 8.66 um stage-2 channel to 2 um, and sets R1 ABOVE 1/gm5 so the zero moves into the LHP
# near p2. Verified live: dc_gain 51.08 dB / ugf 9.30 MHz / pm +71.15 deg / vos 0, MOS
# active area 1851 -> 241 um2, i_supply 217 -> 173 uA, and the closed-loop step is
# strictly MONOTONIC (zero local extrema over 19 us at 2 ns resolution).
schema: spicexplorer/sizing@1
pdk: tsmc-n65
# The closed (Spectre) lane always injects the tsmc-n65 core rail (1.2 V) over the
# cross-PDK authored VDD — record that operating point so raw decks and the entry's
# power_w (i_supply x VDD) tell the truth about what was actually simulated.
analysis_params: {VDD: 1.2}
variables:
- name: x_dut_xm1_w
  description: "NMOS input pair width \u2014 sets gm1, hence UGF = gm1/(2*pi*Cc). 57.1 um at\
    \ 73 uA/side put the pair at vgt = -52.7 mV (deep subthreshold) with gm1 = 1.65 mS, which\
    \ outran p2; 5 um at 10 uA/side lands gm1 = 207 uS, inside the open-PDK family (159-203 uS)"
  default: 5.0e-06
  min: 0.15u
  max: 100u
  unit: m
- name: x_dut_xm1_l
  description: "NMOS input pair length (0.392 -> 0.5 um; a round bin, still short enough that\
    \ the pair is not the gain bottleneck)"
  default: 5.0e-07
  min: 0.13u
  max: 10u
  unit: m
- name: x_dut_xm3_w
  description: "Stage-1 PMOS current-source load width \u2014 at 47.3 um it was forced to pass\
    \ 72.9 uA at gm/ID 5.69 with only +37.6 mV of saturation headroom (one CM perturbation from\
    \ triode). 5 um at 10 uA sits +190 mV clear and its lower gds is where the DC gain comes from"
  default: 5.0e-06
  min: 0.15u
  max: 100u
  unit: m
- name: x_dut_xm3_l
  description: Stage-1 load length (long for load gds)
  default: 2.0e-06
  min: 0.13u
  max: 10u
  unit: m
- name: x_dut_xm5_w
  description: "Stage-2 PMOS driver width \u2014 36 -> 40 um at 12x the current raises gm5 from\
    \ 64.8 uS to 555 uS, lifting p2 = gm5/(2*pi*CL) from 1.03 MHz (13.5x below crossover) to\
    \ ~8.8 MHz and dropping 1/gm5 from 15.4 kohm into nulling-resistor range"
  default: 4.0e-05
  min: 0.15u
  max: 100u
  unit: m
- name: x_dut_xm5_l
  description: "Stage-2 PMOS driver length \u2014 8.66 um of channel on a 65 nm node was the\
    \ single worst knob; 2 um is the shortest length that still keeps stage-2 output gds low"
  default: 2.0e-06
  min: 0.13u
  max: 10u
  unit: m
- name: x_dut_xm6_w
  description: "Bias diode width (ref current density) \u2014 THE ROOT CAUSE at 34.4 um: it is\
    \ what drove XM7/XM6 to 0.187 and XM8/XM6 to 2.352. 3.5 um restores both ratios"
  default: 3.5e-06
  min: 0.15u
  max: 50u
  unit: m
- name: x_dut_xm6_l
  description: "Bias diode length (GROUP-TIED mirror L for XM6/XM7/XM8/XM10 \u2014 this one knob\
    \ also pulls the tail and both output sinks off their 6.39 um channels)"
  default: 2.0e-06
  min: 0.13u
  max: 10u
  unit: m
- name: x_dut_xm7_w
  description: "Output sink width (mirror ratio vs XM6 sets stage-2 current) \u2014 10.5/3.5 =\
    \ 3.00, the invariant on gf180/ihp/sky130. THIS ratio, not the driver, sets stage-2 current:\
    \ 11.25 -> 66 uA/side, which lifts XM7/XM10 out of triode (-112 mV -> +472 mV headroom)"
  default: 1.05e-05
  min: 0.15u
  max: 100u
  unit: m
- name: x_dut_xm8_w
  description: "Tail mirror width (ratio vs XM6 sets the tail current) \u2014 80.9 um gave ratio\
    \ 2.352 and a 146 uA tail; 3.5 um restores the open-PDK 1:1 ratio and a 20 uA tail\
    \ (10 uA/side). Stage 1 must be the CHEAP stage"
  default: 3.5e-06
  min: 0.15u
  max: 100u
  unit: m
- name: x_dut_r1_value
  description: "Per-side Miller zero-nulling resistor \u2014 must EXCEED 1/gm5 so the zero moves\
    \ from the RHP into the LHP and lands near p2 as phase lead. At 701 ohm (1/22 of 1/gm5) the\
    \ zero sat in the RHP at 889 kHz, 15.6x below UGF. The dimensionless invariant R1*gm5 is\
    \ 13.1-14.6 on the three open PDKs and was 0.045 here; 8 kohm restores it to ~4.4. Measured\
    \ peak: 3k -> +40.96 deg, 8k -> +71.15, 12k -> +64.48, 20k -> +42.08 deg"
  default: 8000.0
  min: 100
  max: 50k
  unit: ohm
- name: x_dut_c1_value
  description: "Per-side Miller compensation cap \u2014 sets UGF = gm1/(2*pi*Cc). 12.15 pF against\
    \ a 10 pF load (Cc/CL = 1.215 vs 0.04-0.06 on the open PDKs) was backwards"
  default: 3.0e-12
  min: 0.05p
  max: 20p
  unit: F
- name: i_bias
  description: "Bias reference current into the XM6 diode (drawn as a 1 mA literal \u2014 re-seeded).\
    \ 20 uA is the value all three open PDKs use"
  default: 2.0e-05
  min: 1u
  max: 500u
  unit: A
- name: vbl
  description: "Stage-1 PMOS load gate bias (the drawing's floating net X; knife-edge CM knob).\
    \ CALIBRATION, not a fix: with no CMFB this is an open-loop literal that must be hand-centered.\
    \ An interior operating point DOES exist \u2014 measured window at this sizing is vbl 0.7735\
    \ (voutp 0.332 V) to 0.7752 (voutp 0.926 V), ~1.7 mV wide, beyond which XM5 enters triode.\
    \ 0.7744 centers voutp at 0.636 V. That window is ~55x wider than gf180's 12-25 uV (65 nm's\
    \ lower intrinsic gain shrinks the vbl->vout CM gain to ~370 V/V), but still ~20x narrower\
    \ than the dc_cm_bias_sweep bench's 20-30 mV sample spacing, so cm_interior_pts stays 0, and\
    \ ~70x narrower than the +/-50 mV PVT spread of |vth_p|. No setting of the 14 knobs closes\
    \ that \u2014 the robustness fail is the TOPOLOGY (see circuit.yaml); amp_030 composes the CMFB fix"
  default: 0.7744
  min: 0.0
  max: 1.2
  unit: V
- name: x_dut_xm1_m
  description: XM1 m (frozen literal)
  default: 1
  min: 1
  max: 16
  freeze: true
  is_integer: true
- name: x_dut_xm3_m
  description: XM3 m (frozen literal)
  default: 1
  min: 1
  max: 16
  freeze: true
  is_integer: true
- name: x_dut_xm5_m
  description: XM5 m (frozen literal)
  default: 1
  min: 1
  max: 16
  freeze: true
  is_integer: true
- name: x_dut_xm6_m
  description: XM6 m (frozen literal)
  default: 1
  min: 1
  max: 16
  freeze: true
  is_integer: true
- name: x_dut_xm7_m
  description: XM7 m (frozen literal)
  default: 1
  min: 1
  max: 16
  freeze: true
  is_integer: true
- name: x_dut_xm8_m
  description: XM8 m (frozen literal)
  default: 1
  min: 1
  max: 16
  freeze: true
  is_integer: true
