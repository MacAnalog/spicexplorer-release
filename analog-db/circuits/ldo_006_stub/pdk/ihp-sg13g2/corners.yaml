# Corner bundles for the LDO stub's ihp binding (MOS + resistor corner libs).
pdk: ihp-sg13g2
corners:
  tt: [{lib_file: cornerMOSlv.lib, section: mos_tt}, {lib_file: cornerRES.lib, section: res_typ}]
  ss: [{lib_file: cornerMOSlv.lib, section: mos_ss}, {lib_file: cornerRES.lib, section: res_wcs}]
  ff: [{lib_file: cornerMOSlv.lib, section: mos_ff}, {lib_file: cornerRES.lib, section: res_bcs}]
default_corner: tt
