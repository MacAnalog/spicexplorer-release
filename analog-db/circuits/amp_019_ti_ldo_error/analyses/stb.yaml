# Analysis binding: loop-gain / stability probe in the unity buffer (class template, ibias
# family — the DUT has an ibias port; IBIAS = 1 mA class bias). ngspice does Middlebrook
# voltage injection at the VIPRB marker (`alter @VIPRB[acmag]=1` in .control — netlist bytes
# unchanged); the Spectre lane composes a native `stb stb probe=VIPRB` off the same marker.
# Injection at the DC-short keeps the op point the CLOSED-loop buffer one, so this bench
# needs none of the biaswrap this amp's ac_open_loop needs (its designed-in systematic
# offset — the ratioed mirror_e sink — only rails an UNWRAPPED open-loop bias).
# FSTART = 0.01 Hz is the class value (see the stb template's "CHOOSING FSTART" — the lowest
# FSTART at which every single-ended amp of this corpus clears the 30-deg phase-reference
# guard); phref_dev audits the loop lag already present at FSTART.
# VALIDATION GATE: pm_loop must sit within ~2 deg of the FRESH ac_open_loop pm (both probe
# the same loop; the biaswrap Lfb/Cin shifts the open-loop read ~1%). Fresh reference @
# ihp-sg13g2 tt (2026-08-01): pm = 74.49 deg, ugf = 11.63 MHz, dcgain = 50.03 dB.
# REPORTING: `produces:` names DATASHEET METRIC IDS — the loop measures are canonical as of
# this campaign (_shared/classes/amplifier/metrics.yaml: loopgain_db / ugf_loop_hz /
# pm_loop_deg / gm_loop_db) and datasheet.yaml binds all four. gm_loop = -999 is the loud
# "loop phase never reaches -180 deg inside the band" sentinel, not a failure; pm_loop =
# -999 means no 0 dB crossing was measured; phref_ok = 0 says the phase-reference guard
# tripped. pm_loop_first / phref_dev / phref_ok still ride the recorded
# `corners.<corner>.analyses.stb.measures` block.
schema: spicexplorer/analysis@1
id: stb
template: stb
description: "Loop gain (stb) of the unity buffer — loopgain_db/ugf_loop/pm_loop/gm_loop; Middlebrook injection at VIPRB on ngspice, native stb on Spectre."
# FSTART 0.01 -> 1e-4 (2026-08-04): the stb bench anchors phase at its first swept point and
# blanks pm_loop/gm_loop to the -999 sentinel when |phref_dev| > 30 deg. For a high-gain amp
# the dominant pole f_p = UGF/A0 is sub-Hz, so 0.01 Hz already sits PAST it — and because
# every stabilising move lowers UGF (hence f_p), the guard fires HARDER on a correct fix than
# on the broken design. Measured on amp_006@gf180: the committed (unstable) sizing reports
# pm_loop -16.5, while the stabilised one reports -999 at 0.01 Hz and +66.0 at 1e-4. pm_loop
# and gm_loop are FSTART-INVARIANT; only the guard moves.
params:
  VDD: 3.3
  VCM: 1.2
  IBIAS: 1m
  CL: 10p
  FSTART: 1e-4     # class value; see the stb template's "CHOOSING FSTART"
  FSTOP: 1G
  PPD: 101
flags: []
produces: [pm_loop_deg, loopgain_db, ugf_loop_hz, gm_loop_db]
