# Sizing for the gf180mcu binding — generated by `analog-db add-binding` from the
# ihp-sg13g2 sizing (geometry re-noted to gf180mcu's unit convention + bin-clamped).
# A starting point; re-tune defaults/bounds for gf180mcu device physics as needed.
schema: spicexplorer/sizing@1
pdk: gf180mcu
variables:
- name: x_dut_xm4_w
  description: PMOS input pair width (XM4/XM5)
  default: 1.42u
  min: 0.22u
  max: 20u
  unit: m
- name: x_dut_xm4_l
  description: PMOS input pair length
  default: 0.28u
  min: 0.28u
  max: 2u
  unit: m
- name: x_dut_xm2_w
  description: NMOS mirror width (XM6 diode / XM2 output)
  default: 2.32u
  min: 0.22u
  max: 20u
  unit: m
- name: x_dut_xm2_l
  description: 'NMOS mirror length (long: sets output ro and the servo pole)'
  default: 1.31u
  min: 0.28u
  max: 2u
  unit: m
- name: x_dut_xm1_w
  description: PMOS tail width (gate on the bias string)
  default: 0.329u
  min: 0.22u
  max: 20u
  unit: m
- name: x_dut_xm1_l
  description: PMOS tail length
  default: 0.28u
  min: 0.28u
  max: 2u
  unit: m
- name: x_dut_xm7_w
  description: Bias-string NMOS diode width
  default: 0.293u
  min: 0.22u
  max: 20u
  unit: m
- name: x_dut_xm7_l
  description: Bias-string NMOS diode length
  default: 0.28u
  min: 0.28u
  max: 2u
  unit: m
- name: x_dut_xm3_w
  description: Bias-string PMOS diode width (with XM7 sets the string current; XM1 mirrors)
  default: 0.881u
  min: 0.22u
  max: 20u
  unit: m
- name: x_dut_xm3_l
  description: Bias-string PMOS diode length
  default: 0.28u
  min: 0.28u
  max: 2u
  unit: m
- name: x_dut_rmp_value
  description: CM-detector averaging resistor (RMN tied; high-R to avoid loading the sensed outputs)
  default: 1Meg
  min: 10k
  max: 100Meg
  unit: Ohm
- name: x_dut_xm1_m
  description: XM1 m (frozen literal)
  default: 1
  min: 1
  max: 16
  freeze: true
  is_integer: true
- name: x_dut_xm2_m
  description: XM2 m (frozen literal)
  default: 1
  min: 1
  max: 16
  freeze: true
  is_integer: true
- name: x_dut_xm3_m
  description: XM3 m (frozen literal)
  default: 1
  min: 1
  max: 16
  freeze: true
  is_integer: true
- name: x_dut_xm4_m
  description: XM4 m (frozen literal)
  default: 1
  min: 1
  max: 16
  freeze: true
  is_integer: true
- name: x_dut_xm7_m
  description: XM7 m (frozen literal)
  default: 1
  min: 1
  max: 16
  freeze: true
  is_integer: true
