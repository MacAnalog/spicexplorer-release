# Design variables for the ihp-sg13g2 binding. Validated against sizing.schema.json.
# 28nm geometry re-noted to 130nm lv devices: L 300n kept, follower/feedback devices wide for
# low Vgs at IB = 10uA; the PMOS source XMPB carries ~6x the mirror current (upstream 96u/16u).
schema: spicexplorer/sizing@1
pdk: ihp-sg13g2
variables:
  - {name: x_dut_xm1_w,  description: "Input follower width (per finger, m=4)", default: 8u,  min: 0.18u, max: 100u, unit: m}
  - {name: x_dut_xm2_w,  description: "Feedback sink width (per finger, m=4)",  default: 8u,  min: 0.18u, max: 100u, unit: m}
  - {name: x_dut_xmrn_w, description: "NMOS bias mirror width",          default: 4u,   min: 0.18u, max: 50u, unit: m}
  - {name: x_dut_xmpd_w, description: "PMOS mirror diode width",         default: 8u,   min: 0.18u, max: 50u, unit: m}
  - {name: x_dut_xmpb_w, description: "PMOS source width (per finger, m=6)",    default: 8u,  min: 0.18u, max: 100u, unit: m}
  - {name: x_dut_xm1_l,    description: "NMOS length",                     default: 0.3u, min: 0.13u, max: 10u, unit: m}
  - {name: x_dut_xmpd_l,    description: "PMOS length",                     default: 0.3u, min: 0.13u, max: 10u, unit: m}
  - {name: x_cc,     description: "Feedback-node compensation cap (F)", default: 250e-15, min: 50e-15, max: 2e-12, unit: F}
  # Frozen per-device literals (P4 atomic sweep): defaults reproduce the authored
  # netlist literals exactly; freeze keeps them out of the search space.
  - {name: x_dut_xm1_m, description: "XM1 m (frozen literal)", default: 4, min: 1, max: 16, freeze: true, is_integer: true}
  - {name: x_dut_xm2_m, description: "XM2 m (frozen literal)", default: 4, min: 1, max: 16, freeze: true, is_integer: true}
  - {name: x_dut_xmrn_m, description: "XMRN m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
  - {name: x_dut_xmns_m, description: "XMNS m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
  - {name: x_dut_xmpd_m, description: "XMPD m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
  - {name: x_dut_xmpb_m, description: "XMPB m (frozen literal)", default: 6, min: 1, max: 16, freeze: true, is_integer: true}
# Per-PDK bench overrides (assemble.py precedence: datasheet < analyses < analysis_params).
# The follower's valid bias window (M1 AND M2 saturated) is PDK-specific: ihp lv vth ~0.3
# puts it near 0.78; sky130's higher vth pushes it to ~1.05.
analysis_params:
  VCM: 0.66
