# Design variables for the ihp-sg13g2 binding. Validated against sizing.schema.json.
# sky130 binding: bare-µm convention (.option scale=1u). Upstream 1:1 at 65nm; on sky130 a 4:1 NMOS skew (as in
# tsn_002's pair) sets a non-degenerate sub-threshold point; long channels tame lambda.
schema: spicexplorer/sizing@1
pdk: sky130
variables:
  - {name: x_dut_xm1_w, description: "NMOS diode (XM1) width",   default: 1,   min: 0.42, max: 30, unit: m}
  - {name: x_dut_xm0_w, description: "Output NMOS (XM0) width",  default: 4,   min: 0.42, max: 30, unit: m}
  - {name: x_dut_xm1_l,    description: "NMOS length",              default: 3,   min: 0.15, max: 20, unit: m}
  - {name: x_dut_xm3_w,    description: "PMOS pair width",          default: 2,   min: 0.42, max: 30, unit: m}
  - {name: x_dut_xm3_l,    description: "PMOS length",              default: 3,   min: 0.15, max: 20, unit: m}
  # Frozen per-device literals (P4 atomic sweep): defaults reproduce the authored
  # netlist literals exactly; freeze keeps them out of the search space.
  - {name: x_dut_xm1_m, description: "XM1 m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
  - {name: x_dut_xm0_m, description: "XM0 m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
  - {name: x_dut_xm3_m, description: "XM3 m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
  - {name: x_dut_xm4_m, description: "XM4 m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
