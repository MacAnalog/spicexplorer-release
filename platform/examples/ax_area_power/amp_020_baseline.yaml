# Ax-revival + area/power demo — BASELINE (amplifier specs only).
#
# Two-stage Miller OTA with resistive CMFB (analog-db amp_020_two_stage_miller_cmfb),
# UNSIZED: geometry (W/L) + tail bias are searched; passives/multipliers frozen. Drives the
# committed ihp-sg13g2 raw decks through the optimizer.
#
# `optimizer_config.type` is the ENGINE selector (D-1): `nevergrad` here; flip it to
# `bayesian_ax` (or override in the run script) to run the SAME search under Ax Bayesian
# optimization. Companion `amp_020_area_power.yaml` adds active-area + power as first-class
# metrics — this file is the without-them reference to compare against.
project:
  name: amp_020 baseline (gain/ugf/pm)
  description: Two-stage Miller OTA — amplifier specs only; Ax/Nevergrad engine-swap demo
  simulator: ngspice
  save_sim: false
  parallel_sim: true
  ws_root: ../analog-db/raw/amp_020_two_stage_miller_cmfb/ihp-sg13g2
  netlist: ac_open_loop.spice
  outdir: scratch
  tech_spec:
    name: ihp-sg13g2
    constraints: {}
  dut_params:
  - name: x_dut_xm1_w
    min_val: 1.0e-06
    max_val: 4.0e-06
  - name: x_dut_xm1_l
    min_val: 2.5e-07
    max_val: 1.0e-06
  - name: x_dut_xm3_w
    min_val: 1.0e-06
    max_val: 4.0e-06
  - name: x_dut_xm3_l
    min_val: 2.5e-07
    max_val: 1.0e-06
  - name: x_dut_xm5_w
    min_val: 5.4e-06
    max_val: 2.0e-05
  - name: x_dut_xm5_l
    min_val: 2.5e-07
    max_val: 1.0e-06
  - name: x_dut_xm7_w
    min_val: 2.0e-06
    max_val: 8.0e-06
  - name: x_dut_xm7_l
    min_val: 2.5e-07
    max_val: 1.0e-06
  - name: x_dut_xm6_w
    min_val: 1.0e-06
    max_val: 4.0e-06
  - name: x_dut_xm6_l
    min_val: 2.5e-07
    max_val: 1.0e-06
  - name: x_dut_xm8_w
    min_val: 1.0e-06
    max_val: 4.0e-06
  - name: x_dut_xm8_l
    min_val: 2.5e-07
    max_val: 1.0e-06
  - name: i_bias
    min_val: 2.5e-05
    max_val: 0.0001
  - name: x_dut_r1_value
    freeze: true
    val: 2000.0
  - name: x_dut_c1_value
    freeze: true
    val: 1.0e-12
  - name: x_dut_r3_value
    freeze: true
    val: 5000.0
  - name: x_dut_r5_value
    freeze: true
    val: 5000.0
  - name: x_dut_c3_value
    freeze: true
    val: 5.0e-13
  - name: x_dut_xm1_m
    freeze: true
    val: 1.0
  - name: x_dut_xm2_m
    freeze: true
    val: 1.0
  - name: x_dut_xm3_m
    freeze: true
    val: 1.0
  - name: x_dut_xm4_m
    freeze: true
    val: 1.0
  - name: x_dut_xm5_m
    freeze: true
    val: 1.0
  - name: x_dut_xm9_m
    freeze: true
    val: 1.0
  - name: x_dut_xm7_m
    freeze: true
    val: 1.0
  - name: x_dut_xm10_m
    freeze: true
    val: 1.0
  - name: x_dut_xm6_m
    freeze: true
    val: 1.0
  - name: x_dut_xm8_m
    freeze: true
    val: 1.0
  testbenches:
  - name: ac_open_loop
    params: []
    netlist: ac_open_loop.spice
    enable: true
    description: 'raw deck: ac_open_loop (differential open-loop AC)'
  - name: dc_op
    params: []
    netlist: dc_op.spice
    enable: true
    description: 'raw deck: dc_op (operating point, supply current)'
  optimizer_config:
    type: nevergrad
    random_seed: 48
    budget: 15
    name: NGOpt
    lin_variable_bounds:
      min: 0
      max: 100
    log_variable_bounds:
      min: 1
      max: 100
    # dcgain / ugf / pm are read by BARE NAME from the deck's own `.meas ac …` results
    # (computed on the DIFFERENTIAL output vodm = voutp − voutn) — no `measurement` recipe.
    target_specs:
    - name: dcgain
      testbench: ac_open_loop
      sim_type: ac
      goal: exceed
      target: 40
      range: 40
      tolerance: 1
      weight: 1.0
      reward_type: log
      enable: true
    - name: ugf
      testbench: ac_open_loop
      sim_type: ac
      goal: exceed
      target: 1000000.0
      range: 10000000.0
      tolerance: 100000.0
      weight: 1.0
      reward_type: log
      enable: true
    - name: pm
      testbench: ac_open_loop
      sim_type: ac
      goal: exact
      target: 60
      range: 45
      tolerance: 10
      weight: 1.0
      reward_type: none
      enable: true
