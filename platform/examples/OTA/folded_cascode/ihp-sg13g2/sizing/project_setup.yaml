# The universal circuit setup file
project:
  name: FOLDED-CASCODE-OTA
  description: Example of optimizing a folded cascode OTA using NGOpt optimizer from Nevergrad
  simulator: ngspice
  save_sim: False

  # Workspace root for this design. A relative path is resolved against THIS file's
  # directory, so this example works on a fresh clone with no path editing. Use an
  # absolute path to point at a workspace outside the repo.
  ws_root : ..
  # The following paths are relative to the ws_root
  netlist : spice/cora_testbench.spice
  outdir  : spice/temp_spice_out
  
  # ------------------------
  # Technology Specification: Define the technology and PDK rules
  # ------------------------
  tech_spec : 
    name : ihp-sg13g2
    # PDK RULES
    constraints:
      # n-fet
      max_nfet_w : 200u
      min_nfet_w : 1u
      max_nfet_l : 5u
      min_nfet_l : 0.5u

      # p-fet
      max_pfet_w : 200u
      min_pfet_w : 1u
      max_pfet_l : 5u
      min_pfet_l : 0.5u

      # supply voltage
      max_vdd : 1.8

  # ------------------------
  # PVT (Phase 1): named corners that actually drive the simulation.
  # `active_corner` picks the single corner the optimizer runs against; it can be
  # overridden ephemerally from the UI. The default `tt_27C_1V8` reproduces this
  # testbench's hardcoded netlist exactly (.lib cornerMOSlv.lib mos_tt, .param temp=27,
  # .param VDD=1.8), so enabling PVT changes nothing until you switch corners.
  #
  # MULTI-CORNER MODE (Phase 2): with `mode: multi`, every trial simulates ALL
  # `enabled: true` corners (testbenches x corners cross-product) and collapses the
  # per-corner scores into one objective via `score_aggregation`:
  #   mean (aliases: avg, average)      — average the corner scores [default]
  #   sum  (aliases: add, total)        — add them (average-case bias; a strong corner
  #                                       can mask a weak one)
  #   min  (aliases: worst, worst_case) — worst case: classic PVT sign-off, the
  #                                       failing corner always dominates
  # `active_corner` is still used by single-corner manual sims / UI corner picks.
  # ------------------------
  pvt:
    active_corner: tt_27C_1V8
    mode: multi
    score_aggregation: mean

    # Reusable process bundles — ordered (file, section) includes across device families.
    # PDK-specific tokens; core never interprets them.
    process_bundles:
      tt:
        - { lib_file: cornerMOSlv.lib, section: mos_tt }
        - { lib_file: cornerRES.lib,   section: res_typ }
        - { lib_file: cornerCAP.lib,   section: cap_typ }
      ss:
        - { lib_file: cornerMOSlv.lib, section: mos_ss }
        - { lib_file: cornerRES.lib,   section: res_wcs }
        - { lib_file: cornerCAP.lib,   section: cap_wcs }
      ff:
        - { lib_file: cornerMOSlv.lib, section: mos_ff }
        - { lib_file: cornerRES.lib,   section: res_bcs }
        - { lib_file: cornerCAP.lib,   section: cap_bcs }

    corners:
      - name: tt_27C_1V8            # typical — matches the netlist's hardcoded corner
        process: tt
        temp: 27
        supply: { node: VDD, value: 1.8 }
        enabled: true

      - name: ss_125C_1V62          # slow-slow, hot, -10% supply
        process: ss
        temp: 125
        supply: { node: VDD, value: 1.62 }
        enabled: true

      - name: ff_m40C_1V98          # fast-fast, cold, +10% supply
        process: ff
        temp: -40
        supply: { node: VDD, value: 1.98 }
        enabled: false

    # Optional directory holding the .lib files, so corners are portable. If null, the
    # netlist's own `.lib` search path / PDK env is used (current behavior).
    model_lib_root: null

  # ------------------------
  # DUT Parameters: Configure the parameters to be sized/optimized ([optional] freeze : true/false)
  # ------------------------
  dut_params :
    # ------------------------
    # Device 1 (PMOS) - Input Pair (XM1, XM2)
    # ------------------------
    - name : x_dut_W_1
      # init : 72u
      min_val: min_pfet_w
      max_val: max_pfet_w

    - name : x_dut_L_1
      # init : 2u
      min_val: min_pfet_l
      max_val: max_pfet_l

    # ------------------------
    # Device 2 (NMOS) - Current Mirror/Load (XM3, XM4, XM13)
    # ------------------------
    - name : x_dut_W_2
      min_val: min_nfet_w
      max_val: max_nfet_w

    - name : x_dut_L_2
      # init : 2u
      min_val: min_nfet_l
      max_val: max_nfet_l

    # ------------------------
    # Device 3 (NMOS) - Cascode (XM5, XM6)
    # ------------------------
    - name : x_dut_W_3
      # init : 44u
      min_val: min_nfet_w
      max_val: max_nfet_w

    - name : x_dut_L_3
      # init : 2.5u
      min_val: min_nfet_l
      max_val: max_nfet_l

    # ------------------------
    # Device 4 (PMOS) - Cascode (XM7, XM8)
    # ------------------------
    - name : x_dut_W_4
      # init : 78u
      min_val: min_pfet_w
      max_val: max_pfet_w

    - name : x_dut_L_4
      # init : 2u
      min_val: min_pfet_l
      max_val: max_pfet_l

    # ------------------------
    # Device 5 (PMOS) - Active Load (XM9, XM10)
    # ------------------------
    - name : x_dut_W_5
      # init : 183u
      min_val: min_pfet_w
      max_val: max_pfet_w

    - name : x_dut_L_5
      # init : 4.5u
      min_val: min_pfet_l
      max_val: max_pfet_l

    # ------------------------
    # Device 6 (PMOS) - Bias (XM0, XM11)
    # ------------------------
    - name : x_dut_W_6
      # init : 50u
      min_val: min_pfet_w
      max_val: max_pfet_w

    - name : x_dut_L_6
      # init : 3u
      min_val: min_pfet_l
      max_val: max_pfet_l

    # ------------------------
    # Device 7 (PMOS) - Bias (XM12)
    # ------------------------
    - name : x_dut_W_7
      # init : 50u
      min_val: min_pfet_w
      max_val: max_pfet_w

    - name : x_dut_L_7
      # init : 3u
      min_val: min_pfet_l
      max_val: max_pfet_l

    # ------------------------
    # Biasing Voltages
    # ------------------------
    - name : x_dut_Vb1
      # init : 0.5
      min_val: 0.1
      max_val: max_vdd

    - name : x_dut_Vb2
      # init : 0.5
      min_val: 0.1
      max_val: max_vdd

    # ------------------------
    # Biasing Current
    # ------------------------
    - name : x_dut_IB
      # init : 34u  
      freeze_to : 34u   # Freezes the parameter value to this value
      min_val: 1u
      max_val: 100u
      
  
  # ------------------------
  # Testbench: Configure the testbenches to be used for simulations
  # ------------------------
  testbenches :
      # ------------------------
      # Testbench 1 - AC Simulation
      # ------------------------
      - name: tb_ac
        params:
          - name : CL
            description : load capacitance
            val : 5p
        netlist : spice/cora_testbench_ac.spice
        enable: True # Optional: Enable or disable this testbench
        description : AC analysis for UGF, Gain, PM

      # ------------------------
      # Testbench 2 - Noise Simulation
      # ------------------------
      - name: tb_noise
        params:
          - name : CL
            description : load capacitance
            val : 5p
        netlist : spice/cora_testbench_noise.spice
        enable: False # Optional: Enable or disable this testbench
        description : Noise analysis for input referred noise

      # ------------------------
      # Testbench 3 - Transient Simulation
      # ------------------------
      - name: tb_tran
        params:
          - name : CL
            description : load capacitance
            val : 5p
        netlist : spice/cora_testbench_tran.spice
        enable: False # Optional: Enable or disable this testbench
        description : Transient analysis for slew rate and settling time

      # ------------------------
      # Testbench 4 - Operating Point Simulation
      # ------------------------
      - name: tb_op
        params:
          - name : CL
            description : load capacitance
            val : 5p
        netlist : spice/cora_testbench_op.spice
        enable: False # Optional: Enable or disable this testbench
        description : Operating point analysis

  # ------------------------
  # Optimizer Configuration: Configure the optimizer and target specifications
  # ------------------------
  optimizer_config :
    type: nevergrad
    random_seed: 48
    budget: 5
    name: SamplingSearch
    optimizer_kwargs:
      sampler: Hammersley  # The closest alternative to Sobol
      scrambled: True      # Critical: randomization removes structural artifacts
      rescaled: True       # Ensures you hit the boundaries    


    target_specs:
      - name: ugf
        description: Unitiy gain frequency # optional documentation field
        testbench: tb_ac
        sim_type: ac      # options: dc, ac, tran, noise
        goal: exact       # options: exact, exceed, minimize
        target: 21e6     # Unit: MHz
        range: 1e6        # The expected variation range. used in normalizing the metric values
        tolerance: 1e5   # [Optional] allowed deviation in the spec, otherwise 5% margin is assumed.
        weight:   100.0   # [Optional] non-negative weight factor for this target, else it is 1.0
        log_scale: False  # [Optional] Used to indicate the spec is on log scale
        error_type: relative-sigmoid # [Optional] options: absolute, target_spec_val, squared, relative-squared, relative-absolute, relative-exponential
        enable: True      # [Optional] Used to exclude from the loss function

      - name: dcgain
        description: gain in dB at DC
        testbench: tb_ac
        sim_type: ac    # options: dc, ac, tran, noise
        goal: exceed    # options: exact, exceed, minimize
        target: 55      # 40 dB
        range: 100      # The expected variation range. used in normalizing the metric values
        tolerance: 5    # [Optional] allowed deviation in the spec
        weight:   100.0  # [Optional] non-negative weight factor for this target, else it is 1.0
        error_type: relative-sigmoid # [Optional] options: absolute, target_spec_val, squared, relative-squared, relative-absolute, relative-exponential
        enable: True    # [Optional] Used to exclude from the loss function

      - name: pm
        description: phase margin
        testbench: tb_ac
        sim_type: ac   # options: dc, ac, tran, noise
        goal: exact    # options: exact, exceed, minimize
        target: 70     # in degrees
        range: 45      # The expected variation range. used in normalizing the metric values
        tolerance: 30  # [Optional] allowed deviation in the spec
        weight:   100.0  # [Optional] non-negative weight factor for this target, else it is 1.0
        error_type: relative-sigmoid # [Optional] options: absolute, target_spec_val, squared, relative-squared, relative-absolute, relative-exponential
        enable: True    # [Optional] Used to exclude from the loss function

  