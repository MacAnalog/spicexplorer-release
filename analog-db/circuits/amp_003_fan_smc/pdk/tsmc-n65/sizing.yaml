# Sizing for the tsmc-n65 binding — generated by `analog-db add-binding` from the
# ihp-sg13g2 sizing (geometry re-noted to tsmc-n65's unit convention + bin-clamped).
# A starting point; re-tune defaults/bounds for tsmc-n65 device physics as needed.
schema: spicexplorer/sizing@1
pdk: tsmc-n65
variables:
- name: CAPACITOR_0
  default: 20p
- name: CURRENT_0_BIAS
  default: 15u
- name: x_dut_xm7_l
  default: 1.5u
- name: x_dut_xm7_m
  default: '16'
- name: x_dut_xm7_w
  default: 1.5u
- name: x_dut_xm10_l
  default: 1u
- name: x_dut_xm10_m
  default: '8'
- name: x_dut_xm10_w
  default: 2u
- name: x_dut_xm11_l
  default: 1u
- name: x_dut_xm11_m
  default: '32'
- name: x_dut_xm11_w
  default: 0.5u
- name: x_dut_xm19_l
  default: 1u
- name: x_dut_xm14_m
  default: '4'
- name: x_dut_xm19_w
  default: 2u
- name: x_dut_xm21_l
