schema: spicexplorer/datasheet@1
default_conditions:
  supply:
    unit: V
    typical: 1.5
  cload:
    unit: fF
    typical: 10000
  corner:
    typical: tt
  temp:
    unit: degC
    typical: 27
  vcm:
    unit: V
    typical: 0.8
  ibias:
    unit: uA
    typical: 5
metrics:
  ugf_hz:
    display: Unity-gain frequency
    unit: Hz
    analysis: ac_open_loop
    extract:
      meas: ugf
    spec:
      unit: Hz
      min: 200000000.0
    optimize:
      spec_name: ugf
      testbench: tb_ac
      sim_type: ac
      goal: exceed
      target: 200.0e6
      range: 100.0e6
      tolerance: 10.0e6
      weight: 100.0
      log_scale: false
      error_type: relative-absolute
      reward_type: log
      enable: true
  dc_gain_db:
    display: DC open-loop gain
    unit: dB
    analysis: ac_open_loop
    extract:
      meas: dcgain
    symbolic:
      tool: netlist2tf
      call: open_loop_gain
      args:
        output:
        - vout
        - vss
        input:
        - vinp
        - vinn
        scale: db
    spec:
      min: 40
      unit: dB
    optimize:
      spec_name: dcgain
      testbench: tb_ac
      sim_type: ac
      goal: exceed
      target: 40
      range: 100
      tolerance: 1
      weight: 100.0
      error_type: relative-absolute
      reward_type: log
      enable: true
  pm_deg:
    display: "Phase margin (diagnostic \u2014 see note)"
    unit: deg
    analysis: ac_open_loop
    extract:
      meas: pm
    spec:
      typ: 60
      unit: deg
      min: 60
      max: 90
    optimize:
      spec_name: pm
      testbench: tb_ac
      sim_type: ac
      goal: exact
      target: 60
      range: 45
      tolerance: 10
      weight: 100.0
      error_type: relative-absolute
      reward_type: none
      enable: true
  vn_in_integrated:
    display: Integrated input-referred noise (1 Hz - 1 MHz)
    description: Total input-referred rms noise integrated over the standardized 1 Hz -
      1 MHz band, unity-buffer config, CL=10p (campaign 2026-08-01). ngspice inoise_total
      is already volts rms over the swept band. REPLACES the old vn_in entry, which mapped
      the same inoise_total measure under V/sqrt(Hz) — dimensionally wrong. NO spec; the
      optimize block is retained from vn_in (its v(inoise_total) hook is unchanged), though
      its 1.2 mV target predates the band widening.
    unit: V
    analysis: noise
    extract:
      meas: inoise_total
    optimize:
      spec_name: v(inoise_total)
      testbench: tb_noise
      sim_type: noise
      goal: minimize
      target: 0.0012
      range: 0.001
      tolerance: 1.0e-06
      weight: 100.0
      error_type: relative-absolute
      reward_type: log
      enable: true
  i_supply:
    display: Supply current
    unit: A
    analysis: dc_op
    extract:
      meas: i_supply
    spec:
      max: 2.5e-05
      unit: A
    optimize:
      spec_name: i(idd_total)
      testbench: tb_noise
      sim_type: op
      goal: minimize
      target: 2.5e-05
      range: 0.0001
      tolerance: 1.0e-06
      weight: 100.0
      error_type: relative-absolute
      reward_type: log
      enable: true
  t_settle:
    display: Settling time
    unit: s
    analysis: tran_step
    extract:
      meas: t_settle
    spec:
      max: 1.5e-05
      unit: s
    optimize:
      spec_name: tsettle
      testbench: tb_tran
      sim_type: tran
      goal: minimize
      target: 1.5e-05
      range: 1.0e-06
      tolerance: 1.0e-08
      weight: 10.0
      error_type: relative-absolute
      reward_type: none
      enable: true
  psrr_vdd_db:
    display: Positive-supply rejection
    description: PSRR+ in the unity-buffer config, DC-band floor (design-review 2026-07-05
      rollout).
    unit: dB
    analysis: psrr_vdd
    extract:
      meas: psrr_vdd_db
    spec:
      unit: dB
      min: 40.0
  cmrr_db:
    display: Common-mode rejection
    description: CMRR in the unity-buffer config, DC-band floor (design-review 2026-07-05
      rollout).
    unit: dB
    analysis: cmrr_vcm
    extract:
      meas: cmrr_db
    spec:
      min: 40
      unit: dB
  thd_pct:
    display: Total harmonic distortion (50 mV @ 10 kHz, buffer)
    description: tran+FFT on ngspice; native PSS harmonics on Spectre. F0 = 10 kHz per the
      campaign grid (fresh ugf 300 kHz < 3 MHz -> /100); ASIG = 50 mV, halved from the
      0.1 default for the telescopic cascode's low output swing (campaign 2026-08-01).
    unit: '%'
    analysis: thd
    extract:
      meas: thd_pct
      f0: 1.0e4
    spec:
      max: 2.0
      unit: '%'
  iip3_dbv:
    display: Input IP3 (two-tone 9/10 kHz, 6.25 mV/tone, buffer)
    description: Single-point IM3 extrapolation; tran+coherent DFT on ngspice, native PSS
      on Spectre. Tones at 9/10 kHz per the campaign grid (fresh ugf 300 kHz < 3 MHz ->
      /100), exact 9:10 ratio on the 1 kHz beat fundamental. ampl_in MUST track the
      analysis binding's ASIG (it is the intercept's input reference).
    unit: dBV
    analysis: iip3
    extract:
      meas: iip3_dbv
      f1: 9.0e3
      f2: 1.0e4
      ampl_in: 0.00625
    spec:
      min: -10
      unit: dBV
  pm_loop_deg:
    display: Loop phase margin (stb probe)
    description: Phase margin of the unity-buffer loop by Middlebrook injection at the
      VIPRB marker — probes the same loop as pm_deg (ac_open_loop), so the two must agree
      to ~2 deg. -999 sentinel = no in-band crossover (fails the min spec by design).
    unit: deg
    analysis: stb
    extract:
      meas: pm_loop
    spec:
      min: 60
      unit: deg
  loopgain_db:
    display: DC loop gain (stb probe)
    description: Loop-gain magnitude read at FSTART = 0.01 Hz; crosschecks ac_open_loop's
      dcgain. NO spec (dc_gain_db already carries the gain oracle).
    unit: dB
    analysis: stb
    extract:
      meas: loopgain_db
  ugf_loop_hz:
    display: Loop unity-gain frequency (stb probe)
    description: Loop crossover of the unity-buffer stb probe; crosschecks ac_open_loop's
      ugf. NO spec (ugf_hz already carries the bandwidth oracle).
    unit: Hz
    analysis: stb
    extract:
      meas: ugf_loop
  gm_loop_db:
    display: Loop gain margin (stb probe)
    description: Gain margin at the -180 deg crossing of the stb probe. -999 sentinel =
      the loop phase never reaches -180 deg in-band (single-dominant-pole loop) — correct
      behavior here, hence NO spec.
    unit: dB
    analysis: stb
    extract:
      meas: gm_loop
