# Corner bundles for sky130 (D-6): PDK libs stay out-of-repo, referenced by lib_file + section.
pdk: sky130
corners:
  tt: [{lib_file: sky130.lib.spice, section: tt}]
  ss: [{lib_file: sky130.lib.spice, section: ss}]
  ff: [{lib_file: sky130.lib.spice, section: ff}]
  sf: [{lib_file: sky130.lib.spice, section: sf}]
  fs: [{lib_file: sky130.lib.spice, section: fs}]
default_corner: tt
