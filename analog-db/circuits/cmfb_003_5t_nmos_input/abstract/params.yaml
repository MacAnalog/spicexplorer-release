# cmfb_003_5t_nmos_input — DUT parameterization (spicexplorer/params@1; contract: _shared/PARAMS.md).
# `devices:` is GENERATED from abstract/topology.cgraph.json — refresh with
# `analog-db gen-params --circuit cmfb_003_5t_nmos_input --write` (it preserves the authored sections).
# `groups:`/`ratios:` are AUTHORED default tying, reviewed by a human (plan D-2):
# recommendations tagged with WHY, which an upstream user may accept, edit, or dissolve.
schema: spicexplorer/params@1
devices:
  RMN: {Value: x_dut_rmn_value}
  RMP: {Value: x_dut_rmp_value}
  XM1: {l: x_dut_xm1_l, m: x_dut_xm1_m, w: x_dut_xm1_w}
  XM2: {l: x_dut_xm2_l, m: x_dut_xm2_m, w: x_dut_xm2_w}
  XM3: {l: x_dut_xm3_l, m: x_dut_xm3_m, w: x_dut_xm3_w}
  XM4: {l: x_dut_xm4_l, m: x_dut_xm4_m, w: x_dut_xm4_w}
  XM5: {l: x_dut_xm5_l, m: x_dut_xm5_m, w: x_dut_xm5_w}
  XM6: {l: x_dut_xm6_l, m: x_dut_xm6_m, w: x_dut_xm6_w}
  XM8: {l: x_dut_xm8_l, m: x_dut_xm8_m, w: x_dut_xm8_w}
# NOTE (2026-07-20 review): the structural proposals' bias-vs-tail mirror_length
# ties are deliberately DROPPED — the optimizer sized those lengths independently.
groups:
- name: pair_xm1_xm2
  kind: matched_pair
  members: [XM1, XM2]
  tie: [w, l, m]
  description: NMOS input differential pair (XM1 gate = sensed CM, XM2 gate = vref).
- name: mirror_xm3_xm4
  kind: matched_pair
  members: [XM3, XM4]
  tie: [w, l, m]
  description: PMOS mirror load, drawn 1:1 (XM3 diode -> XM4 output side); long L sets
    the servo output ro / dominant pole.
- name: pair_rmp_rmn
  kind: shared_geometry
  members: [RMP, RMN]
  tie: [Value]
  description: CM-detector averaging resistors — equal values so cm_sense sits at the true
    output midpoint (mismatch leaks differential signal into the CM servo).
