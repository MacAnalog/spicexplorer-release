# Design variables for the ihp-sg13g2 binding — the OPTIMIZER-SIZED point from the
# 2026-07-18/19 dual-engine campaign (drawings/SIZING_VALIDATION_REPORT.md §4.1;
# machine copy drawings/sizing-and-specs.yaml bio_afe_SRMC_core_amp.ihp_winner).
# Campaign: scripted Nevergrad (budget 400, ckpt best i=191) + 100-loop banded refine;
# verified standalone: 54.67 dB / 76.2 MHz / PM 60.2 deg / 96.9 uA, CM errors
# 0.21/0.31 mV, both servos in-rail. Defaults are FULL-PRECISION on purpose — the
# drawn seed (all 0.15u/0.13u) is UNSTABLE (PM -17.8 deg). Group representatives only
# (see abstract/params.yaml ties): XM4<-XM3, XM7<-XM6, XM9<-XM1, XM10<-XM2, C2<-C1,
# R2<-R1, RM1N/RM2P/RM2N<-RM1P. The CMFB servo macromodel knobs are behavioral.
# Per-PDK note: VB2 is PDK-specific (ihp sized 0.70 / FOUNDRY-n65 drawn 0.50 /
# FOUNDRY-n65 sized 0.35 — the 65nm binding, when added, must re-bias; see the report §6.1
# incl. the 65nm loop-2 rail-marginality).
schema: spicexplorer/sizing@1
pdk: ihp-sg13g2
variables:
  - {name: x_dut_xm3_w, description: "NMOS input pair width (XM3/XM4)", default: 1.929899553930193e-06, min: 0.15u, max: 50u, unit: m}
  - {name: x_dut_xm3_l, description: "NMOS input pair length", default: 7.17160573582043e-07, min: 0.13u, max: 2u, unit: m}
  - {name: x_dut_xm6_w, description: "PMOS input pair width (XM6/XM7)", default: 4.333517676791642e-06, min: 0.15u, max: 50u, unit: m}
  - {name: x_dut_xm6_l, description: "PMOS input pair length", default: 5.543754544025163e-07, min: 0.13u, max: 2u, unit: m}
  - {name: x_dut_xm5_w, description: "Stage-1 NMOS tail width (gate vb2)", default: 2.65342774731541e-06, min: 0.15u, max: 50u, unit: m}
  - {name: x_dut_xm5_l, description: "Stage-1 NMOS tail length", default: 4.862864381993593e-07, min: 0.13u, max: 2u, unit: m}
  - {name: x_dut_xm8_w, description: "Stage-1 PMOS tail width (CMFB loop-1 actuator, gate vcmfb1)", default: 2.8635900612133323e-06, min: 0.15u, max: 50u, unit: m}
  - {name: x_dut_xm8_l, description: "Stage-1 PMOS tail length", default: 4.4416626216939937e-07, min: 0.13u, max: 2u, unit: m}
  - {name: x_dut_xm1_w, description: "Output NMOS driver width (XM1/XM9)", default: 2.0223959132588594e-06, min: 0.15u, max: 50u, unit: m}
  - {name: x_dut_xm1_l, description: "Output NMOS driver length", default: 4.2775106088068857e-07, min: 0.13u, max: 2u, unit: m}
  - {name: x_dut_xm2_w, description: "Output PMOS source width (CMFB loop-2 actuator, XM2/XM10)", default: 1.5914426355899998e-06, min: 0.15u, max: 50u, unit: m}
  - {name: x_dut_xm2_l, description: "Output PMOS source length", default: 5.757246674262767e-07, min: 0.13u, max: 2u, unit: m}
  - {name: x_dut_c1_value, description: "Per-side Miller compensation cap (drawn Cc)", default: 5.0e-12, min: 0.05p, max: 20p, unit: F}
  - {name: x_dut_r1_value, description: "Per-side Miller nulling resistor (drawn Rz)", default: 7.0e3, min: 100, max: 200k, unit: ohm}
  - {name: x_dut_rm1p_value, description: "CM-detector resistor unit (all four halves tied)", default: 1Meg, min: 10k, max: 100Meg, unit: ohm}
  - {name: gm_val,   description: "CMFB servo macromodel transconductance (both loops)", default: 100u, min: 1u, max: 10m, unit: S}
  - {name: rout_val, description: "CMFB servo macromodel output resistance", default: 10Meg, min: 100k, max: 1.0e9, unit: ohm}
  - {name: rin_val,  description: "CMFB servo macromodel input resistance (near-ideal)", default: 1.0e12, min: 1.0e9, max: 1.0e14, unit: ohm}
  - {name: cout_val, description: "CMFB servo macromodel output capacitance (100f validated for BOTH loops here)", default: 300f, min: 1f, max: 10p, unit: F}
  - {name: cin_val,  description: "CMFB servo macromodel input capacitance", default: 1f, min: 1f, max: 1p, unit: F}
  - {name: vb2, description: "Stage-1 NMOS tail gate bias (per-PDK: ihp-sized value; see header)", default: 0.7002027602191484, min: 0.0, max: 1.2, unit: V}
  - {name: vref_cm, description: "CM reference for BOTH servo loops (drawn 0.5 V = the SRMC filter's system CM)", default: 0.5, min: 0.0, max: 1.2, unit: V}
  # Frozen per-device literals: defaults reproduce the drawn m=1 exactly.
  - {name: x_dut_xm1_m, description: "XM1 m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
  - {name: x_dut_xm2_m, description: "XM2 m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
  - {name: x_dut_xm3_m, description: "XM3 m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
  - {name: x_dut_xm5_m, description: "XM5 m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
  - {name: x_dut_xm6_m, description: "XM6 m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
  - {name: x_dut_xm8_m, description: "XM8 m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
