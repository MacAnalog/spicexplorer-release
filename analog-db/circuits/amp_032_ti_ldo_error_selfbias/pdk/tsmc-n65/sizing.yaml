# Sizing for the tsmc-n65 binding — generated by `analog-db add-binding` from the
# gf180mcu sizing (geometry re-noted to tsmc-n65's unit convention + bin-clamped).
# A starting point; re-tune defaults/bounds for tsmc-n65 device physics as needed.
schema: spicexplorer/sizing@1
pdk: tsmc-n65
variables:
- name: x_dut_xmbp_w
  default: 6.3111u
  min: 2u
  max: 64u
  unit: m
  description: On-chip reference PMOS (diode-connected, vdd->ibias). PRIMARY power/PSRR trade knob.
- name: x_dut_xmbp_l
  default: 2u
  min: 0.5u
  max: 10u
  unit: m
  description: Reference PMOS length; longer = lower current, better matching.
- name: x_dut_xmb0_w
  default: 34.533u
  min: 2u
  max: 100u
  unit: m
  description: Bias-mirror NMOS unit
- name: x_dut_xmb0_l
  default: 2u
  min: 0.5u
  max: 10u
  unit: m
- name: x_dut_xmbc_m
  default: '1'
  is_integer: true
  min: 1
  max: 8
  description: Tail mirror multiplicity
- name: x_dut_xmbo_m
  default: '1'
  is_integer: true
  min: 1
  max: 8
  description: Output sink multiplicity
- name: x_dut_xm1_w
  default: 68.542u
  min: 4u
  max: 100u
  unit: m
  description: Input pair
- name: x_dut_xm1_l
  default: 0.7u
  min: 0.28u
  max: 10u
  unit: m
- name: x_dut_xm3_w
  default: 69.545u
  min: 4u
  max: 100u
  unit: m
  description: Level-shifted PMOS mirror (M3m/M5)
- name: x_dut_xm3_l
  default: 0.5u
  min: 0.28u
  max: 10u
  unit: m
- name: x_dut_xm4_w
  default: 10u
  min: 2u
  max: 100u
  unit: m
  description: M4 compound-diode level shifter (~zero DC current by design)
- name: x_dut_xm4_l
  default: 0.5u
  min: 0.28u
  max: 10u
  unit: m
- name: x_dut_xm6_w
  default: 60u
  min: 8u
  max: 100u
  unit: m
  description: M6 output PMOS
- name: x_dut_xm6_l
  default: 1u
  min: 0.28u
  max: 10u
  unit: m
- name: r_z
  default: 10k
  min: 100
  max: 50k
  unit: ohm
  description: Nulling resistor (Miller compensation)
- name: c_comp
  default: 15p
  min: 0.2p
  max: 20p
  unit: F
  description: Miller capacitor
- name: x_dut_xmbf_w
  default: 5u
  min: 1u
  max: 40u
  unit: m
  description: M_mirror_f sink (level-shifter anchor; carries ~0 by design)
- name: r_nd
  default: 500k
  min: 10k
  max: 10MEG
  unit: ohm
  description: "Level-shifted-mirror gate-rail tie na->nd (DC-defines nd; ~0 current \u2014 fix 2026-07-25,\
    \ see abstract netlist)"

# Per-PDK re-bias. This circuit is authored on a 3.3 V rail; the tsmc-n65 registry is a
# 1.2 V CORE kit with no IO/thick-oxide device, so the authored rail would put 3.3 V across
# a 1.2 V oxide and read gm/ID off a grid that stops at 1.8 V. Re-biased to the kit rail
# (3.3 V -> 1.2 V; VCM 1.2*1.2/3.3). The circuit is therefore characterised on tsmc-n65 at a DIFFERENT operating
# point than on gf180mcu/sky130/ihp-sg13g2 -- intentional (owner decision), and it means
# its tsmc-n65 row is not directly comparable to its open-PDK rows.
analysis_params:
  VDD: 1.2
  VCM: 0.436
