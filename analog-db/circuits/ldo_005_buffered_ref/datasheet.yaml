# Datasheet for the buffered-reference LDO. Validated against _shared/schema/datasheet.schema.json.
# UNITS NOTE (matches ldo_007_pmos): load_reg / line_reg are a plain delta-Vout in VOLTS, not a slope.
#
# SPECS CHARACTERIZED ON ihp-sg13g2 (the best-behaved binding — vout lands almost exactly on
# the ideal vref*(r_ref_top+r_ref_bot)/r_ref_bot target) by real ngspice runs — see
# results/ihp-sg13g2__tt.json. gf180mcu (the native/source-design PDK) and sky130 both run all
# 7 analyses cleanly too, but each needed a per-PDK vref_val bump for input-pair headroom
# (0.8 V / 0.7 V vs. ihp's 0.6 V — see their own pdk/<pdk>/sizing.yaml notes) and neither
# regulates as tightly — same "runs but not yet per-PDK tuned" state as ldo_007_pmos. Two internal
# 5T OTA stages (ref buffer + error amp) plus an RC filter give this circuit more poles than
# ldo_007_pmos's single-error-amp loop — expect looser stability margins in general.
schema: spicexplorer/datasheet@1
cace_format: "5.2"
default_conditions:
  supply: {unit: V, typical: 3.3}      # input rail (Vin=vdd for this 3-port DUT); 6 V device family
  vout:   {unit: V, typical: 1.6}      # regulated output target (= vref*(r_ref_top+r_ref_bot)/r_ref_bot)
  vref:   {unit: V, typical: 0.8}      # internal reference (sizing var vref_val)
  cout:   {unit: uF, typical: 1.0}     # external output cap assumed by PSRR/transient/stability
  iload:  {unit: mA, typical: 1.0}     # nominal load current
  corner: {typical: tt}
  temp:   {unit: degC, typical: 27}
# RE-TARGETED 2026-07-20 for the rewritten architecture: 3.3 V rail (6 V devices), 1.6 V output.
# The v_out window is +/-100 mV rather than the old +/-50 mV ON PURPOSE — the error amp compares
# vout DIRECTLY against the filtered reference with no feedback divider, so amp_032's ~93 mV
# systematic input offset appears at vout one-for-one, before any regulation error. Tightening it
# below that would be specifying a number the chosen error-amp topology cannot meet; closing that
# gap is an amp_032 topology question (its ratioed mirror_e sink), tracked separately.
metrics:
  v_out:
    display: "Regulated output voltage"
    description: "DC output at no load; settles almost exactly to vref*(r_ref_top+r_ref_bot)/r_ref_bot = 1.2 V on ihp-sg13g2."
    unit: V
    analysis: dc_op
    extract: {meas: vout_dc}
    spec: {min: 1.50, typ: 1.6, max: 1.70, unit: V}
  i_q:
    display: "Quiescent current"
    description: "Total supply current at no load (ref-buffer tail + error-amp tail + dividers)."
    unit: A
    analysis: dc_op
    extract: {meas: i_supply}
    spec: {max: 8.0e-4, unit: A}
  load_reg:
    display: "Load regulation"
    description: "delta-Vout across the 0 -> ILOAD_STOP DC load sweep (volts, not a slope)."
    unit: V
    analysis: load_regulation
    extract: {meas: load_reg}
    spec: {max: 0.06, unit: V}
  line_reg:
    display: "Line regulation"
    description: >-
      delta-Vout across the Vin sweep at fixed load (volts, not a slope). Loose vs. ldo_007_pmos:
      the reference-buffer stage's own supply sensitivity feeds straight through the RC filter
      into the error amp's reference input, with no PSRR of its own to reject it.
    unit: V
    analysis: line_regulation
    extract: {meas: line_reg}
    spec: {max: 0.3, unit: V}
  v_dropout:
    display: "Dropout voltage"
    description: "Vin - Vout at which Vout has fallen to VOUT_THRESH under heavy load."
    unit: V
    analysis: dropout
    extract: {meas: v_dropout}
    spec: {max: 0.4, unit: V}
  psrr_vdd_db:
    display: "PSRR (Vdd -> Vout)"
    description: "Supply rejection at FMEAS (1 kHz) at nominal load + Cout."
    unit: dB
    analysis: psrr
    extract: {meas: psrr_vdd_db}
    spec: {min: 25, unit: dB}
  zout_peak_db:
    display: "Closed-loop Zout peaking"
    description: >-
      Peaking of the closed-loop output impedance above its DC value (dB) — a stability PROXY
      measurable from the [vdd,vout,vss] ports (same rationale as ldo_007_pmos: the loop is entirely
      internal to the subckt, so a true loop-gain phase margin needs a future internal probe).
    unit: dB
    analysis: loop_stability
    extract: {meas: zout_peak_db}
    spec: {max: 10, unit: dB}
  v_undershoot:
    display: "Load-step undershoot"
    description: "Peak Vout droop on a fast lo->hi load step (volts)."
    unit: V
    analysis: tran_load_step
    extract: {meas: v_undershoot}
    spec: {max: 0.15, unit: V}
  t_transient:
    display: "Load-step recovery time"
    description: "Time for Vout to settle back within VTOL after the load step."
    unit: s
    analysis: tran_load_step
    extract: {meas: t_transient}
    spec: {max: 3.0e-5, unit: s}
  vn_out_rms:
    display: "Integrated output noise"
    description: "Closed-loop output noise integrated 10 Hz - 10 MHz at nominal load + Cout (V rms)."
    unit: V
    analysis: noise
    extract: {meas: vn_out_rms}
    spec: {max: 0.02, unit: V}          # ihp-sg13g2 measured 12.0 mVrms
  v_line_pp:
    display: "Line-transient deviation"
    description: >-
      Peak-to-peak Vout deviation over a fast 1.6 -> 2.0 V supply step at nominal load. Dominated
      by the same reference-buffer supply sensitivity that sets line_reg (the buffer's own
      operating point shifts with Vdd and feeds through the RC filter unrejected).
    unit: V
    analysis: tran_line_step
    extract: {meas: v_line_pp}
    spec: {max: 0.03, unit: V}          # ihp-sg13g2 measured 15.8 mV p2p
  pm_loop_deg:
    display: "Loop phase margin"
    description: "TRUE regulation-loop phase margin by voltage injection at the Vlp marker. The
      previous revision of this circuit measured 0.97 dB of loop gain with pm_loop 206 deg (i.e. no
      usable loop), while zout_peak_db read 0.0 and looked perfectly damped — which is exactly why
      this metric exists alongside the peaking proxy."
    unit: deg
    analysis: ac_loopgain
    extract: {meas: pm_loop}
    spec: {min: 45, unit: deg}
  loopgain_db:
    display: "DC loop gain"
    description: "Loop gain at FSTART. Sets the regulation accuracy floor: static load/line error
      scales as 1/loop-gain."
    unit: dB
    analysis: ac_loopgain
    extract: {meas: loopgain_db}
    spec: {min: 50, unit: dB}
  ugf_loop_hz:
    display: "Loop unity-gain frequency"
    description: "Regulation bandwidth — how fast the loop can correct a load step."
    unit: Hz
    analysis: ac_loopgain
    extract: {meas: ugf_loop}
    spec: {min: 1e5, unit: Hz}
