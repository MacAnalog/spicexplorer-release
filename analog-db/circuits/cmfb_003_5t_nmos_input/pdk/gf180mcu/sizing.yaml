# Sizing for the gf180mcu binding — generated by `analog-db add-binding` from the
# ihp-sg13g2 sizing (geometry re-noted to gf180mcu's unit convention + bin-clamped).
# A starting point; re-tune defaults/bounds for gf180mcu device physics as needed.
# HAND-SIZED 2026-08-05 by role + square-law, NOT by search (the as-converted geometry
# was essentially minimum-size and measured -10.5 dB, i.e. attenuating).
# 3.3 V devices: ntail = 1.65 - 0.7 - 0.2 = 0.75 V, so tail headroom is ample and either
# flavor works; NMOS-input keeps parity with sky130. I_tail ~ 20 uA (branch 10 uA); mirror
# L=2u for ro. XM6 is DELIBERATELY the narrow device -- the string's PMOS diode sees a large
# |Vov| (3.3 - Vgs_n), so a small W/L is what sets a sane string current.
# Live: gain_servo_db +41.4 dB, cmfb_slope 117.8, vcmfb_nat 2.307 V (plant balance gate
# 1.633 -> ~-5.7 mV static CM error), vcmfb_max 3.3 V, i_supply 49 uA.
schema: spicexplorer/sizing@1
analysis_params:            # the block's own bench must be run at THIS kit's rail/CM
  VDD: 3.3
  VCM: 1.65
  VSHI: 3.3
  VSSTEP: 5m
pdk: gf180mcu
variables:
- name: x_dut_xm1_w
  description: NMOS input pair width (XM1/XM2)
  default: 10u
  min: 0.22u
  max: 20u
  unit: m
- name: x_dut_xm1_l
  description: NMOS input pair length
  default: 1u
  min: 0.28u
  max: 2u
  unit: m
- name: x_dut_xm3_w
  description: PMOS mirror width (XM3 diode / XM4 output)
  default: 42u
  min: 0.22u
  # max RAISED 20u -> 50u to cover the hand-sized, measurement-backed 42u default. The 20u ceiling
  # was DONOR BOILERPLATE inherited by `add-binding` from the ihp-sg13g2 sizing, NOT a gf180mcu
  # process rule — the kit has no 20 um width limit (wide devices are drawn multi-finger).
  max: 50u
  unit: m
- name: x_dut_xm3_l
  description: 'PMOS mirror length (long: sets output ro and the servo pole)'
  default: 2u
  min: 0.28u
  max: 2u
  unit: m
- name: x_dut_xm8_w
  description: NMOS tail width (mirrors the XM5 bias diode)
  default: 13u
  min: 0.22u
  max: 20u
  unit: m
- name: x_dut_xm8_l
  description: NMOS tail length
  default: 1u
  min: 0.28u
  max: 2u
  unit: m
- name: x_dut_xm5_w
  description: Bias-string NMOS diode width
  default: 6.5u
  min: 0.22u
  max: 20u
  unit: m
- name: x_dut_xm5_l
  description: Bias-string NMOS diode length
  default: 1u
  min: 0.28u
  max: 2u
  unit: m
- name: x_dut_xm6_w
  description: Bias-string PMOS diode width (with XM5 sets the string current)
  default: 1u
  min: 0.22u
  max: 20u
  unit: m
- name: x_dut_xm6_l
  description: Bias-string PMOS diode length
  default: 2u
  min: 0.28u
  max: 2u
  unit: m
- name: x_dut_rmp_value
  description: CM-detector averaging resistor (RMN tied; high-R to avoid loading the sensed outputs)
  default: 5Meg
  min: 10k
  max: 100Meg
  unit: Ohm
- name: x_dut_xm1_m
  description: XM1 m (frozen literal)
  default: 1
  min: 1
  max: 16
  freeze: true
  is_integer: true
- name: x_dut_xm3_m
  description: XM3 m (frozen literal)
  default: 1
  min: 1
  max: 16
  freeze: true
  is_integer: true
- name: x_dut_xm5_m
  description: XM5 m (frozen literal)
  default: 1
  min: 1
  max: 16
  freeze: true
  is_integer: true
- name: x_dut_xm6_m
  description: XM6 m (frozen literal)
  default: 1
  min: 1
  max: 16
  freeze: true
  is_integer: true
- name: x_dut_xm8_m
  description: XM8 m (frozen literal)
  default: 1
  min: 1
  max: 16
  freeze: true
  is_integer: true
