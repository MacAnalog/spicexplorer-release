# Analysis binding: loop-gain / stability probe in the unity buffer (class base template —
# ibias port; IBIAS negative, see ac_open_loop.yaml). ngspice does Middlebrook voltage
# injection at the VIPRB marker (`alter @VIPRB[acmag]=1` in .control — netlist bytes
# unchanged); the Spectre lane composes a native `stb stb probe=VIPRB` off the same marker.
# FSTART = 0.01 Hz is the class value (the stb template's "CHOOSING FSTART" — the lowest
# FSTART at which every single-ended amp of this corpus clears the 30-deg phase-reference
# guard). Params mirror the circuit's other AC benches (VDD 1.8, VCM 0.9, IBIAS -34u,
# CL 10p).
# CROSS-CHECK @ihp-sg13g2 tt (2026-08-01): stb reads loopgain_db 30.68 / ugf_loop 1.946M /
# pm_loop 74.77 while the same-day fresh ac_open_loop reads dcgain 44.13 / ugf 2.029M /
# pm 69.71 — OUTSIDE the campaign's ~2 deg pm gate, and the discrepancy is the CIRCUIT, not
# the binding: the direct-drive open-loop bench sits at the offset-driven op point
# vout = 1.248 V, while the closed buffer (the bias stb injects at, and the one the loop
# actually runs at) sits at vout = 0.904 V. Offset-nulling the open-loop bench onto the
# buffer point (Vinp dc -2.818 mV -> vout 0.90362) reconciles them: it then reads
# dcgain 30.76 (vs loopgain_db 30.68, 0.08 dB), ugf 1.971M (1.3 %), pm 71.41 (3.4 deg,
# single-ended-injection vs pure-differential-drive residual + input-C loading). This
# sizing's cascode gain is a strong function of vout position; the stb numbers are the
# trustworthy closed-loop-bias ones. gm_loop = -999 is the "no -180 deg crossing in-band"
# sentinel (loop phase never reaches -180 below 1 GHz), not a failure.
# REPORTING: `produces:` names DATASHEET METRIC IDS — as of this branch the amplifier class
# vocabulary registers loopgain_db / ugf_loop_hz / pm_loop_deg / gm_loop_db, and
# datasheet.yaml binds all four (pm_loop_deg carries the spec; the other three are
# characterization-only). phref_dev / phref_ok / pm_loop_first still ride the recorded
# `corners.<corner>.analyses.stb.measures` block unbound.
schema: spicexplorer/analysis@1
id: stb
template: stb
description: "Loop gain (stb) of the unity buffer — loopgain_db/ugf_loop/pm_loop/gm_loop; Middlebrook injection at VIPRB on ngspice, native stb on Spectre."
# FSTART 0.01 -> 1e-4 (2026-08-04): the stb bench anchors phase at its first swept point and
# blanks pm_loop/gm_loop to the -999 sentinel when |phref_dev| > 30 deg. For a high-gain amp
# the dominant pole f_p = UGF/A0 is sub-Hz, so 0.01 Hz already sits PAST it — and because
# every stabilising move lowers UGF (hence f_p), the guard fires HARDER on a correct fix than
# on the broken design. Measured on amp_006@gf180: the committed (unstable) sizing reports
# pm_loop -16.5, while the stabilised one reports -999 at 0.01 Hz and +66.0 at 1e-4. pm_loop
# and gm_loop are FSTART-INVARIANT; only the guard moves.
params:
  VDD: 1.8
  VCM: 0.9
  IBIAS: -34u
  CL: 10p
  FSTART: 1e-4     # class value; see the stb template's "CHOOSING FSTART"
  FSTOP: 1G
  PPD: 101
flags: []
produces: [loopgain_db, ugf_loop_hz, pm_loop_deg, gm_loop_db]
