# Analysis binding (thd) — AnalogGym self-bias DUT (no ibias port), so the class's
# ibias-free template variant: the unity buffer self-biases and needs none of the
# Lfb/Cin biaswrap the open-loop benches use.
# F0 GRID: fresh ac_open_loop @ ihp-sg13g2 tt (2026-08-01, landed sizing) reads
# ugf = 1.92 MHz < 3 MHz, so the campaign 1 MHz base grid is divided by 100:
# F0 = 10 kHz sits ~190x under the buffer's closed-loop bandwidth (~ugf).
# COHERENT WINDOW (the template requires (TSTOP-TSTART) to be whole F0 periods, see its
# header): F0 = 10 kHz -> T = 100 us; TSTART = 200u = 2 whole periods, ~26x the 20x-settling
# floor (tran_step t_settle = 385 ns to 2 mV, same fresh run -> 20x = 7.7 us); TSTOP = 1.8m
# leaves 16 whole measured periods. TSTEP = 200n = T/500 = 1/(500*F0).
# DRIVE: ASIG = 0.1 (class default) about VCM = 300m -> vout swings 0.2..0.4 V, well inside
# the 0..1.8 V rails (single-ended DUT, no FD headroom rule needed).
# REPORTING: `produces:` names datasheet metric ids; thd_pct is wired in datasheet.yaml.
# gain_tone < 0.5 means the template's dead-output guard fired and thd_pct is the 999
# sentinel, not a measurement.
schema: spicexplorer/analysis@1
id: thd
template: thd_selfbias
description: "THD — unity-buffer large-signal sine (100 mV @ 10 kHz); tran + in-deck coherent DFT (ngspice) / native PSS (Spectre)."
params: {VDD: 1.8, VCM: 300m, CL: 10p, ASIG: 0.1, F0: 1.0e4, TSTEP: 200n, TSTART: 200u, TSTOP: 1.8m, HARMS: 7}
flags: []
produces: [thd_pct]
