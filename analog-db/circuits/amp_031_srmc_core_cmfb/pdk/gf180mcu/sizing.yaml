  is_integer: true
- name: x_dut_xm6_m
  description: XM6 m (frozen literal)
  default: 1
  min: 1
  max: 16
  freeze: true
  is_integer: true
- name: x_dut_xm8_m
  description: XM8 m (frozen literal)
  default: 1
  min: 1
  max: 16
  freeze: true
  is_integer: true

# Per-PDK re-bias (platform convention: analyses params are the AUTHORED operating point;
# per-PDK deltas live here). amp_031 is authored at the Hsu bio-AFE 1.2 V rail (ihp binding).
# gf180mcu's 03v3 devices (Vth ~0.7/-0.9) cannot bias a complementary-input two-stage at
# 1.2 V, so the binding runs the kit's nominal 3.3 V. VCM picked by coarse VCM x vb2 dc
# sweep (2026-08-03; see the run notes in the port session). vref_cm/vb2 sizing defaults
# above track the same re-bias.
analysis_params:
  VDD: 3.3
  VCM: 1.4
