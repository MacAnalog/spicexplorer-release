# AnalogGym analysis binding (noise).
# Band standardized 2026-08-01 (campaign): FSTART 1 Hz, FSTOP 1 MHz so the datasheet's
# vn_in_integrated (ngspice inoise_total = TOTAL input-referred rms noise over the swept
# band, in volts) is one uniform condition across the corpus. PPD/CL unchanged.
schema: spicexplorer/analysis@1
id: noise
template: noise_biaswrap
description: "Input-referred noise via the AnalogGym self-bias bias-wrap (Lfb/Cin)."
enabled: true
params: {VDD: 1.8, VCM: 300m, CL: 10p, FSTART: 1, FSTOP: 1MEG, PPD: 50}
flags: []
produces: [vn_in_integrated]
