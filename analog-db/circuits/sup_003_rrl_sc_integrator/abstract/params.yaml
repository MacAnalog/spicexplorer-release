- name: pair_xm15_xm16
  kind: shared_geometry
  members: [XM15_OPAMP, XM16_OPAMP]
  tie: [w, l, m]
  description: The two DDA diode loads (oa_cm_bias / oa_cm_sense) — symmetric halves of the differential-difference
