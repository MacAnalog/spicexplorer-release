# Corner bundles for sky130 (D-6): corner libs stay OUT of repo; reference by lib_file + section.
# sky130 ships all corners in the top-level models lib (sky130.lib.spice). Both NMOS flavors resolve
# from the one section. The native runner auto-swaps this full (~480k-line) lib for its generated
# slim lib when present (byte-identical, ~50-90x faster parse) — see deck_prep.plan_slim_swap.
pdk: sky130
corners:
  tt: [{lib_file: sky130.lib.spice, section: tt}]
  ss: [{lib_file: sky130.lib.spice, section: ss}]
  ff: [{lib_file: sky130.lib.spice, section: ff}]
  sf: [{lib_file: sky130.lib.spice, section: sf}]
  fs: [{lib_file: sky130.lib.spice, section: fs}]
default_corner: tt
