# Sizing for the ihp-sg13g2 binding — generated by `analog-db add-binding` from the
# sky130 sizing (geometry re-noted to ihp-sg13g2's unit convention + bin-clamped).
# A starting point; re-tune defaults/bounds for ihp-sg13g2 device physics as needed.
schema: spicexplorer/sizing@1
pdk: ihp-sg13g2
variables:
- name: x_dut_xm1_w
  default: 60u
- name: x_dut_xm1_l
  default: 0.5u
- name: x_dut_xm3_w
  default: 60u
- name: x_dut_xm3_l
  default: 0.5u
- name: x_dut_xm5_w
  default: 30u
- name: x_dut_xm5_l
  default: 0.5u
- name: x_dut_xm7_w
  default: 13u
- name: x_dut_xm7_l
  default: 1u
- name: x_dut_xm9_w
  default: 10u
- name: x_dut_xm9_l
  default: 0.5u
- name: x_dut_xmp_w
  default: 10u
- name: x_dut_xmp_l
  default: 0.5u
- name: x_dut_xmp_m
  default: '400'
- name: r_z
  default: 1.5k
- name: c_comp
  default: 5p
  description: Upstream XCfb mim, M_Cfb=10 units of ~200 fF
- name: vref_val
  default: 1.8
- name: vb1_val
  default: '1.0'
  description: Upstream TB Vb1 (NMOS sink/tail rail)
- name: vb2_val
  default: '0.025'
  description: Upstream TB Vb2 (PMOS cascode gate rail, near-ground for deep cascode)
- name: r_bleed
  default: 40k
  description: Minimum-load bleed (import adaptation; upstream TBs never run true no-load)
