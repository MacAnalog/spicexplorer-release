# Design variables for the ihp-sg13g2 binding. Validated against sizing.schema.json.
# 28nm geometry re-noted to 130nm lv devices; per-finger widths with the upstream m-ratios
# scaled down (tail m=4 => ~80 uA error amp vs the upstream 200 uA; pass m=60 => ~480 um for
# the 10 mA load range). The divider is 10x the upstream 900 ohm (67 uA instead of 667 uA
# divider burn — the upstream value would dominate i_q).
schema: spicexplorer/sizing@1
pdk: sky130
variables:
  - {name: x_dut_xmnb_w,   description: "NMOS bias diode / tail width (per finger, tail m=4)", default: 8, min: 0.42, max: 100, unit: m}
  - {name: x_dut_xmnb_l,   description: "NMOS bias length",                     default: 0.5, min: 0.15, max: 20, unit: m}
  - {name: x_dut_xmdr_w,   description: "Error-amp input pair width (per finger, m=4)", default: 6, min: 0.42, max: 100, unit: m}
  - {name: x_dut_xmdr_l,   description: "Error-amp input pair length",          default: 0.3, min: 0.15, max: 20, unit: m}
  - {name: x_dut_xmld_w,   description: "PMOS mirror load width (per finger, m=4)", default: 8, min: 0.42, max: 100, unit: m}
  - {name: x_dut_xmld_l,   description: "PMOS mirror load length",              default: 0.5, min: 0.15, max: 20, unit: m}
  - {name: x_dut_xmp_w, description: "PMOS pass width (per finger, m=60)",   default: 8,   min: 0.42, max: 100, unit: m}
  - {name: x_dut_xmp_l, description: "PMOS pass length",                     default: 0.2, min: 0.15, max: 20, unit: m}
  - {name: x_rcomp,  description: "Compensation zero R (ohms)",           default: 40000, min: 100, max: 50000, unit: ohm}
  - {name: x_ccomp,  description: "Compensation C (F)",                   default: 160e-12, min: 1e-12, max: 5e-10, unit: F}
  - {name: x_dut_rt_value,   description: "Divider R (each half, ohms)",          default: 9000, min: 1000, max: 1e6, unit: ohm}
  - {name: x_vref_val,  description: "Internal ideal reference (V)",      default: 0.6,  min: 0.3, max: 1.0, unit: V, freeze: true}
  - {name: x_ibias_val, description: "Internal bias current (A)",         default: 20e-6, min: 1e-6, max: 1e-4, unit: A, freeze: true}
  # Frozen per-device literals (P4 atomic sweep): defaults reproduce the authored
  # netlist literals exactly; freeze keeps them out of the search space.
  - {name: x_dut_xmnb_m, description: "XMNB m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
  - {name: x_dut_xmnt_m, description: "XMNT m (frozen literal)", default: 4, min: 1, max: 16, freeze: true, is_integer: true}
  - {name: x_dut_xmdr_m, description: "XMDR m (frozen literal)", default: 4, min: 1, max: 16, freeze: true, is_integer: true}
  - {name: x_dut_xmdf_m, description: "XMDF m (frozen literal)", default: 4, min: 1, max: 16, freeze: true, is_integer: true}
  - {name: x_dut_xmld_m, description: "XMLD m (frozen literal)", default: 4, min: 1, max: 16, freeze: true, is_integer: true}
  - {name: x_dut_xmlm_m, description: "XMLM m (frozen literal)", default: 4, min: 1, max: 16, freeze: true, is_integer: true}
  - {name: x_dut_xmp_m, description: "XMP m (frozen literal)", default: 60, min: 1, max: 60, freeze: true, is_integer: true}
