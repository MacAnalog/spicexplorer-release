# Analysis binding for the SELF-BIASED reference amp (no ibias port) — uses the class's
# ibias-free template variant so no external current source is left driving a dangling node.
# VCM = 0.8 V is this block's TRUE in-LDO input common mode (it sits on VREF, and the divider
# tap on vinn regulates to the same level) — NOT amp_032's 1.2 V. On gf180 6 V devices this is
# a low CM for an NMOS input pair, so the tail-sink headroom is the thing to watch here.
# BAND: FSTART 1 / FSTOP 1G is the CAMPAIGN-STANDARD noise band — the paper's noise column is
# one uniform condition (total integrated input-referred noise, 1 Hz - 1 MHz, closed-loop bias
# config, CL = 10p); compare cells only under this same band. Was 10..100MEG; PPD unchanged.
schema: spicexplorer/analysis@1
id: noise
template: noise_biaswrap
description: "Total integrated input-referred noise, 1 Hz - 1 MHz, closed-loop bias; vn_in_integrated. The downstream RC filter attenuates this before the error amp sees it, but the in-band part still lands on the LDO output."
params: {VDD: 3.3, VCM: 0.8, CL: 10p, FSTART: 1, FSTOP: 1MEG, PPD: 21}
flags: []
# `produces:` names DATASHEET METRIC IDS (analysis.schema.json), not ngspice measure names:
# datasheet.yaml binds metrics.vn_in_integrated.{analysis: noise, extract.meas: inoise_total}
# (replacing the old vn_in id), which is what ppa.metric_values() maps onto the scoreboard;
# onoise_total has no canonical metric.
produces: [vn_in_integrated]
