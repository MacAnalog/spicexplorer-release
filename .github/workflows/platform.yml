# Managed by the private release infra (scripts/release/repo/) — edit there,
# not here; the next port overwrites this file.
#
# Per-unit CI for the platform packages. Self-skips until the platform unit
# actually ports (no platform/ tree in the monorepo yet).
name: platform

on:
  # Manually runnable: path-filtered lanes do NOT fire on a history rewrite (GitHub has no
  # meaningful `before` commit to diff against), and a release must be able to prove every
  # lane green on the exact published SHA. `gh workflow run <name>.yml --ref main`.
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["platform/**", ".github/workflows/platform.yml"]
  pull_request:
    paths: ["platform/**", ".github/workflows/platform.yml"]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - spicexplorer-core
          - spicexplorer-circuitgraph
          - spicexplorer-netlist2xschem
          - spicexplorer
          - spicexplorer-waveview
          - spicexplorer-api
          - spicexplorer-gmid
          - spicexplorer-netlist2tf
          # layout/signoff run their OFFLINE tier here: the gdsfactory/klayout
          # `gds` extra is opt-in and the DRC/LVS/PEX executables are discovered
          # at run time, so both import and test on a bare runner.
          - spicexplorer-layout
          - spicexplorer-signoff
    steps:
      - uses: actions/checkout@v5
      - name: platform unit ported yet?
        id: ported
        run: |
          if [ -d "platform/packages/${{ matrix.package }}" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::platform/packages/${{ matrix.package }} not in the monorepo yet — this job activates once the platform unit ports."
          fi
      - uses: actions/setup-python@v6
        if: steps.ported.outputs.ok == 'true'
        with:
          python-version: "3.11"
      - name: install (workspace siblings + package under test)
        if: steps.ported.outputs.ok == 'true'
        # Siblings first so pip satisfies the cross-package deps from the
        # monorepo, never PyPI. pyyaml: the workspace-root conftest imports it
        # at collection and core does not declare it.
        # layout + signoff: the optimizer's layout-flow backend imports them, so
        # spicexplorer's own tests/test_layout_backend.py needs them present even
        # though they are a lazy `[layout]` extra at runtime. Their heavy
        # gdsfactory/klayout stack is the separate opt-in `gds` extra, so a bare
        # install stays cheap and the offline tier runs on a plain runner.
        run: |
          pip install -e platform/packages/spicexplorer-core \
                      -e platform/packages/spicexplorer-circuitgraph \
                      -e platform/packages/spicexplorer-netlist2xschem \
                      -e platform/packages/spicexplorer-waveview \
                      -e platform/packages/spicexplorer-layout \
                      -e platform/packages/spicexplorer-signoff \
                      -e platform/packages/spicexplorer
          # httpx: FastAPI TestClient's HTTP backend — the api route tests import
          # starlette.testclient at collection, which hard-errors without it.
          pip install -e "platform/packages/${{ matrix.package }}" pytest pyyaml httpx

      # spicexplorer-layout's EM tests importorskip klayout.db at MODULE level and
      # scikit-rf inside the vector-fit test, so WITHOUT these the whole EM suite
      # vanishes and the job goes green having verified none of it. Both are
      # wheels, and only this one matrix entry pays for them.
      - name: layout EM extras (so the EM tests actually run, not skip)
        if: steps.ported.outputs.ok == 'true' && matrix.package == 'spicexplorer-layout'
        run: pip install "klayout>=0.30" "scikit-rf>=1.0"

      # Guard the guard: a silent skip here is the exact failure the step above
      # exists to prevent, so fail loudly if the extras did not take.
      - name: EM suite is collectable (not silently skipped)
        if: steps.ported.outputs.ok == 'true' && matrix.package == 'spicexplorer-layout'
        working-directory: platform/packages/spicexplorer-layout
        run: |
          if [ -f tests/test_em_offline.py ]; then
            python -m pytest tests/test_em_offline.py --collect-only -q \
              || { echo "::error::EM tests are not collectable — the gds/em extras did not install"; exit 1; }
          else
            echo "::notice::tests/test_em_offline.py not in this tree yet — nothing to guard."
          fi
      - name: wire the analog-db corpus (templates + examples)
        if: steps.ported.outputs.ok == 'true'
        # circuitgraph's template library and some example YAMLs resolve the
        # analog-db tree via <platform root>/examples/analog-db (a submodule in
        # the private repo); in the monorepo it lives at ./analog-db.
        run: |
          if [ -d analog-db ]; then
            mkdir -p platform/examples
            ln -sfn "$GITHUB_WORKSPACE/analog-db" platform/examples/analog-db
            echo "SPICEXPLORER_ANALOG_DB=$GITHUB_WORKSPACE/analog-db" >> "$GITHUB_ENV"
          else
            echo "::notice::analog-db unit not in the monorepo — corpus-dependent tests will skip or fail until it ports."
          fi
      - name: fast test tier (no SPICE)
        if: steps.ported.outputs.ok == 'true'
        working-directory: platform/packages/${{ matrix.package }}
        run: |
          if [ -d tests ]; then
            python -m pytest tests -q -m "not slow"
          else
            echo "no tests/ directory in ${{ matrix.package }} — nothing to run"
          fi
