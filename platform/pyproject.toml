# SpiceXplorer platform — public uv workspace root (virtual; no root package).
#
# Managed by the private release infra (scripts/release/repo/platform/) — edit
# there, not here; the next port overwrites this file. This is a CURATED
# variant of the private workspace root: only the released packages are wired.
[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
spicexplorer-core = { workspace = true }
spicexplorer = { workspace = true }
spicexplorer-circuitgraph = { workspace = true }
spicexplorer-netlist2xschem = { workspace = true }
spicexplorer-waveview = { workspace = true }
spicexplorer-api = { workspace = true }
spicexplorer-gmid = { workspace = true }
spicexplorer-netlist2tf = { workspace = true }
spicexplorer-layout = { workspace = true }
spicexplorer-signoff = { workspace = true }
# CPU-only torch on Linux (no CUDA) — the api pulls spicexplorer[torch] for the
# Bode / AC transfer-function optimizer; the CPU wheel keeps `uv sync` and the
# Docker image lean. macOS/Windows use the normal PyPI wheels.
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "httpx>=0.27",  # FastAPI TestClient backend — the spicexplorer-api route tests
                    # import starlette.testclient at collection (hard-errors without it)
]

# Anchors pytest's rootdir at the workspace root so the root conftest.py (the
# example-registry fixtures) loads for per-package invocations — same shape as
# the private workspace root, restricted to the released packages.
[tool.pytest.ini_options]
addopts = "-ra"
testpaths = [
    "packages/spicexplorer-core/tests",
    "packages/spicexplorer/tests",
    "packages/spicexplorer-circuitgraph/tests",
    "packages/spicexplorer-netlist2xschem/tests",
    "packages/spicexplorer-waveview/tests",
    "packages/spicexplorer-api/tests",
    "packages/spicexplorer-gmid/tests",
    "packages/spicexplorer-netlist2tf/tests",
    "packages/spicexplorer-layout/tests",
    "packages/spicexplorer-signoff/tests",
]
markers = [
    "slow: marks tests that run a real SPICE simulation (deselect with -m 'not slow')",
    "notebooks: executes a guide notebook headlessly (deselect with -m 'not notebooks')",
]
