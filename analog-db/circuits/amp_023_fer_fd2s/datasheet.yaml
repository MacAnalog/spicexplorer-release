# Datasheet (plan D-3/D-5/D-12). Validated against _shared/schema/datasheet.schema.json.
# Differential-output amplifier sheet (amp_020 vocabulary): open-loop AC, offset, noise, settle.
schema: spicexplorer/datasheet@1
cace_format: "5.2"
default_conditions:
  supply: {unit: V, typical: 1.5}
  vcm:    {unit: V, typical: 0.9}
  cload:  {unit: fF, typical: 500}
  corner: {typical: tt}
  temp:   {unit: degC, typical: 27}
metrics:
  dc_gain_db:
    display: "DC open-loop differential gain"
    description: "Differential DC gain, db(voutp - voutn)."
    unit: dB
    analysis: ac_open_loop
    extract: {meas: dcgain}
    spec: {min: 50, unit: dB}
  ugf_hz:
    display: "Unity-gain frequency"
    unit: Hz
    analysis: ac_open_loop
    extract: {meas: ugf}
    spec: {min: 5.0e6, unit: Hz}
  pm_deg:
    display: "Phase margin"
    unit: deg
    analysis: ac_open_loop
    extract: {meas: pm}
    spec: {min: 45, unit: deg}
  vos:
    display: "Output offset (voutp - voutn, matched inputs)"
    description: "The residual of the RC-CMFB servo at matched DC inputs."
    unit: V
    analysis: dc_op
    extract: {meas: vos}
    spec: {max: 5.0e-2, unit: V}
  i_supply:
    display: "Supply current"
    unit: A
    analysis: dc_op
    extract: {meas: i_supply}
    spec: {max: 1.0e-3, unit: A}
  vn_in:
    display: "Input-referred noise"
    unit: "V/sqrt(Hz)"
    analysis: noise
    extract: {meas: inoise_total}
    spec: {max: 1.0e-3, unit: "V/sqrt(Hz)"}
  t_settle:
    display: "Unity-gain differential step settling (0.2 V)"
    unit: s
    analysis: tran_step
    extract: {meas: t_settle}
    spec: {max: 2.0e-6, unit: s}
