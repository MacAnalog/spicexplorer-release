# Analysis binding: large-signal THD in the DIFFERENTIAL unity-feedback follower
# (amplifier/thd_diff — tran_step_diff's network with the tone split +/- ASIG/2; the SE
# thd template is structurally invalid on this FD member: its `vout` node is capacitively
# fed and read "thd_pct = 5.372 %" from a dead node before the guard, see thd.spice).
# ASIG = 0.1 is the applied DIFFERENTIAL stimulus peak — closed-loop gain of the one-wire
# follower is 2, so EACH output node swings ~100 mV, the same per-side swing the SE
# consumers (amp_001/amp_022) measure at their ASIG = 0.1 binding. Headroom: vod_op ~
# 2*(VCM - vocm) ~ 0.25 V rides the differential output (vocm ~ 0.78 V at this sizing);
# per-side excursion ~|vod_op|/2 + ASIG ~ 0.22 V about vocm, inside the 1.5 V rails.
# COHERENT WINDOW (whole F0 periods, EVEN count so cm_drift_v's half-window means stay
# tone-blind — template header): F0 = 1 MHz, TSTART = 4u discards ~39x the scoreboard
# t_settle (102 ns at this sizing; the follower operating point is tran_step's), TSTOP =
# 20u leaves 16 whole periods; TSTEP = 2n = 1/(500*F0) <= 1/(200*F0). F0 sits ~34x under
# the follower's closed-loop crossover (~ugf/2 = 34 MHz; live ac_open_loop ugf = 68.3 MHz).
# REPORTING: `produces:` names DATASHEET METRIC IDS, not measure names. The template also
# prints thd_db / a1..a5 / a1_in / gain_tone (~2 when live) / vod_op / vocm_op /
# cm_drift_v; those ride the recorded measures block. TRUST CHECKS: gain_tone <= 2/3 means
# the guard fired (thd_pct = 999 sentinel); cm_drift_v must be << ASIG or the output
# common mode was still walking through the DFT window and thd_pct is not trustworthy.
schema: spicexplorer/analysis@1
id: thd
template: thd_diff
description: "THD — FD unity-feedback follower, differential tone; tran + in-deck coherent DFT."
params: {VDD: 1.5, VCM: 0.9, CL: 10p, ASIG: 0.1, F0: 1.0e6, TSTEP: 2n, TSTART: 4u, TSTOP: 20u}
flags: []
produces: [thd_pct]
