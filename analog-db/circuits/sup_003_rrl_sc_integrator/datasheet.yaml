# Datasheet (plan D-3/D-5/D-12). Validated against _shared/schema/datasheet.schema.json.
# SUPERSET of cace_format 5.2. See _shared/CACE_FORMAT.md for the field-overlap mapping (O-1).
# Spec band is a characterization band around the live-measured value for the hand-seeded
# sizing (see pdk/*/sizing.yaml), not the Fan-paper numbers — the paper characterizes the
# full CCIA system, not this servo block.
schema: spicexplorer/datasheet@1
cace_format: "5.2"
default_conditions:
  supply: {unit: V, typical: 1.2}
  corner: {typical: tt}
  temp:   {unit: degC, typical: 27}
  vcm:    {unit: V, typical: 0.6}
metrics:
  ripple_gain:
    display: "RRL ripple-sensing gain"
    description: "Demodulated integrator ramp per volt of differential ripple (V/s/V): a +/-VR/2-per-side square ripple at FCHOP on vinp/vinn is synchronously demodulated by the internal 4-gate chopper (CLK_CH_RRL at FCHOP) and integrated; ripple_gain = ramp_rate/VR between T1 and T2 (tran_rrl_sense). Charge-transfer limit is the DIFFERENTIAL cap-ratio law 2*(Cs/Cint)*FCHOP at the integration nodes (both sides contribute per cycle — same 2x factor DRAWING_REVIEW S8 measured for this block's held-phase transfer), times the behavioral output-stage gain 1000. ESTABLISHED EMPIRICALLY 2026-07-20, superseding an earlier (Cs/Cint)*FCHOP claim in this field: measured ripple_gain EXCEEDS the 1x law at Cs/Cint = 4p/4p (6.17e6 vs 5e6), 8p/4p (1.29e7 vs 1e7) and 4p/2p (1.07e7 vs 1e7), so 1x is not an upper bound; the 2x law bounds all five (Cs,Cint) points measured, at 52-66% efficiency. STARTUP-ARTIFACT CAVEAT RETIRED 2026-07-20 (superseded; kept for provenance): the pre-2026-07-20 value (-6.465e7 committed, -8.45e7 quoted) was startup relaxation, not demodulation — a VR~0 control reproduced it. ROOT CAUSE was the DRAWING_REVIEW S7 sense-ground phase ASYMMETRY (S1 grounded sc_n on phi_1 while S2 grounded sc_p on phi_2), not the bench: with the asymmetric front end the two integration sides ramp in OPPOSITE directions (rate_p -58.9 / rate_n +70.4 V/s) so the startup common mode leaks straight into the differential. The owner's 2026-07-20 redraw after Fan Fig. 6 puts BOTH sense grounds on phi_2 (symmetric, same phase as the AZ shorts). MEASURED AFTER THE FIX (live tt, ngspice-45, 2026-07-20): ripple_gain -4.377e5 V/s/V at VR=2m vs +58.4 for the VR~0 control — a 7.5e3x signal-to-artifact separation (was ~1x). The startup ramp is now purely COMMON MODE (rate_p +137.1 / rate_n +138.0 V/s) and cancels in the differential. The sign is therefore now a real demodulation polarity: it tracks the chopper hookup and NOTHING else (A/B: reverting only the chopper flips the sign at identical magnitude, +4.378e5 vs -4.377e5), so S4.2's demod sign is now MEASURABLE here — though whether that polarity makes the COMPOSED loop negative-feedback still needs the P4-4b composite. CHARACTERIZED 2026-07-20 but NOT SIZED — the sizing was tried and REVERTED; this binding sits at its committed defaults (2u switches, Cs=1p) measuring 17.5% of the 2x law. Characterization (all vs the 2x law): the limiter is a SENSE-NODE PARASITIC charge divider Cs/(Cs+Cpar) with Cpar dominated by switch DIFFUSION area, so both levers run opposite to intuition — widening the TGs strictly LOWERS efficiency (at Cs=1p: 18.8% at 1u -> 17.5% at 2u -> 4.8% at 5u -> 1.4% at 20u) while raising Cs RAISES it (at min-W: 11.7% at 0.5p -> 24.2% at 1p -> 28.1% at 2p -> 61.7% at 4p); Ron is NOT the limiter at FCHOP=5k (min-W Ron ~30k x 1p = 30 ns vs a 100 us half-period), so 'widen for lower Ron' is wrong block-locally. Caz is not a lever (1.0-1.2x over a 16x sweep). WHY REVERTED: both block-local optima are SYSTEM regressions in the composed ia_004 — min-W switches moved its hpf_hz 32.5 Hz -> 776 kHz and Cs=4p moved it to 395 kHz (independently), each breaking ia_004's <=1000 Hz spec, because the RRL's switch Ron and sense caps reshape the composite's feedback path. ia_004 re-verified at hpf_hz 32.482 Hz / validated after the revert. CONCLUSION: this block must be sized COMPOSITE-AWARE and multi-objective (ripple_gain vs power vs AREA — 2x Cs + 2x Cint + 2x Caz dominate its area, so a gain-only objective always spends area), and only after the P4-4b CMFB closure makes the composite exercisable. Still NO spec band (informative). Window note: T1/T2 sit after the opamp desaturates; the cheap default window is kept."
    unit: "V/s/V"
    analysis: tran_rrl_sense
    extract: {meas: ripple_gain}
