# Analysis binding for the SELF-BIASED error amp (no ibias port) — uses the class's
# ibias-free template variant so no external current source is left driving a dangling node.
schema: spicexplorer/analysis@1
id: ac_open_loop
template: ac_open_loop_biaswrap
description: "Bias-wrapped open-loop AC. This amp has a designed-in systematic offset (the ratioed mirror_e sink), so an unwrapped open-loop op point rails."
params: {VDD: 3.3, VCM: 1.2, CL: 10p, FSTART: 10, FSTOP: 100MEG, PPD: 101}
flags: []
produces: [dcgain, ugf, pm]
