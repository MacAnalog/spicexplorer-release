groups:
- name: pair_xm8o_xm9o
  kind: shared_geometry
  members: [XM8O, XM9O]
  tie: [w, l, m]
  description: Class-A output PMOS current sources on the CMFB-driven gate vb4o (composite-owned replacement
    for the core's omitted XM8/XM9) — the CM actuator pair, must match.
- name: pair_xm4_xm5_cmfb
  kind: matched_pair
  members: [XM4_CMFB, XM5_CMFB]
  tie: [w, l, m]
  description: PMOS input differential pair (XM4 gate = sensed CM, XM5 gate = vref) (ported from cmfb_002_5t_pmos_input
    through the composer rename).
- name: mirror_xm2_xm6_cmfb
  kind: matched_pair
  members: [XM2_CMFB, XM6_CMFB]
  tie: [w, l, m]
  description: NMOS mirror load, drawn 1:1 (XM6 diode -> XM2 output side); long L sets the servo output
    ro / dominant pole (ported from cmfb_002_5t_pmos_input through the composer rename).
- name: pair_rmp_rmn_cmfb
  kind: shared_geometry
  members: [RMP_CMFB, RMN_CMFB]
  tie: [Value]
  description: CM-detector averaging resistors — equal values so cm_sense sits at the true output midpoint
    (mismatch leaks differential signal into the CM servo) (ported from cmfb_002_5t_pmos_input through
    the composer rename).
- name: pair_xm2_xm3_core
  kind: matched_pair
  members: [XM2_CORE, XM3_CORE]
  tie: [w, l, m]
  description: PMOS input differential pair of the embedded core (structural detection; shared source
    = tail) (ported from ia_002_fan_chopper_simple through the composer rename).
- name: pair_xm4_xm5_core
  kind: shared_geometry
  members: [XM4_CORE, XM5_CORE]
  tie: [w, l, m]
  description: First-stage NMOS current sinks at the two fold nodes (gates on vb1) — symmetric halves
    (ported from ia_002_fan_chopper_simple through the composer rename).
- name: pair_xm12_xm13_core
  kind: shared_geometry
  members: [XM12_CORE, XM13_CORE]
  tie: [w, l, m]
  description: Folded NMOS cascodes over the two first-stage output branches (gates on vb2) (ported from
    ia_002_fan_chopper_simple through the composer rename).
- name: pair_xm10_xm11_core
  kind: shared_geometry
  members: [XM10_CORE, XM11_CORE]
  tie: [w, l, m]
  description: PMOS cascodes of the first-stage load (gates on vb3) (ported from ia_002_fan_chopper_simple
    through the composer rename).
- name: pair_xm6_xm7_core
  kind: shared_geometry
  members: [XM6_CORE, XM7_CORE]
  tie: [w, m]
  description: PMOS fold current sources (gates on vb4); L tied through sources_vb4_l (ported from ia_002_fan_chopper_simple
    through the composer rename).
- name: sources_vb4_l_core
  kind: shared_geometry
  members: [XM1_CORE, XM6_CORE, XM7_CORE]
  tie: [l]
  description: All vb4-gated PMOS current sources (tail + fold sources + output sources) share one gate
    net — same L so their current densities track off the single bias level (mirror-style tie; the kind
    checker requires a diode-connected anchor for mirror_length, and vb4 is a knob source) (ported from
    ia_002_fan_chopper_simple through the composer rename).
- name: pair_xm14_xm15_core
  kind: shared_geometry
  members: [XM14_CORE, XM15_CORE]
  tie: [w, l, m]
  description: Class-A output NMOS common-source devices (gates on the output-chopper nodes g2_p/g2_n)
    (ported from ia_002_fan_chopper_simple through the composer rename).
- name: chout_tg_nmos_core
  kind: shared_geometry
  members: [XM16_CORE, XM18_CORE, XM28_CORE, XM30_CORE]
  tie: [w, l, m]
  description: NMOS pass devices of the embedded output chopper's four transmission gates (straight XM16/XM18
    + cross XM28/XM30) — all gates must match for symmetric on-resistance and charge injection across
    both chop phases (ported from ia_002_fan_chopper_simple through the composer rename).
- name: chout_tg_pmos_core
  kind: shared_geometry
  members: [XM17_CORE, XM19_CORE, XM29_CORE, XM31_CORE]
  tie: [w, l, m]
  description: PMOS pass devices of the embedded output chopper's four gates (straight + cross); n and
    p halves stay independent (different mobility) (ported from ia_002_fan_chopper_simple through the
    composer rename).
- name: chin_tg_nmos_core
  kind: shared_geometry
  members: [XM24_CORE, XM26_CORE, XM32_CORE, XM34_CORE]
  tie: [w, l, m]
  description: NMOS pass devices of the input chopper's four gates (straight XM24/XM26 + cross XM32/XM34)
    — gate symmetry on the differential signal across both chop phases (ported from ia_002_fan_chopper_simple
    through the composer rename).
- name: chin_tg_pmos_core
  kind: shared_geometry
  members: [XM25_CORE, XM27_CORE, XM33_CORE, XM35_CORE]
  tie: [w, l, m]
  description: PMOS pass devices of the input chopper's four gates (straight + cross) (ported from ia_002_fan_chopper_simple
    through the composer rename).
- name: chfb_tg_nmos_core
  kind: shared_geometry
  members: [XM20_CORE, XM22_CORE, XM36_CORE, XM38_CORE]
  tie: [w, l, m]
  description: NMOS pass devices of the feedback chopper's four gates (straight XM20/XM22 + cross XM36/XM38;
    voutp / voutn) (ported from ia_002_fan_chopper_simple through the composer rename).
- name: chfb_tg_pmos_core
  kind: shared_geometry
  members: [XM21_CORE, XM23_CORE, XM37_CORE, XM39_CORE]
  tie: [w, l, m]
  description: PMOS pass devices of the feedback chopper's four gates (straight + cross) (ported from
    ia_002_fan_chopper_simple through the composer rename).
- name: pair_cin_core
  kind: shared_geometry
  members: [CIN1_CORE, CIN2_CORE]
  tie: [Value]
  description: Input coupling caps — the two legs must match; sets the closed-loop gain numerator (gain
    = Cin/Cfb) (ported from ia_002_fan_chopper_simple through the composer rename).
- name: pair_cfb_core
  kind: shared_geometry
  members: [CFB1_CORE, CFB2_CORE]
  tie: [Value]
  description: Feedback caps — the two legs must match; sets the closed-loop gain denominator (ported
    from ia_002_fan_chopper_simple through the composer rename).
- name: pair_cm_core
  kind: shared_geometry
  members: [CM1_CORE, CM2_CORE]
  tie: [Value]
  description: Per-side Miller caps must match (the originally-drawn Cm_1=1p (now symbolic Cm at source,
    DRAWING_REVIEW item 5) was an unedited xschem default; Cm_2 was symbolic Cm) (ported from ia_002_fan_chopper_simple
    through the composer rename).
- name: pair_rb_core
  kind: shared_geometry
  members: [RB1_CORE, RB2_CORE]
  tie: [Value]
  description: Summing-node bias resistors to vref — the two legs must match (input CM + high-pass corner
    symmetry) (ported from ia_002_fan_chopper_simple through the composer rename).
- name: mirror_xm3_cmfb_l
  kind: mirror_length
  members: [XM3_CMFB, XM1_CMFB]
  tie: [l]
  description: CMFB tail XM1 mirrors the bias-string diode XM3, so their L is tied (leader XM3).
    This tie exists only in the COMPOSITE — standalone cmfb_002 sizes the two independently and its
    ihp-sg13g2 sizing still carries an XM1 L of 0.267u. That number never reached a deck here, because
    the tie forces XM1's L to XM3's — the SHIPPED/MEASURED value is 0.259u. The materialized sizing
    row for the follower is therefore dropped by the composer (it double-defined the symbol in the
    generated _dut.spice, where the tie line wins anyway).
