# Analysis binding for the self-biased AnalogGym convention (no ibias port) — uses the
# class's ibias-free template variant so no external current source is left driving a
# dangling node.
# Loop-gain / stability probe in the unity buffer: ngspice does Middlebrook voltage
# injection at the VIPRB marker (`alter @VIPRB[acmag]=1` in .control — netlist bytes
# unchanged); the Spectre lane composes a native `stb stb probe=VIPRB` off the same marker.
# Injection at the DC-short keeps the op point the CLOSED-loop buffer one.
# FSTART = 0.01 Hz is the class value (see the stb template's "CHOOSING FSTART" guard note).
# WHY THIS BENCH MATTERS HERE (2026-08-01, ihp-sg13g2 tt at the landed sizing): the biaswrap
# ac_open_loop reads pm = 82.95 deg at its FIRST 0 dB crossing (ugf 2.39 MHz), but the real
# unity-gain buffer LIMIT-CYCLES at ~20.6 MHz / ~150 mVpp (measured, 1 ms transient) — the
# RAFFC feedforward path brings the loop gain back through 0 dB near 20 MHz with negative
# margin. pm_loop is taken at the LAST 0 dB crossing exactly to certify this (the PM-rescue
# finding); expect pm_loop near/below 0 here, i.e. this bench documents a real instability
# of the ihp binding's sizing, not a bench artifact.
# REPORTING: `produces:` stays empty DELIBERATELY — it names datasheet metric ids
# (analysis.schema.json); the loop figures ride the datasheet via extract.meas entries
# (pm_loop_deg, loopgain_db, ugf_loop_hz, gm_loop_db). The full measure set (loopgain_db,
# ugf_loop, pm_loop, gm_loop, pm_loop_first, phref_dev, phref_ok) rides the recorded
# `corners.<corner>.analyses.stb.measures` block. pm_loop/gm_loop = -999 is the "no crossing
# measured" sentinel, phref_ok = 0 says the phase reference tripped.
schema: spicexplorer/analysis@1
id: stb
template: stb_selfbias
description: "Loop gain (stb) of the unity buffer — loopgain_db/ugf_loop/pm_loop/gm_loop; Middlebrook injection at VIPRB on ngspice, native stb on Spectre."
# FSTART 0.01 -> 1e-4 (2026-08-04): the stb bench anchors phase at its first swept point and
# blanks pm_loop/gm_loop to the -999 sentinel when |phref_dev| > 30 deg. For a high-gain amp
# the dominant pole f_p = UGF/A0 is sub-Hz, so 0.01 Hz already sits PAST it — and because
# every stabilising move lowers UGF (hence f_p), the guard fires HARDER on a correct fix than
# on the broken design. Measured on amp_006@gf180: the committed (unstable) sizing reports
# pm_loop -16.5, while the stabilised one reports -999 at 0.01 Hz and +66.0 at 1e-4. pm_loop
# and gm_loop are FSTART-INVARIANT; only the guard moves.
params:
  VDD: 1.8
  VCM: 300m
  CL: 10p
  FSTART: 1e-4     # class value; see the stb template's "CHOOSING FSTART"
  FSTOP: 1G
  PPD: 101
flags: []
produces: []
