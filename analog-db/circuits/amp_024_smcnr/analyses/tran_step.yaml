# Analysis binding (plan D-4): universal tran_step — unity-gain 0.2 V step settling.
# 100 nA into 10 pF slews at ~10 V/ms, so the settle window is hundreds of microseconds.
schema: spicexplorer/analysis@1
id: tran_step
template: tran_step
description: "Unity-gain step settling; t_settle to |err| < VTOL."
params: {VDD: 1.5, VCM: 0.5, CL: 10p, VSTEP: 0.2, VTOL: 2m, TSTART: 10u, TSTEP: 50n, TSTOP: 300u}
flags: []
produces: [t_settle]
