# Analysis binding for the SELF-BIASED reference amp (no ibias port) — uses the class's
# ibias-free template variant so no external current source is left driving a dangling node.
# VCM = 0.8 V is this block's TRUE in-LDO input common mode (it sits on VREF, and the divider
# tap on vinn regulates to the same level) — NOT amp_032's 1.2 V. On gf180 6 V devices this is
# a low CM for an NMOS input pair, so the tail-sink headroom is the thing to watch here.
# Loop-gain / stability probe in the unity buffer: ngspice does Middlebrook voltage injection
# at the VIPRB marker (`alter @VIPRB[acmag]=1` in .control — netlist bytes unchanged); the
# Spectre lane composes a native `stb stb probe=VIPRB` off the same marker. Injection at the
# DC-short keeps the op point the CLOSED-loop buffer one.
# FSTART = 0.01 Hz is the class value (see the stb template's "CHOOSING FSTART" — the lowest
# FSTART at which every single-ended amp of this corpus, this cell included, clears the
# 30-deg phase-reference guard). PILOT @ gf180mcu tt (2026-08-01, landed sizing):
# loopgain_db = 74.1232 vs ac_open_loop dcgain 74.1230 (0.0002 dB), ugf_loop = 7.253 MHz vs
# ugf 7.286 MHz (the biaswrap Lfb/Cin shifts the open-loop read ~0.5%), pm_loop = 74.06 deg
# vs the same-sizing ac_open_loop pm 73.894 (delta 0.17 deg — two independent routes),
# pm_loop_first = pm_loop (single 0 dB crossing), gm_loop = 33.25 dB (this loop DOES cross
# -180 deg in band, unlike amp_032's), phref_dev = -4.4e-4 deg.
# REPORTING: `produces:` names DATASHEET METRIC IDS (analysis.schema.json) — datasheet.yaml
# binds metrics.{pm_loop_deg, loopgain_db, ugf_loop_hz, gm_loop_db} to this analysis (the
# loop-gain ids are canonical in the class vocabulary as of the stb-wiring campaign). The
# remaining measures (pm_loop_first, phref_dev, phref_ok) still ride the recorded
# `corners.<corner>.analyses.stb.measures` block. pm_loop = -999 is the "no crossing
# measured" sentinel, phref_ok = 0 says the phase reference tripped.
schema: spicexplorer/analysis@1
id: stb
template: stb_selfbias
description: "Loop gain (stb) of the unity buffer — loopgain_db/ugf_loop/pm_loop/gm_loop; Middlebrook injection at VIPRB on ngspice, native stb on Spectre."
# FSTART 0.01 -> 1e-4 (2026-08-04): the stb bench anchors phase at its first swept point and
# blanks pm_loop/gm_loop to the -999 sentinel when |phref_dev| > 30 deg. For a high-gain amp
# the dominant pole f_p = UGF/A0 is sub-Hz, so 0.01 Hz already sits PAST it — and because
# every stabilising move lowers UGF (hence f_p), the guard fires HARDER on a correct fix than
# on the broken design. Measured on amp_006@gf180: the committed (unstable) sizing reports
# pm_loop -16.5, while the stabilised one reports -999 at 0.01 Hz and +66.0 at 1e-4. pm_loop
# and gm_loop are FSTART-INVARIANT; only the guard moves.
params:
  VDD: 3.3
  VCM: 0.8
  CL: 10p
  FSTART: 1e-4     # class value; see the stb template's "CHOOSING FSTART"
  FSTOP: 1G
  PPD: 101
flags: []
produces: [pm_loop_deg, loopgain_db, ugf_loop_hz, gm_loop_db]
