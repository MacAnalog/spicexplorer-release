# Sizing for the gf180mcu binding — generated by `analog-db add-binding` from the
# ihp-sg13g2 sizing (geometry re-noted to gf180mcu's unit convention + bin-clamped).
# A starting point; re-tune defaults/bounds for gf180mcu device physics as needed.
schema: spicexplorer/sizing@1
pdk: gf180mcu
variables:
- name: x_dut_xm1_w
  description: Input follower width (per finger, m=4)
  default: 8u
  min: 0.22u
  max: 100u
  unit: m
- name: x_dut_xm2_w
  description: Feedback sink width (per finger, m=4)
  default: 8u
  min: 0.22u
  max: 100u
  unit: m
- name: x_dut_xmrn_w
  description: NMOS bias mirror width
  default: 4u
  min: 0.22u
  max: 50u
  unit: m
- name: x_dut_xmpd_w
  description: PMOS mirror diode width
  default: 8u
  min: 0.22u
  max: 50u
  unit: m
- name: x_dut_xmpb_w
  description: PMOS source width (per finger, m=6)
  default: 8u
  min: 0.22u
  max: 100u
  unit: m
- name: x_dut_xm1_l
  description: NMOS length
  default: 0.3u
  min: 0.28u
  max: 10u
  unit: m
- name: x_dut_xmpd_l
  description: PMOS length
  default: 0.3u
  min: 0.28u
  max: 10u
  unit: m
- name: x_cc
  description: Feedback-node compensation cap (F)
  default: 250e-15
  min: 50e-15
  max: 2e-12
  unit: F
# Frozen per-device literals (P4 atomic sweep): defaults reproduce the authored
# netlist literals exactly; freeze keeps them out of the search space.
- {name: x_dut_xm1_m, description: "XM1 m (frozen literal)", default: 4, min: 1, max: 16, freeze: true, is_integer: true}
- {name: x_dut_xm2_m, description: "XM2 m (frozen literal)", default: 4, min: 1, max: 16, freeze: true, is_integer: true}
- {name: x_dut_xmrn_m, description: "XMRN m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
- {name: x_dut_xmns_m, description: "XMNS m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
- {name: x_dut_xmpd_m, description: "XMPD m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
- {name: x_dut_xmpb_m, description: "XMPB m (frozen literal)", default: 6, min: 1, max: 16, freeze: true, is_integer: true}
