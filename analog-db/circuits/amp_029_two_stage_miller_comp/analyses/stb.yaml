# Analysis binding: loop-gain / stability probe of the DIFFERENTIAL loop (class stb_diff
# template — the FD counterpart of stb; this cell is self-biased with voutp/voutn, so the SE
# unity-buffer probe does not fit). The differential unity feedback is closed by the template's
# CM-pinned VCVS network (input CM held at VCM = the ac_open_loop_diff operating point) and the
# loop is broken by antiphase Middlebrook injection at the VIPRB/VIPRBM marker pair; the probed
# transmission is exactly Add, so pm_loop here crosschecks ac_open_loop's pm_deg.
# FRESH CROSSCHECK REFERENCE (ihp-sg13g2 tt, 2026-08-01, CL=10p): ac_open_loop reads
# dcgain 50.47 dB / ugf 24.39 MHz / pm 24.06 deg — the marginal pm is the CIRCUIT (plain
# Miller two-stage at this sizing under the standardized CL=10p; the 77.4 deg in the
# circuit.yaml notes predates that standardization), not a bench artifact; expect pm_loop
# within ~2 deg of 24.06.
# gm_loop may read the -999 sentinel — CORRECT behavior when the loop phase never reaches
# -180 deg below its DC reference inside FSTOP=1G (no in-band gain margin), not a failure.
# FSTART 0.01 is the SE-corpus class value (see stb.spice "CHOOSING FSTART"); this cell's
# dominant pole sits ~70 kHz (ugf/gain), so |phref_dev| at 0.01 Hz is negligible and the
# phase-reference guard has full headroom. NO Spectre lane: stb_diff has no
# spectre-benches.yaml entry (a native differential stb needs a diffstbprobe pair).
# `produces:` names the DATASHEET METRIC IDS the loop-metric vocabulary carries
# (loopgain_db/ugf_loop_hz/pm_loop_deg/gm_loop_db, canonical_metrics 2026-07-31); the raw
# measures (pm_loop_first/phref_dev/phref_ok) still ride the scoreboard analyses block.
schema: spicexplorer/analysis@1
id: stb
template: stb_diff
description: "Differential loop gain (stb) — loopgain_db/ugf_loop/pm_loop/gm_loop by antiphase Middlebrook injection at the VIPRB/VIPRBM pair (ngspice only)."
# FSTART 0.01 -> 1e-4 (2026-08-04): the stb bench anchors phase at its first swept point and
# blanks pm_loop/gm_loop to the -999 sentinel when |phref_dev| > 30 deg. For a high-gain amp
# the dominant pole f_p = UGF/A0 is sub-Hz, so 0.01 Hz already sits PAST it — and because
# every stabilising move lowers UGF (hence f_p), the guard fires HARDER on a correct fix than
# on the broken design. Measured on amp_006@gf180: the committed (unstable) sizing reports
# pm_loop -16.5, while the stabilised one reports -999 at 0.01 Hz and +66.0 at 1e-4. pm_loop
# and gm_loop are FSTART-INVARIANT; only the guard moves.
params:
  VDD: 1.2
  VCM: 0.6
  CL: 10p
  FSTART: 1e-4     # class value; see the stb template's "CHOOSING FSTART"
  FSTOP: 1G
  PPD: 101
flags: []
produces: [pm_loop_deg, loopgain_db, ugf_loop_hz, gm_loop_db]
