# Sizing for the sky130 binding — generated by `analog-db add-binding` from the
# ihp-sg13g2 sizing (geometry re-noted to sky130's unit convention + bin-clamped).
# A starting point; re-tune defaults/bounds for sky130 device physics as needed.
# HAND-SIZED 2026-08-05 by role + square-law, NOT by search (add-binding had clamped the
# ihp sub-micron geometry to sky130's 0.42 um floor -> a minimum-size 5T with +20.6 dB).
# I_tail ~ 6 uA (branch 3 uA); pair L=1 for ro, mirror L=2 for ro; XM6 is the string's
# current limiter. HEADROOM RULES THE FLAVOR: nfet Vth ~0.7 leaves only ~0.2 V above the
# 0.9 V sensed CM for Vov1 + Vds,tail, so the tail runs near triode (fine for a CMFB --
# the tail's ro sets the servo's own CMRR, not its gain). The PMOS-input flavor cannot
# sense 0.9 V here at all (ptail >= 0.9 + 0.9 + 0.15 > 1.8 V).
# Live: gain_servo_db +36.3 dB, cmfb_slope 65.4, vcmfb_nat 0.535 V (plant balance gate
# 0.600 -> ~1.0 mV static CM error), vcmfb_max 1.80 V, i_supply 35 uA.
# NOTE sky130 sizing is UNITLESS MICRONS in this repo; gf180mcu is METRES.
schema: spicexplorer/sizing@1
analysis_params:            # the block's own bench must be run at THIS kit's rail/CM
  VDD: 1.8
  VCM: 0.9
  VSHI: 1.8
  VSSTEP: 5m
pdk: sky130
variables:
- name: x_dut_xm1_w
  description: NMOS input pair width (XM1/XM2)
  default: 8
  min: 0.42
  max: 20
  unit: m
- name: x_dut_xm1_l
  description: NMOS input pair length
  default: 1
  min: 0.15
  max: 2
  unit: m
- name: x_dut_xm3_w
  description: PMOS mirror width (XM3 diode / XM4 output)
  default: 12
  min: 0.42
  max: 20
  unit: m
- name: x_dut_xm3_l
  description: 'PMOS mirror length (long: sets output ro and the servo pole)'
  default: 2
  min: 0.15
  max: 2
  unit: m
- name: x_dut_xm8_w
  description: NMOS tail width (mirrors the XM5 bias diode)
  default: 10
  min: 0.42
  max: 20
  unit: m
- name: x_dut_xm8_l
  description: NMOS tail length
  default: 1
  min: 0.15
  max: 2
  unit: m
- name: x_dut_xm5_w
  description: Bias-string NMOS diode width
  default: 5
  min: 0.42
  max: 20
  unit: m
- name: x_dut_xm5_l
  description: Bias-string NMOS diode length
  default: 1
  min: 0.15
  max: 2
  unit: m
- name: x_dut_xm6_w
  description: Bias-string PMOS diode width (with XM5 sets the string current)
  default: 30
  min: 0.42
  # max RAISED 20 -> 50 (bare um, this file's convention) to cover the hand-sized,
  # measurement-backed 30 um default. The 20 um ceiling was DONOR BOILERPLATE inherited by
  # `add-binding` from the ihp-sg13g2 sizing, NOT a sky130 process rule — the kit has no such
  # width limit (wide devices are drawn multi-finger).
  max: 50
  unit: m
- name: x_dut_xm6_l
  description: Bias-string PMOS diode length
  default: 1
  min: 0.15
  max: 2
  unit: m
- name: x_dut_rmp_value
  description: CM-detector averaging resistor (RMN tied; high-R to avoid loading the sensed outputs)
  default: 5Meg
  min: 10k
  max: 100Meg
  unit: Ohm
- name: x_dut_xm1_m
  description: XM1 m (frozen literal)
  default: 1
  min: 1
  max: 16
  freeze: true
  is_integer: true
- name: x_dut_xm3_m
  description: XM3 m (frozen literal)
  default: 1
  min: 1
  max: 16
  freeze: true
  is_integer: true
- name: x_dut_xm5_m
  description: XM5 m (frozen literal)
  default: 1
  min: 1
  max: 16
  freeze: true
  is_integer: true
- name: x_dut_xm6_m
  description: XM6 m (frozen literal)
  default: 1
  min: 1
  max: 16
  freeze: true
  is_integer: true
- name: x_dut_xm8_m
  description: XM8 m (frozen literal)
  default: 1
  min: 1
  max: 16
  freeze: true
  is_integer: true
