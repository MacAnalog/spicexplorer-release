display_name: "Capless low-Iq LDO: double-mirror FVF output stage + two-stage error amp, resistor-referenced bias (IHP SG13G2, 1.5 V lv devices)"
compensation: "Miller cap across error-amp stage 2 (dominant pole at ea_o1); nothing at the pass gate (any C there is paid at the sink slew)"
