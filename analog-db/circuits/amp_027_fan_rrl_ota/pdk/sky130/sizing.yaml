# Re-bias for the sky130 binding (authored analyses run VDD=1.2/VCM=0.6 — the ihp rail).
# sky130's 1.8 V devices (pfet_01v8 |Vth|~0.9) are essentially OFF at 1.2 V (i_supply ~nA,
# dcgain 27 dB / pm 179 degenerate). Coarse dc sweep at 1.8 V (vb1=0.6 vb2=0.9 vb3=0.8
# vb4=0.9): CMFB regulates vocm~0.89 flat over VCM 0.05-0.85 (railed above ~1.0); 0.75
# keeps tail interior (VSD~0.13) and input pair saturated (VSD~0.16). vb1..vb4 defaults
# re-tuned above to match.
analysis_params:
  VDD: 1.8
  VCM: 0.75
