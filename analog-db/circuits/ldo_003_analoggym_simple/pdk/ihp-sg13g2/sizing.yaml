# Sizing for the ihp-sg13g2 binding — generated by `analog-db add-binding` from the
# sky130 sizing (geometry re-noted to ihp-sg13g2's unit convention + bin-clamped).
# A starting point; re-tune defaults/bounds for ihp-sg13g2 device physics as needed.
schema: spicexplorer/sizing@1
pdk: ihp-sg13g2
variables:
- name: x_dut_xm1_w
  default: 160u
- name: x_dut_xm1_l
  default: 0.45u
- name: x_dut_xm4_w
  default: 160u
- name: x_dut_xm4_l
  default: 0.45u
- name: x_dut_xm5_w
  default: 30u
- name: x_dut_xm5_l
  default: 1u
- name: x_dut_xmp_w
  default: 20u
- name: x_dut_xmp_l
  default: 0.4u
- name: x_dut_xmp_m
  default: '180'
- name: r_z
  default: 500
  description: Upstream XRfb res_high_po_0p35 L=3, M_Rfb=1 (~3 kohm)
- name: c_comp
  default: 60p
  description: Upstream XCfb mim, M_Cfb=5 units of ~200 fF
- name: vref_val
  default: 1.8
  description: Upstream TB Vref = 1.8 V at the 2.0 V rail; unity feedback -> vout = vref
- name: vb_val
  default: 1.0
  description: Upstream TB Vb tail-bias voltage
- name: r_bleed
  default: 27k
  description: Minimum-load bleed (import adaptation; upstream TBs never run true no-load)
