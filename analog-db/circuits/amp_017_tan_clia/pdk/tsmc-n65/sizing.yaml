# Per-PDK re-bias (platform convention: analyses params are the AUTHORED operating point;
# the closed lane injects the registry rail, and per-PDK deltas live here).
# amp_017 is authored on a 1.8 V rail (sky130/gf180). The tsmc-n65 registry is a 1.2 V CORE
# kit with no IO/thick-oxide device, so running the authored 1.8 V would operate core LVT
# devices at 1.5x nominal. Re-biased to the kit rail, VCM scaled proportionally (300m*1.2/1.8).
# NOTE: amp_003_fan_smc (the other 1.8 V drawing on this kit) got the same re-bias on
# 2026-08-01 -- owner ruling: tsmc-n65 runs at 1.2 V and below, no exceptions.
analysis_params:
  VDD: 1.2
  VCM: 0.2
