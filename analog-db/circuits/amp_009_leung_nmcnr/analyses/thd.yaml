# Analysis binding for the SELF-BIASED 3-stage NMCNR OTA (no ibias port) — uses the class's
# ibias-free template variant so no external current source is left driving a dangling node.
# THD in the unity buffer: tran + the template's in-deck coherent DFT (ngspice); the Spectre
# lane composes a native pss at F0 (HARMS).
# F0 GRID: fresh ac_open_loop @ ihp-sg13g2 tt (2026-08-01, this sizing) reads ugf = 1.439 MHz
# — the < 3 MHz band of the campaign grid, so the whole base grid (F0 = 1 MHz) divides by
# 100: F0 = 10 kHz, ~144x under the ugf (well in-band for the unity buffer).
# COHERENT WINDOW (the template requires (TSTOP-TSTART) to be whole F0 periods, see its
# header): F0 = 10 kHz -> T = 100 us; TSTART = 400u = 4 whole periods, discarding ~715x the
# fresh 559 ns settling (tran_step t_settle to 2 mV, same run); TSTOP = 2m leaves 16 whole
# measured periods. TSTEP = 200n = T/500 <= 1/(200*F0).
# DRIVE: ASIG = 0.1 (class default) — sine 0.2..0.4 V about VCM = 0.3, far inside the
# 0..1.8 V rails.
# REPORTING: `produces:` names DATASHEET METRIC IDS (analysis.schema.json) —
# datasheet.metrics.thd_pct binds {analysis: thd, extract.meas: thd_pct}. The template's
# other measures (thd_db, a1..a5, a1_in, gain_tone, vout_op) still ride the recorded
# `corners.<corner>.analyses.thd.measures` block. gain_tone < 0.5 means the dead-output
# guard fired and thd_pct is the 999 sentinel, not a measurement.
schema: spicexplorer/analysis@1
id: thd
template: thd_selfbias
description: "THD — unity-buffer large-signal sine; tran + in-deck coherent DFT (ngspice) / native PSS (Spectre)."
params: {VDD: 1.8, VCM: 300m, CL: 10p, ASIG: 0.1, F0: 1.0e4, TSTEP: 200n, TSTART: 400u, TSTOP: 2m, HARMS: 7}
flags: []
produces: [thd_pct]
