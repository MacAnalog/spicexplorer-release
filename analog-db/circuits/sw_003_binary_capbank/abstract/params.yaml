# sw_003_binary_capbank — DUT parameterization (spicexplorer/params@1; contract: _shared/PARAMS.md).
# `devices:` is GENERATED from abstract/topology.cgraph.json — refresh with
# `analog-db gen-params --circuit sw_003_binary_capbank --write` (it preserves the authored sections).
# `groups:`/`ratios:` are AUTHORED default tying, reviewed by a human (plan D-2):
# recommendations tagged with WHY, which an upstream user may accept, edit, or dissolve.
# The four caps share the drawn unit-value symbol Cu directly (owner decision 2026-07-19,
# DRAWING_REVIEW §8 finding 1: value=Cu, weighting structural via m) — no Value tie needed;
# the per-cap m knobs are deliberately UNTIED (they carry the binary weights 1/1/2/4).
schema: spicexplorer/params@1
