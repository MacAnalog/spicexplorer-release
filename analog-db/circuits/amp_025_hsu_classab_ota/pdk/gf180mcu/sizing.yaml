# Bias knobs re-ranged/re-tuned for the gf180mcu 3.3 V rail (coarse dc_op sweep, tt,
# 2026-08-03): the ihp 1.2 V values leave the 03v3 stacks (|Vth| ~0.7/0.85) cut off. At
# vb1=2.2/vb2=1.9/vb3=1.3 every node sits interior (tail 2.76, drv 0.88, psrc 2.93) and
# the servo settles in-rail first try (vcmfb 2.23, vocm = ref to 2 mV).
- name: vb1
  description: "PMOS tail/current-source gate bias \u2014 XM1/XM14/XM20 (drawn as an external 0.5 V port)"
  default: 2.2
  min: 0.0
  max: 3.3
  unit: V
- name: vb2
  description: "Folded PMOS cascode gate bias \u2014 XM10/XM11 (drawn 0.5 V)"
  default: 1.9
  min: 0.0
  max: 3.3
  unit: V
- name: vb3
  description: "NMOS cascode gate bias \u2014 XM7/XM9 (drawn 0.5 V)"
  default: 1.3
  min: 0.0
  max: 3.3
  unit: V
- name: vcmfb_ref
  description: Output common-mode reference into the CMFB servo (drawn port vcmbf_ref, 0.5 V)
  default: 1.65
  min: 0.0
  max: 3.3
  unit: V
