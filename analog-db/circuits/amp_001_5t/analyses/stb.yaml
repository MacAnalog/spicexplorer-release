# Analysis binding: loop-gain / stability probe in the unity buffer (class template).
# Params mirror the circuit's other AC benches (CL 50f); the tsmc-n65 binding re-biases
# via its sizing.yaml analysis_params (VDD 1.2 / VCM 0.45) like every other bench.
# ngspice lane = closed-loop AC only (no stb in ngspice); Spectre lane composes a native
# `stb stb probe=VIPRB` off the template's VIPRB loop-probe marker -> loopGain PSF
# (pm_loop / gain-margin). No datasheet metrics bind here on purpose — loop-gain
# figures are closed-lane-only, so they ride the registry/calculator route instead of
# datasheet conformance (which must stay engine-neutral).
schema: spicexplorer/analysis@1
id: stb
template: stb
description: "Loop gain (stb) of the unity buffer — Spectre-lane pm_loop/gain-margin; ngspice sees the closed-loop AC only."
params:
  VDD: 1.5
  VCM: 0.8
  IBIAS: 20u
  CL: 50f
  FSTART: 1k
  FSTOP: 1G
  PPD: 101
flags: [spectre_only_payload]
produces: []
