# Design variables for the sky130 binding (bare-um tokens; sky130 uses scale=1u).
# Starting point only — UNVALIDATED until the sim tier tunes compensation + device sizes.
schema: spicexplorer/sizing@1
pdk: sky130
variables:
  - {name: x_dut_xmp_w, description: "Pass PMOS per-device width (<=bin max)", default: 50, min: 1, max: 100, unit: m}
  - {name: x_dut_xmp_m, description: "Pass PMOS parallel multiplier (total W = x_dut_xmp_w*x_dut_xmp_m)", default: 48, min: 1, max: 200, unit: count, is_integer: true}
  - {name: x_dut_xmp_l, description: "Pass PMOS length",           default: 0.5, min: 0.15, max: 2,    unit: m}
  - {name: x_dut_xm1_w,   description: "Error-amp input pair width", default: 40,   min: 0.42, max: 60,   unit: m}
  - {name: x_dut_xm1_l,   description: "Error-amp input pair length",default: 0.5, min: 0.15, max: 20,   unit: m}
  - {name: x_dut_xm3_w, description: "Error-amp PMOS load width",  default: 12,   min: 0.42, max: 60,   unit: m}
  - {name: x_dut_xm3_l, description: "Error-amp PMOS load length", default: 0.5, min: 0.15, max: 20,   unit: m}
  - {name: x_dut_xm6_w, description: "Tail/bias mirror width",     default: 4,   min: 0.42, max: 60,   unit: m}
  - {name: x_dut_xm6_l, description: "Tail/bias mirror length",    default: 1.0, min: 0.15, max: 20,   unit: m}
  - {name: r_top,  description: "Divider top",                default: 50k, min: 1k,  max: 10Meg, unit: ohm}
  - {name: r_bot,  description: "Divider bottom",             default: 70k, min: 1k,  max: 10Meg, unit: ohm}
  - {name: c_ff,   description: "Feedforward (phase-lead) cap across r_top", default: 30p, min: 0.01p, max: 2n, unit: F}
  - {name: c_comp, description: "Miller compensation cap",    default: 0.05p, min: 0.01p, max: 100p, unit: F}
  - {name: r_z,    description: "Nulling resistor",           default: 1,   min: 0,    max: 100k,  unit: ohm}
  - {name: vref_val, description: "Internal reference voltage", default: 0.7, min: 0.3, max: 1.2, unit: V}
  - {name: i_tail, description: "Error-amp tail bias current",  default: 50u, min: 1u, max: 500u,  unit: A}
