  notes: >-
    The CCIA system entry composing the two-stage opamp core (amp_026) with the
    input/feedback chopper network PLUS the paper's positive-feedback
    input-impedance boost (Fan et al. §II-B): a fourth chopper taps voutp/voutn
    and Cpf caps (Cpf = Cfb as drawn) recycle the Cin charging current into the
    input-cap nodes, raising the chopped input impedance. CHOPPER NOTE (drawing
    fixed 2026-07-16, DRAWING_REVIEW.md §1; entry matches the drawing): every
    chopper block (chopper-diff) is a TRUE 4-gate modulator — two straight
    transmission gates plus two cross gates on the swapped clock hookup — so
    the clocked bench (tran_chopper_ripple) measures real chopping (modulate +
    demodulate through the in/fb choppers); the static benches hold the clocks
    transparent (straight path on, cross path off), in which configuration this
    IS a working capacitively-coupled IA with cap-ratio gain Cin/Cfb. The
    embedded core's four formerly floating source nets (XM1/XM6/XM9 -> vdd,
    XM15 -> vss) are FIXED in the drawing (DRAWING_REVIEW.md §2) — no deviation
    remains for that item. Drawn unsized (placeholder minimum-size devices)
    with Vb1..Vb4 as
    external bias ports; this entry pulls the four bias levels inside as
    knob-driven dc sources (instantiator-owns-bias,
    plan_hierarchical_composition D3/D4). The drawn Rb=1k placeholder would put
    the high-pass corner at ~MHz — the 10Meg sizing default is a deliberate
    sizing-floor choice.
