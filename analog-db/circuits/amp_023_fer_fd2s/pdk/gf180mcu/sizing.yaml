- {name: x_dut_xmnd1_m, description: "XMND1 m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
- {name: x_dut_xmt_m, description: "XMT m (frozen literal)", default: 2, min: 1, max: 16, freeze: true, is_integer: true}
- {name: x_dut_xmi1_m, description: "XMI1 m (frozen literal)", default: 2, min: 1, max: 16, freeze: true, is_integer: true}
- {name: x_dut_xmi2_m, description: "XMI2 m (frozen literal)", default: 2, min: 1, max: 16, freeze: true, is_integer: true}
- {name: x_dut_xmsa_m, description: "XMSA m (frozen literal)", default: 2, min: 1, max: 16, freeze: true, is_integer: true}
- {name: x_dut_xmsb_m, description: "XMSB m (frozen literal)", default: 2, min: 1, max: 16, freeze: true, is_integer: true}
- {name: x_dut_xmca_m, description: "XMCA m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
- {name: x_dut_xmcb_m, description: "XMCB m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
- {name: x_dut_xmna_m, description: "XMNA m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
- {name: x_dut_xmnb_m, description: "XMNB m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
- {name: x_dut_xmka_m, description: "XMKA m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
- {name: x_dut_xmkb_m, description: "XMKB m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
- {name: x_dut_xm2a_m, description: "XM2A m (frozen literal)", default: 4, min: 1, max: 16, freeze: true, is_integer: true}
- {name: x_dut_xm2b_m, description: "XM2B m (frozen literal)", default: 4, min: 1, max: 16, freeze: true, is_integer: true}
- {name: x_dut_xmla_m, description: "XMLA m (frozen literal)", default: 6, min: 1, max: 16, freeze: true, is_integer: true}
- {name: x_dut_xmlb_m, description: "XMLB m (frozen literal)", default: 6, min: 1, max: 16, freeze: true, is_integer: true}
- {name: x_dut_xmea1_m, description: "XMEA1 m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
- {name: x_dut_xmea2_m, description: "XMEA2 m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
- {name: x_dut_xmepd_m, description: "XMEPD m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
- {name: x_dut_xmepm_m, description: "XMEPM m (frozen literal)", default: 2, min: 1, max: 16, freeze: true, is_integer: true}
- {name: x_dut_xmncd_m, description: "XMNCD m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
