# Sizing for the sky130 binding — generated by `analog-db add-binding` from the
# gf180mcu sizing (geometry re-noted to sky130's unit convention + bin-clamped).
# A starting point; re-tune defaults/bounds for sky130 device physics as needed.
schema: spicexplorer/sizing@1
pdk: sky130
variables:
- name: x_dut_xmb0_w
  default: 100
  description: Bias-mirror NMOS unit (1 mA/branch at ~0.3 V vdsat)
- name: x_dut_xmb0_l
  default: 0.5
- name: x_dut_xmbc_m
  default: 1
- name: x_dut_xmbo_m
  default: 1
- name: x_dut_xm1_w
  default: 100
  description: Input pair
- name: x_dut_xm1_l
  default: 0.5
- name: x_dut_xm3_w
  default: 40
  description: Level-shifted PMOS mirror (M3m/M5)
- name: x_dut_xm3_l
  default: 1
- name: x_dut_xm4_w
  default: 10
  description: M4 compound-diode level shifter (~zero DC current)
- name: x_dut_xm4_l
  default: 0.5
- name: x_dut_xm7_w
  default: 20
  description: M7 second-stage diode (stacked on the first-stage output node)
- name: x_dut_xm7_l
  default: 0.5
- name: x_dut_xm6_w
  default: 80
  description: M6 output PMOS
- name: x_dut_xm6_l
  default: 2
- name: r_z
  default: 3000
  description: Upstream RZ ppolyf_u_3k placeholder geometry -> coarse 1k
- name: c_comp
  default: 6e-12
  description: Upstream param block says 100p, instance says 1p; coarse 2p
- name: x_dut_xmbe_w
  default: 12
  description: "M_mirror_e sink \u2014 MUST be < tail/2 for a valid first-stage op point (see netlist\
    \ note)"
- name: x_dut_xmbf_w
  default: 25
  description: M_mirror_f sink (level-shifter anchor; carries ~0 by design)
- name: r_nd
  default: 500000
  min: 10k
  max: 10MEG
  unit: ohm
  description: "Level-shifted-mirror gate-rail tie na->nd (DC-defines nd; ~0 current — fix 2026-07-25, see abstract netlist)"
