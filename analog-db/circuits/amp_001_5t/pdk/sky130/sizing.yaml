# Design variables (W/L/M) for the sky130 binding (Phase 1 multi-PDK proof).
# Validated against _shared/schema/sizing.schema.json. Geometry retuned for sky130
# 1.8 V devices (min L 0.15u); same abstract symbols as the ihp binding.
# Keyed on the FREE atomic symbols after default tying (abstract/params.yaml, plan D-4):
# tied members (XM2 tracks XM1, XM4 tracks XM3) come from the generated tie block.
# Defaults/bounds numerically identical to the pre-atomic knobs.
schema: spicexplorer/sizing@1
pdk: sky130
variables:
  - {name: x_dut_xm1_w, description: "Input pair width (XM1; XM2 tied)",        default: 1.0, min: 0.42, max: 30, unit: m}
  - {name: x_dut_xm1_l, description: "Input pair length (XM1; XM2 tied)",       default: 2.0, min: 0.15, max: 20, unit: m}
  - {name: x_dut_xm3_w, description: "PMOS mirror-load width (XM3; XM4 tied)",  default: 2.0, min: 0.42, max: 30, unit: m}
  - {name: x_dut_xm3_l, description: "PMOS mirror-load length (XM3; XM4 tied)", default: 2.0, min: 0.15, max: 20, unit: m}
  - {name: x_dut_xm5_w, description: "Tail device width",       default: 3.0, min: 0.42, max: 30, unit: m}
  - {name: x_dut_xm5_l, description: "Tail device length",      default: 2.0, min: 0.15, max: 20, unit: m}
  - {name: x_dut_xm6_w, description: "Mirror reference width",  default: 3.0, min: 0.42, max: 30, unit: m}
  - {name: x_dut_xm6_l, description: "Mirror reference length", default: 2.0, min: 0.15, max: 20, unit: m}
  - {name: x_dut_xm1_m, description: "Input pair fingers (frozen)",       default: 1, min: 1, max: 16, freeze: true, is_integer: true}
  - {name: x_dut_xm3_m, description: "Mirror-load fingers (frozen)",      default: 1, min: 1, max: 16, freeze: true, is_integer: true}
  - {name: x_dut_xm5_m, description: "Tail device fingers (frozen)",      default: 1, min: 1, max: 16, freeze: true, is_integer: true}
  - {name: x_dut_xm6_m, description: "Mirror reference fingers (frozen)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
