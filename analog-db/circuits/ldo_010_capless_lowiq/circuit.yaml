# ★ SUPER-DSL manifest (plan D-3). Validated against _shared/schema/circuit.schema.json.
# PORTED from an agent-first design repo @ 40cad45
# (branch feat/001-reference), where the same cell is the local circuit `ldo_ihp_capless`.
# That repo carries the design's own certification lane (frozen decks + a signed ledger);
# this entry is the catalogued, drift-guarded, layout-bearing form of the SAME design point.
#
# Topology of record (design repo experiment 002): a DOUBLE-MIRROR flipped-voltage-follower (FVF)
# output stage — pass PMOS XMP; control PMOS XMC whose source IS the output; XMC's current folded
# through an NMOS 1:1 mirror (XMA/XMB) and a PMOS 1:1 mirror (XMCP/XMD) onto the pass gate as a
# pull-up; constant sink XMS pulling the gate down — under a slow, high-gain outer loop: a
# two-stage PMOS-input error amplifier (5T OTA + Miller-compensated common source) compares the
# divided output with the (ideal) reference and sets the FVF control voltage. The FVF's local loop
# is the fast transient path; the outer loop sets DC accuracy, PSRR and load/line regulation. The
# fold (not a plain FVF) is what lets the gate reach vdd so the pass device turns OFF at hot/fast
# corners. Bias is resistor-referenced (no ideal current sources): one NMOS diode behind a poly
# resistor from the rail, mirrored to the sink and, via a PMOS diode, to the error-amp tail.
schema: spicexplorer/circuit@1
