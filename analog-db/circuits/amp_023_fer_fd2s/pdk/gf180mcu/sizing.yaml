# Sizing for the gf180mcu binding — generated by `analog-db add-binding` from the
# ihp-sg13g2 sizing (geometry re-noted to gf180mcu's unit convention + bin-clamped).
# A starting point; re-tune defaults/bounds for gf180mcu device physics as needed.
schema: spicexplorer/sizing@1
pdk: gf180mcu
variables:
- name: x_dut_xmbd_w
  description: NMOS bias diode / mirror / EA width
  default: 4u
  min: 0.22u
  max: 50u
  unit: m
- name: x_dut_xmpd1_w
  description: PMOS bias diode + vcn source width
  default: 6u
  min: 0.22u
  max: 50u
  unit: m
- name: x_dut_xmpd2_w
  description: Narrow PMOS diode (vcp rail) width
  default: 1.5u
  min: 0.22u
  max: 50u
  unit: m
- name: x_dut_xmnd1_w
  description: Narrow NMOS diode (vcn rail) width
  default: 0.75u
  min: 0.22u
  max: 50u
  unit: m
- name: x_dut_xmi1_w
  description: Input pair width (per finger, m=2)
  default: 6u
  min: 0.22u
  max: 50u
  unit: m
- name: x_dut_xmsa_w
  description: Folded PMOS source width (per finger, m=2)
  default: 6u
  min: 0.22u
  max: 50u
  unit: m
- name: x_dut_xmca_w
  description: PMOS cascode width
  default: 6u
  min: 0.22u
  max: 50u
  unit: m
- name: x_dut_xmna_w
  description: NMOS cascode width
  default: 4u
  min: 0.22u
  max: 50u
  unit: m
- name: x_dut_xmka_w
  description: CMFB-driven bottom sink width
  default: 3u
  min: 0.22u
  max: 50u
  unit: m
- name: x_dut_xm2a_w
  description: Stage-2 NMOS CS width (per finger, m=4)
  default: 8u
  min: 0.22u
  max: 50u
  unit: m
- name: x_dut_xmla_w
  description: Stage-2 PMOS load width (per finger, m=6)
  default: 6u
  min: 0.22u
  max: 50u
  unit: m
- name: x_dut_xmepd_w
  description: CMFB EA PMOS diode width (mirror m=2)
  default: 3u
  min: 0.22u
  max: 50u
  unit: m
- name: x_dut_xmncd_w
  description: CMFB output NMOS diode width
  default: 1.5u
  min: 0.22u
  max: 50u
  unit: m
- name: x_dut_xmbd_l
  description: Bias/load device length
  default: 0.4u
  min: 0.28u                            # manual fix: L bin floor (see x_dut_xmca_l note)
  max: 10u
  unit: m
- name: x_dut_xmi1_l
  description: Input pair / stage-2 CS length
  default: 0.3u
  min: 0.28u                            # manual fix: L bin floor (see x_dut_xmca_l note)
  max: 10u
  unit: m
- name: x_dut_xmca_l
  description: Cascode / EA-pair length
  # manual fix: length knob (name doesn't match the _l heuristic) — clamp to the gf180 L bin
  # floor (0.28u), not the W floor the generator applied.
  default: 0.28u
  min: 0.28u
  max: 10u
  unit: m
- name: x_dut_rza_value
  description: Nulling resistor (ohms)
  default: 1500
  min: 100
  max: 10000
  unit: ohm
- name: x_dut_cca_value
  description: Miller cap per side (F)
  default: 2e-12
  min: 5e-14
  max: 2e-12
  unit: F
- name: x_dut_rca_value
  description: CM sense resistor (ohms)
  default: 2e5
  min: 1e4
  max: 1e6
  unit: ohm
- name: x_dut_cma_value
  description: CM sense cap (F)
  default: 150e-15
  min: 1e-14
  max: 1e-12
  unit: F
- name: x_ibias_val
  description: Internalized bias current (A)
  default: 20e-6
  min: 1e-6
  max: 1e-4
  unit: A
  freeze: true
- name: x_vcmr_val
  description: Internalized CM reference (V)
  default: 0.75
  min: 0.3
  max: 1.2
  unit: V
  freeze: true
# Frozen per-device literals (P4 atomic sweep): defaults reproduce the authored
# netlist literals exactly; freeze keeps them out of the search space.
- {name: x_dut_xmbd_m, description: "XMBD m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
- {name: x_dut_xmb1_m, description: "XMB1 m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
- {name: x_dut_xmpd1_m, description: "XMPD1 m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
- {name: x_dut_xmb2_m, description: "XMB2 m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
- {name: x_dut_xmpd2_m, description: "XMPD2 m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
