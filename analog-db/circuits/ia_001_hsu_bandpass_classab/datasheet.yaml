# Datasheet (plan D-3/D-5/D-12). Validated against _shared/schema/datasheet.schema.json.
# SUPERSET of cace_format 5.2. See _shared/CACE_FORMAT.md for the field-overlap mapping (O-1).
# Spec bands target the Hsu-paper headline figures where they translate to this abstract
# ihp-sg13g2 binding (gain 26 dB = Cin/Cf = 20; THD well under the paper's -65 dB ~ 0.06%),
# and are sanity bands for the hand-seeded sizing elsewhere.
schema: spicexplorer/datasheet@1
cace_format: "5.2"
default_conditions:
  supply: {unit: V, typical: 1.2}
  cload:  {unit: fF, typical: 50}
  corner: {typical: tt}
  temp:   {unit: degC, typical: 27}
  vcm:    {unit: V, typical: 0.6}
metrics:
  gain_cl:
    display: "Closed-loop mid-band gain"
    description: "Capacitive-ratio gain Cin/Cf = 20 V/V = 26 dB (the paper's ~25.7 dB); linear
      V/V because the template's gain_cl_db MAX-measure prints an 'at=' suffix the harness
      measure parser rejects — gain_cl is the template's clean print of the same peak"
    unit: V/V
    analysis: ac_closed_loop
    extract: {meas: gain_cl}
    spec: {min: 10, typ: 20, unit: V/V}
  hpf_hz:
    display: "High-pass corner"
    description: "Low-side bandpass corner set by the pseudo-resistors x Cf"
    unit: Hz
    analysis: ac_closed_loop
    extract: {meas: hpf_hz}
    spec: {max: 200, unit: Hz}
  bw_cl_hz:
    display: "Closed-loop bandwidth"
    description: "High-side -3 dB corner (loop UGF x feedback factor)"
    unit: Hz
    analysis: ac_closed_loop
    extract: {meas: bw_cl_hz}
    spec: {min: 500, unit: Hz}
  vos:
    display: "Output offset"
    description: "voutp - voutn at matched DC inputs; the CMFB/pseudo-R bias residual"
    unit: V
    analysis: dc_op
    extract: {meas: vos}
    spec: {min: -50e-3, max: 50e-3, unit: V}
  i_supply:
    display: "Supply current"
    unit: A
    analysis: dc_op
    extract: {meas: i_supply}
    spec: {max: 500e-6, unit: A}
  vn_in:
    display: "Input-referred noise"
    description: "Integrated 1 Hz - 100 kHz through the closed loop"
    unit: V
    analysis: noise
    extract: {meas: inoise_total}
    spec: {max: 1e-3, unit: V}
  thd_pct:
    display: "Total harmonic distortion"
    description: "Class-AB output THD at 1 kHz, 2 mV differential input (~40 mV diff out) — the paper's small-signal regime; ~0.05% = -66 dB (paper: -65 dB). Rises steeply above ~5 mV input as the class-AB downswing clips"
    unit: "%"
    analysis: thd
    extract: {meas: thd_pct}
    spec: {max: 0.5, unit: "%"}
  zin_ohm:
    display: "Differential input impedance (static, 100 Hz)"
    description: "Voltage-driven |Zin| at FSIG — the cap-coupled 1/(pi*f*Cin) figure; the in-operation number is zin_chop_ohm"
    unit: Ohm
    analysis: ac_zin_diff
    extract: {meas: zin_ohm}
    spec: {min: 50e6, unit: Ohm}
