# AnalogGym analysis binding (noise).
# BAND STANDARDIZED 2026-08-01: FSTART 1k -> 1 Hz so the paper's noise column is one uniform
# condition across the corpus — total integrated input-referred noise, 1 Hz..1 MHz, unity/
# closed-loop bias config, CL = 10p. PPD unchanged.
# `produces:` names DATASHEET METRIC IDS — datasheet.metrics.vn_in_integrated binds
# {analysis: noise, extract.meas: inoise_total} (ngspice inoise_total is volts rms integrated
# over the swept band).
schema: spicexplorer/analysis@1
id: noise
template: noise_biaswrap
description: "Input-referred noise via the AnalogGym self-bias bias-wrap (Lfb/Cin)."
enabled: true
params: {VDD: 1.8, VCM: 300m, CL: 10p, FSTART: 1, FSTOP: 1MEG, PPD: 50}
flags: []
produces: [vn_in_integrated]
