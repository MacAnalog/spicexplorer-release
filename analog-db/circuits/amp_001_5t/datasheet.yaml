schema: spicexplorer/datasheet@1
cace_format: '5.2'
default_conditions:
  supply:
    unit: V
    typical: 1.5
  cload:
    unit: fF
    typical: 10000
  corner:
    typical: tt
  temp:
    unit: degC
    typical: 27
  vcm:
    unit: V
    typical: 0.8
  ibias:
    unit: uA
    typical: 20
metrics:
  dc_gain_db:
    display: DC open-loop gain
    description: Large-signal DC gain
    unit: dB
    analysis: ac_open_loop
    extract:
      meas: dcgain
    symbolic:
      tool: netlist2tf
      call: open_loop_gain
      args:
        output:
        - vout
        - vss
        input:
        - vinp
        - vinn
        scale: db
    spec:
      unit: dB
      min: 40.0
    optimize:
      spec_name: dcgain
      testbench: tb_ac
      sim_type: ac
      goal: exceed
      target: 35
      range: 100
      tolerance: 5
      weight: 100.0
      error_type: relative-sigmoid
      enable: true
  ugf_hz:
    display: Unity-gain frequency
    unit: Hz
    analysis: ac_open_loop
    extract:
      meas: ugf
    spec:
      unit: Hz
      min: 5000000.0
    optimize:
      spec_name: ugf
      testbench: tb_ac
      sim_type: ac
      goal: exceed
      target: 2.0e6
      range: 1.0e6
      tolerance: 2.0e5
      weight: 100.0
      error_type: relative-sigmoid
      enable: true
  pm_deg:
    display: Phase margin
    unit: deg
    analysis: ac_open_loop
    extract:
      meas: pm
    spec:
      typ: 70
      unit: deg
      min: 60.0
      max: 90
    optimize:
      spec_name: pm
      testbench: tb_ac
      sim_type: ac
      goal: exact
      target: 70
      range: 45
      tolerance: 30
      weight: 100.0
      error_type: relative-sigmoid
      enable: true
  gain_cl:
    display: Buffer gain
    description: Unity-gain buffer voltage ratio (the a-c-d CACE ac_params.gain spec)
    unit: V/V
    analysis: ac_closed_loop
    extract:
      meas: gain_cl
    spec:
      min: 0.97
      max: 1.03
      unit: V/V
  bw_cl_hz:
    display: Buffer bandwidth
    description: -3 dB bandwidth of the buffer (the a-c-d CACE ac_params.bw spec)
    unit: Hz
    analysis: ac_closed_loop
    extract:
      meas: bw_cl
    spec:
      min: 10.0e6
      unit: Hz
  psrr_vdd_db:
    display: Positive-supply rejection
    description: PSRR+ in the unity-buffer config, DC-band floor (design-review 2026-07-05,
      wired).
    unit: dB
    analysis: psrr_vdd
    extract:
      meas: psrr_vdd_db
    spec:
      unit: dB
      min: 40.0
  cmrr_db:
    display: Common-mode rejection
    description: CMRR in the unity-buffer config, DC-band floor (design-review 2026-07-05,
      wired).
    unit: dB
    analysis: cmrr_vcm
    extract:
      meas: cmrr_db
    spec:
      min: 40
      unit: dB
  thd_pct:
    display: Total harmonic distortion (100 mV @ 10 kHz, buffer)
    description: tran+FFT on ngspice; native PSS harmonics on Spectre (tb-validation
      follow-on 2026-07-09). F0 1 MHz -> 10 kHz 2026-08-01 (campaign grid rule) — the
      fresh ac_open_loop ugf is 1.214 MHz at CL=10p, so the old tone sat AT loop
      crossover; see analyses/thd.yaml.
    unit: '%'
    analysis: thd
    extract:
      meas: thd_pct
      f0: 10.0e3
    spec:
      max: 2.0
      unit: '%'
  iip3_dbv:
    display: Input IP3 (two-tone 9/10 kHz, 6.25 mV/tone, buffer)
    description: Single-point IM3 extrapolation; tran+coherent DFT on ngspice, native
      PSS on Spectre (2026-07-09). Drive lowered 50 mV -> 6.25 mV 2026-07-31 — at 50 mV
      the IM3 bin was already off its 3:1 slope, reading 1.40 dB optimistic on sky130;
      tones 0.9/1.0 MHz -> 9/10 kHz 2026-08-01 (campaign grid rule, fresh ugf 1.214 MHz
      at CL=10p put the old tones AT loop crossover); see analyses/iip3.yaml. ampl_in
      below MUST track the analysis binding's ASIG (it is the intercept's input
      reference).
    unit: dBV
    analysis: iip3
    extract:
      meas: iip3_dbv
      f1: 9.0e3
      f2: 10.0e3
      ampl_in: 0.00625
    spec:
      min: -10
      unit: dBV
  pm_loop_deg:
    display: Loop phase margin (stb, buffer)
    description: Phase margin of the unity-buffer feedback loop — Middlebrook injection
      at the VIPRB marker (ngspice) / native stb (Spectre). Probes the same loop as
      pm_deg (spec min matched to it); -999 sentinel = the loop never crosses unity
      (fails the min spec by design).
    unit: deg
    analysis: stb
    extract:
      meas: pm_loop
    spec:
      min: 60.0
      unit: deg
  loopgain_db:
    display: Loop gain (stb, buffer)
    description: Low-frequency loop-gain magnitude of the Middlebrook probe (read at
      FSTART). No spec — reported for the record.
    unit: dB
    analysis: stb
    extract:
      meas: loopgain_db
  ugf_loop_hz:
    display: Loop unity-gain frequency (stb, buffer)
    description: Loop-gain unity crossover of the buffer loop. No spec — reported for
      the record.
    unit: Hz
    analysis: stb
    extract:
      meas: ugf_loop
  gm_loop_db:
    display: Loop gain margin (stb, buffer)
    description: Gain margin at the loop phase crossover; -999 sentinel = no phase
      crossover in band (a single-pole-like loop, common on this 5T cell). No spec.
      ngspice emits meas name gm_loop; Spectre's bench emits gm_loop_db.
    unit: dB
    analysis: stb
    extract:
      meas: gm_loop
  icmr_range:
    display: Input common-mode range
    description: Widest contiguous 20 mV tracking band of the buffer-connected DC
      sweep (tb-validation pass 2026-07-09).
    unit: V
    analysis: linearity
    extract:
      meas: icmr_range
      vin: vinp
      vtrack: 0.02
    spec:
      min: 0.3
      unit: V
  vn_in_integrated:
    display: Total integrated input-referred noise (1 Hz - 1 MHz)
    description: Total rms input-referred noise integrated over the standard 1 Hz -
      1 MHz paper band, unity-buffer bias config, CL=10p. ngspice inoise_total is
      already volts rms integrated over the swept band (calibrated 2026-08-01 —
      cross-checked against the platform registry on amp_022@ihp, 2.47e-4 V). Replaces
      the old vn_in entry, which bound the same inoise_total under V/sqrt(Hz) — that
      unit was dimensionally wrong. No spec.
    unit: V
    analysis: noise
    extract:
      meas: inoise_total
  t_settle:
    display: Settling time
    unit: s
    analysis: tran_step
    extract:
      meas: t_settle
    spec:
      max: 1.5e-07
      unit: s
    optimize:
      spec_name: tsettle
      testbench: tb_tran
      sim_type: tran
      goal: minimize
      target: 1.5e-07
      range: 1.0e-06
      tolerance: 1.0e-08
      weight: 100.0
      error_type: relative-sigmoid
      enable: true
  i_supply:
    display: Supply current
    unit: A
    analysis: dc_op
    extract:
      meas: i_supply
    spec:
      max: 0.001
      unit: A
  fom_s:
    display: Small-signal FOM
    formula: ugf_hz*1e-6 * 0.05 / (i_supply*1.5*1e3)
    spec:
      min: any
