schema: spicexplorer/params@1
devices:
  C1: {Value: x_dut_c1_value}
  C2: {Value: x_dut_c2_value}
  IBIAS: {Value: i_bias}
  R1: {Value: x_dut_r1_value}
  R2: {Value: x_dut_r2_value}
  VBL: {Value: vbl}
  XM1: {l: x_dut_xm1_l, m: x_dut_xm1_m, w: x_dut_xm1_w}
  XM10: {l: x_dut_xm10_l, m: x_dut_xm10_m, w: x_dut_xm10_w}
  XM2: {l: x_dut_xm2_l, m: x_dut_xm2_m, w: x_dut_xm2_w}
  XM3: {l: x_dut_xm3_l, m: x_dut_xm3_m, w: x_dut_xm3_w}
  XM4: {l: x_dut_xm4_l, m: x_dut_xm4_m, w: x_dut_xm4_w}
  XM5: {l: x_dut_xm5_l, m: x_dut_xm5_m, w: x_dut_xm5_w}
  XM6: {l: x_dut_xm6_l, m: x_dut_xm6_m, w: x_dut_xm6_w}
  XM7: {l: x_dut_xm7_l, m: x_dut_xm7_m, w: x_dut_xm7_w}
  XM8: {l: x_dut_xm8_l, m: x_dut_xm8_m, w: x_dut_xm8_w}
  XM9: {l: x_dut_xm9_l, m: x_dut_xm9_m, w: x_dut_xm9_w}
groups:
- name: mirror_xm6_l
  kind: mirror_length
  members: [XM6, XM10, XM7, XM8]
  tie: [l]
  description: Bias diode XM6 mirrors to the output sinks XM7/XM10 and the tail XM8 — same L for mirror
    accuracy (structural detection).
- name: pair_xm1_xm2
  kind: matched_pair
  members: [XM1, XM2]
  tie: [w, l, m]
  description: NMOS input differential pair (structural detection).
- name: pair_xm3_xm4
  kind: matched_pair
  members: [XM3, XM4]
  tie: [w, l, m]
  description: PMOS current-source loads of stage 1 (gates on the vbl knob) — must match for stage-1 balance;
    vbl is the knife-edge CM knob (no CMFB drawn).
- name: pair_xm5_xm9
  kind: matched_pair
  members: [XM5, XM9]
  tie: [w, l, m]
  description: Per-side stage-2 PMOS common-source drivers.
- name: pair_xm7_xm10
  kind: matched_pair
  members: [XM7, XM10]
  tie: [w, m]
  description: Output current sinks (gates on ref); W/m matched, L tied through mirror_xm6_l.
- name: miller_r
  kind: shared_geometry
  members: [R1, R2]
  tie: [Value]
  description: Per-side Miller zero-nulling resistors.
- name: miller_c
  kind: shared_geometry
  members: [C1, C2]
  tie: [Value]
  description: Per-side Miller compensation capacitors.
