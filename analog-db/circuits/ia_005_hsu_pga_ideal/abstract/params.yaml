groups:
- name: bank_tg_nmos
  kind: shared_geometry
  members: [XMA1, XMA3, XMA5, XMA7, XMA9, XMA11, XMB1, XMB3, XMB5, XMB7, XMB9, XMB11]
  tie: [w, l, m]
  description: The NMOS halves of all twelve bank transmission gates (select + park, both banks) —
    parallel signal paths with no shared channel net, but every leg must match for uniform series
    resistance and charge injection on the switched bottom plates, per bit AND per side (the two
    banks set the differential gain — side mismatch is gain error).
