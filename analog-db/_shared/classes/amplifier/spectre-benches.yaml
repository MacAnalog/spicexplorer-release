# Per-TESTBENCH Spectre engine config for the amplifier class — which analysis templates
# each bench composes on the closed (Spectre) lane, and which SKILL calculator
# expressions read its results (the OCEAN Tier-2 route).
#
# The analysis statement templates live in `_shared/engines/spectre/analyses.yaml`; the
# calculator expression table in `_shared/engines/spectre/calculator.yaml`. This file only
# WIRES them per bench. The deck *stimulus* (which source carries the AC unit, the sine
# drive, the step) still rides in from the class testbench template — only the analyses
# and result-reading expressions are configured here.
#
# Value syntax in `args:` — `$NAME` pulls from the render context (the bench's
# `analyses/<tb>.yaml` params, UPPERCASE, plus the platform-computed extras below);
# anything else is a literal. Unmapped template placeholders resolve directly from the
# context by their own name (so the ac template needs no args: FSTART/FSTOP/PPD are bench
# params already).
#
# Platform-computed context extras (see `spicexplorer.backends.analog_db._spectre_context`):
#   RAIL                             — the per-PDK registry supply (closed-lane rail)
#   IIP3_FUND, IIP3_HARMS,           — two-tone shared fundamental + harmonic budget and
#   IIP3_N1, IIP3_N2,                  tone/IM3 harmonic indices, derived from F1/F2
#   IIP3_NIM3A, IIP3_NIM3B             (f1=N1·fund, f2=N2·fund; IM3 at |2N1-N2|, 2N2-N1)
schema: spicexplorer/spectre-benches@1
class: amplifier
benches:
  ac_open_loop:
    analyses:
      - {template: dc_op}
      - {template: ac}
    calculator:
      - {name: dcgain, expr: gain_db_at, args: {OUT: vout, FREQ: $FSTART}}
      - {name: bw_3db, expr: bw_3db, args: {OUT: vout}}
      - {name: gbw, expr: gbw, args: {OUT: vout}}
      - {name: ugf, expr: ugf, args: {OUT: vout}}
      - {name: pm, expr: pm, args: {OUT: vout}}
  ac_closed_loop:
    analyses:
      - {template: dc_op}
      - {template: ac}
    calculator:
      # gain_cl is LINEAR (V/V) — the class buffer-gain spec convention
      - {name: gain_cl, expr: gain_lin_at, args: {OUT: vout, FREQ: $FSTART}}
      - {name: bw_cl, expr: bw_3db, args: {OUT: vout}}
  cmrr_vcm:
    analyses:
      - {template: dc_op}
      - {template: ac}
    calculator:
      # OUT: vout is rewritten to (v("voutp")-v("voutn")) for a fully-differential DUT by
      # `analog_db.bench_ocean_measurements` — one row serves both output conventions.
      - {name: cmrr_db, expr: neg_gain_db_at, args: {OUT: vout, FREQ: $FSTART}}
      # ... but the SECOND figure the `cmrr_vcm_diff` template measures — the OUTPUT-CM
      # response to the same CM ride — has no single-ended counterpart, so it cannot ride the
      # rewrite: it needs the PAIR, not the difference. `requires:` gates the row on the
      # FD-only $CM_OUTP/$CM_OUTN context extras, so it renders on a differential DUT and is
      # SKIPPED on a single-ended one (whose datasheet does not declare cmrr_cm_db either).
      # Without this row cmrr_cm_db had no Spectre route at all and fell through to the Tier-1
      # registry, which has no such recipe -> KeyError -> NaN -> dropped from the metrics
      # rollup, blanking the rejection column for all 8 FD Spectre-routed cells.
      - {name: cmrr_cm_db, expr: neg_cm_gain_db_at, requires: [CM_OUTP, CM_OUTN],
         args: {OUTP: $CM_OUTP, OUTN: $CM_OUTN, FREQ: $FSTART}}
  psrr_vdd:
    analyses:
      - {template: dc_op}
      - {template: ac}
    calculator:
      - {name: psrr_vdd_db, expr: neg_gain_db_at, args: {OUT: vout, FREQ: $FSTART}}
      # FD-only CM-path supply rejection — the psrr twin of cmrr_cm_db above (same gating).
      - {name: psrr_cm_db, expr: neg_cm_gain_db_at, requires: [CM_OUTP, CM_OUTN],
         args: {OUTP: $CM_OUTP, OUTN: $CM_OUTN, FREQ: $FSTART}}
  dc_op:
    analyses:
      - {template: dc_op}
    calculator: []
  ac_cm_reg:
    analyses:
      - {template: dc_op}
      - {template: ac}
    calculator:
      # CM benches assume the self-biased differential-output port contract
      # (voutp/voutn), like the ngspice templates they mirror.
      - {name: zcm_lf_ohm, expr: cm_z_lf, args: {OUTP: voutp, OUTN: voutn, FREQ: $FSTART}}
      - {name: cm_peaking_db, expr: cm_z_peaking_db, args: {OUTP: voutp, OUTN: voutn, FREQ: $FSTART}}
  dc_cm_bias_sweep:
    # The closed-lane twin of the ngspice dc_cm_bias_sweep template. That deck steps ONE
    # internal bias knob through five AUTHORED values with alterparam+reset+op; Spectre does
    # the same in a single `dc` analysis over the netlist parameter (`dc_param_points`,
    # values=[VB1..VB5]), so both lanes sample the same abscissa at the same five points.
    # Sweep-only (no dc_op sibling) for the same reason as `linearity`: two `.dc` PSFs.
    # Like the other CM benches this assumes the self-biased differential-output port
    # contract (voutp/voutn) the ngspice template hardcodes — FD-only by construction.
    analyses:
      - {template: dc_param_points,
         args: {PARAM: $CMKNOB, V1: $VB1, V2: $VB2, V3: $VB3, V4: $VB4, V5: $VB5}}
    calculator:
      # `name:` is the datasheet `extract.meas` string — cm_interior_pts is the published
      # figure (amp_029/amp_030/amp_034 all declare it); without this bench it had no
      # closed-lane route at all and blanked on every Spectre-routed CM-closure cell.
      - {name: cm_interior_pts, expr: cm_interior_pts, args: {OUTP: voutp, OUTN: voutn}}
      # the five per-point reads the ngspice deck `print`s (the analyses' `produces:` list)
      - {name: vocm_1, expr: cm_vocm_at, args: {OUTP: voutp, OUTN: voutn, VB: $VB1}}
      - {name: vocm_2, expr: cm_vocm_at, args: {OUTP: voutp, OUTN: voutn, VB: $VB2}}
      - {name: vocm_3, expr: cm_vocm_at, args: {OUTP: voutp, OUTN: voutn, VB: $VB3}}
      - {name: vocm_4, expr: cm_vocm_at, args: {OUTP: voutp, OUTN: voutn, VB: $VB4}}
      - {name: vocm_5, expr: cm_vocm_at, args: {OUTP: voutp, OUTN: voutn, VB: $VB5}}
  tran_cm_kick:
    analyses:
      - {template: dc_op}
      - {template: tran}
    calculator:
      - {name: cm_kick_v, expr: cm_kick_v, args: {OUTP: voutp, OUTN: voutn}}
      - {name: cm_resid_v, expr: cm_resid_v, args: {OUTP: voutp, OUTN: voutn}}
      - {name: t_cm_settle, expr: cm_t_settle, args: {OUTP: voutp, OUTN: voutn}}
  noise:
    analyses:
      - {template: dc_op}
      # OUT = $NOISE_OUT (vout single / voutp differential); OUTN comes from the context
      # (0 single / voutn differential) — both set by _spectre_context from circuit.yaml ports
      # IPROBE is the input SOURCE INSTANCE, and the closed-lane deck is a translation of
      # the ngspice template, so the instance name follows the VARIANT: the self-biased
      # (biaswrap) decks drive through VAC on `sigin` and have no VINP at all. Hardcoding
      # VINP made Spectre reference a nonexistent instance, so it returned no
      # input-referred density and inoise_total was NaN on 16 Spectre-routed amplifiers while
      # the analysis still reported status ok. $NOISE_IPROBE resolves per template.
      - {template: noise, args: {OUT: $NOISE_OUT, IPROBE: $NOISE_IPROBE}}
    calculator:
      # input-referred integrated noise off the `in` density vector (iprobe-based, so it is
      # output-node-agnostic and works for single-ended AND differential-output DUTs)
      - {name: inoise_total, expr: noise_total_rms, args: {SIG: in, FSTART: $FSTART, FSTOP: $FSTOP}}
  tran_step:
    analyses:
      - {template: dc_op}
      - {template: tran}
    calculator: []
  linearity:
    # sweep-only on purpose: the dc_op sibling would leave a second `.dc` PSF
    analyses:
      - {template: dc_sweep, args: {DEV: VINP, START: 0, STOP: $RAIL, STEP: $VSWEEP_STEP}}
    calculator: []
  thd:
    # ngspice has no PSS — the open lane runs the deck's committed tran (registry FFT);
    # the closed lane composes this native pss at the drive fundamental instead.
    analyses:
      - {template: pss, args: {FUND: $F0}}
    calculator:
      # NHARM is the SUMMATION width, not the PSS harmonic budget ($HARMS stays 7 so the
      # solve keeps its accuracy). Pinned to 5 because the three ngspice templates all
      # compute sqrt(a2^2+a3^2+a4^2+a5^2)/a1 — summing through the 7th here made the THD
      # column mean something different on this kit than on the open ones. Measured cost
      # of the truncation: 0.000 % on amp_003 (0.00293) and amp_022 (0.11606), i.e. the
      # 6th and 7th are below the printed precision, so this buys comparability for free.
      - {name: thd_pct, expr: thd_pct, args: {OUT: vout, NHARM: 5}}
      - {name: hd2_db, expr: hd2_db, args: {OUT: vout}}
      - {name: hd3_db, expr: hd3_db, args: {OUT: vout}}
  iip3:
    # both tones share IIP3_FUND (template contract), so tones AND IM3 products are plain
    # harmonics of ONE pss — no QPSS needed; harms budget covers 2·N2 with margin.
    analyses:
      - {template: pss, args: {FUND: $IIP3_FUND, HARMS: $IIP3_HARMS}}
    calculator:
      - name: im3_dbc
        expr: im3_dbc
        args: {OUT: vout, N1: $IIP3_N1, N2: $IIP3_N2, NIM3A: $IIP3_NIM3A, NIM3B: $IIP3_NIM3B}
      - name: iip3_dbv
        expr: iip3_dbv
        args:
          OUT: vout
          AMPL: $ASIG
          N1: $IIP3_N1
          N2: $IIP3_N2
          NIM3A: $IIP3_NIM3A
          NIM3B: $IIP3_NIM3B
  stb:
    # VIPRB is the loop-probe marker in the stb template (a 0 V source in the feedback
    # path); the platform's Spectre emitter translates it to an `iprobe` instance.
    analyses:
      - {template: dc_op}
      - {template: stb, args: {PROBE: VIPRB}}
    calculator:
      # `name:` MUST be the datasheet `extract.meas` string, not the metric id — a row the
      # datasheets never name is dead, and the metric silently falls through to the Tier-1
      # registry (which spells these `gain_margin_db` and has no loop-UGF at all) and lands
      # NaN with the bench still `status: ok`. All 32 amplifier datasheets ask for
      # pm_loop / ugf_loop / gm_loop / loopgain_db.
      - {name: pm_loop, expr: pm_loop}
      - {name: ugf_loop, expr: ugf_loop}
      - {name: gm_loop, expr: gm_loop}
      - {name: loopgain_db, expr: loopgain_db, args: {FREQ: $FSTART}}
