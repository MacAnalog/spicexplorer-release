# the cell from the scoreboard index / paper tabulation while its four open-PDK bindings, abstract
# netlist, params and sizing stay lowered, drift-guarded and resolvable for that composition.
# It is NOT `kind: reference` — that kind means "imported FOREIGN deck" (PDK-free, carries
# `references:`) and would skip T1-T4 on a cell that really does have open-PDK bindings.
