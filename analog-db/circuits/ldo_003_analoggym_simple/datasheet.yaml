# Datasheet — AnalogGym ldo_simple (5T OTA + pass, unity feedback)
# Characterized on sky130 (the upstream-native PDK); PROVISIONAL specs bracketing first
# recorded baselines — see results/. load_reg/line_reg are plain delta-Vout in VOLTS.
schema: spicexplorer/datasheet@1
cace_format: "5.2"
default_conditions:
  supply: {unit: V, typical: 2.0}
  vout:   {unit: V, typical: 1.8}
  vref:   {unit: V, typical: 1.8}
  cout:   {unit: pF, typical: 50}      # upstream mim output cap (~50 pF) — a CAPLESS-class LDO
  iload:  {unit: mA, typical: 10.0}
  corner: {typical: tt}
  temp:   {unit: degC, typical: 27}
metrics:
  v_out:
    display: "Regulated output voltage"
    unit: V
    analysis: dc_op
    extract: {meas: vout_dc}
    spec: {min: 1.7, typ: 1.8, max: 1.95, unit: V}   # sky130 measured 1.871 (finite 5T loop gain)
  i_q:
    display: "Quiescent current"
    unit: A
    analysis: dc_op
    extract: {meas: i_supply}
    spec: {max: 5.0e-4, unit: A}          # sky130 measured 108 uA
  load_reg:
    display: "Load regulation"
    description: "delta-Vout across the 0 -> heavy-load DC sweep (volts)."
    unit: V
    analysis: load_regulation
    extract: {meas: load_reg}
    spec: {max: 0.15, unit: V}            # sky130 measured 0.10
  line_reg:
    display: "Line regulation"
    unit: V
    analysis: line_regulation
    extract: {meas: line_reg}
    spec: {max: 0.05, unit: V}
  v_dropout:
    display: "Dropout voltage"
    unit: V
    analysis: dropout
    extract: {meas: v_dropout}
    spec: {max: 0.3, unit: V}
  psrr_vdd_db:
    display: "PSRR (Vdd -> Vout)"
    unit: dB
    analysis: psrr
    extract: {meas: psrr_vdd_db}
    spec: {min: 20, unit: dB}
  zout_peak_db:
    display: "Closed-loop Zout peaking"
    unit: dB
    analysis: loop_stability
    extract: {meas: zout_peak_db}
    spec: {max: 25, unit: dB}             # sky130 measured 19.4
  v_undershoot:
    display: "Load-step undershoot"
    description: "Peak droop on the fast load step into only ~50 pF (capless-class — expect much more than a 1 uF-cap LDO)."
    unit: V
    analysis: tran_load_step
    extract: {meas: v_undershoot}
    spec: {max: 1.2, unit: V}             # sky130 measured 0.92 on the 10 uA -> 10 mA step into 50 pF
  t_transient:
    display: "Load-step recovery time"
    unit: s
    analysis: tran_load_step
    extract: {meas: t_transient}
    spec: {max: 3.0e-5, unit: s}
  vn_out_rms:
    display: "Integrated output noise"
    unit: V
    analysis: noise
    extract: {meas: vn_out_rms}
    spec: {max: 0.03, unit: V}
  v_line_pp:
    display: "Line-transient deviation"
    unit: V
    analysis: tran_line_step
    extract: {meas: v_line_pp}
    spec: {max: 0.2, unit: V}             # sky130 measured 0.157
  pm_loop_deg:
    display: "Loop phase margin"
    description: "TRUE regulation-loop phase margin by Middlebrook voltage injection at the Vlp
      marker. Recorded WITHOUT a spec bound: the bench was bound to this entry after its
      specification bands were authored and validated, and inventing a threshold here would
      silently re-judge an entry that was never designed against one."
    unit: deg
    analysis: ac_loopgain
    extract: {meas: pm_loop}
  loopgain_db:
    display: "DC loop gain"
    description: "Loop gain at FSTART. Sets the regulation accuracy floor: static load/line error
      scales as 1/loop-gain."
    unit: dB
    analysis: ac_loopgain
    extract: {meas: loopgain_db}
  ugf_loop_hz:
    display: "Loop unity-gain frequency"
    description: "Regulation bandwidth: how fast the loop can correct a load step."
    unit: Hz
    analysis: ac_loopgain
    extract: {meas: ugf_loop}
  ms_peak_db:
    display: "Sensitivity peak"
    description: "Peak of the sensitivity function |S| = |Zout_cl|/|Zout_ol|, in dB. This is the
      damping figure zout_peak_db stands in for, and unlike the proxy it is referenced to the
      OPEN-loop impedance rather than to its own low-frequency value, so it does not confound the
      output capacitor with the loop. Cross-check on every run: Ms >= 1/(2 sin(PM/2))."
    unit: dB
    analysis: ac_loopgain
    extract: {meas: ms_peak}
  tloop_ph_dc_deg:
    display: "DC loop phase"
    description: "Measured DC phase of the raw around-the-loop transfer. Guard, not a design
      figure: ms_peak assumes the negative-feedback sign convention, which holds only when this
      reads near +/-180 deg."
    unit: deg
    analysis: ac_loopgain
    extract: {meas: tloop_ph_dc}
