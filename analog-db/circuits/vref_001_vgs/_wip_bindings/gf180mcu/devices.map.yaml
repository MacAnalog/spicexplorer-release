# Generic device kind -> gf180mcu device name. TWO NMOS flavors for the ΔVth reference: the 3.3V
# standard NMOS is the Vgs=0 source (token `nmos`); the 6V IO NMOS is the diode (higher Vt, token
# `nmos_hv`). Both are in gf180's default stat set (design.ngspice), so no native-device tox gaps.
pdk: gf180mcu
devices:
  nmos:    {model: nfet_03v3}
  nmos_hv: {model: nfet_06v0}
