# Sizing for the sky130 binding — generated by `analog-db add-binding` from the
# ihp-sg13g2 sizing (geometry re-noted to sky130's unit convention + bin-clamped).
# A starting point; re-tune defaults/bounds for sky130 device physics as needed.
schema: spicexplorer/sizing@1
pdk: sky130
variables:
- name: x_dut_xm1_w
  description: Pass device width
  default: 50
  min: 0.42
  max: 200
  unit: m
- name: x_dut_xm1_l
  description: Pass device length
  default: 0.5
  min: 0.42
  max: 10
  unit: m
- name: r_top
  description: Divider top
  default: 100k
  min: 1k
  max: 1Meg
  unit: ohm
- name: r_bot
  description: Divider bottom
  default: 100k
  min: 1k
  max: 1Meg
  unit: ohm
# Frozen per-device literals (P4 atomic sweep): defaults reproduce the authored
# netlist literals exactly; freeze keeps them out of the search space.
- {name: x_dut_xm1_m, description: "XM1 m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
