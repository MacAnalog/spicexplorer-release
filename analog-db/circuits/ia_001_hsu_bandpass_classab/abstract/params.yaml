groups:
- name: pair_xmo2_xmo3
  kind: matched_pair
  members: [XMO2, XMO3]
  tie: [w, l, m]
  description: PMOS input differential pair (structural detection).
- name: pair_xmo4_xmo5
  kind: matched_pair
  members: [XMO4, XMO5]
  tie: [w, l, m]
  description: Stage-1 NMOS diode loads — the symmetric halves of the two mirror references. Ordered before
    the mirror_length groups so the tie chain (xmo6_l -> xmo5_l -> xmo4_l) lowers definitions-before-uses.
- name: mirror_xmo4_l
  kind: mirror_length
  members: [XMO4, XMO8]
  tie: [l]
  description: Diode XMO4 mirrors onto XMO8 (the voutp-branch pull-down) — same L for mirror accuracy
    (structural detection).
- name: mirror_xmo5_l
  kind: mirror_length
  members: [XMO5, XMO6]
  tie: [l]
  description: Diode XMO5 mirrors onto XMO6 (the voutn-branch pull-down) — same L for mirror accuracy
    (structural detection; XMO5's own L rides the pair_xmo4_xmo5 tie).
- name: pair_xmo6_xmo8
  kind: matched_pair
  members: [XMO6, XMO8]
  tie: [w, m]
  description: The two mirror-output sinks — symmetric branch halves; W/m matched, L already tied through
    the mirror_length groups. W(XMO6)/W(XMO4) is the free mirror-gain ratio.
- name: pair_xmo7_xmo9
  kind: shared_geometry
  members: [XMO7, XMO9]
  tie: [w, l, m]
  description: NMOS cascodes (shared gate bias vb3) over the two mirror outputs — sources differ per branch,
    so shared_geometry rather than matched_pair.
- name: pair_xmo10_xmo11
  kind: shared_geometry
  members: [XMO10, XMO11]
  tie: [w, l, m]
  description: PMOS cascodes (shared gate bias vb2) over the two first-stage output branches.
- name: pair_xmo12_xmo13
  kind: matched_pair
  members: [XMO12, XMO13]
  tie: [w, l, m]
  description: Stage-1 PMOS current sources, gates on the shared CMFB servo output vcmfb.
- name: bias_vb1_l
  kind: shared_geometry
  members: [XMO1, XMO14, XMO20]
  tie: [l]
  description: Input-pair tail (XMO1) and the two class-AB battery current sources (XMO14/XMO20) all share
    the vb1 gate bias — same L so their current densities track; W stays free to scale each branch current
    independently.
- name: pair_xmo14_xmo20
  kind: matched_pair
  members: [XMO14, XMO20]
  tie: [w, m]
  description: The two class-AB floating-battery current sources (one per output side); W/m matched, L
    is the bias_vb1_l tie.
- name: pair_xmo15_xmo21
  kind: shared_geometry
  members: [XMO15, XMO21]
  tie: [w, l, m]
  description: Class-AB NMOS level-shift diodes — side-symmetric halves of the floating translinear battery.
- name: pair_xmo16_xmo22
  kind: shared_geometry
  members: [XMO16, XMO22]
  tie: [w, l, m]
  description: NMOS output source followers (pull-up half of each class-AB output).
- name: pair_xmo17_xmo23
  kind: shared_geometry
  members: [XMO17, XMO23]
  tie: [w, l, m]
  description: Class-AB PMOS level-shift diodes — side-symmetric battery halves.
- name: pair_xmo18_xmo24
  kind: shared_geometry
  members: [XMO18, XMO24]
  tie: [w, l, m]
  description: PMOS output source followers (pull-down half of each class-AB output).
- name: pair_xmo19_xmo25
  kind: matched_pair
  members: [XMO19, XMO25]
  tie: [w, l, m]
  description: Second-stage common-source drivers (gates on out1p/out1n) — the symmetric class-AB steering
    devices.
- name: pseudo_r_quad
  kind: shared_geometry
  members: [XM1, XM2, XM3, XM4]
  tie: [w, l, m]
  description: Pseudo-resistor bias quad — all four anti-series diode-connected PMOS share one long-L
    geometry so both summing nodes see the same HPF corner.
- name: pair_cin
  kind: shared_geometry
  members: [CIN1, CIN2]
  tie: [Value]
  description: Input coupling caps — the numerator of the Cin/Cf mid-band gain; matched per side (drawn
    as one shared 1p symbol).
- name: pair_cf
  kind: shared_geometry
  members: [CF1, CF2]
  tie: [Value]
  description: Feedback caps — the denominator of the Cin/Cf mid-band gain.
- name: pair_cc
  kind: shared_geometry
  members: [C1, C2]
  tie: [Value]
  description: Miller compensation caps (drawn as one shared symbol Cc).
- name: pair_rz
  kind: shared_geometry
  members: [R1, R2]
  tie: [Value]
  description: Miller zero resistors — drawn as one shared symbol Rz (an earlier Rz/RZ case collision, fixed at source per DRAWING_REVIEW item 5);
    atomized per instance and tied here.
- name: pair_rm
  kind: shared_geometry
  members: [RMP, RMN]
  tie: [Value]
  description: Resistive output-CM detector halves — matching sets the CM sense error.
