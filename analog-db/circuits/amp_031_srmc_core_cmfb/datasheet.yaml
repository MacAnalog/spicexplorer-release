schema: spicexplorer/datasheet@1
cace_format: '5.2'
default_conditions:
  supply:
    unit: V
    typical: 1.2
  cload:
    unit: fF
    typical: 50
  corner:
    typical: tt
  temp:
    unit: degC
    typical: 27
  vcm:
    unit: V
    typical: 0.5
metrics:
  dc_gain_db:
    display: DC open-loop differential gain
    description: Differential DC gain, vdb(voutp,voutn); complementary-input stage
      into per-side class-A outputs, dual-loop CMFB closed
    unit: dB
    analysis: ac_open_loop
    extract:
      meas: dcgain
    spec:
      min: 50
      unit: dB
  ugf_hz:
    display: Unity-gain frequency
    unit: Hz
    analysis: ac_open_loop
    extract:
      meas: ugf
    spec:
      unit: Hz
      min: 5000000.0
  pm_deg:
    display: Phase margin
    description: "Miller-Rz per side (C1/R1). NOTE: the open-loop response has a Miller\
      \ feedthrough shelf \u2014 the amp is NOT unity-gain stable in unity-beta reuse\
      \ (reuse flag, report \xA73); PM here is at the first 0 dB crossing of the sized\
      \ design"
    unit: deg
    analysis: ac_open_loop
    extract:
      meas: pm
    spec:
      unit: deg
      min: 60.0
      max: 90
  vos:
    display: Output offset
    description: voutp - voutn at matched DC inputs; residual of the dual behavioral
      CMFB servos
    unit: V
    analysis: dc_op
    extract:
      meas: vos
    spec:
      min: -50e-3
      max: 50e-3
      unit: V
  i_supply:
    display: Supply current
    unit: A
    analysis: dc_op
    extract:
      meas: i_supply
    spec:
      max: 150e-6
      unit: A
  cm_kick_v:
    display: CM kick displacement
    description: Settled output-CM displacement under the CM current kick (loop-2
      stiffness)
    unit: V
    analysis: tran_cm_kick
    extract:
      meas: cm_kick_v
    spec:
      min: -50e-3
      max: 50e-3
      unit: V
  cm_resid_v:
    display: CM kick residual
    description: "Output-CM residual after kick release. INDICATIVE, not signed-off\
      \ (amp_025 precedent): the harness records ~68 mV at 380 us \u2014 a slow post-kick\
      \ wander from the STAGE-1 loop (only locally stable with the unclamped ideal\
      \ servo; its weakly-damped CM couples into the output CM). The campaign's isolated\
      \ gear-integrated bench measured loop-2 resid ~0; the committed template (trap)\
      \ plus the coupled loop-1 dynamics dominate here. The band is the target for\
      \ the rail-clamped-servo follow-up"
    unit: V
    analysis: tran_cm_kick
    extract:
      meas: cm_resid_v
    spec:
      min: -20e-3
      max: 20e-3
      unit: V
  t_cm_settle:
    display: CM kick recovery time
    description: INDICATIVE (same loop-1 wander as cm_resid_v; recorded ~346 us)
    unit: s
    analysis: tran_cm_kick
    extract:
      meas: t_cm_settle
    spec:
      max: 100e-6
      unit: s
notes: "Sized by the SpiceXplorer optimizer (scripted Nevergrad 400 + 100-loop banded\
  \ refine; drawings/SIZING_VALIDATION_REPORT.md \xA74 + sizing-and-specs.yaml): the\
  \ drawn seed is UNSTABLE (PM -17.8 deg). Sizing defaults are FULL-PRECISION. CMFB\
  \ polarity is the B5 closure: both plants inverting -> canonical A*(sensed-vref)\
  \ servos on both loops (sim-proven on ihp AND FOUNDRY-n65). Per-PDK biases: VB2 0.70\
  \ (ihp sized) / 0.50 (FOUNDRY-n65 drawn) / 0.35 (FOUNDRY-n65 sized); a FOUNDRY-n65 binding\
  \ must also address the 65nm loop-2 rail-marginality (servo equilibrium below rail;\
  \ achievable CM 0.474 vs ref 0.5 \u2014 report \xA76.1) and expects ~38 dB (LVT\
  \ gm/gds ceiling). Input CM MUST be 0.5 V (0.6 rails the servos through the SRMC\
  \ filter's DC-coupled R path)."
