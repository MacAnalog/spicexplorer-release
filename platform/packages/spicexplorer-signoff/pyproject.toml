[project]
name = "spicexplorer-signoff"
version = "0.0.0"
description = "SpiceXplorer physical signoff — engine-agnostic DRC / LVS / PEX runners with structured verdicts (KLayout PDK decks, kpex 2.5D), post-layout netlist splicing for bench reuse, and parasitic/mismatch injection for layout-sensitivity briefs."
requires-python = ">=3.10"
dependencies = [
    "spicexplorer-core",   # env/eng/paths seams shared across the suite; never a peer tool
    "klayout>=0.30",       # the PDK's run_drc.py / run_lvs.py `import klayout.db` — they run under
                           # THIS interpreter (override with SIGNOFF_PYTHON); also the .lyrdb parser's fallback
]

# NOTE: a leaf tool — depends on spicexplorer-core only. The heavy tools (a `klayout`
# executable, kpex, ngspice, the PDK decks) are DISCOVERED at run time, never imported:
# every runner degrades to a structured "not available" verdict, so this package imports
# and its offline tests pass on a machine with none of them. It MUST NOT import a peer
# tool (`spicexplorer_layout`, the optimizer `spicexplorer`); composition (build → drc →
# lvs → pex → measure per optimizer trial) is done by handing `flow.run_flow` a build
# callable, so this package never imports the generator side.

[project.scripts]
spicexplorer-signoff = "spicexplorer_signoff.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spicexplorer_signoff"]
