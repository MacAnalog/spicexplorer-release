# Sizing for the tsmc-n65 binding — generated by `analog-db add-binding` from the
# ihp-sg13g2 sizing (geometry re-noted to tsmc-n65's unit convention + bin-clamped).
# A starting point; re-tune defaults/bounds for tsmc-n65 device physics as needed.
schema: spicexplorer/sizing@1
pdk: tsmc-n65
variables:
- name: x_dut_xm1_w
  description: NMOS input pair width
  default: 10u
  min: 0.15u
  max: 100u
  unit: m
- name: x_dut_xm1_l
  description: NMOS input pair length
  default: 0.5u
  min: 0.13u
  max: 10u
  unit: m
- name: x_dut_xm3_w
  description: Stage-1 PMOS current-source load width
  default: 10u
  min: 0.15u
  max: 100u
  unit: m
- name: x_dut_xm3_l
  description: Stage-1 load length (long for load gds)
  default: 1u
  min: 0.13u
  max: 10u
  unit: m
- name: x_dut_xm5_w
  description: Stage-2 PMOS driver width
  default: 12u
  min: 0.15u
  max: 100u
  unit: m
- name: x_dut_xm5_l
  description: Stage-2 PMOS driver length
  default: 0.5u
  min: 0.13u
  max: 10u
  unit: m
- name: x_dut_xm6_w
  description: Bias diode width (ref current density)
  default: 2u
  min: 0.15u
  max: 50u
  unit: m
- name: x_dut_xm6_l
  description: Bias diode length (mirror L for tail + sinks)
  default: 1u
  min: 0.13u
  max: 10u
  unit: m
- name: x_dut_xm7_w
  description: Output sink width (mirror ratio vs XM6 sets stage-2 current)
  default: 6u
  min: 0.15u
  max: 100u
  unit: m
- name: x_dut_xm8_w
  description: Tail mirror width (ratio vs XM6 sets the tail current)
  default: 2u
  min: 0.15u
  max: 100u
  unit: m
- name: x_dut_r1_value
  description: Per-side Miller zero-nulling resistor
  default: 2k
  min: 100
  max: 50k
  unit: ohm
- name: x_dut_c1_value
  description: Per-side Miller compensation cap
  default: 1p
  min: 0.05p
  max: 20p
  unit: F
- name: i_bias
  description: "Bias reference current into the XM6 diode (drawn as a 1 mA literal \u2014 re-seeded)"
  default: 20u
  min: 1u
  max: 500u
  unit: A
- name: vbl
  description: "Stage-1 PMOS load gate bias (the drawing's floating net X; knife-edge CM knob; see notes\
    \ \u2014 no interior operating point exists without external CM control)"
  default: 0.71
  min: 0.0
  max: 1.2
  unit: V
- name: x_dut_xm1_m
  description: XM1 m (frozen literal)
  default: 1
  min: 1
  max: 16
  freeze: true
  is_integer: true
- name: x_dut_xm3_m
  description: XM3 m (frozen literal)
  default: 1
  min: 1
  max: 16
  freeze: true
  is_integer: true
- name: x_dut_xm5_m
  description: XM5 m (frozen literal)
  default: 1
  min: 1
  max: 16
  freeze: true
  is_integer: true
- name: x_dut_xm6_m
  description: XM6 m (frozen literal)
  default: 1
  min: 1
  max: 16
  freeze: true
  is_integer: true
- name: x_dut_xm7_m
  description: XM7 m (frozen literal)
  default: 1
  min: 1
  max: 16
  freeze: true
  is_integer: true
- name: x_dut_xm8_m
  description: XM8 m (frozen literal)
  default: 1
  min: 1
  max: 16
  freeze: true
  is_integer: true
