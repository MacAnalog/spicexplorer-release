# Analysis binding (plan D-4). Validated against _shared/schema/analysis.schema.json.
# Binds the amplifier-class ac_open_loop_diff template (differential output, self-biased —
# the macromodel is supply-less, so the bench's rails are simply unused).
schema: spicexplorer/analysis@1
id: ac_open_loop
template: ac_open_loop_diff
description: "Open-loop differential AC gain for dc_gain_db, ugf_hz."
params:
  FSTART: 10
  FSTOP: 1G
  PPD: 101
  CL: 50f
  VCM: 0.6
  VDD: 1.2
flags: []
produces: [dc_gain_db, ugf_hz]
