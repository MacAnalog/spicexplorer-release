# Sizing for the tsmc-n65 binding — generated by `analog-db add-binding` from the
# ihp-sg13g2 sizing (geometry re-noted to tsmc-n65's unit convention + bin-clamped).
# A starting point; re-tune defaults/bounds for tsmc-n65 device physics as needed.
schema: spicexplorer/sizing@1
pdk: tsmc-n65
variables:
- name: x_dut_xm1_w
  description: PMOS tail current-source width (gate vb4)
  default: 5.629u
  min: 0.15u
  max: 100u
  unit: m
- name: x_dut_xm1_l
  description: 'vb4 PMOS current-source length (shared: tail + fold + output sources)'
  default: 1u
  min: 0.13u
  max: 10u
  unit: m
- name: x_dut_xm2_w
  description: PMOS input pair width
  default: 4.933u
  min: 0.15u
  max: 200u
  unit: m
- name: x_dut_xm2_l
  description: PMOS input pair length
  default: 0.5u
  min: 0.13u
  max: 10u
  unit: m
- name: x_dut_xm4_w
  description: First-stage NMOS fold-sink width (gate vb1)
  default: 2.51u
  min: 0.15u
  max: 100u
  unit: m
- name: x_dut_xm4_l
  description: First-stage NMOS fold-sink length
  default: 1u
  min: 0.13u
  max: 10u
  unit: m
- name: x_dut_xm6_w
