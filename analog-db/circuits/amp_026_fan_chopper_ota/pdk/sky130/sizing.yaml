  default: 2
  min: 0.42
  max: 50
  unit: m
- name: x_dut_xm16_l
  description: Chopper TG NMOS pass-device length (all 4 legs)
  default: 0.15
  min: 0.15
  max: 5
  unit: m
- name: x_dut_xm17_w
  description: Chopper TG PMOS pass-device width (all 4 legs)
  default: 2
  min: 0.42
  max: 50
  unit: m
- name: x_dut_xm17_l
  description: Chopper TG PMOS pass-device length (all 4 legs)
  default: 0.15
  min: 0.15
  max: 5
  unit: m
- name: x_dut_cm1_value
  description: Per-side Miller compensation cap (pair tied; drawn 1p was an unedited default)
  default: 3p
  min: 0.05p
  max: 20p
  unit: F
- name: vb1
  description: "First-stage NMOS fold-sink gate bias (knife-edge \u2014 no CMFB, sets the stage-1
    output CM; re-tuned for sky130 vth at the 1.8 V re-bias, interior window is ~0.1 mV wide)"
  default: 0.697441489
  min: 0.0
  max: 1.8
  unit: V
