# Sizing for the gf180mcu binding — generated by `analog-db add-binding` from the
# ihp-sg13g2 sizing (geometry re-noted to gf180mcu's unit convention + bin-clamped).
# A starting point; re-tune defaults/bounds for gf180mcu device physics as needed.
schema: spicexplorer/sizing@1
pdk: gf180mcu
variables:
- name: x_dut_xmp_w
  description: Input-pair width
  default: 12u
  min: 0.22u
  max: 30u
  unit: m
- name: x_dut_xmp_l
  description: Input-pair length
  default: 0.3u
  min: 0.28u
  max: 10u
  unit: m
- name: x_dut_rp_value
  description: Load resistor (ohms)
  default: 22000
  min: 1000
  max: 500000
  unit: ohm
- name: x_dut_xmt_w
  description: Tail mirror-out width
  default: 24u
  min: 0.22u
  max: 40u
  unit: m
- name: x_dut_xmr_l
  description: Mirror length (tail+ref)
  default: 0.3u
  min: 0.28u
  max: 10u
  unit: m
- name: x_dut_xmt_m
  description: Tail multiplier
  default: 1
  is_integer: true
- name: x_dut_xmr_w
  description: Mirror-reference width
  default: 24u
  min: 0.22u
  max: 40u
  unit: m
# Frozen per-device literals (P4 atomic sweep): defaults reproduce the authored
# netlist literals exactly; freeze keeps them out of the search space.
- {name: x_dut_xmp_m, description: "XMP m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
- {name: x_dut_xmn_m, description: "XMN m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
- {name: x_dut_xmr_m, description: "XMR m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
