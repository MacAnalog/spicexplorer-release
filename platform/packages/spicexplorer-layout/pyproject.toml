[project]
name = "spicexplorer-layout"
version = "0.0.0"
description = "SpiceXplorer layout generation — parameterized, generator-produced analog layouts (gdsfactory + a node PDK): a generator-module contract (LayoutParams + build), a deterministic build → GDS step with hash/area, matching-pattern helpers (mirror pairs, interdigitation, common-centroid orders, dummies) and a headless render."
requires-python = ">=3.10"
dependencies = [
    "spicexplorer-core",   # env/eng/paths seams shared across the suite; never a peer tool
    "pyyaml>=6.0",         # review files, the iterations log, cli validate-review, em tech/sim specs
    "pillow",              # review.annotate + iterations.diff_png PNG renders
    "scipy>=1.11",         # rail: connected-component label + sparse sheet-resistance solve
]

[project.optional-dependencies]
# The generation stack is heavy (gdsfactory pulls kfactory + klayout wheels) and only needed
# on a machine that draws layout, so it is OPT-IN: `uv sync --extra gds` (or the ai_env conda
# env on the research server, which already has all three). Everything else in this package
# — the generator contract, pattern orders, the loader — imports without it and its offline
# tests run without it.
gds = [
    "gdsfactory>=9; python_version >= '3.11'",
    "ihp-gdsfactory>=0.2.7; python_version >= '3.11'",
    "klayout>=0.30.12",
]

# EM verification lane (spicexplorer_layout.em): net cutting needs `gds`; the
# touchstone -> SPICE-subckt exporter needs scikit-rf. The openEMS solver itself
# is a from-source install (no wheel) and is NOT a dependency — em_sparams()
# raises with the build-recipe pointer when it is absent.
em = [
    # <2.0 is forced by the gds extra: ihp-gdsfactory 2.0 -> gplugins[sax]>=2.1 -> scikit-rf<2.0.
    # A scikit-rf 2.x bump silently downgrades ihp-gdsfactory to 0.2.8 (dependabot #123); lift the
    # cap only when gplugins allows 2.x. Our own use (Network, VectorFitting) runs on 2.1 unchanged.
    "scikit-rf>=1.0,<2.0",
]

# NOTE: a leaf tool — spicexplorer-core is its only SpiceXplorer dependency (pyyaml, pillow
# and scipy above are third-party). It MUST NOT import a peer tool
# (`spicexplorer_signoff`, the optimizer `spicexplorer`). Composition (build → drc → lvs →
# pex → measure) is done by handing `spicexplorer_signoff.run_flow` a `GdsBuilder` from here.

[project.scripts]
spicexplorer-layout = "spicexplorer_layout.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spicexplorer_layout"]
