# Sizing for the ihp-sg13g2 binding — generated by `analog-db add-binding` from the
# gf180mcu sizing (geometry re-noted to ihp-sg13g2's unit convention + bin-clamped).
# A starting point; re-tune defaults/bounds for ihp-sg13g2 device physics as needed.
# HAND-FIXED after generation: the gf180 source stores geometry defaults in RAW METERS
# (6.8542e-05), which the converter misread as µm and clamped to the bin floor
# (0.18u/0.13u). Defaults below are the gf180 landed values re-noted to explicit µm.
schema: spicexplorer/sizing@1
pdk: ihp-sg13g2
variables:
- name: x_dut_xmbp_w
  default: 5.578670789917222e-06
  min: 2u
  max: 64u
  unit: m
  description: On-chip reference PMOS (diode-connected, vdd->ibias). PRIMARY power/PSRR trade knob.
- name: x_dut_xmbp_l
  default: 4.652399317553778e-06
  min: 0.5u
  max: 10u
  unit: m
  description: Reference PMOS length; longer = lower current, better matching.
- name: x_dut_xmb0_w
  default: 8.276833786204537e-05
  min: 2u
  max: 100u
  unit: m
  description: Bias-mirror NMOS unit
- name: x_dut_xmb0_l
  default: 3.15070605280647e-06
  min: 0.5u
  max: 10u
  unit: m
- name: x_dut_xmbc_m
  default: 1
  is_integer: true
  min: 1
  max: 8
  description: Tail mirror multiplicity
- name: x_dut_xmbo_m
  default: 1
  is_integer: true
  min: 1
  max: 8
  description: Output sink multiplicity
- name: x_dut_xm1_w
  default: 6.400316047920548e-05
  min: 4u
  max: 100u
  unit: m
  description: Input pair
- name: x_dut_xm1_l
  default: 5.758061070605141e-07
  min: 0.28u
  max: 10u
  unit: m
- name: x_dut_xm3_w
  default: 2.269768753572863e-05
  min: 4u
  max: 100u
  unit: m
  description: Level-shifted PMOS mirror (M3m/M5)
- name: x_dut_xm3_l
  default: 4.103599384216178e-06
  min: 0.28u
  max: 10u
  unit: m
- name: x_dut_xm4_w
  default: 4.622984258189675e-05
  min: 2u
  max: 100u
  unit: m
  description: M4 compound-diode level shifter (~zero DC current by design)
- name: x_dut_xm4_l
  default: 7.560584329408141e-06
  min: 0.28u
  max: 10u
  unit: m
- name: x_dut_xm6_w
  default: 1.0646593948046076e-05
  min: 8u
  max: 100u
  unit: m
  description: M6 output PMOS
- name: x_dut_xm6_l
  default: 1.3958157250351549e-06
  min: 0.28u
  max: 10u
  unit: m
- name: r_z
  default: 35759.18207181488
  min: 100
  max: 50k
  unit: ohm
  description: Nulling resistor (Miller compensation)
- name: c_comp
  default: 5.3161930814325235e-12
  min: 0.2p
  max: 20p
  unit: F
  description: Miller capacitor
- name: x_dut_xmbf_w
  default: 3.1866222602286976e-06
  min: 1u
  max: 40u
  unit: m
  description: M_mirror_f sink (level-shifter anchor; carries ~0 by design)
- name: r_nd
  default: 9882082.54892156
  min: 10k
  max: 10MEG
  unit: ohm
  description: "Level-shifted-mirror gate-rail tie na->nd (DC-defines nd; ~0 current \u2014 fix 2026-07-25,\
    \ see abstract netlist)"

# Per-PDK re-bias (platform convention: analyses params are the AUTHORED operating point;
# per-PDK deltas live here). amp_032 is authored on gf180mcu's 3.3 V / 6V-device rail
# (VDD 3.3, VCM 1.2). ihp-sg13g2 is a 1.5 V lv kit, so the authored rail would badly
# overdrive sg13_lv devices. Re-biased to the registry rail; VCM picked by a coarse
# dc sweep of the bias-wrapped op point (see the port session note in the PR).
analysis_params:
  VDD: 1.5
  VCM: 0.75
