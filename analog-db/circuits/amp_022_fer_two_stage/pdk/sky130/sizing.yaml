# Sizing for the sky130 binding — geometry re-noted to sky130's bare-µm convention
# (.option scale=1u) and clamped to the sky130 W/L bin floor (min_w 0.42, min_l 0.15).
# Same m-ratios as the ihp binding; the cap value stays in farads.
# Keyed on the FREE atomic symbols after default tying (abstract/params.yaml, plan D-4): tied
# members come from the generated tie block. Defaults reproduce the pre-atomic knobs exactly:
# the legacy x_n_l is now THREE independent L knobs and x_p_l TWO, all still 0.4.
schema: spicexplorer/sizing@1
pdk: sky130
variables:
  - {name: x_dut_xmbd_w, description: "NMOS bias diode/mirror width (XMBD; XMBS tied)", default: 4, min: 0.42, max: 100, unit: m}
  - {name: x_dut_xm7_w,  description: "PMOS bias/tail/load width per finger (XM7; XM5/XM6 tied)", default: 8, min: 0.42, max: 100, unit: m}
  - {name: x_dut_xm0_w,  description: "PMOS input pair width per finger (XM0; XM1 tied, m=5)", default: 8, min: 0.42, max: 100, unit: m}
  - {name: x_dut_xm3_w,  description: "NMOS mirror/CS width per finger (XM3; XM4/XM2 tied)", default: 6, min: 0.42, max: 100, unit: m}
  - {name: x_dut_xm7_l,  description: "PMOS bias-mirror length (XM7; XM5/XM6 tied; legacy x_p_l)", default: 0.4, min: 0.15, max: 20, unit: m}
  - {name: x_dut_xm0_l,  description: "PMOS input pair length (XM0; XM1 tied; legacy x_p_l)", default: 0.4, min: 0.15, max: 20, unit: m}
  - {name: x_dut_xm3_l,  description: "NMOS load-mirror length (XM3; XM4 tied; legacy x_n_l)", default: 0.4, min: 0.15, max: 20, unit: m}
  - {name: x_dut_xm2_l,  description: "NMOS 2nd-stage CS length (legacy x_n_l, now free)", default: 0.4, min: 0.15, max: 20, unit: m}
  - {name: x_dut_xmbd_l, description: "NMOS bias-diode length (XMBD; XMBS tied; legacy x_n_l)", default: 0.4, min: 0.15, max: 20, unit: m}
  - {name: x_dut_cc_value, description: "Miller compensation cap (F)", default: 2e-12, min: 2e-13, max: 1e-11, unit: F}
  - {name: x_dut_xm0_m,  description: "Input pair fingers (frozen; XM1 tied)", default: 5, min: 1, max: 16, freeze: true, is_integer: true}
  - {name: x_dut_xm3_m,  description: "Load-mirror unit fingers (frozen; XM4 via 1:1 ratio)", default: 2, min: 1, max: 16, freeze: true, is_integer: true}
  - {name: x_dut_xm2_m,  description: "2nd-stage CS fingers (frozen; legacy m=24)", default: 24, min: 1, max: 32, freeze: true, is_integer: true}
  - {name: x_dut_xm7_m,  description: "Bias-diode fingers (frozen; XM5 1:1, XM6 17/3 ratios)", default: 3, min: 1, max: 16, freeze: true, is_integer: true}
  - {name: x_dut_xmbd_m, description: "Bias front-end fingers (frozen; XMBS via 1:1 ratio)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
