# AnalogGym analysis binding (noise).
# Band standardized 2026-08-01 (campaign): FSTART 1k -> 1 Hz so the paper's noise column
# is one uniform condition — TOTAL integrated input-referred rms noise, 1 Hz..1 MHz,
# CL = 10p (ngspice inoise_total is already volts rms integrated over the swept band).
schema: spicexplorer/analysis@1
id: noise
template: noise_biaswrap
description: "Input-referred noise via the AnalogGym self-bias bias-wrap (Lfb/Cin)."
enabled: true
params: {VDD: 1.8, VCM: 300m, CL: 10p, FSTART: 1, FSTOP: 1MEG, PPD: 50}
flags: []
produces: [vn_in_integrated]
