# Sizing for the tsmc-n65 binding — generated by `analog-db add-binding` from the
# sky130 sizing (geometry re-noted to tsmc-n65's unit convention + bin-clamped).
# A starting point; re-tune defaults/bounds for tsmc-n65 device physics as needed.
# W/L min-bounds lowered from the sky130-inherited floors to the CRN65 process floor
# (min_w 0.12u, min_l 0.06u); defaults kept (0.4u L gives usable intrinsic gain per stage).
# Keyed on the FREE atomic symbols after default tying (abstract/params.yaml, plan D-4): tied
# members come from the generated tie block. Defaults reproduce the pre-atomic knobs exactly:
# the legacy x_n_l is now THREE independent L knobs and x_p_l TWO, all still 0.4u.
schema: spicexplorer/sizing@1
pdk: tsmc-n65
variables:
  - {name: x_dut_xmbd_w, description: "NMOS bias diode/mirror width (XMBD; XMBS tied)", default: 4u, min: 0.12u, max: 100u, unit: m}
  - {name: x_dut_xm7_w,  description: "PMOS bias/tail/load width per finger (XM7; XM5/XM6 tied)", default: 8u, min: 0.12u, max: 100u, unit: m}
  - {name: x_dut_xm0_w,  description: "PMOS input pair width per finger (XM0; XM1 tied, m=5)", default: 8u, min: 0.12u, max: 100u, unit: m}
  - {name: x_dut_xm3_w,  description: "NMOS mirror/CS width per finger (XM3; XM4/XM2 tied)", default: 6u, min: 0.12u, max: 100u, unit: m}
  - {name: x_dut_xm7_l,  description: "PMOS bias-mirror length (XM7; XM5/XM6 tied; legacy x_p_l)", default: 0.4u, min: 0.06u, max: 20u, unit: m}
  - {name: x_dut_xm0_l,  description: "PMOS input pair length (XM0; XM1 tied; legacy x_p_l)", default: 0.4u, min: 0.06u, max: 20u, unit: m}
  - {name: x_dut_xm3_l,  description: "NMOS load-mirror length (XM3; XM4 tied; legacy x_n_l)", default: 0.4u, min: 0.06u, max: 20u, unit: m}
  - {name: x_dut_xm2_l,  description: "NMOS 2nd-stage CS length (legacy x_n_l, now free)", default: 0.4u, min: 0.06u, max: 20u, unit: m}
  - {name: x_dut_xmbd_l, description: "NMOS bias-diode length (XMBD; XMBS tied; legacy x_n_l)", default: 0.4u, min: 0.06u, max: 20u, unit: m}
  - {name: x_dut_cc_value, description: "Miller compensation cap (F)", default: 2e-12, min: 2e-13, max: 1e-11, unit: F}
  - {name: x_dut_xm0_m,  description: "Input pair fingers (frozen; XM1 tied)", default: 5, min: 1, max: 16, freeze: true, is_integer: true}
  - {name: x_dut_xm3_m,  description: "Load-mirror unit fingers (frozen; XM4 via 1:1 ratio)", default: 2, min: 1, max: 16, freeze: true, is_integer: true}
  - {name: x_dut_xm2_m,  description: "2nd-stage CS fingers (frozen; legacy m=24)", default: 24, min: 1, max: 32, freeze: true, is_integer: true}
  - {name: x_dut_xm7_m,  description: "Bias-diode fingers (frozen; XM5 1:1, XM6 17/3 ratios)", default: 3, min: 1, max: 16, freeze: true, is_integer: true}
  - {name: x_dut_xmbd_m, description: "Bias front-end fingers (frozen; XMBS via 1:1 ratio)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
# Per-PDK bench re-bias (tb-validation 2026-07-09): bake the tsmc-n65 1.2 V core rail into
# the rendered decks (the platform's closed-lane supply override then confirms rather than
# corrects); VCM 0.6 is mid-rail at 1.2 V and inside the live tracking band [~0.1, 1.17] V.
analysis_params:
  VDD: 1.2
