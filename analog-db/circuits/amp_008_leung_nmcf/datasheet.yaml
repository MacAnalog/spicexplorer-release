schema: spicexplorer/datasheet@1
default_conditions:
  supply:
    unit: V
    typical: 1.8
  corner:
    typical: tt
  temp:
    unit: degC
    typical: 27
  cload:
    unit: F
    typical: 1e-11
  vcm:
    unit: V
    typical: 0.3
  ibias:
    unit: A
    typical: 1.9999999999999998e-05
metrics:
  dc_gain_db:
    display: DC open-loop gain
    unit: dB
    analysis: ac_open_loop
    extract:
      meas: dcgain
    spec:
      min: 100
      unit: dB
  ugf_hz:
    display: Unity-gain frequency
    unit: Hz
    analysis: ac_open_loop
    extract:
      meas: ugf
    spec:
      unit: Hz
      min: 2000000.0
  pm_deg:
    display: Phase margin
    unit: deg
    analysis: ac_open_loop
    extract:
      meas: pm
    spec:
      unit: deg
      min: 60.0
      max: 90.0
  vn_in_integrated:
    display: Input-referred noise (total, 1 Hz - 1 MHz)
    description: Total integrated input-referred rms noise over the standardized
      1 Hz - 1 MHz band, unity-buffer bias config, CL = 10p. ngspice inoise_total
      is already volts rms integrated over the swept band (replaces the old vn_in
      entry that mapped the same measure under the dimensionally wrong V/sqrt(Hz)).
    unit: V
    analysis: noise
    extract:
      meas: inoise_total
  i_supply:
    display: Supply current
    unit: A
    analysis: dc_op
    extract:
      meas: i_supply
    spec:
      max: 0.00555556
  t_settle:
    display: Settling time
    unit: s
    analysis: tran_step
    extract:
      meas: t_settle
    spec:
      max: 1.0e-06
      unit: s
  psrr_vdd_db:
    display: Positive-supply rejection
    description: PSRR+ in the unity-buffer config, DC-band floor (design-review 2026-07-05
      rollout).
    unit: dB
    analysis: psrr_vdd
    extract:
      meas: psrr_vdd_db
    spec:
      unit: dB
      min: 40.0
  cmrr_db:
    display: Common-mode rejection
    description: CMRR in the unity-buffer config, DC-band floor (design-review 2026-07-05
      rollout).
    unit: dB
    analysis: cmrr_vcm
    extract:
      meas: cmrr_db
    spec:
      min: 40
      unit: dB
  thd_pct:
    display: Total harmonic distortion (50 mV @ 100 kHz, buffer)
    description: tran+FFT on ngspice; native PSS harmonics on Spectre. F0 = 100 kHz
      per the campaign grid (fresh ugf 3.16 MHz @ ihp tt sits in the 3-30 MHz band,
      so the 1 MHz grid divides by 10); ASIG = 50 mV, the low-swing-core drive (VCM
      0.3 V near vss — the 100 mV default fails the drive-halving slope check); see
      analyses/thd.yaml.
    unit: '%'
    analysis: thd
    extract:
      meas: thd_pct
      f0: 0.1e6
    spec:
      max: 2.0
      unit: '%'
  iip3_dbv:
    display: Input IP3 (two-tone 90/100 kHz, 6.25 mV/tone, buffer)
    description: Single-point IM3 extrapolation; tran+coherent DFT on ngspice, native
      PSS on Spectre. Tones on the campaign /10 grid (fresh ugf 3.16 MHz @ ihp tt);
      ampl_in below MUST track the analysis binding's ASIG (it is the intercept's
      input reference); see analyses/iip3.yaml.
    unit: dBV
    analysis: iip3
    extract:
      meas: iip3_dbv
      f1: 0.09e6
      f2: 0.1e6
      ampl_in: 0.00625
    spec:
      min: -10
      unit: dBV
  pm_loop_deg:
    display: Phase margin (loop probe)
    description: Middlebrook-injection stb probe of the unity buffer — same loop the
      ac_open_loop pm_deg measures by the biaswrap route (spec min matches pm_deg's).
      -999 sentinel = no 0 dB crossing measured (fails the min spec by design).
    unit: deg
    analysis: stb
    extract:
      meas: pm_loop
    spec:
      min: 60.0
      unit: deg
  loopgain_db:
    display: Low-frequency loop gain (stb)
    unit: dB
    analysis: stb
    extract:
      meas: loopgain_db
  ugf_loop_hz:
    display: Loop unity-gain crossover (stb)
    unit: Hz
    analysis: stb
    extract:
      meas: ugf_loop
  gm_loop_db:
    display: Gain margin (stb)
    description: Gain margin at the -180 deg loop-phase crossing; -999 sentinel =
      the loop phase never reaches -180 deg inside the swept band (no in-band gain
      margin to measure).
    unit: dB
    analysis: stb
    extract:
      meas: gm_loop
