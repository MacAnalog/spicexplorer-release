# Analysis binding (plan D-4): dc_op_diff template — operating point + supply current +
# output offset. Both are trivially ~0 for the behavioral macromodel (no supply draw,
# perfectly symmetric VCCS) — the bands guard the harness wiring.
schema: spicexplorer/analysis@1
id: dc_op
template: dc_op_diff
description: "DC operating point; i_supply (ideally 0) + vos (output offset)."
params:
  VDD: 1.2
  VCM: 0.6
flags: []
produces: [i_supply, vos]
