schema: spicexplorer/analysis@1
id: noise
template: noise
description: "Input-referred noise."
# Band standardized 1 Hz - 1 MHz (2026-08-01): the paper's noise column is ONE uniform
# condition — total integrated input-referred noise, 1 Hz..1 MHz, unity/closed-loop bias
# config, CL = 10p — so every circuit's inoise_total integrates the same band (was 1k..100MEG).
params: {VDD: 1.8, VCM: 0.9, IBIAS: -34u, CL: 10p, FSTART: 1, FSTOP: 1MEG, PPD: 101}
flags: []
produces: [vn_in_integrated]
