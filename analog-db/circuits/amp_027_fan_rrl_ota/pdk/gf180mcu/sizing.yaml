# Re-bias for the gf180mcu binding (authored analyses run VDD=1.2/VCM=0.6 — the ihp rail;
# the 03v3 devices with Vth ~0.7-0.8 barely bias there). Run at the native 3.3 V rail.
# Coarse dc sweep at 3.3 V (vb1=1.1 vb2=1.2 vb3=2.2 vb4=1.65): CMFB regulates vocm~1.58
# flat over VCM 0.1-2.0 (i_supply ~51 uA; railed above ~2.9); 1.2 keeps the tail deep
# interior (VSD~0.9) and the input pair saturated (VSD~0.15). vb1..vb4 defaults re-tuned
# above to match.
analysis_params:
  VDD: 3.3
  VCM: 1.2
