# Sizing for the sky130 binding — generated by `analog-db add-binding` from the
# ihp-sg13g2 sizing (geometry re-noted to sky130's unit convention + bin-clamped).
# A starting point; re-tune defaults/bounds for sky130 device physics as needed.
schema: spicexplorer/sizing@1
pdk: sky130
variables:
- name: x_dut_xmp_w
  description: Pass PMOS per-device width (<=bin max)
  default: 10
  min: 1
  max: 100
  unit: m
- name: x_dut_xmp_m
  description: Pass PMOS parallel multiplier (total W = x_dut_xmp_w*x_dut_xmp_m)
  default: 100
  min: 1
  max: 200
  unit: count
  is_integer: true
- name: x_dut_xmp_l
  description: Pass PMOS length
  default: 0.42
  min: 0.42
  max: 2
  unit: m
- name: r_top
  description: Divider top
  default: 100k
  min: 1k
  max: 10Meg
  unit: ohm
- name: r_bot
  description: Divider bottom
  default: 100k
  min: 1k
  max: 10Meg
  unit: ohm
- name: vref_val
  description: Internal reference voltage
  default: 0.645
  min: 0.3
  max: 1.2
  unit: V
- name: i_tail
  description: Error-amp tail bias current
  default: 200u
  min: 1u
  max: 500u
  unit: A
- name: x_dut_xm1_w
  description: Error-amp input pair width
  default: 42
  min: 0.42
  max: 50
  unit: m
- name: x_dut_xm1_l
  description: Error-amp input pair length
  default: 1
  min: 0.42
  max: 10
  unit: m
- name: x_dut_xm3_w
  description: Error-amp PMOS load width
  default: 45
  min: 0.42
  max: 50
  unit: m
- name: x_dut_xm3_l
  description: Error-amp PMOS load length
  default: 0.5
  min: 0.42
  max: 10
  unit: m
