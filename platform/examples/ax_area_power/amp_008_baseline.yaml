# Ax-revival + area/power demo — SECOND topology, gain/ugf/pm only (no area/power pressure).
#
# amp_008_leung_nmcf is a THREE-stage nested-Miller (NMCF) op-amp — a wider search space than the
# two-stage amp_020 (7 sized device groups × {w,l} + the bias current = 15 free knobs vs amp_020's
# ~13), so it exercises the revived Ax backend + the shared scoring path on a harder problem.
# Same raw-deck driving convention as amp_020: `dcgain`/`ugf`/`pm` are bare-name reads of the
# ac_open_loop deck's ngspice `.meas` results.
#
# `optimizer_config.type` selects the engine (nevergrad | bayesian_ax); the run script sweeps both.
project:
  name: amp_008 baseline
  description: Three-stage NMCF op-amp (amp_008_leung_nmcf) — gain/ugf/pm only, no area/power
  simulator: ngspice
  save_sim: false
  parallel_sim: true
  ws_root: ../analog-db/raw/amp_008_leung_nmcf/ihp-sg13g2
  netlist: ac_open_loop.spice
  outdir: scratch
  tech_spec:
    name: ihp-sg13g2
    constraints: {}
  dut_params:
  # 7 free device groups (the untied sizing knobs from sizing.yaml); each drives a family of
  # ratio-tied siblings in the deck. m-counts stay frozen at the deck default (integer bins).
  - {name: x_dut_xm7_w,  min_val: 5.0e-07, max_val: 2.0e-06}
  - {name: x_dut_xm7_l,  min_val: 3.0e-07, max_val: 1.5e-06}
  - {name: x_dut_xm9_w,  min_val: 5.0e-07, max_val: 2.0e-06}
  - {name: x_dut_xm9_l,  min_val: 3.0e-07, max_val: 1.5e-06}
  - {name: x_dut_xm10_w, min_val: 5.0e-07, max_val: 2.0e-06}
  - {name: x_dut_xm10_l, min_val: 3.0e-07, max_val: 1.5e-06}
  - {name: x_dut_xm11_w, min_val: 5.0e-07, max_val: 2.0e-06}
  - {name: x_dut_xm11_l, min_val: 3.0e-07, max_val: 1.5e-06}
  - {name: x_dut_xm14_w, min_val: 5.0e-07, max_val: 2.0e-06}
  - {name: x_dut_xm14_l, min_val: 3.0e-07, max_val: 1.5e-06}
  - {name: x_dut_xm21_w, min_val: 5.0e-07, max_val: 2.0e-06}
  - {name: x_dut_xm21_l, min_val: 3.0e-07, max_val: 1.5e-06}
  - {name: x_dut_xm23_w, min_val: 5.0e-07, max_val: 2.0e-06}
  - {name: x_dut_xm23_l, min_val: 3.0e-07, max_val: 1.5e-06}
  # bias current (searched)
  - {name: CURRENT_0_BIAS, min_val: 1.0e-05, max_val: 4.0e-05}
  testbenches:
  - name: ac_open_loop
    params: []
    netlist: ac_open_loop.spice
    enable: true
    description: 'raw deck: ac_open_loop (open-loop gain in closed-loop bias)'
  optimizer_config:
    type: nevergrad
    random_seed: 48
    budget: 15
    name: NGOpt
    lin_variable_bounds: {min: 0, max: 100}
    log_variable_bounds: {min: 1, max: 100}
    target_specs:
    - name: dcgain
      testbench: ac_open_loop
      sim_type: ac
      goal: exceed
      target: 40
      range: 40
      tolerance: 1
      weight: 1.0
      reward_type: log
      enable: true
    - name: ugf
      testbench: ac_open_loop
      sim_type: ac
      goal: exceed
      target: 1000000.0
      range: 10000000.0
      tolerance: 100000.0
      weight: 1.0
      reward_type: log
      enable: true
    - name: pm
      testbench: ac_open_loop
      sim_type: ac
      goal: exact
      target: 60
      range: 45
      tolerance: 10
      weight: 1.0
      reward_type: none
      enable: true
