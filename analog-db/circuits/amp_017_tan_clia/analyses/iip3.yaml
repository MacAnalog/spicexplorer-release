# Analysis binding for the self-biased CLIA 3-stage OTA (no ibias port) — uses the class's
# ibias-free template variant so no external current source is left driving a dangling node.
# Two-tone IIP3 in the unity buffer: 6.25 mV tones at 90/100 kHz share the F0 = gcd = 10 kHz
# fundamental (n1=9, n2=10), so the IM3 products at 80/110 kHz (bins 8/11) and the IM5
# products at 70/120 kHz (bins 7/12) land on exact F0 bins — the in-deck coherent DFT then
# has no leakage. TONE GRID: fresh ac_open_loop @ gf180mcu tt (2026-08-01, landed sizing)
# reads ugf = 5.94 MHz (3-30 MHz band) -> the campaign grid divided by 10.
# COHERENT WINDOW: TSTART = 4m = 40 WHOLE beat periods (1/F0 = 100 us) >= 20x the fresh
# tran_step t_settle read (198.98 us -> 3.98 ms); TSTOP-TSTART = 2m = 20 beat periods;
# TSTEP = 50n <= 1/(200*F2). NOTE the t_settle read itself is an oscillation artifact
# (tcross pinned at the tran_step window end) — the closed loop at this sizing RINGS; see
# datasheet.yaml iip3_dbv.
# DRIVE: ASIG = 6.25 mV per tone — the class default (compression bounds the intercept
# above, the deck's own floor below; see the iip3 template header's measured valid-window
# sweep). Plain decimal (0.00625), never a SPICE suffix — ASIG/F0/F1/F2 reach .control
# arithmetic.
# PILOT @ gf180mcu tt (2026-08-01, landed sizing): iip3_dbv = -31.2 dBV with a_im3l =
# 631 uV only ~6 dB above a_floor = 316 uV (trust check wants >= 20 dB), im5_im3_db =
# -6.8 (IM5 nearly as large as IM3 — no power-series slope), gain_tone = 1.96 (loop
# peaking, outside (0.5,1]) and iip3_comp_db = 9.9 dB — the UNSTABLE unity-gain loop
# (stb pm_loop -73.6 deg) dominates every bin, so this is NOT a valid intercept; the
# failure is the CIRCUIT at the landed sizing, not this binding. Honest values kept;
# see datasheet.yaml iip3_dbv.
schema: spicexplorer/analysis@1
id: iip3
template: iip3_selfbias
description: "IIP3 — two-tone intermodulation intercept; tran+coherent DFT (ngspice) / native PSS (Spectre)."
params: {VDD: 1.8, VCM: 300m, CL: 10p, ASIG: 0.00625, F0: 0.01e6, F1: 0.09e6, F2: 0.1e6, TSTEP: 50n, TSTART: 4m, TSTOP: 6m}
flags: []
produces: [iip3_dbv]
