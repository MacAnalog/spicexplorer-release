# AnalogGym design variables (role-encoded, upstream LDO_variables.txt defaults). W/L in um,
# M integer; the netlist scales them (e.g. m='4*<M>'). Passives/sources in SI units.
schema: spicexplorer/sizing@1
pdk: sky130
variables:
- name: x_dut_xm0_w
  default: '5'
- name: x_dut_xm0_l
  default: '1'
- name: x_dut_xm0_m
  default: '3'
- name: x_dut_xm8_w
  default: '5.5'
- name: x_dut_xm8_l
  default: '4'
- name: x_dut_xm8_m
  default: '8'
- name: x_dut_xm10_w
  default: '8'
- name: x_dut_xm10_l
  default: '1'
- name: x_dut_xm10_m
  default: '7'
- name: x_dut_xm11_w
  default: '9'
- name: x_dut_xm11_l
  default: '0.15'
- name: x_dut_xm11_m
  default: '928'
- name: x_dut_xm14_w
  default: '1.5'
- name: x_dut_xm14_l
  default: '4'
- name: x_dut_xm14_m
  default: '10'
- name: x_dut_xm22_w
  default: '6'
- name: x_dut_xm22_l
  default: '2'
- name: x_dut_xm22_m
  default: '8'
- name: r_top
  default: 300k
  description: "Upstream r1 (fixed 300e3) — sets vout = vref*(r_top+r_bot)/r_bot = 4*vref"
- name: r_bot
  default: 100k
- name: c_comp
  default: 6.8p
  description: "Upstream mim XC0, M_C0=34 units of ~200 fF (10x10 um mim)"
- name: vref_val
  default: 0.4
  description: "Upstream TB Vref = 0.4 V -> vout target 1.6 V at the 1.8 V rail"
- name: i_bias
  default: 1.5u
  description: "Upstream current_0_bias"
