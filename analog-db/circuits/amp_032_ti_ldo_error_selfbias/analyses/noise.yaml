# Analysis binding for the SELF-BIASED error amp (no ibias port) — uses the class's
# ibias-free template variant so no external current source is left driving a dangling node.
schema: spicexplorer/analysis@1
id: noise
template: noise_biaswrap
description: "Input-referred noise over the audio-to-GBW band (closed-loop bias)."
params: {VDD: 3.3, VCM: 1.2, CL: 10p, FSTART: 10, FSTOP: 100MEG, PPD: 21}
flags: []
produces: [inoise_total, onoise_total]
