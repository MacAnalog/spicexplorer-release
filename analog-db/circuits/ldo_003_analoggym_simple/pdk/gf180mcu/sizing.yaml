# Sizing for the gf180mcu binding — generated by `analog-db add-binding` from the
# sky130 sizing (geometry re-noted to gf180mcu's unit convention + bin-clamped).
# A starting point; re-tune defaults/bounds for gf180mcu device physics as needed.
schema: spicexplorer/sizing@1
pdk: gf180mcu
variables:
- name: x_dut_xm1_w
  default: 2u
- name: x_dut_xm1_l
  default: 2u
- name: x_dut_xm4_w
  default: 80u
- name: x_dut_xm4_l
  default: 0.5u
- name: x_dut_xm5_w
  default: 100u
- name: x_dut_xm5_l
  default: 0.6u   # gf180 nfet_06v0 bins need L >= 0.6u (upstream 0.5u has no valid bin)
- name: x_dut_xmp_w
  default: 20u
- name: x_dut_xmp_l
  default: 0.5u
- name: x_dut_xmp_m
  default: '360'
- name: r_z
  default: 3k
  description: Upstream XRfb res_high_po_0p35 L=3, M_Rfb=1 (~3 kohm)
- name: c_comp
  default: 1p
  description: Upstream XCfb mim, M_Cfb=5 units of ~200 fF
- name: vref_val
  default: 1.8
  description: Upstream TB Vref = 1.8 V at the 2.0 V rail; unity feedback -> vout = vref
- name: vb_val
  default: 1.2
  description: Upstream TB Vb tail-bias voltage
- name: r_bleed
  default: 100k
  description: Minimum-load bleed (import adaptation; upstream TBs never run true no-load)
