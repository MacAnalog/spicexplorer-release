# Analysis binding: common-mode rejection in the unity-buffer config (the class template;
# Miller-compensated two-stage is buffer-stable, so no biaswrap needed). Params mirror the
# circuit's other benches (VCM 0.6, IBIAS 20u, CL 500f). Added with the tb-validation pass
# (2026-07-09) alongside psrr_vdd/linearity so the reference two-stage carries the full
# amplifier disturbance suite on every binding, tsmc-n65 included.
schema: spicexplorer/analysis@1
id: cmrr_vcm
template: cmrr_vcm
description: "CMRR — 1 V AC common-mode on both inputs of the unity buffer, DC-band floor."
params:
  VDD: 1.5
  VCM: 0.6
  IBIAS: 20u
  CL: 500f
  FSTART: 1k
  FSTOP: 1G
  PPD: 101
flags: []
produces: [cmrr_db]
