# Datasheet (plan D-3/D-5/D-12). Validated against _shared/schema/datasheet.schema.json.
# Metric sheet for the MOS-triode voltage-controlled trim. Specs are loose open-PDK envelopes
# (goal: a converged, valid metric set + validated class benches on ihp-sg13g2). The transfer is
# intentionally a raw analog attenuator, so INL is large — reported honestly (a linearised trim
# would tighten it).
schema: spicexplorer/datasheet@1
cace_format: "5.2"
default_conditions:
  supply: {unit: V, typical: 1.2}
  corner: {typical: tt}
  temp:   {unit: degC, typical: 27}
metrics:
  v_out:
    display: "Output at code 0"
    description: "Trimmed output with the control at 0 (shunt off) — near the supply."
    unit: V
    analysis: dc_op
    extract: {meas: v_out}
    spec: {min: 0.5, max: 1.3, unit: V}
  i_supply:
    display: "Supply current"
    unit: A
    analysis: dc_op
    extract: {meas: i_supply}
    spec: {max: 1.0e-3, unit: A}
  full_range:
    display: "Full-scale trim range"
    description: "|vout(max code) - vout(min code)| over the control sweep."
    unit: V
    analysis: dc_code_sweep
    extract: {meas: full_range}
    spec: {min: 0.3, unit: V}
  lsb_step:
    display: "Average LSB step"
    description: "full_range / (Ncodes-1) — the mean output step per code."
    unit: V
    analysis: dc_code_sweep
    extract: {meas: lsb_step}
    spec: {min: any}
  inl_lsb:
    display: "Peak INL"
    description: "Peak deviation from the endpoint line (LSB). Large for a raw analog attenuator."
    unit: LSB
    analysis: dc_code_sweep
    extract: {meas: inl_lsb}
    spec: {min: any}
  monotonic:
    display: "Monotonicity"
    description: "1 if every code step has the same sign (monotonic transfer)."
    unit: bool
    analysis: dc_code_sweep
    extract: {meas: monotonic}
    spec: {min: 1}
