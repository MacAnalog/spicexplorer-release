# Analysis binding (plan D-4). Binds the support-class tran_rrl_sense template
# (ripple-sensing demodulating SC-integrator bench, DRAWING_REVIEW S4 option A): a
# differential SQUARE ripple of +/-VR/2 per side at FCHOP on vinp/vinn, CLK_CH_RRL
# clocked synchronously at FCHOP and PHI_1/PHI_2 as exact complements (the drawn TGs
# use the opposite phase as each complement — see the template header). A DC input is
# correctly rejected by the AC-coupled front end. W1/W2 are one-chop-period AVG
# windows (residual f_chop ripple integrates to ~zero per window, so it cannot alias
# into the slope — the FIND-at-instant nit from the adversarial review). Window
# centers 0.6m/1.8m sit inside the linear ramp, an integer number of chop periods
# (6) apart, EARLY —
# the unclamped behavioral integrator winds up to nonphysical hundreds of volts if the
# window extends further (VR is scaled down for the same reason; ripple_gain is
# VR-normalized so the metric is unchanged).
schema: spicexplorer/analysis@1
id: tran_rrl_sense
template: tran_rrl_sense
description: "RRL ripple-sense bench: demodulated integrator ramp per volt of ripple (ripple_gain, V/s/V; its SIGN is the composed RRL loop polarity)."
params:
  VDD: 1.2
  VCM: 0.6
  VR: 2m
  FCHOP: 5k
  TEDGE: 100n
  W1A: 0.5m
  W1B: 0.7m
  W2A: 1.7m
  W2B: 1.9m
  TSTEP: 500n
  TSTOP: 2m
  TMAX: 200n
flags: []
produces: [ramp_rate, ripple_gain]
