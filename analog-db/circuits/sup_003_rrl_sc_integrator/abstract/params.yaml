  description: Auto-zero coupling caps into the opamp inputs — p/n halves must match for offset storage.
- name: pair_cint
  kind: shared_geometry
  members: [CINT1, CINT2]
  tie: [Value]
  description: Integration caps — p/n halves; Cs/Cint sets the per-cycle charge-transfer gain.
