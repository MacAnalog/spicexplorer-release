# Analysis binding for the SELF-BIASED error amp (no ibias port) — uses the class's
# ibias-free template variant so no external current source is left driving a dangling node.
schema: spicexplorer/analysis@1
id: psrr_vdd
template: psrr_vdd_selfbias
description: "PSRR+ - 1 V supply ripple into the unity buffer, DC-band floor. Self-bias variant: unlike the ibias-port bench this DOES exercise the on-chip reference, so x_dut_xmbp_w moves this number."
params: {VDD: 3.3, VCM: 1.2, CL: 10p, FSTART: 1k, FSTOP: 1G, PPD: 101}
flags: []
produces: [psrr_vdd_db]
