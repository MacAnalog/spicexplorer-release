# Per-PDK re-bias (platform convention: analyses params are the AUTHORED operating point;
# per-PDK deltas live here). amp_031 is authored at the Hsu bio-AFE 1.2 V rail (ihp binding).
# sky130's 1v8 core devices don't bias at 1.2 V (i_supply ~13 nA, vocm railed at VDD), so the
# binding runs sky130's nominal 1.8 V. VCM picked by coarse VCM x vb2 dc sweep (2026-08-03):
# the complementary input stage only conducts for VCM ~0.55-0.75 (PMOS-pair headroom collapses
# above 0.75 — i_supply drops uA -> nA); 0.7 is the sweep optimum (i_supply 15 uA, vocm
# servo-held interior). vref_cm/vb2 sizing defaults above track the same re-bias.
analysis_params:
  VDD: 1.8
  VCM: 0.7
