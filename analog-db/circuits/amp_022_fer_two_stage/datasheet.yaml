schema: spicexplorer/datasheet@1
cace_format: '5.2'
default_conditions:
  supply:
    unit: V
    typical: 1.5
  vcm:
    unit: V
    typical: 0.6
  ibias:
    unit: uA
    typical: 20
  cload:
    unit: fF
    typical: 10000
  corner:
    typical: tt
  temp:
    unit: degC
    typical: 27
metrics:
  dc_gain_db:
    display: DC open-loop gain (bias-wrapped)
    unit: dB
    analysis: ac_open_loop
    extract:
      meas: dcgain
    spec:
      min: 40
      unit: dB
  ugf_hz:
    display: Unity-gain frequency
    unit: Hz
    analysis: ac_open_loop
    extract:
      meas: ugf
    spec:
      unit: Hz
      min: 5000000.0
  pm_deg:
    display: Phase margin
    unit: deg
    analysis: ac_open_loop
    extract:
      meas: pm
    spec:
      unit: deg
      min: 60.0
      max: 90
  i_supply:
    display: Supply current
    unit: A
    analysis: dc_op
    extract:
      meas: i_supply
    spec:
      max: 0.0005
      unit: A
  vn_in_integrated:
    display: Total integrated input-referred noise (1 Hz - 1 MHz, buffer)
    description: ngspice inoise_total is volts rms already integrated over the swept
      band (standardized 1 Hz - 1 MHz, unity-buffer bias config, CL=10p) — the paper's
      uniform noise column. Replaces the old vn_in entry, which bound the same measure
      under V/sqrt(Hz) (dimensionally wrong; inoise_total is not a spot density).
    unit: V
    analysis: noise
    extract:
      meas: inoise_total
  t_settle:
    display: Unity-gain step settling time (0.2 V step)
    unit: s
    analysis: tran_step
    extract:
      meas: t_settle
    spec:
      max: 2.0e-06
      unit: s
  cmrr_db:
    display: Common-mode rejection
    description: CMRR in the unity-buffer config, DC-band floor (tb-validation pass
      2026-07-09).
    unit: dB
    analysis: cmrr_vcm
    extract:
      meas: cmrr_db
    spec:
      min: 40
      unit: dB
  psrr_vdd_db:
    display: Positive-supply rejection
    description: PSRR+ in the unity-buffer config, DC-band floor (tb-validation pass
      2026-07-09).
    unit: dB
    analysis: psrr_vdd
    extract:
      meas: psrr_vdd_db
    spec:
      unit: dB
      min: 40.0
  thd_pct:
    display: Total harmonic distortion (100 mV @ 1 MHz, buffer)
    description: tran+FFT on ngspice; native PSS harmonics on Spectre (tb-validation
      follow-on 2026-07-09).
    unit: '%'
    analysis: thd
    extract:
      meas: thd_pct
      f0: 1.0e6
    spec:
      max: 2.0
      unit: '%'
  iip3_dbv:
    display: Input IP3 (two-tone 0.9/1.0 MHz, 6.25 mV/tone, buffer)
    description: Single-point IM3 extrapolation; tran+coherent DFT on ngspice, native
      PSS on Spectre (2026-07-09). Drive lowered 50 mV -> 6.25 mV 2026-07-31 — at 50 mV
      the IM3 bin was already off its 3:1 slope, reading 0.50 dB optimistic here and up
      to 1.40 dB on amp_001_5t@sky130; see analyses/iip3.yaml. ampl_in below MUST track
      the analysis binding's ASIG (it is the intercept's input reference).
    unit: dBV
    analysis: iip3
    extract:
      meas: iip3_dbv
      f1: 0.9e6
      f2: 1.0e6
      ampl_in: 0.00625
    spec:
      min: -10
      unit: dBV
  pm_loop_deg:
    display: Loop phase margin (stb, unity buffer)
    description: Phase margin of the Middlebrook-probed buffer loop (VIPRB marker);
      crosschecks ac_open_loop's pm_deg — fresh ihp-sg13g2 tt reads 63.42 vs 63.37 deg.
      -999 sentinel = no crossover (fails the min spec by design).
    unit: deg
    analysis: stb
    extract:
      meas: pm_loop
    spec:
      min: 60
      unit: deg
  loopgain_db:
    display: DC loop gain (stb, unity buffer)
    description: Loop-gain magnitude read at FSTART; bit-identical to ac_open_loop's
      dcgain on this cell. Report-only.
    unit: dB
    analysis: stb
    extract:
      meas: loopgain_db
  ugf_loop_hz:
    display: Loop unity-gain frequency (stb)
    unit: Hz
    analysis: stb
    extract:
      meas: ugf_loop
  gm_loop_db:
    display: Loop gain margin (stb)
    description: Gain margin at the phase crossover; ngspice measure name is gm_loop
      (the Spectre bench emits gm_loop_db — the split is absorbed here). -999 sentinel =
      no phase crossover in-band. Report-only.
    unit: dB
    analysis: stb
    extract:
      meas: gm_loop
  icmr_range:
    display: Input common-mode range
    description: Widest contiguous 20 mV tracking band of the buffer-connected DC
      sweep (tb-validation pass 2026-07-09).
    unit: V
    analysis: linearity
    extract:
      meas: icmr_range
      vin: vinp
      vtrack: 0.02
    spec:
      min: 0.3
      unit: V
