schema: spicexplorer/datasheet@1
cace_format: '5.2'
default_conditions:
  supply:
    unit: V
    typical: 1.2
  cload:
    unit: fF
    typical: 50
  corner:
    typical: tt
  temp:
    unit: degC
    typical: 27
  vcm:
    unit: V
    typical: 0.6
metrics:
  dc_gain_db:
    display: DC open-loop differential gain
    description: Differential large-signal DC gain, vdb(voutp,voutn); folded-cascode
      first stage + class-A second stage
    unit: dB
    analysis: ac_open_loop
    extract:
      meas: dcgain
    spec:
      min: 50
      unit: dB
  ugf_hz:
    display: Unity-gain frequency
    unit: Hz
    analysis: ac_open_loop
    extract:
      meas: ugf
    spec:
      unit: Hz
      min: 5000000.0
  pm_deg:
    display: Phase margin
    description: Two-stage, per-side Miller-compensated into the 50 fF load
    unit: deg
    analysis: ac_open_loop
    extract:
      meas: pm
    spec:
      unit: deg
      min: 60.0
      max: 90
  vos:
    display: Output offset
    description: voutp - voutn at matched DC inputs; NO explicit CMFB is drawn, so
      the band is wide (ratioed output CM)
    unit: V
    analysis: dc_op
    extract:
      meas: vos
    spec:
      typ: 0
      min: -100e-3
      max: 100e-3
      unit: V
  i_supply:
    display: Supply current
    unit: A
    analysis: dc_op
    extract:
      meas: i_supply
    spec:
      max: 500e-6
      unit: A
  vn_in:
    display: Input-referred noise (integrated)
    description: "ngspice inoise_total = total noise INTEGRATED over the bench band\
      \ (see analyses/noise.yaml FSTART..FSTOP) \u2014 a voltage, not a density; the\
      \ bound is a characterization band at the family's measured magnitude"
    unit: V
    analysis: noise
    extract:
      meas: inoise_total
    spec:
      max: 0.001
      unit: V
  t_settle:
    display: Settling time
    description: Unity-gain differential-follower settling (see tran_step_diff.spice)
    unit: s
    analysis: tran_step
    extract:
      meas: t_settle
    spec:
      max: 1.0e-05
      unit: s
