# AUTHORED ties (2026-07-27 registration review): the drawing carries GLOBAL geometry
# params — tg_n_w/tg_n_l for every TG NMOS, tg_p_w/tg_p_l for every TG PMOS,
# cmfb_cm1/cmfb_cm2 for the switched/reservoir cap pairs — so the ties below ARE the
# drawn intent, not a recommendation. shared_geometry (not matched_pair): the eight
# gates share no source net; what matters is equal Ron/charge-injection per phase and
# p/n-side symmetry (mismatch leaks differential signal into vcmfb).
groups:
- name: tg_nmos_all
  kind: shared_geometry
  members: [XM1, XM3, XM5, XM7, XM9, XM11, XM13, XM15]
  tie: [w, l, m]
  description: All eight transmission-gate NMOS halves (drawn global tg_n_w/tg_n_l);
    p/n-side symmetry keeps charge injection common-mode.
- name: tg_pmos_all
  kind: shared_geometry
  members: [XM2, XM4, XM6, XM8, XM10, XM12, XM14, XM16]
  tie: [w, l, m]
  description: All eight transmission-gate PMOS halves (drawn global tg_p_w/tg_p_l).
- name: cap_switched
  kind: shared_geometry
  members: [C2, C4]
  tie: [Value]
  description: Per-side switched caps (drawn cmfb_cm1) — equal values so both sides
    transfer equal charge and vcmfb reads the true CM.
- name: cap_reservoir
  kind: shared_geometry
  members: [C1, C3]
  tie: [Value]
  description: Per-side reservoir caps across (vbias, vcm) (drawn cmfb_cm2).
