# Per-PDK bench overrides (assemble.py precedence: datasheet < analyses < analysis_params).
# The cross-PDK benches carry the authored ihp 1.2 V/0.6 V conditions; sky130's 1.8 V core
# devices (nfet/pfet_01v8, |Vth| ~0.65/0.9) are dead at that rail. Re-biased to the nominal
# 1.8 V rail, input CM at mid-rail (coarse dc_op sweep 2026-08-03: stage-1 interior at
# VCM 0.8-0.9; 0.9 keeps the benches' mid-rail convention).
analysis_params:
  VDD: 1.8
  VCM: 0.9
