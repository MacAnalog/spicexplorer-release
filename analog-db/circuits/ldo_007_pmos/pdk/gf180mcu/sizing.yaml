# Design variables for the gf180mcu binding (explicit `u` tokens; 3.3 V devices run at 1.8 V here).
# Topology knobs ported from the sky130-tuned design; per-PDK fine-tuning happens at the sim tier.
schema: spicexplorer/sizing@1
pdk: gf180mcu
variables:
  - {name: x_dut_xmp_w, description: "Pass PMOS per-device width (<=bin max)", default: 20u, min: 0.22u, max: 100u, unit: m}
  - {name: x_dut_xmp_m, description: "Pass PMOS parallel multiplier (total W = x_dut_xmp_w*x_dut_xmp_m)", default: 20, min: 1, max: 200, unit: count, is_integer: true}
  - {name: x_dut_xmp_l, description: "Pass PMOS length",           default: 0.5u, min: 0.28u, max: 2u,    unit: m}
  - {name: x_dut_xm1_w,   description: "Error-amp input pair width", default: 4u,   min: 0.22u, max: 50u,   unit: m}
  - {name: x_dut_xm1_l,   description: "Error-amp input pair length",default: 0.5u, min: 0.28u, max: 10u,   unit: m}
  - {name: x_dut_xm3_w, description: "Error-amp PMOS load width",  default: 4u,   min: 0.22u, max: 50u,   unit: m}
  - {name: x_dut_xm3_l, description: "Error-amp PMOS load length", default: 0.5u, min: 0.28u, max: 10u,   unit: m}
  - {name: x_dut_xm6_w, description: "Tail/bias mirror width",     default: 4u,   min: 0.22u, max: 50u,   unit: m}
  - {name: x_dut_xm6_l, description: "Tail/bias mirror length",    default: 1.0u, min: 0.28u, max: 10u,   unit: m}
  - {name: r_top,  description: "Divider top",                default: 100k, min: 1k,    max: 10Meg, unit: ohm}
  - {name: r_bot,  description: "Divider bottom",             default: 100k, min: 1k,    max: 10Meg, unit: ohm}
  - {name: c_ff,   description: "Feedforward (phase-lead) cap across r_top", default: 60p, min: 0.01p, max: 2n, unit: F}
  - {name: c_comp, description: "Miller compensation cap",    default: 0.05p, min: 0.01p, max: 100p, unit: F}
  - {name: r_z,    description: "Nulling resistor",           default: 1,    min: 0,     max: 100k,  unit: ohm}
  - {name: vref_val, description: "Internal reference voltage", default: 0.6, min: 0.3,  max: 1.2,   unit: V}
  - {name: i_tail, description: "Error-amp tail bias current",  default: 200u, min: 1u,  max: 500u,  unit: A}
