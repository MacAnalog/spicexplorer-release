[project]
name = "spicexplorer-gmid"
version = "0.0.0"
description = "SpiceXplorer gm/ID sizing tool — deterministic transistor sizing from pre-computed gm/ID lookup tables: pick an inversion level and length, read JD/VGS/gain/fT/caps off the LUT, de-normalize to a width, with explicit sanity gates."
requires-python = ">=3.10"
dependencies = [
    "spicexplorer-core",   # env/eng/sim seams shared across the suite; never a peer tool
    "pygmid>=1.2",         # the LUT reader (Lookup) — proven against our committed .pkl tables
    "numpy",               # grid/sweep array math (torch-free)
    "pydantic>=2",         # typed I/O contract (contract.py) — feeds OpenAPI/TS codegen + MCP schemas
]

# NOTE: a leaf tool — depends on spicexplorer-core only (+ pygmid/numpy/pydantic from PyPI). It MUST
# NOT import a peer tool (the optimizer `spicexplorer`, `spicexplorer_netlist2tf`) nor the data repo
# `spicexplorer_analog_db`. Anything that reads DB datasheets, sizes, and re-simulates is an
# orchestration concern (notebook/script first, workflow later), not this package.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spicexplorer_gmid"]
