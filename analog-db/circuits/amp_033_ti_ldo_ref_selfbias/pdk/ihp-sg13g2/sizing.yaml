# Sizing for the ihp-sg13g2 binding — generated by `analog-db add-binding` from the
# gf180mcu sizing, then HAND-CORRECTED (2026-08-03): the gf180 source writes geometry as raw
# meters (1.0844e-05, no 'u'), which the converter misread as bare microns and floor-clamped
# every W/L to the 0.18u/0.13u bin. Defaults below are the gf180 µm values re-scaled for the
# 130 nm lv devices at the 1.5 V rail: W ÷~4–8 (higher current density, half the rail) and
# capped at the registry max_w 10u; bias-mirror L 2u→1u, input pair 0.7u→0.4u, load 1u→0.5u,
# driver 2.646u→0.5u. Rz/Cc carried and then retuned against the live pm. A starting point —
# the campaign re-sizes later.
schema: spicexplorer/sizing@1
pdk: ihp-sg13g2
variables:
- name: x_dut_xmbp_w
  default: 5u
  min: 0.5u
  max: 10u
  unit: m
  description: On-chip reference PMOS (diode, vdd->ibias). Primary power/PSRR trade knob.
- name: x_dut_xmbp_l
  default: 1u
  min: 0.13u
  max: 10u
  unit: m
  description: Reference PMOS length; longer = lower current, better matching.
- name: x_dut_xmb0_w
  default: 5u
  min: 0.5u
  max: 10u
  unit: m
  description: Bias-mirror NMOS diode (the mirror-rail unit device).
- name: x_dut_xmb0_l
  default: 1u
  min: 0.13u
  max: 10u
  unit: m
  description: Mirror-rail channel length (shared by XMBC/XMBO for matching).
- name: x_dut_xmbc_w
  default: 4u
  min: 0.5u
  max: 10u
  unit: m
  description: Tail sink (stage-1 current). With XMBO this sets the gm1/gm5 balance.
- name: x_dut_xmbc_m
  default: 1
  is_integer: true
  min: 1
  max: 8
  description: Tail mirror multiplicity (the drawing uses nf=2 here).
- name: x_dut_xmbo_w
  default: 2u
  min: 0.5u
  max: 10u
  unit: m
  description: Stage-2 sink (output-stage current). Seeded 2x the tail.
- name: x_dut_xmbo_m
  default: 1
  is_integer: true
  min: 1
  max: 8
  description: Output-sink multiplicity.
- name: x_dut_xm1_w
  default: 10u
  min: 0.5u
  max: 10u
  unit: m
  description: Input pair (XM2 tied to it - matched pair).
- name: x_dut_xm1_l
  default: 0.4u
  min: 0.13u
  max: 10u
  unit: m
- name: x_dut_xm3_w
  default: 8u
  min: 0.5u
  max: 10u
  unit: m
  description: PMOS mirror load (XM4 tied to it - matched mirror; mismatch here IS offset).
- name: x_dut_xm3_l
  default: 0.5u
  min: 0.13u
  max: 10u
  unit: m
- name: x_dut_xm5_w
  default: 10u
  min: 0.5u
  max: 10u
  unit: m
  description: Stage-2 common-source PMOS driver.
- name: x_dut_xm5_l
  default: 0.5u
  min: 0.13u
  max: 10u
  unit: m
- name: r_z
  default: 30853
  min: 100
  max: 50k
  unit: ohm
  description: Nulling resistor. MUST stay free - see header.
- name: c_comp
  default: 4.508e-12
  min: 0.2p
  max: 20p
  unit: F
  description: Miller capacitor. MUST stay free - see header.

# Per-PDK re-bias (assemble.py precedence: datasheet < analyses < analysis_params).
# Authored on gf180's 3.3 V rail with the in-LDO VCM 0.8 V; ihp-sg13g2 is a 1.5 V lv kit.
# VCM picked via coarse dc sweep: NMOS pair (lv vth ~0.3-0.5) + tail headroom put the
# tracking band's low edge near 0.6; 0.75 = VDD/2 sits comfortably inside it.
analysis_params:
  VDD: 1.5
  VCM: 0.75
