# Sizing for the sky130 binding — generated by `analog-db add-binding` from the
# ihp-sg13g2 sizing (geometry re-noted to sky130's unit convention + bin-clamped).
# A starting point; re-tune defaults/bounds for sky130 device physics as needed.
schema: spicexplorer/sizing@1
pdk: sky130
variables:
- name: x_dut_xm1_w
  description: Input pair W (PMOS)
  default: 5
  min: 1
  max: 200
  unit: m
- name: x_dut_xm1_l
  description: Input pair L
  default: 0.5
  min: 0.5
  max: 5
  unit: m
- name: x_dut_xm13_w
  description: NMOS mirror W
  default: 5
  min: 1
  max: 200
  unit: m
- name: x_dut_xm13_l
  description: NMOS mirror L
  default: 2
  min: 0.5
  max: 5
  unit: m
- name: x_dut_xm6_w
  description: NMOS cascode W
  default: 5
  min: 1
  max: 200
  unit: m
- name: x_dut_xm6_l
  description: NMOS cascode L
  default: 0.5
  min: 0.5
  max: 5
  unit: m
- name: x_dut_xm7_w
  description: PMOS cascode W
  default: 5
  min: 1
  max: 200
  unit: m
- name: x_dut_xm7_l
  description: PMOS cascode L
  default: 0.5
  min: 0.5
  max: 5
  unit: m
- name: x_dut_xm9_w
  description: PMOS mirror W
  default: 5
  min: 1
  max: 200
  unit: m
- name: x_dut_xm9_l
  description: PMOS mirror L
  default: 2
  min: 0.5
  max: 5
  unit: m
- name: x_dut_xm11_w
  description: Tail/bias W
  default: 5
  min: 1
  max: 200
  unit: m
- name: x_dut_xm11_l
  description: Tail/bias L
  default: 2
  min: 0.5
  max: 5
  unit: m
- name: x_dut_xm12_w
  description: NMOS-bias feed W
  default: 5
  min: 1
  max: 200
  unit: m
- name: x_dut_xm12_l
  description: NMOS-bias feed L
  default: 2
  min: 0.5
  max: 5
  unit: m
- name: x_dut_vb1
  description: NMOS cascode bias
  default: 0.94
  min: 0.1
  max: 1.8
  unit: V
- name: x_dut_vb2
  description: PMOS cascode bias
  # sky130 VTP≈-0.5V; need vb2 = s9 - (|VTP|+Vov) ≈ s9 - 0.7; s9≈1.3-1.5V → vb2≈0.6-0.8V
  default: 0.48
  min: 0.1
  max: 1.8
  unit: V
- name: x_dut_xm1_ng
  description: Input pair fingers
  default: 1
  min: 1
  max: 32
  freeze: true
- name: x_dut_xm13_ng
  description: NMOS mirror fingers
  default: 1
  min: 1
  max: 32
  freeze: true
- name: x_dut_xm6_ng
  description: NMOS cascode fingers
  default: 1
  min: 1
  max: 32
  freeze: true
- name: x_dut_xm7_ng
  description: PMOS cascode fingers
  default: 1
  min: 1
  max: 32
  freeze: true
- name: x_dut_xm9_ng
  description: PMOS mirror fingers
  default: 1
  min: 1
  max: 32
  freeze: true
- name: x_dut_xm11_ng
  description: Tail/bias fingers
  default: 1
  min: 1
  max: 32
  freeze: true
- name: x_dut_xm12_ng
  description: NMOS-bias feed fingers
  default: 1
  min: 1
  max: 32
  freeze: true
# Frozen per-device literals (P4 atomic sweep): defaults reproduce the authored
# netlist literals exactly; freeze keeps them out of the search space.
- {name: x_dut_xm4_m, description: "XM4 m (frozen literal)", default: 6, min: 1, max: 32, freeze: true, is_integer: true}
- {name: x_dut_xm1_m, description: "XM1 m (frozen literal)", default: 32, min: 1, max: 32, freeze: true, is_integer: true}
- {name: x_dut_xm2_m, description: "XM2 m (frozen literal)", default: 32, min: 1, max: 32, freeze: true, is_integer: true}
- {name: x_dut_xm3_m, description: "XM3 m (frozen literal)", default: 6, min: 1, max: 32, freeze: true, is_integer: true}
- {name: x_dut_xm11_m, description: "XM11 m (frozen literal)", default: 24, min: 1, max: 32, freeze: true, is_integer: true}
- {name: x_dut_xm0_m, description: "XM0 m (frozen literal)", default: 24, min: 1, max: 32, freeze: true, is_integer: true}
- {name: x_dut_xm6_m, description: "XM6 m (frozen literal)", default: 4, min: 1, max: 32, freeze: true, is_integer: true}
- {name: x_dut_xm5_m, description: "XM5 m (frozen literal)", default: 4, min: 1, max: 32, freeze: true, is_integer: true}
- {name: x_dut_xm7_m, description: "XM7 m (frozen literal)", default: 12, min: 1, max: 32, freeze: true, is_integer: true}
- {name: x_dut_xm8_m, description: "XM8 m (frozen literal)", default: 12, min: 1, max: 32, freeze: true, is_integer: true}
- {name: x_dut_xm9_m, description: "XM9 m (frozen literal)", default: 8, min: 1, max: 32, freeze: true, is_integer: true}
- {name: x_dut_xm10_m, description: "XM10 m (frozen literal)", default: 8, min: 1, max: 32, freeze: true, is_integer: true}
- {name: x_dut_xm12_m, description: "XM12 m (frozen literal)", default: 24, min: 1, max: 32, freeze: true, is_integer: true}
- {name: x_dut_xm13_m, description: "XM13 m (frozen literal)", default: 6, min: 1, max: 32, freeze: true, is_integer: true}
