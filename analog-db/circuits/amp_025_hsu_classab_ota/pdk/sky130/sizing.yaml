# Bias knobs re-ranged/re-tuned for the sky130 1.8 V rail (coarse dc_op sweeps, tt,
# 2026-08-03): the ihp 1.2 V values leave every stack cut off (i_supply ~14 nA). At
# vb1=0.8/vb2=0.7/vb3=1.0 stage 1 + the folded cascode sit interior (tail 1.76,
# drv 0.67, psrc 1.60). The reachable output-CM window at this sizing is ~(0.99, 1.15)
# \u2014 vcmfb_ref=0.9 is BELOW it and winds the servo to -90 V (dead actuator);
# vcmfb_ref=1.0 settles the servo in-rail (vcmfb 0.86, vocm 0.999).
- name: vb1
  description: "PMOS tail/current-source gate bias \u2014 XM1/XM14/XM20 (drawn as an external 0.5 V port)"
  default: 0.8
  min: 0.0
  max: 1.8
  unit: V
- name: vb2
  description: "Folded PMOS cascode gate bias \u2014 XM10/XM11 (drawn 0.5 V)"
  default: 0.7
  min: 0.0
  max: 1.8
  unit: V
- name: vb3
  description: "NMOS cascode gate bias \u2014 XM7/XM9 (drawn 0.5 V)"
  default: 1.0
  min: 0.0
  max: 1.8
  unit: V
- name: vcmfb_ref
  description: Output common-mode reference into the CMFB servo (drawn port vcmbf_ref, 0.5 V)
  default: 1.0
  min: 0.0
  max: 1.8
  unit: V
- name: x_dut_xm1_m
