# Per-PDK bench overrides (assemble.py precedence: datasheet < analyses < analysis_params).
# The cross-PDK benches carry the authored ihp 1.2 V/0.6 V conditions; gf180mcu binds the
# 3.3 V core family (nfet/pfet_03v3) which is cut off at that rail. Re-biased to the
# nominal 3.3 V rail, input CM at mid-rail (amp_004 gf180mcu precedent).
analysis_params:
  VDD: 3.3
  VCM: 1.65
