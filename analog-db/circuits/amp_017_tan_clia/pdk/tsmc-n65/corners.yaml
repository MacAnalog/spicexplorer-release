# Corner bundles for tsmc-n65 (D-6): PDK libs stay out-of-repo, referenced by
# lib_file (+ section). Cross-PDK binding generated by `analog-db add-binding`.
pdk: tsmc-n65
corners:
  tt: [{lib_file: tsmc_n65_models.scs, section: tt}]
  ss: [{lib_file: tsmc_n65_models.scs, section: ss}]
  ff: [{lib_file: tsmc_n65_models.scs, section: ff}]
  sf: [{lib_file: tsmc_n65_models.scs, section: sf}]
  fs: [{lib_file: tsmc_n65_models.scs, section: fs}]
default_corner: tt
