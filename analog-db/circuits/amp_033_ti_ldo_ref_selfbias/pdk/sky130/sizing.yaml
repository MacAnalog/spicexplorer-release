# Sizing for the sky130 binding — generated by `analog-db add-binding` from the
# gf180mcu sizing, then HAND-CORRECTED (2026-08-03): the gf180 source writes geometry as raw
# meters (1.0844e-05, no 'u'), which the converter misread as bare microns and floor-clamped
# every W/L to the 0.42/0.15 bin. Defaults below are the gf180 µm values re-scaled for the
# 1.8 V core devices (bare-µm convention, .option scale=1u): W ÷~4 (thinner oxide, higher
# current density, half the rail); bias-mirror L 2→1, input pair 0.7→0.5, load 1→0.5,
# driver 2.646→0.5. Rz/Cc carried and then retuned against the live pm. A starting point —
# the campaign re-sizes later.
schema: spicexplorer/sizing@1
pdk: sky130
variables:
- name: x_dut_xmbp_w
  default: 23.71339160604486
  min: 0.42
  max: 30
  unit: m
  description: On-chip reference PMOS (diode, vdd->ibias). Primary power/PSRR trade knob.
- name: x_dut_xmbp_l
  default: 1.1974442129526897
  min: 0.15
  max: 10
  unit: m
  description: Reference PMOS length; longer = lower current, better matching.
- name: x_dut_xmb0_w
  default: 14.316321410441935
  min: 0.42
  max: 30
  unit: m
  description: Bias-mirror NMOS diode (the mirror-rail unit device).
- name: x_dut_xmb0_l
  default: 4.017319560601552
  min: 0.15
  max: 10
  unit: m
  description: Mirror-rail channel length (shared by XMBC/XMBO for matching).
- name: x_dut_xmbc_w
  default: 26.895472565757352
  min: 0.42
  max: 30
  unit: m
  description: Tail sink (stage-1 current). With XMBO this sets the gm1/gm5 balance.
- name: x_dut_xmbc_m
  default: 1
  is_integer: true
  min: 1
  max: 8
  description: Tail mirror multiplicity (the drawing uses nf=2 here).
- name: x_dut_xmbo_w
  default: 17.003801287035284
  min: 0.42
  max: 30
  unit: m
  description: Stage-2 sink (output-stage current). Seeded 2x the tail.
- name: x_dut_xmbo_m
  default: 1
  is_integer: true
  min: 1
  max: 8
  description: Output-sink multiplicity.
- name: x_dut_xm1_w
  default: 13.80211797930676
  min: 0.42
  max: 30
  unit: m
  description: Input pair (XM2 tied to it - matched pair).
- name: x_dut_xm1_l
  default: 0.8298635361175917
  min: 0.15
  max: 10
  unit: m
- name: x_dut_xm3_w
  default: 12.154294570182673
  min: 0.42
  max: 30
  unit: m
  description: PMOS mirror load (XM4 tied to it - matched mirror; mismatch here IS offset).
- name: x_dut_xm3_l
  default: 1.159444890985505
  min: 0.15
  max: 10
  unit: m
- name: x_dut_xm5_w
  default: 9.903158187330707
  min: 0.42
  max: 30
  unit: m
  description: Stage-2 common-source PMOS driver.
- name: x_dut_xm5_l
  default: 2.949529504310346
  min: 0.15
  max: 10
  unit: m
- name: r_z
  default: 49350.31244197376
  min: 100
  max: 50k
  unit: ohm
  description: Nulling resistor. MUST stay free - see header.
- name: c_comp
  default: 5.9836450528951e-12
  min: 0.2p
  max: 20p
  unit: F
  description: Miller capacitor. MUST stay free - see header.

# Per-PDK re-bias (assemble.py precedence: datasheet < analyses < analysis_params).
# Authored on gf180's 3.3 V rail with the in-LDO VCM 0.8 V; sky130 core devices run 1.8 V.
# VCM picked via coarse dc sweep: sky130's higher vth (~0.45+, plus body effect on the
# raised-source pair) pushes the tracking band up; 0.9 = VDD/2 sits inside it.
analysis_params:
  VDD: 1.8
  VCM: 0.9
