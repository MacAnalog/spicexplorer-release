# BAND STANDARDIZED 2026-08-01 (campaign): FSTART 1MEG -> 1, FSTOP 1G — the paper's noise
# column is one uniform condition, total integrated input-referred noise over 1 Hz - 1 MHz
# in the unity/closed-loop bias config, CL = 10p. PPD unchanged. ngspice inoise_total is
# already volts rms integrated over the swept band, hence the vn_in_integrated metric
# (unit V) in datasheet.yaml.
schema: spicexplorer/analysis@1
id: noise
template: noise
description: "Total integrated input-referred noise, 1 Hz - 1 MHz (unity-buffer config)."
params: {VDD: 1.5, VCM: 0.8, IBIAS: 5u, CL: 10p, FSTART: 1, FSTOP: 1MEG, PPD: 101}
flags: []
produces: [vn_in_integrated]
