# Sizing for the tsmc-n65 binding — generated by `analog-db add-binding` from the
# ihp-sg13g2 sizing (geometry re-noted to tsmc-n65's unit convention + bin-clamped).
# A starting point; re-tune defaults/bounds for tsmc-n65 device physics as needed.
schema: spicexplorer/sizing@1
pdk: tsmc-n65
variables:
- name: x_dut_xm3_w
  description: NMOS input pair width (XM3/XM4)
  default: 0.12u
  min: 0.15u
  max: 50u
  unit: m
- name: x_dut_xm3_l
  description: NMOS input pair length
  default: 0.06u
  min: 0.13u
  max: 2u
  unit: m
- name: x_dut_xm6_w
  description: PMOS input pair width (XM6/XM7)
  default: 0.12u
  min: 0.15u
  max: 50u
  unit: m
- name: x_dut_xm6_l
  description: PMOS input pair length
  default: 0.06u
  min: 0.13u
  max: 2u
  unit: m
- name: x_dut_xm5_w
  description: Stage-1 NMOS tail width (gate vb2)
  default: 0.12u
  min: 0.15u
  max: 50u
  unit: m
- name: x_dut_xm5_l
  description: Stage-1 NMOS tail length
  default: 0.06u
  min: 0.13u
  max: 2u
  unit: m
- name: x_dut_xm8_w
  description: Stage-1 PMOS tail width (CMFB loop-1 actuator, gate vcmfb1)
  default: 0.12u
  min: 0.15u
  max: 50u
  unit: m
- name: x_dut_xm8_l
  description: Stage-1 PMOS tail length
  default: 0.06u
  min: 0.13u
  max: 2u
  unit: m
- name: x_dut_xm1_w
  description: Output NMOS driver width (XM1/XM9)
  default: 0.12u
  min: 0.15u
  max: 50u
  unit: m
- name: x_dut_xm1_l
  description: Output NMOS driver length
  default: 0.06u
  min: 0.13u
  max: 2u
  unit: m
- name: x_dut_xm2_w
  description: Output PMOS source width (CMFB loop-2 actuator, XM2/XM10)
  default: 0.12u
  min: 0.15u
  max: 50u
  unit: m
- name: x_dut_xm2_l
  description: Output PMOS source length
  default: 0.06u
  min: 0.13u
  max: 2u
  unit: m
- name: x_dut_c1_value
  description: Per-side Miller compensation cap (drawn Cc)
  default: 5.825188706426775e-13
  min: 0.05p
  max: 20p
  unit: F
- name: x_dut_r1_value
  description: Per-side Miller nulling resistor (drawn Rz)
  default: 2102.5223381221017
  min: 100
  max: 200k
  unit: ohm
- name: x_dut_rm1p_value
  description: CM-detector resistor unit (all four halves tied)
  default: 1Meg
  min: 10k
  max: 100Meg
  unit: ohm
- name: gm_val
  description: CMFB servo macromodel transconductance (both loops)
  default: 100u
  min: 1u
  max: 10m
  unit: S
- name: rout_val
  description: CMFB servo macromodel output resistance
  default: 10Meg
  min: 100k
  max: 1.0e9
  unit: ohm
- name: rin_val
  description: CMFB servo macromodel input resistance (near-ideal)
  default: 1.0e12
  min: 1.0e9
  max: 1.0e14
  unit: ohm
- name: cout_val
  description: CMFB servo macromodel output capacitance (100f validated for BOTH loops here)
  default: 100f
  min: 1f
  max: 10p
  unit: F
- name: cin_val
  description: CMFB servo macromodel input capacitance
  default: 10f
  min: 1f
  max: 1p
  unit: F
- name: vb2
  description: 'Stage-1 NMOS tail gate bias (per-PDK: ihp-sized value; see header)'
  default: 0.7002027602191484
  min: 0.0
  max: 1.2
  unit: V
- name: vref_cm
  description: CM reference for BOTH servo loops (drawn 0.5 V = the SRMC filter's system CM)
  default: 0.5
  min: 0.0
  max: 1.2
  unit: V
- name: x_dut_xm1_m
  description: XM1 m (frozen literal)
  default: 1
  min: 1
  max: 16
  freeze: true
  is_integer: true
