# Sizing for the sky130 binding — geometry re-noted to sky130's bare-µm convention
# (.option scale=1u) and clamped to the sky130 W/L bin floor (min_w 0.42, min_l 0.15).
# Same symbols + ratios as the ihp binding.
schema: spicexplorer/sizing@1
pdk: sky130
variables:
  - {name: x_dut_xmpb1_w, description: "PMOS bias-ladder diode width",       default: 16,  min: 0.42, max: 100, unit: m}
  - {name: x_dut_xmpb1_l, description: "PMOS bias/load length",              default: 0.5, min: 0.15, max: 20, unit: m}
  - {name: x_dut_xmpnr_w, description: "PMOS nbias-branch source width",     default: 0.5,   min: 0.42, max: 100, unit: m}
  - {name: x_dut_xmnb2_w, description: "NMOS bias-stack diode width",        default: 6,   min: 0.42, max: 100, unit: m}
  - {name: x_dut_xmnb2_l, description: "NMOS bias-stack length",             default: 0.3, min: 0.15, max: 20, unit: m}
  - {name: x_dut_xmpld_w, description: "PMOS load + cascode width",          default: 10,  min: 0.42, max: 100, unit: m}
  - {name: x_dut_xmpld_l, description: "PMOS load + cascode length",         default: 0.5, min: 0.15, max: 20, unit: m}
  - {name: x_dut_xmnca_w,  description: "NMOS cascode width",                 default: 4,   min: 0.42, max: 100, unit: m}
  - {name: x_dut_xmnin_w,   description: "NMOS input device width",            default: 4,   min: 0.42, max: 100, unit: m}
  - {name: x_dut_xmnca_l,   description: "NMOS input + cascode length",        default: 0.3, min: 0.15, max: 20, unit: m}
  # Frozen per-device literals (P4 atomic sweep): defaults reproduce the authored
  # netlist literals exactly; freeze keeps them out of the search space.
  - {name: x_dut_xmpb1_m, description: "XMPB1 m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
  - {name: x_dut_xmpb2_m, description: "XMPB2 m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
  - {name: x_dut_xmpnr_m, description: "XMPNR m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
  - {name: x_dut_xmnb2_m, description: "XMNB2 m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
  - {name: x_dut_xmnb1_m, description: "XMNB1 m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
  - {name: x_dut_xmpld_m, description: "XMPLD m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
  - {name: x_dut_xmpca_m, description: "XMPCA m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
  - {name: x_dut_xmnca_m, description: "XMNCA m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
  - {name: x_dut_xmnin_m, description: "XMNIN m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
