# Design variables for the ihp-sg13g2 binding (explicit `u` tokens; sg13 lv-MOS geometry
# rules). The drawing uses placeholder minimum devices (w=0.15u l=0.13u); defaults here are
# a signal-switch starting point (w=2u, min L) — sized for on-resistance, not min leakage.
# Group representatives only (see abstract/params.yaml ties): XM3/XM5/XM7<-XM1 (all four
# nmos legs, straight + cross), XM4/XM6/XM8<-XM2 (all four pmos legs). The n and p halves
# stay independent (different mobility).
schema: spicexplorer/sizing@1
pdk: ihp-sg13g2
variables:
  - {name: x_dut_xm1_w, description: "NMOS pass-device width (all 4 legs)", default: 2u, min: 0.15u, max: 50u, unit: m}
  - {name: x_dut_xm1_l, description: "NMOS pass-device length (all 4 legs)", default: 0.13u, min: 0.13u, max: 2u, unit: m}
  - {name: x_dut_xm2_w, description: "PMOS pass-device width (all 4 legs)", default: 2u, min: 0.15u, max: 50u, unit: m}
  - {name: x_dut_xm2_l, description: "PMOS pass-device length (all 4 legs)", default: 0.13u, min: 0.13u, max: 2u, unit: m}
  # Frozen per-device literals: defaults reproduce the drawn m=1 exactly; freeze keeps
  # them out of the search space.
  - {name: x_dut_xm1_m, description: "XM1 m (frozen literal; ties XM3/XM5/XM7)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
  - {name: x_dut_xm2_m, description: "XM2 m (frozen literal; ties XM4/XM6/XM8)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
