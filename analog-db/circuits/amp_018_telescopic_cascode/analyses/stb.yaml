# Analysis binding: loop-gain / stability probe in the unity buffer (class stb template,
# base/ibias variant). Params mirror the circuit's other AC benches (VDD 1.5, VCM 0.8,
# IBIAS 5u, CL 10p). ngspice does Middlebrook voltage injection at the VIPRB marker and
# prints loopgain_db / ugf_loop / pm_loop / gm_loop / pm_loop_first / phref_dev / phref_ok;
# the Spectre lane composes a native `stb` off the same marker.
# FSTART = 0.01 is the SE-corpus class value (see the stb template's "CHOOSING FSTART");
# this cell's dominant pole is low (ugf only 300 kHz) but the DC pole is at true DC, so the
# phase-reference guard has ample headroom (measured |phref_dev| ~ 0 at 0.01 Hz).
# CROSSCHECK (MEASURED ihp-sg13g2 tt, 2026-08-01, against same-day fresh ac_open_loop):
# pm_loop 88.94469 vs pm 88.98885 (delta 0.044 deg — same loop); ugf_loop 300257.3 vs ugf
# 300205.7 (delta 0.02 %); loopgain_db 52.36059 vs dcgain 52.18988 (0.17 dB gap — NOT the
# phref mechanism, phref_dev = -8e-4 deg; small bench-config residual between the buffer
# probe and the open-loop bias wrap). gm_loop = -999 sentinel = the loop phase never
# reaches -180 deg in-band (single dominant pole, PM ~ 89 deg) — correct behavior, not a
# failure, which is why gm_loop_db carries NO spec in datasheet.yaml.
# `produces:` names DATASHEET METRIC IDS: this branch registers the four loop metrics in
# _shared/classes/amplifier/metrics.yaml canonical_metrics and datasheet.yaml binds them.
schema: spicexplorer/analysis@1
id: stb
template: stb
description: "Loop gain (stb) of the unity buffer — loopgain_db/ugf_loop/pm_loop/gm_loop; Middlebrook injection at VIPRB on ngspice, native stb on Spectre."
# FSTART 0.01 -> 1e-4 (2026-08-04): the stb bench anchors phase at its first swept point and
# blanks pm_loop/gm_loop to the -999 sentinel when |phref_dev| > 30 deg. For a high-gain amp
# the dominant pole f_p = UGF/A0 is sub-Hz, so 0.01 Hz already sits PAST it — and because
# every stabilising move lowers UGF (hence f_p), the guard fires HARDER on a correct fix than
# on the broken design. Measured on amp_006@gf180: the committed (unstable) sizing reports
# pm_loop -16.5, while the stabilised one reports -999 at 0.01 Hz and +66.0 at 1e-4. pm_loop
# and gm_loop are FSTART-INVARIANT; only the guard moves.
params:
  VDD: 1.5
  VCM: 0.8
  IBIAS: 5u
  CL: 10p
  FSTART: 1e-4     # class value; see the stb template's "CHOOSING FSTART"
  FSTOP: 1G
  PPD: 101
flags: []
produces: [loopgain_db, ugf_loop_hz, pm_loop_deg, gm_loop_db]
