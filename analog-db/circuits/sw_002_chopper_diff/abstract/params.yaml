schema: spicexplorer/params@1
devices:
  XM1: {l: x_dut_xm1_l, m: x_dut_xm1_m, w: x_dut_xm1_w}
  XM2: {l: x_dut_xm2_l, m: x_dut_xm2_m, w: x_dut_xm2_w}
  XM3: {l: x_dut_xm3_l, m: x_dut_xm3_m, w: x_dut_xm3_w}
  XM4: {l: x_dut_xm4_l, m: x_dut_xm4_m, w: x_dut_xm4_w}
  XM5: {l: x_dut_xm5_l, m: x_dut_xm5_m, w: x_dut_xm5_w}
  XM6: {l: x_dut_xm6_l, m: x_dut_xm6_m, w: x_dut_xm6_w}
  XM7: {l: x_dut_xm7_l, m: x_dut_xm7_m, w: x_dut_xm7_w}
  XM8: {l: x_dut_xm8_l, m: x_dut_xm8_m, w: x_dut_xm8_w}
groups:
- name: legs_nmos
  kind: shared_geometry
  members: [XM1, XM3, XM5, XM7]
  tie: [w, l, m]
  description: The NMOS halves of all four transmission gates (straight XM1/XM3, cross XM5/XM7) — no shared
    source/drain net (parallel signal paths), but all legs must match for symmetric on-resistance and
    charge injection on the differential signal in both chopper phases.
- name: legs_pmos
  kind: shared_geometry
  members: [XM2, XM4, XM6, XM8]
  tie: [w, l, m]
  description: The PMOS halves of all four transmission gates (straight XM2/XM4, cross XM6/XM8) — same
    leg-matching argument as legs_nmos; the n and p halves stay independent (different mobility).
