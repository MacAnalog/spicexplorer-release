# Analysis binding: loop-gain / stability probe of the DIFFERENTIAL loop (class stb_diff
# template — this cell is fully differential with voutp/voutn, so the SE unity-buffer probe
# does not fit). The differential unity feedback is closed by the template's CM-pinned VCVS
# network (input CM held at VCM = the ac_open_loop operating point) and the loop is broken
# by antiphase Middlebrook injection at the VIPRB/VIPRBM marker pair; the probed
# transmission is exactly Add, so pm_loop here crosschecks ac_open_loop's pm_deg.
# NOTE this loop is MARGINAL at the current sizing + CL=10p: fresh ac_open_loop (2026-08-01)
# reads pm = 22.49 deg / ugf = 10.32 MHz (the scoreboard's pm 73.9 / ugf 22.35M predates the
# CL=10p standardization) — expect pm_loop ~ 22 deg, an honest FAIL of the 60-deg spec.
# gm_loop = -999 would be CORRECT sentinel behavior (no phase crossover in-band), not a
# failure. FSTART 0.01 is the SE-corpus class value (see stb.spice "CHOOSING FSTART"); this
# cell's dominant pole sits well above it, so the phase-reference guard has wide headroom.
# NO Spectre lane: stb_diff has no spectre-benches.yaml entry (a native differential stb
# needs a diffstbprobe pair — template header).
schema: spicexplorer/analysis@1
id: stb
template: stb_diff
description: "Differential loop gain (stb) — loopgain_db/ugf_loop/pm_loop/gm_loop by antiphase Middlebrook injection at the VIPRB/VIPRBM pair (ngspice only)."
# FSTART 0.01 -> 1e-4 (2026-08-04): the stb bench anchors phase at its first swept point and
# blanks pm_loop/gm_loop to the -999 sentinel when |phref_dev| > 30 deg. For a high-gain amp
# the dominant pole f_p = UGF/A0 is sub-Hz, so 0.01 Hz already sits PAST it — and because
# every stabilising move lowers UGF (hence f_p), the guard fires HARDER on a correct fix than
# on the broken design. Measured on amp_006@gf180: the committed (unstable) sizing reports
# pm_loop -16.5, while the stabilised one reports -999 at 0.01 Hz and +66.0 at 1e-4. pm_loop
# and gm_loop are FSTART-INVARIANT; only the guard moves.
params:
  VDD: 1.2
  VCM: 0.6
  CL: 10p
  FSTART: 1e-4     # class value; see the stb template's "CHOOSING FSTART"
  FSTOP: 1G
  PPD: 101
flags: []
produces: [pm_loop_deg, loopgain_db, ugf_loop_hz, gm_loop_db]
