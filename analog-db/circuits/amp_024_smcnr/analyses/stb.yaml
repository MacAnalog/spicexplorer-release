# Analysis binding for the SELF-BIASED SMCNR two-stage (5-port AnalogGym convention, no
# ibias port — the 100 nA sink is internal) — uses the class's ibias-free template variant so
# no external current source is left driving a dangling node.
# Loop-gain / stability probe in the unity buffer: ngspice does Middlebrook voltage injection
# at the VIPRB marker (`alter @VIPRB[acmag]=1` in .control — netlist bytes unchanged); the
# Spectre lane composes a native `stb stb probe=VIPRB` off the same marker. Injection at the
# DC-short keeps the op point the CLOSED-loop buffer one, so this bench needs none of the
# biaswrap this amp's ac_open_loop needs.
# FSTART = 0.01 Hz is the class value (see the stb template's "CHOOSING FSTART").
# CROSSCHECK (FRESH, ihp-sg13g2 tt 2026-08-01, both benches at CL=10p): pm_loop 58.215 vs
# ac_open_loop pm 58.088 (0.13 deg — two independent routes to the same loop; the biaswrap
# Lfb/Cin shifts the open-loop read slightly), ugf_loop 150.73k vs ugf 152.03k (~0.9%),
# loopgain_db 69.36742 vs dcgain 69.3674 (agree to every printed digit). gm_loop = 26.535 dB
# at the in-band -180 deg crossing (a real measured crossing, not the sentinel);
# phref_dev = -0.0096 deg, phref_ok = 1.
# REPORTING: `produces:` names DATASHEET METRIC IDS (analysis.schema.json) — the campaign's
# owner decision landed the loop-gain vocabulary in _shared/classes/amplifier/metrics.yaml,
# and this circuit's datasheet.yaml binds all four off this analysis (extract.meas = the
# ngspice measure names loopgain_db / ugf_loop / pm_loop / gm_loop; the Spectre bench's
# gm_loop_db name split is absorbed there). Only pm_loop_deg carries a spec (min 60,
# mirroring the existing pm_deg floor). pm_loop = -999 is the "no crossing" sentinel,
# phref_ok = 0 says the phase-reference guard tripped.
schema: spicexplorer/analysis@1
id: stb
template: stb_selfbias
description: "Loop gain (stb) of the unity buffer — loopgain_db/ugf_loop/pm_loop/gm_loop; Middlebrook injection at VIPRB on ngspice, native stb on Spectre."
# FSTART 0.01 -> 1e-4 (2026-08-04): the stb bench anchors phase at its first swept point and
# blanks pm_loop/gm_loop to the -999 sentinel when |phref_dev| > 30 deg. For a high-gain amp
# the dominant pole f_p = UGF/A0 is sub-Hz, so 0.01 Hz already sits PAST it — and because
# every stabilising move lowers UGF (hence f_p), the guard fires HARDER on a correct fix than
# on the broken design. Measured on amp_006@gf180: the committed (unstable) sizing reports
# pm_loop -16.5, while the stabilised one reports -999 at 0.01 Hz and +66.0 at 1e-4. pm_loop
# and gm_loop are FSTART-INVARIANT; only the guard moves.
params:
  VDD: 1.5
  VCM: 0.5
  CL: 10p
  FSTART: 1e-4     # class value; see the stb template's "CHOOSING FSTART"
  FSTOP: 1G
  PPD: 101
flags: []
produces: [pm_loop_deg, loopgain_db, ugf_loop_hz, gm_loop_db]
