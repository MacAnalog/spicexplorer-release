  freeze: true
  is_integer: true

# Per-PDK re-bias (platform convention: analyses params are the AUTHORED operating point;
# per-PDK deltas live here). amp_026 is authored on the ihp-sg13g2 1.2 V lv rail; sky130's
# 1v8 core devices (nfet vth ~0.65, pfet |vth| ~0.85) are dead at 1.2 V (i_supply ~2 nA,
# outputs railed). Re-biased to the sky130 nominal 1.8 V rail. VCM picked via a coarse dc
# sweep at 1.8 V: the fold-node interior window is VCM ~0.55-0.9 (above ~0.9 the PMOS tail
# rails); 0.6 leaves ~0.13 V tail VSD headroom. vb1..vb4 defaults re-tuned above to match.
analysis_params:
  VDD: 1.8
  VCM: 0.6
