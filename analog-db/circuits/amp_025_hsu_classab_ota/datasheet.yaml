schema: spicexplorer/datasheet@1
cace_format: '5.2'
default_conditions:
  supply:
    unit: V
    typical: 1.2
  cload:
    unit: fF
    typical: 10000
  corner:
    typical: tt
  temp:
    unit: degC
    typical: 27
  vcm:
    unit: V
    typical: 0.6
metrics:
  dc_gain_db:
    display: DC open-loop differential gain
    description: Differential large-signal DC gain, vdb(voutp,voutn); folded-mirror
      stage into the class-AB output
    unit: dB
    analysis: ac_open_loop
    extract:
      meas: dcgain
    spec:
      min: 60
      unit: dB
  ugf_hz:
    display: Unity-gain frequency
    unit: Hz
    analysis: ac_open_loop
    extract:
      meas: ugf
    spec:
      unit: Hz
      min: 5000000.0
  pm_deg:
    display: Phase margin
    description: Miller-Rz compensated (C1/R1 per side, class-AB battery midnode to
      drive node)
    unit: deg
    analysis: ac_open_loop
    extract:
      meas: pm
    spec:
      unit: deg
      min: 60.0
      max: 90
  vos:
    display: Output offset
    description: voutp - voutn at matched DC inputs; the residual of the behavioral
      CMFB servo
    unit: V
    analysis: dc_op
    extract:
      meas: vos
    spec:
      min: -50e-3
      max: 50e-3
      unit: V
  i_supply:
    display: Supply current
    unit: A
    analysis: dc_op
    extract:
      meas: i_supply
    spec:
      max: 500e-6
      unit: A
  vn_in_integrated:
    display: Total integrated input-referred noise (1 Hz - 1 MHz, FD follower)
    description: ngspice inoise_total is volts rms already integrated over the swept
      band (standardized 1 Hz - 1 MHz, closed-loop bias config, CL=10p) \u2014 the paper's
      uniform noise column. Replaces the old vn_in entry, which bound the SAME measure
      (already unit V here) over the narrower 1 Hz - 10 MHz band with a spec the cell
      already failed (1.16 mV vs max 1 mV); report-only under the standardized band.
    unit: V
    analysis: noise
    extract:
      meas: inoise_total
  t_settle:
    display: Settling time
    description: Unity-gain differential-follower settling (see tran_step_diff.spice)
    unit: s
    analysis: tran_step
    extract:
      meas: t_settle
    spec:
      max: 1.0e-05
      unit: s
  thd_pct:
    display: Total harmonic distortion (50 mV @ 100 kHz, FD follower)
    description: tran + in-deck coherent DFT in the differential unity-feedback
      follower (thd_diff); F0 grid set by the fresh 10.3 MHz ugf (CL=10p); ASIG=0.05
      low-swing-core drive. Live only with the cout_val=10p CM-servo fix, and an
      HONEST FAIL at this sizing — the core's linear window is tiny (gain_tone 1.69
      vs healthy ~1.94, ~12 % THD; see analyses/thd.yaml).
    unit: '%'
    analysis: thd
    extract:
      meas: thd_pct
      f0: 1.0e5
    spec:
      max: 2.0
      unit: '%'
  iip3_dbv:
    display: Input IP3 (two-tone 90/100 kHz, 6.25 mV/tone, FD follower)
    description: Single-point IM3 extrapolation, tran + coherent DFT (iip3_diff);
      campaign drive 6.25 mV/tone. ampl_in below MUST track the analysis binding's
      ASIG (it is the intercept's input reference). HONEST FAIL at this sizing
      (-26.3 dBV, tt) — the core is grossly nonlinear (a_im3 only ~10.6 dB above the
      real >=9th-order product floor; see analyses/iip3.yaml), so read this as an
      upper bound.
    unit: dBV
    analysis: iip3
    extract:
      meas: iip3_dbv
      f1: 9.0e4
      f2: 1.0e5
      ampl_in: 0.00625
    spec:
      min: -10
      unit: dBV
  pm_loop_deg:
    display: Loop phase margin (stb, differential loop)
    description: Phase margin of the antiphase-Middlebrook-probed differential loop
      (stb_diff); crosschecks ac_open_loop's pm_deg — both probe Add at the same OP.
      Marginal at the current sizing + CL=10p (fresh ac_open_loop pm = 22.5 deg), so
      this spec honestly FAILS. -999 sentinel = no crossover (fails the min spec by
      design).
    unit: deg
    analysis: stb
    extract:
      meas: pm_loop
    spec:
      min: 60
      unit: deg
  loopgain_db:
    display: DC loop gain (stb, differential loop)
    description: Loop-gain magnitude read at FSTART; crosschecks ac_open_loop's
      dcgain on this cell. Report-only.
    unit: dB
    analysis: stb
    extract:
      meas: loopgain_db
  ugf_loop_hz:
    display: Loop unity-gain frequency (stb)
    unit: Hz
    analysis: stb
    extract:
      meas: ugf_loop
  gm_loop_db:
    display: Loop gain margin (stb)
    description: Gain margin at the phase crossover. -999 sentinel = no phase
      crossover in-band. Report-only.
    unit: dB
    analysis: stb
    extract:
      meas: gm_loop
  cmrr_db:
    display: Common-mode rejection (differential figure)
    description: 'CMRR of the CM-pinned differential unity-feedback loop, DC-band
      floor (cmrr_vcm_diff). NO spec ON PURPOSE: on this perfectly symmetric FD
      netlist the differential response to a CM ride is solver round-off and the
      figure saturates at the ~250-300 dB resolution cap — a min-spec would silently
      pass any cell. The physical discriminator is cmrr_cm_db (the CM loop''s
      rejection), which rides the scoreboard analyses block.'
    unit: dB
    analysis: cmrr_vcm
    extract:
      meas: cmrr_db
  cmrr_cm_db:
    display: CM-loop rejection of a CM ride (cmrr_vcm)
    description: Output-CM response to the same 1 V CM ride — the always-physical,
      discriminating rejection figure. NO spec — report-only companion to cmrr_db
      (whose differential figure is solver-capped on symmetric FD netlists).
    unit: dB
    analysis: cmrr_vcm
    extract:
      meas: cmrr_cm_db
  psrr_vdd_db:
    display: Positive-supply rejection (differential figure)
    description: 'PSRR+ of the CM-pinned differential unity-feedback loop, DC-band
      floor (psrr_vdd_diff). NO spec ON PURPOSE: on this perfectly symmetric FD
      netlist the supply disturbs both half-circuits identically, so the differential
      figure saturates at the ~250-300 dB solver-resolution cap — a min-spec would
      silently pass any cell. The physical discriminator is psrr_cm_db (the CM path''s
      supply rejection), which rides the scoreboard analyses block.'
    unit: dB
    analysis: psrr_vdd
    extract:
      meas: psrr_vdd_db
  psrr_cm_db:
    display: CM-path supply rejection (psrr_vdd)
    description: Output-CM supply rejection through the cell's CM path + CMFB —
      the always-physical, discriminating figure. NO spec — report-only companion
      to psrr_vdd_db (whose differential figure is solver-capped on symmetric FD
      netlists).
    unit: dB
    analysis: psrr_vdd
    extract:
      meas: psrr_cm_db
  zcm_lf_ohm:
    display: CM output impedance (low frequency)
    description: "Closed-loop common-mode output impedance at FSTART \u2014 the CM\
      \ servo's stiffness (characterization bound, loose sanity band)"
    unit: ohm
    analysis: ac_cm_reg
    extract:
      meas: zcm_lf_ohm
    spec:
      max: 100e3
      unit: ohm
  cm_peaking_db:
    display: CM impedance peaking
    description: "20log10(Zcm_peak/Zcm_lf) \u2014 >6 dB flags an underdamped CM loop\
      \ (the external signature of poor CM phase margin; internal T_cm needs a composed\
      \ loop probe)"
    unit: dB
    analysis: ac_cm_reg
    extract:
      meas: cm_peaking_db
    spec:
      max: 6
      unit: dB
  cm_resid_v:
    display: CM kick residual
    description: "vocm displacement after the CM current kick releases. OP-DEPENDENT\
      \ (2026-07-17 polarity audit): the behavioral CMFB has a SECOND stable DC equilibrium\
      \ (vcmfb railed to ~+42 V, XM12/XM13 cut off) and the plain-seeded DC solver\
      \ reaches it intermittently (card-order sensitive); a range-reference series\
      \ bias seeds the good OP in an isolated deck but does not eliminate the second\
      \ equilibrium in the sorted committed deck. The output-CM node is hyper-sensitive\
      \ to the load-gate voltage (cascoded high-Z), so a stable low-gain servo can't\
      \ hold it and the high-gain servo is under-damped \u2014 proper CMFB loop compensation\
      \ is the open sizing task. Treat this and t_cm_settle as indicative, not signed-off."
    unit: V
    analysis: tran_cm_kick
    extract:
      meas: cm_resid_v
    spec:
      min: -5e-3
      max: 5e-3
      unit: V
  t_cm_settle:
    display: CM kick recovery time
    description: "OP-dependent (see cm_resid_v) \u2014 the behavioral CMFB's second\
      \ railed equilibrium makes the committed CM-bench numbers solver-path sensitive;\
      \ proper CMFB compensation is an open sizing follow-up."
    unit: s
    analysis: tran_cm_kick
    extract:
      meas: t_cm_settle
    spec:
      max: 5e-6
      unit: s
notes: "2026-08-01 large-signal binding campaign: the note-(1) servo fix is now APPLIED\
  \ as cout_val 100f -> 10p (10p = the declared knob max; 100p is out of bounds —\
  \ measured equivalent for stability here): at 100f even the QUIESCENT one-wire follower\
  \ walks vcmfb to a rail within 20 us, killing tran_step/thd/iip3; at 10p quiescent is\
  \ bit-stable and the step tracks. Fresh ac_open_loop at the CL=10p standardization reads\
  \ pm 22.5 deg / ugf 10.3 MHz (the old scoreboard 73.9 deg / 22.35 MHz predates CL=10p)\
  \ — pm_deg/pm_loop_deg now honestly FAIL; re-compensation for CL=10p is an open\
  \ sizing task. THD/IIP3: the core's linear window is tiny (gain collapses with drive);\
  \ thd bound at the low-swing ASIG=0.05.\n2026-07-18/19 dual-engine campaign findings (drawings/SIZING_VALIDATION_REPORT.md;\
  \ machine copy drawings/sizing-and-specs.yaml ccia_01_two_stage_ota_core): (1) the\
  \ under-damped behavioral CMFB has a MEASURED fix candidate \u2014 servo cout_val\
  \ 100f -> 100p (100f lets a 100 nA CM kick escape the interior basin; 100p regulates\
  \ and kick-recovers at both seed and this sizing) \u2014 apply on the next re-lower.\
  \ (2) An optimizer fine-tune (3 campaigns, 800 loops total) plateaus at 38.8 dB:\
  \ the 55-60 dB gain target is a TOPOLOGY limit of this two-stage class-AB core at\
  \ 1.2 V (needs cascoding), not a sizing miss; the winner is NOT adopted here \u2014\
  \ its DC solution is a bistable knife-edge (verifies only at full-precision knob\
  \ values; preserved in sizing-and-specs.yaml). (3) tsmc-n65 context: achievable\
  \ output-CM window [0.61, 1.04] (vcmfb_ref must move to ~0.8 there), ~28.9 dB at\
  \ the LVT gm/gds ceiling. (4) The entry schematic copy was re-pointed to the -inv\
  \ shared CMFB block (B5 decision-A fanout) \u2014 polarity unchanged vs the frozen\
  \ netlist."
