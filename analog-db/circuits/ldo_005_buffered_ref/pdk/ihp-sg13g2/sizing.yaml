# Sizing for the ihp-sg13g2 binding — generated by `analog-db add-binding` from the
# gf180mcu sizing (geometry re-noted to ihp-sg13g2's unit convention + bin-clamped).
# A starting point; re-tune defaults/bounds for ihp-sg13g2 device physics as needed.
schema: spicexplorer/sizing@1
pdk: ihp-sg13g2
variables:
- name: x_dut_xmra_bp_w
  description: Ref-amp self-bias PMOS diode (sets its whole bias current)
  default: 5u
  min: 2u
  max: 64u
  unit: m
- name: x_dut_xmra_bp_l
  description: Ref-amp self-bias PMOS length
  default: 2u
  min: 0.5u
  max: 10u
  unit: m
- name: x_dut_xmra_b0_w
  description: Ref-amp mirror-rail NMOS diode (unit device)
  default: 12u
  min: 2u
  max: 100u
  unit: m
- name: x_dut_xmra_b0_l
  description: Ref-amp mirror-rail length (shared by tail + output sink)
  default: 2u
  min: 0.5u
  max: 10u
  unit: m
- name: x_dut_xmra_bc_w
  description: Ref-amp tail sink (stage-1 current)
  default: 8.316u
  min: 2u
  max: 100u
  unit: m
- name: x_dut_xmra_bo_w
  description: Ref-amp stage-2 sink (output-stage current)
  default: 4u
  min: 2u
  max: 100u
  unit: m
- name: x_dut_xmra_1_w
  description: Ref-amp input pair width (XRA1/XRA2 matched)
  default: 86.42u
  min: 4u
  max: 100u
  unit: m
- name: x_dut_xmra_1_l
  description: Ref-amp input pair length
  default: 0.7u
  min: 0.28u
  max: 10u
  unit: m
- name: x_dut_xmra_3_w
  description: Ref-amp PMOS mirror load (XRA3/XRA4 matched - mismatch here IS offset)
  default: 20u
  min: 2u
  max: 100u
  unit: m
- name: x_dut_xmra_3_l
  description: Ref-amp PMOS mirror load length
  default: 1u
  min: 0.28u
  max: 10u
  unit: m
- name: x_dut_xmra_5_w
  description: Ref-amp stage-2 common-source PMOS
  default: 37.76u
  min: 4u
  max: 100u
  unit: m
- name: x_dut_xmra_5_l
  description: Ref-amp stage-2 PMOS length
  default: 2.646u
  min: 0.28u
  max: 10u
  unit: m
- name: r_ra_z
  description: Ref-amp Miller nulling resistor
  default: 30.853k
  min: 100
  max: 100k
  unit: ohm
- name: c_ra_comp
  description: Ref-amp Miller capacitor
  default: 4.508p
  min: 0.2p
  max: 50p
  unit: F
- name: x_dut_xmea_bp_w
  description: Error-amp self-bias PMOS diode (primary power/PSRR trade knob)
  default: 8u
  min: 2u
  max: 64u
  unit: m
- name: x_dut_xmea_bp_l
  description: Error-amp self-bias PMOS length
  default: 2u
  min: 0.5u
  max: 10u
  unit: m
- name: x_dut_xmea_b0_w
  description: Error-amp mirror unit width (diode + tail + output sink share it)
  default: 50u
  min: 2u
  max: 100u
  unit: m
- name: x_dut_xmea_b0_l
  description: Error-amp mirror-rail length (all five sinks share it)
  default: 2u
  min: 0.5u
  max: 10u
  unit: m
- name: x_dut_xmea_bf_w
  description: Error-amp mirror_f sink (level-shifter anchor, ~0 current by design)
  default: 5u
  min: 1u
  max: 40u
  unit: m
- name: x_dut_xmea_1_w
  description: Error-amp input pair width (XEA1/XEA2 matched)
  default: 68.542u
  min: 4u
  max: 100u
  unit: m
- name: x_dut_xmea_1_l
  description: Error-amp input pair length
  default: 0.45u
  min: 0.28u
  max: 10u
  unit: m
- name: x_dut_xmea_3_w
  description: Error-amp level-shifted PMOS mirror (XEA3/XEA5 matched)
  default: 30u
  min: 4u
  max: 100u
  unit: m
- name: x_dut_xmea_3_l
  description: Error-amp PMOS mirror length
  default: 0.45u
  min: 0.28u
  max: 10u
  unit: m
- name: x_dut_xmea_4_w
  description: Error-amp M4 compound-diode level shifter (~zero DC current)
  default: 10u
  min: 2u
  max: 100u
  unit: m
- name: x_dut_xmea_4_l
  description: Error-amp M4 length
  default: 0.5u
  min: 0.28u
  max: 10u
  unit: m
- name: x_dut_xmea_6_w
  description: Error-amp output PMOS (drives the pass gate)
  default: 8u
  min: 8u
  max: 100u
  unit: m
- name: x_dut_xmea_6_l
  description: Error-amp output PMOS length
  default: 0.45u
  min: 0.28u
  max: 10u
  unit: m
- name: r_ea_z
  description: Error-amp Miller nulling resistor - expect re-tuning against the pass gate
  default: 1k
  min: 100
  max: 100k
  unit: ohm
- name: r_ea_nd
  description: EA gate-rail tie na->nd (DC-defines ea_nd; ~0 current by design - fix 2026-07-25, see abstract netlist)
  default: 500k
  min: 10k
  max: 10MEG
  unit: ohm
- name: c_ea_comp
  description: Error-amp Miller capacitor - expect re-tuning against the pass gate
  default: 0.2p
  min: 0.2p
  max: 50p
  unit: F
- name: vref_val
  description: Internal reference voltage (ideal source; a real bandgap is vref_001_vgs)
  default: 0.8
  min: 0.3
  max: 1.5
  unit: V
- name: r_ref_top
  description: Ref-amp feedback divider top - with r_ref_bot sets vout = vref*(top+bot)/bot
  default: 100k
  min: 1k
  max: 10Meg
  unit: ohm
- name: r_ref_bot
  description: Ref-amp feedback divider bottom (100k/100k => gain 2 => vout 1.6 V)
  default: 100k
  min: 1k
  max: 10Meg
  unit: ohm
- name: r_lpf
  description: Reference low-pass filter resistor
  default: 200k
  min: 1k
  max: 1Meg
  unit: ohm
- name: c_lpf
  description: Reference low-pass filter cap (10k/10p => ~1.6 MHz corner)
  default: 10n
  min: 0.1p
  max: 10n
  unit: F
- name: x_dut_xmp_w
  description: Pass PMOS per-device width (<= the gf180 100u bin max)
  default: 20u
  min: 1u
  max: 100u
  unit: m
- name: x_dut_xmp_m
  description: Pass PMOS parallel multiplier (total W = w*m)
  default: 4
  min: 1
  max: 200
  unit: count
  is_integer: true
- name: x_dut_xmp_l
  description: Pass PMOS length (short = low dropout, but more gate cap to drive)
  default: 0.45u
  min: 0.28u
  max: 2u
  unit: m
- name: r_bleed
  description: Output bleeder / minimum-load path (the drawing's R3)
  default: 10k
  min: 1k
  max: 1Meg
  unit: ohm
- name: c_out_int
  description: On-die output capacitor (the drawing's C1); benches add their own external COUT
  default: 10p
  min: 0.1p
  max: 1n
  unit: F
