# Sizing for the tsmc-n65 binding — generated by `analog-db add-binding` from the
# ihp-sg13g2 sizing (geometry re-noted to tsmc-n65's unit convention + bin-clamped).
# A starting point; re-tune defaults/bounds for tsmc-n65 device physics as needed.
# CM centering (P3-2c, live-swept on CRN65 tt 2026-07-17): the no-CMFB output common
# mode is a gds-level knife-edge (cf. the ihp binding's xm4_w/xm8_w note) — the
# auto-converted geometry landed the output CM at the LOW rail (XM14 triode, static
# closed-loop gain ~0.08 V/V). xm4_w 4.7u→6u + xm8_w 6.2u→12u center it (XM8 vds
# -0.41 / XM14 vds +0.79, both saturated; static closed-loop gain 16 V/V vs the
# cap-ratio 20 ideal). xm4_w=8u overshoots to the HIGH rail — the edge is that sharp.
schema: spicexplorer/sizing@1
pdk: tsmc-n65
variables:
- name: x_dut_xm1_w
  description: Main tail current source width (PMOS, gate vb4)
  default: 5.629u
  min: 0.15u
  max: 100u
  unit: m
- name: x_dut_xm1_l
  description: vb4 current-source length (shared with XM6/XM7/XM8/XM9)
  default: 1u
  min: 0.13u
  max: 10u
  unit: m
