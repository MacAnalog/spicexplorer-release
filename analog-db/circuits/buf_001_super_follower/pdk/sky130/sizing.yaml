# Sizing for the sky130 binding — geometry re-noted to sky130's bare-µm convention
# (.option scale=1u) and clamped to the sky130 W/L bin floor (min_w 0.42, min_l 0.15).
# Same symbols + ratios as the ihp binding. The cap value stays in farads.
schema: spicexplorer/sizing@1
pdk: sky130
variables:
  - {name: x_dut_xm1_w,  description: "Input follower width (per finger, m=4)", default: 8,  min: 0.42, max: 200, unit: m}
  - {name: x_dut_xm2_w,  description: "Feedback sink width (per finger, m=4)",  default: 8,  min: 0.42, max: 200, unit: m}
  - {name: x_dut_xmrn_w, description: "NMOS bias mirror width",          default: 4,   min: 0.42, max: 100, unit: m}
  - {name: x_dut_xmpd_w, description: "PMOS mirror diode width",         default: 8,   min: 0.42, max: 100, unit: m}
  - {name: x_dut_xmpb_w, description: "PMOS source width (per finger, m=6)",    default: 8,  min: 0.42, max: 200, unit: m}
  - {name: x_dut_xm1_l,    description: "NMOS length",                     default: 0.3, min: 0.15, max: 20, unit: m}
  - {name: x_dut_xmpd_l,    description: "PMOS length",                     default: 0.3, min: 0.15, max: 20, unit: m}
  - {name: x_cc,     description: "Feedback-node compensation cap (F)", default: 250e-15, min: 50e-15, max: 2e-12, unit: F}
  # Frozen per-device literals (P4 atomic sweep): defaults reproduce the authored
  # netlist literals exactly; freeze keeps them out of the search space.
  - {name: x_dut_xm1_m, description: "XM1 m (frozen literal)", default: 4, min: 1, max: 16, freeze: true, is_integer: true}
  - {name: x_dut_xm2_m, description: "XM2 m (frozen literal)", default: 4, min: 1, max: 16, freeze: true, is_integer: true}
  - {name: x_dut_xmrn_m, description: "XMRN m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
  - {name: x_dut_xmns_m, description: "XMNS m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
  - {name: x_dut_xmpd_m, description: "XMPD m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
  - {name: x_dut_xmpb_m, description: "XMPB m (frozen literal)", default: 6, min: 1, max: 16, freeze: true, is_integer: true}
# Per-PDK bench overrides: sky130's higher vth (+body effect on the follower) moves the valid
# bias window (M1 AND M2 saturated) up to ~1.05.
analysis_params:
  VCM: 1.05
