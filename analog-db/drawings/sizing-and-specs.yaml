# drawings/ — consolidated sizing + measured specs (2026-07-18/19 dual-engine campaign)
# [REFERENCE] Machine-readable companion to SIZING_VALIDATION_REPORT.md (prose/method)
# and DRAWING_REVIEW.md §8 (per-block sweep verdicts). Conventions:
#   - engines: ngspice = native ihp-sg13g2 tt 27C; spectre = tsmc-n65 tt via the
#     operator's NDA-neutral wrapper (no kit data in this file).
#   - widths are xschem TOTAL widths (ng=1 everywhere, so per-finger == total).
#   - full_precision values are AUTHORITATIVE where given (amp_025's DC solution is
#     bistable — rounded knobs land in the wound-servo basin; keep all digits).
#   - behavioral macromodel params are testbench-supplied globals, not geometry.
schema: spicexplorer/drawings-sizing-specs@1
campaign: 2026-07-18/19

shared:
  transmission_gate_pair:
    sizing: {drawn: "w=0.15u l=0.13u (all four devices, min-size)"}
    specs:
      ngspice: {ron_at_vcm0p6: 26.6k, ron_min: 3.40k, ron_max: 31.2k,
                off_leak_1v: 272f_A, off_r_equiv: ">3.7T"}
      spectre: {port: "verify+netcheck+simcheck OK (smoke block)"}
  chopper_diff:
    specs:
      ngspice: {phase_A_diff_out: +97.44m, phase_B_diff_out: -97.44m,
                input: "±50 mV diff", cm_preserved: 0.5998}
  capbank:
    parameterization: "BINARY (owner decision 2026-07-19): all caps value=Cu (TB must
      .param Cu; default bench value 1p); weighting structural via m — C1 fixed m=1,
      C2(D0) m=1, C3(D1) m=2, C4(D2) m=4 → C_eff=(1+code)*Cu"
    specs:
      ngspice: {ceff_code0_to_7: "1p..8p exact steps @ Cu=1p, all 8 distinct/monotonic"}
      spectre: "STALE cellview (pre-binary). Re-port needs an m-aware capa map rule
        (xvport maps only value→c; m=2/4 would silently drop)"
  ideal_macromodels:
    params_default: {gm_val: 100u, rout_val: 10Meg, rin_val: 1T, cout_val: 100f,
                     cin_val: 10f, Rm: 1Meg}
    notes:
      - "ideal-amp-fully-diff: A=gm*rout=60 dB, pole 159 kHz @ defaults (measured exact)"
      - "vcm-detector: Rout=Rm/2=500k — load with >>Meg or sensed CM divides away"
      - "cmfb-output-ideal-amp = A*(sensed-vref) (slope +1000); -inv = A*(vref-sensed)
         (slope -1000) — pick by plant parity (dc_cmfb_plant_sign template)"
      - "servo compensation per consumer: SRMC loops cout_val=100f OK;
         ccia-01 core REQUIRES cout_val=100p (100f under-damped, kick escapes)"
      - "UNCLAMPED servo caveat: winds 10s-100s V out of rail on wrong polarity /
         dead actuator; rail-clamped variant is an open follow-up"
      - "gm_val=100u cannot drive the SRMC 1k R-network — stiff-gm (100m) variant or
         duty-scaled R_eff for design-intent filter numbers"
  real_5t_cmfb:    # 2026-07-20: REAL transistor-level CMFB (replaces ideal servos)
    accessions: "LANDED same day into the NEW `cmfb` class (owner decision: CMFB out
      of the generic support toolbox): cmfb_002_5t_pmos_input + cmfb_003_5t_nmos_input
      (this section's winners = their sizing.yaml defaults); the ideal servo re-classed
      sup_002 -> cmfb_001_ideal_rsense_servo; class suite = dc_cmfb_transfer /
      ac_servo / tran_cmfb_step (signed-polarity-first metrics)"
    blocks: "amp-single-ended-5t-{nmos,pmos}-input (5T OTA + on-cell 2-diode bias
      string, no external bias pin) wrapped by cmfb-output-amp-5t-{nmos,pmos}-input
      (+ -inv swapped-input variants for non-inverting plants); pin footprint ==
      the ideal pair, so consumer swap is a pure symbol-path change"
    polarity_check: "standalone dc sweep, vref=0.5: canonical slopes +14.0 (nmos) /
      +9.4 (pmos) at drawn min sizes; -inv mirrors -14.4 / -9.5"
    sizing:        # per-flavor Nevergrad (TwoPointsDE ~400 evals) INSIDE the sized
                   # SRMC core (amp_031 winner); objective: CM error + PM/gain/UGF
                   # + kick stability + supply current. ROUNDED 3-sigfig values
                   # reproduce winner metrics EXACTLY (not bistable) and are
                   # committed in the .sch files == authoritative.
      pmos_input_winner:   # CHOSEN for the SRMC consumer (score 3.40 vs 9.24)
        rounded:  {M4_M5_in_pair: {w: 1.42u, l: 0.27u}, M6_M2_mirror: {w: 2.32u, l: 1.31u},
                   M1_tail: {w: 0.329u, l: 0.267u}, M7_bias_n: {w: 0.293u, l: 0.22u},
                   M3_bias_p: {w: 0.881u, l: 0.259u}}
        full_precision: {w_in: 1.419591579583896e-06, l_in: 2.702704038778698e-07,
                         w_ld: 2.31687239723547e-06, l_ld: 1.3149955825715198e-06,
                         w_tl: 3.2905455692948113e-07, l_tl: 2.6723717947101066e-07,
                         w_bn: 2.9338747721699096e-07, l_bn: 2.197389297254071e-07,
                         w_bp: 8.810417092668546e-07, l_bp: 2.588371059138098e-07}
      nmos_input_winner:   # validated secondary (score 9.24)
        rounded:  {M1_M2_in_pair: {w: 0.349u, l: 0.834u}, M3_M4_mirror: {w: 0.218u, l: 1.19u},
                   M8_tail: {w: 18u, l: 0.484u}, M5_bias_n: {w: 1.57u, l: 0.276u},
                   M6_bias_p: {w: 0.178u, l: 1.07u}}
        full_precision: {w_in: 3.4903239196781644e-07, l_in: 8.341771390511717e-07,
                         w_ld: 2.1823337088892705e-07, l_ld: 1.1859387512834458e-06,
                         w_tl: 1.796259990247479e-05, l_tl: 4.843900559777285e-07,
                         w_bn: 1.5731041622020363e-06, l_bn: 2.7551084347372647e-07,
                         w_bp: 1.7819354009811655e-07, l_bp: 1.0741148873300073e-06}
    specs:   # in-loop, sized SRMC core, both loops real, VDD 1.2, refs 0.5, 200us windows
      ngspice_pmos_sized: {cm_err: "3.6/2.1 mV (loop1/loop2)", servos: "0.215/0.318 in-rail",
                           dcgain_db: 54.72, ugf: 76.9Meg, pm_deg: 58.9, i_supply: 116.4u,
                           kick_resid: "0.000/0.000 mV BOTH loops"}
      ngspice_nmos_sized: {cm_err: "3.8/4.8 mV", dcgain_db: 54.72, ugf: 76.9Meg,
                           pm_deg: 58.9, i_supply: 112.9u, kick_resid: "0.000/0.000 mV"}
      drawn_min_baseline: {cm_err: "~35 mV", pm_deg: "43-47", note: "loops stable even
        at min size; low servo gain (9-14) costs static CM error, which starves the
        output stage and eats PM"}
    notes:
      - "RAIL-CLAMPED BY CONSTRUCTION: both CM kicks recover with zero residual —
         closes the ideal-servo loop-1 basin-escape finding AND the 'rail-clamped
         variant' open item for this consumer (ideal blocks keep the caveat)"
      - "real-amp static CM error = (needed actuator gate - amp natural output)/A_servo;
         the pmos flavor's natural output 0.502 sits closest to the needed 0.215/0.318"

