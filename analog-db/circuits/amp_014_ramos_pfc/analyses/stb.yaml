# Analysis binding for the SELF-BIASED 3-stage PFC OTA (no ibias port) — uses the class's
# ibias-free template variant so no external current source is left driving a dangling node.
# Loop-gain / stability probe in the unity buffer: ngspice does Middlebrook voltage injection
# at the VIPRB marker (`alter @VIPRB[acmag]=1` in .control — netlist bytes unchanged); the
# Spectre lane composes a native `stb stb probe=VIPRB` off the same marker. Injection at the
# DC-short keeps the op point the CLOSED-loop buffer one, so this bench needs none of the
# biaswrap this amp's ac_open_loop needs (the AnalogGym Lfb/Cin wrap only conditions the
# UNWRAPPED open-loop bias).
# FSTART = 0.01 Hz is the class value (see the stb template's "CHOOSING FSTART" — the lowest
# FSTART at which every single-ended amp of this corpus clears the 30-deg phase-reference
# guard). MEASURED CROSS-CHECK @ ihp-sg13g2 tt (2026-08-01, landed sizing): pm_loop =
# 81.509 deg vs the same-run ac_open_loop pm = 81.986 deg (delta 0.48 deg — two independent
# routes onto the same loop, well inside the ~2 deg campaign gate; the biaswrap Lfb/Cin
# shifts the open-loop read slightly); loopgain_db = 102.098 vs dcgain 102.098 (exact);
# ugf_loop = 1.9399 MHz vs ugf 1.9417 MHz (0.1%). gm_loop = +15.34 dB is a REAL margin: the
# 3-stage PFC loop phase does cross -180 deg in-band with |T| already 15 dB under 0 dB.
# pm_loop_first = pm_loop (single 0 dB crossing); phref_dev = -0.042 deg.
# REPORTING: the measures (loopgain_db, ugf_loop, pm_loop, gm_loop, pm_loop_first, phref_dev,
# phref_ok) ride the recorded `corners.<corner>.analyses.stb.measures` block. pm_loop = -999
# is the "no crossing measured" sentinel, phref_ok = 0 says the phase reference tripped.
schema: spicexplorer/analysis@1
id: stb
template: stb_selfbias
description: "Loop gain (stb) of the unity buffer — loopgain_db/ugf_loop/pm_loop/gm_loop; Middlebrook injection at VIPRB on ngspice, native stb on Spectre."
# FSTART 0.01 -> 1e-4 (2026-08-04): the stb bench anchors phase at its first swept point and
# blanks pm_loop/gm_loop to the -999 sentinel when |phref_dev| > 30 deg. For a high-gain amp
# the dominant pole f_p = UGF/A0 is sub-Hz, so 0.01 Hz already sits PAST it — and because
# every stabilising move lowers UGF (hence f_p), the guard fires HARDER on a correct fix than
# on the broken design. Measured on amp_006@gf180: the committed (unstable) sizing reports
# pm_loop -16.5, while the stabilised one reports -999 at 0.01 Hz and +66.0 at 1e-4. pm_loop
# and gm_loop are FSTART-INVARIANT; only the guard moves.
params:
  VDD: 1.8
  VCM: 400m
  CL: 10p
  FSTART: 1e-4     # class value; see the stb template's "CHOOSING FSTART"
  FSTOP: 1G
  PPD: 101
flags: []
produces: [pm_loop_deg, loopgain_db, ugf_loop_hz, gm_loop_db]
