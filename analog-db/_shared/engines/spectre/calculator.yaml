# SKILL CALCULATOR expression table (engine-level, NDA-clean) — the ADE-calculator
# analogue for headless OCEAN evaluation of Spectre results.
#
# One named expression per row: `result` is the OCEAN *result* name selected before
# evaluation (`selectResults("<result>")` — NOT the deck's analysis name: a `dcOp dc` run
# registers as `dc`, its oppoint info file as `dcOpInfo`, a `pss pss` run as `pss_fd` +
# `pss_td`, an `stb stb` run as `stb`); `expr` is ONE SKILL line that must reduce to a
# number. `{NAME}` placeholders substitute from the render context (bench params + the
# per-bench `args:` in `_shared/classes/<class>/spectre-benches.yaml`). Signals are BARE
# names on a headless raw (`v("vout")`, never `v("/vout")`).
#
# The platform renders these into its `OceanMeasurement` runner
# (`spicexplorer.backends.spectre_templates.bench_measurements` →
# `ocean_metrics.OceanMetricsSession.measure/measure_batch`); every submission persists
# its exact SKILL as `<stem>.il` beside the metrics file, so any row here can be replayed
# by hand (`ocean -nograph < file.il`).
schema: spicexplorer/spectre-calculator@1
description: >-
  Named SKILL calculator expressions (AC gains/bandwidth, OP reads, PSS harmonic
  distortion + two-tone IIP3, STB loop-gain/phase-margin) rendered per-testbench by the
  platform's OCEAN Tier-2 metrics runner.
expressions:
  # -- AC (small-signal frequency sweep) --------------------------------------
  gain_db_at:
    result: ac
    expr: 'value(dB20(v("{OUT}")) {FREQ})'
    notes: passband/DC gain probe — dB20 of the transfer at one frequency.
  gain_lin_at:
    result: ac
    expr: 'value(mag(v("{OUT}")) {FREQ})'
    notes: >-
      LINEAR gain (V/V) at one frequency — the buffer-gain spec convention (the
      amplifier class gain_cl is V/V, e.g. 0.97..1.03, matching CACE ac_params.gain).
  neg_gain_db_at:
    result: ac
    expr: '-value(dB20(v("{OUT}")) {FREQ})'
    notes: >-
      rejection figure of the unity-buffer disturbance benches (CMRR/PSRR): the output
      residual IS the reciprocal rejection, so the figure is MINUS the residual gain.
  bw_3db:
    result: ac
    expr: 'bandwidth(v("{OUT}") 3 "low")'
  gbw:
    result: ac
    expr: 'gainBwProd(v("{OUT}"))'
  ugf:
    result: ac
    expr: 'cross(dB20(v("{OUT}")) 0 1 "falling")'
    notes: unity-gain frequency — first falling 0 dB crossing of the gain.
  pm:
    result: ac
    expr: '180 + phase(value(v("{OUT}") cross(dB20(v("{OUT}")) 0 1 "falling"))) - phase(value(v("{OUT}") {FSTART}))'
    notes: >-
      Phase margin, DC-referenced: PM = 180 + phase(UGF) − phase(DC). Correct for BOTH
      inverting and non-inverting open-loop amps. OCEAN's built-in phaseMargin() assumes a
      loop-gain wave whose phase starts at 0 and returns phase(UGF)−180 for an amp that is
      INVERTING at DC (phase(DC)≈180°) — off by 180° (live: −98.7° vs the true 81.3° on
      amp_022; this silently corrupted every inverting amp's PM in the first campaign).
      Referencing to phase at DC (= FSTART, the AC sweep start, from the render context)
      removes the convention ambiguity and matches the engine-neutral registry `pm`. Still
      open-loop only (needs a real 0 dB crossing); a closed-loop/loop-gain PM uses the stb rows.
  # -- noise (integrated RMS off the density spectrum) --------------------------
  noise_total_rms:
    result: noise
    expr: 'sqrt(integ(getData("{SIG}")*getData("{SIG}") {FSTART} {FSTOP}))'
    notes: >-
      Total integrated RMS noise (V) over [FSTART,FSTOP]. The Spectre `noise` analysis
      registers OCEAN result `noise` with bare density vectors `in` (input-referred) and
      `out` (output) in V/rtHz — SIG=in for input-referred noise, SIG=out for output.
      `getData(SIG)*getData(SIG)` (NOT `expt(...,2)`, which NaNs on a waveform) is the
      mean-square density; integ over the band then sqrt is the RMS. Cross-checks the
      Tier-1 registry `inoise_total`/`onoise_total`, and is the calculator route the
      Spectre lane uses instead of the Tier-1 PSF read (which mis-looks-up `vout`).
  # -- CM-loop health (fully-differential DUTs; the ac_cm_reg / tran_cm_kick benches) --
  cm_z_lf:
    result: ac
    expr: 'value(mag((v("{OUTP}") + v("{OUTN}"))/2) {FREQ})'
    notes: >-
      Low-frequency closed-loop CM output impedance: the ac_cm_reg deck injects a unit
      AC common-mode current (0.5 A per side), so vocm(f) IS |Zcm(f)| in ohms.
  cm_z_peaking_db:
    result: ac
    expr: 'dB20(ymax(mag((v("{OUTP}") + v("{OUTN}"))/2)) / value(mag((v("{OUTP}") + v("{OUTN}"))/2) {FREQ}))'
    notes: >-
      Zcm impedance peaking 20*log10(peak/lf) — the external signature of an
      underdamped CM loop (mirrors the ngspice template's cm_peaking_db).
  cm_kick_v:
    result: tran
    expr: '(value((v("{OUTP}") + v("{OUTN}"))/2 {TMID}) - value((v("{OUTP}") + v("{OUTN}"))/2 ({TKICK}/2.0)))'
    notes: >-
      tran_cm_kick — settled vocm displacement while the CM current kick is applied
      (vocm(TMID) - vocm(TKICK/2), the pre-kick sample instant the ngspice deck uses).
  cm_resid_v:
    result: tran
    expr: '(value((v("{OUTP}") + v("{OUTN}"))/2 {TEND}) - value((v("{OUTP}") + v("{OUTN}"))/2 ({TKICK}/2.0)))'
    notes: >-
      tran_cm_kick — vocm residual after the kick releases (~0 for a healthy loop;
      nonzero flags CM bistability/latch-up).
  cm_t_settle:
    result: tran
    expr: '(cross(abs((v("{OUTP}") + v("{OUTN}"))/2 - value((v("{OUTP}") + v("{OUTN}"))/2 {TEND})) {VTOL} -1 "falling") - {TREL})'
    notes: >-
      tran_cm_kick — recovery time from the release edge until |vocm - vocm(TEND)|
      stays below VTOL; cross(... -1 "falling") = the LAST falling crossing (the OCEAN
      analogue of the ngspice meas FALL=LAST). Live-validated against the waveform.
  # -- operating point ---------------------------------------------------------
  node_v:
    result: dc
    expr: 'v("{NODE}")'
    notes: op-point node voltage (a `dcOp dc` run registers as result `dc`).
  device_op:
    result: dcOpInfo
    expr: 'OP("{INST}" "{PARAM}")'
    notes: per-device OP scalar (gm, vdsat, region, cgg, …) from the oppoint info file.
  # -- PSS (periodic steady state; fd = per-harmonic phasors, td = one period) --
  thd_pct:
    result: pss_fd
    expr: >-
      let(((s 0.0)) for(k 2 {NHARM} s = s + expt(mag(harmonic(v("{OUT}") k)) 2))
      100.0 * sqrt(s) / mag(harmonic(v("{OUT}") 1)))
    notes: >-
      THD (percent) straight off the fd-PSF harmonic phasors — RSS of harmonics
      2..NHARM over the fundamental (same definition as the platform's
      thd_from_harmonics, so the two routes cross-check). OCEAN's own thd() wants an
      ADE-style swept-time wave and errors on a headless pss_td raw (live-verified
      2026-07-09), so the harmonic form is the calculator route.
  harmonic_db:
    result: pss_fd
    expr: 'dB20(mag(harmonic(v("{OUT}") {N})))'
    notes: absolute level of harmonic N (dBV) off the fd-PSF phasors.
  hd2_db:
    result: pss_fd
    expr: 'dB20(mag(harmonic(v("{OUT}") 2)) / mag(harmonic(v("{OUT}") 1)))'
  hd3_db:
    result: pss_fd
    expr: 'dB20(mag(harmonic(v("{OUT}") 3)) / mag(harmonic(v("{OUT}") 1)))'
  im3_dbc:
    result: pss_fd
    expr: >-
      dB20(max(mag(harmonic(v("{OUT}") {NIM3A})) mag(harmonic(v("{OUT}") {NIM3B}))) /
      min(mag(harmonic(v("{OUT}") {N1})) mag(harmonic(v("{OUT}") {N2}))))
    notes: >-
      two-tone IM3 (dBc, worse side / weaker tone — matches the platform's Python
      convention). Tones ride harmonics N1/N2 of the shared fundamental; the IM3
      products are plain harmonics NIM3A=|2·N1-N2|, NIM3B=2·N2-N1.
  iip3_dbv:
    result: pss_fd
    expr: >-
      dB20({AMPL}) - dB20(max(mag(harmonic(v("{OUT}") {NIM3A})) mag(harmonic(v("{OUT}") {NIM3B}))) /
      min(mag(harmonic(v("{OUT}") {N1})) mag(harmonic(v("{OUT}") {N2})))) / 2.0
    notes: >-
      input-referred intercept (dBV): IIP3_dBV = 20·log10(A_in) − IM3_dBc/2 (A_in =
      per-tone input amplitude AMPL).
  # -- STB (loop gain / stability) ---------------------------------------------
  # Spectre computes the margins natively (`stb.margin.stb` -> result `stb_margin`,
  # outputs phaseMargin/gainMargin/+Freq) — read THOSE, not phaseMargin(loopGain):
  # the loopGain wave carries the -T sign convention (phase starts at ±180°), which
  # shifts the generic wave-level phaseMargin() by -180 (live-verified 2026-07-10;
  # the platform registry's {meas: pm_loop} is phi0-referenced and agrees to <1°).
  pm_loop:
    result: stb_margin
    expr: 'getData("phaseMargin")'
    notes: loop phase margin (deg) — Spectre's own stb margin computation.
  gm_loop_db:
    result: stb_margin
    expr: 'getData("gainMargin")'
    notes: loop gain margin (dB) — matches the registry gain_margin_db to 4 digits live.
  loopgain_db:
    result: stb
    expr: 'value(dB20(getData("loopGain")) {FREQ})'
    notes: in-band loop-gain magnitude (dB) at one frequency (== dcgain for a unity buffer).
