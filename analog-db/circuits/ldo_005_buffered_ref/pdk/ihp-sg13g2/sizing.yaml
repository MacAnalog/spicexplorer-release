# Sizing for the ihp-sg13g2 binding — generated by `analog-db add-binding` from the
# gf180mcu sizing (geometry re-noted to ihp-sg13g2's unit convention + bin-clamped).
# A starting point; re-tune defaults/bounds for ihp-sg13g2 device physics as needed.
schema: spicexplorer/sizing@1
pdk: ihp-sg13g2
variables:
- name: x_dut_xmp_w
  description: Pass PMOS per-device width (<=bin max)
  default: 20u
  min: 0.22u
  max: 100u
  unit: m
- name: x_dut_xmp_m
  description: Pass PMOS parallel multiplier (total W = x_dut_xmp_w*x_dut_xmp_m)
  default: 20
  min: 1
  max: 200
  unit: count
  is_integer: true
- name: x_dut_xmp_l
  description: Pass PMOS length
  default: 0.5u
  min: 0.28u
  max: 2u
  unit: m
- name: r_bleed
  description: Output bleeder resistor
  default: 10k
  min: 1k
  max: 1Meg
  unit: ohm
- name: r_z
  description: Miller nulling resistor
  default: 1
  min: 0
  max: 100k
  unit: ohm
- name: c_comp
  description: Miller compensation cap
  default: 0.05p
  min: 0.01p
  max: 100p
  unit: F
- name: x_dut_xm7_w
  description: Error-amp input pair width
  default: 4u
  min: 0.22u
  max: 50u
  unit: m
- name: x_dut_xm7_l
  description: Error-amp input pair length
  default: 0.5u
  min: 0.28u
  max: 10u
  unit: m
- name: x_dut_xm9_w
  description: Error-amp PMOS load width
  default: 4u
  min: 0.22u
  max: 50u
  unit: m
- name: x_dut_xm9_l
  description: Error-amp PMOS load length
  default: 0.5u
  min: 0.28u
  max: 10u
  unit: m
- name: x_dut_xm12_w
  description: Error-amp tail/bias mirror width
  default: 4u
  min: 0.22u
  max: 50u
  unit: m
- name: x_dut_xm12_l
  description: Error-amp tail/bias mirror length
  default: 1u
  min: 0.28u
  max: 10u
  unit: m
- name: i_tail_err
  description: Error-amp tail bias current
  default: 200u
  min: 1u
  max: 500u
  unit: A
- name: x_dut_xm1_w
  description: Ref-buffer input pair width
  default: 4u
  min: 0.22u
  max: 50u
  unit: m
- name: x_dut_xm1_l
  description: Ref-buffer input pair length
  default: 0.5u
  min: 0.28u
  max: 10u
  unit: m
- name: x_dut_xm3_w
  description: Ref-buffer PMOS load width
  default: 4u
  min: 0.22u
  max: 50u
  unit: m
- name: x_dut_xm3_l
  description: Ref-buffer PMOS load length
  default: 0.5u
  min: 0.28u
  max: 10u
  unit: m
- name: x_dut_xm6_w
  description: Ref-buffer tail/bias mirror width
  default: 4u
  min: 0.22u
  max: 50u
  unit: m
- name: x_dut_xm6_l
  description: Ref-buffer tail/bias mirror length
  default: 1u
  min: 0.28u
  max: 10u
  unit: m
- name: i_tail_ref
  description: Ref-buffer tail bias current
  default: 100u
  min: 1u
  max: 500u
  unit: A
- name: r_ref_top
  description: Ref-buffer feedback divider top
  default: 100k
  min: 1k
  max: 10Meg
  unit: ohm
- name: r_ref_bot
  description: Ref-buffer feedback divider bottom
  default: 100k
  min: 1k
  max: 10Meg
  unit: ohm
- name: r_lpf
  description: Reference low-pass filter resistor
  default: 10k
  min: 1k
  max: 1Meg
  unit: ohm
- name: c_lpf
  description: Reference low-pass filter cap
  default: 10p
  min: 0.1p
  max: 10n
  unit: F
- name: vref_val
  description: Internal reference voltage
  default: 0.6
  min: 0.3
  max: 1.2
  unit: V
