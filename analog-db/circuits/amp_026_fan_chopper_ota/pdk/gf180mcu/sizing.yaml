# Sizing for the gf180mcu binding — generated by `analog-db add-binding` from the
# ihp-sg13g2 sizing (geometry re-noted to gf180mcu's unit convention + bin-clamped).
# A starting point; re-tune defaults/bounds for gf180mcu device physics as needed.
schema: spicexplorer/sizing@1
pdk: gf180mcu
variables:
- name: x_dut_xm1_w
  description: PMOS tail current-source width (gate vb4)
  default: 1.123721263159263e-05
  min: 0.22u
  max: 100u
  unit: m
- name: x_dut_xm1_l
  description: 'vb4 PMOS current-source length (shared: tail + fold + output sources)'
  default: 1.6326174478553636e-06
  min: 0.28u
  max: 10u
  unit: m
- name: x_dut_xm2_w
