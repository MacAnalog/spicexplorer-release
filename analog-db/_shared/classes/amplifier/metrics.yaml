# Amplifier class — canonical metric vocabulary + owned testbench templates (plan D-10).
# Validated against _shared/schema/class.schema.json by the verify harness (Tier 0).
# An `ldo` class would instead declare load/line-regulation, dropout, PSRR-vs-load, Iq, ...
schema: spicexplorer/class@1
class: amplifier
id_code: amp            # accession-id prefix for verifiable circuits (plan_scoreboard D-1)
description: >-
  Operational amplifiers / OTAs. Open- and closed-loop AC, DC operating point and
  sweep, noise, transient (slew/settle), linearity, plus derived CMRR/PSRR.
ppa:                      # scoreboard PPA rollup declaration (plan_scoreboard D-7)
  power: {metric: i_supply, times_vdd: true}
  performance:
    - {metric: dc_gain_db, better: max}
    - {metric: ugf_hz, better: max}
    - {metric: pm_deg, better: max}
canonical_metrics:
  - dc_gain_db
  - gain_cl          # closed-loop (buffer) gain, V/V
  - bw_cl_hz         # closed-loop -3 dB bandwidth
  - gbw_hz
  - ugf_hz
  - pm_deg
  - gm_deg          # gain margin
  - cmrr_db
  - cmrr_cm_db        # cmrr_vcm_diff: RAW output-CM residual -db|vocm| to the CM ride (CM-loop rejection, a CM-to-CM ratio WITHOUT the differential gain) — the PHYSICAL discriminator on FD cells (differential cmrr_db saturates at the solver cap on symmetric netlists)
  - cmrr_cm_corr_db   # DERIVED (scoreboard.record, FD cells only): the physical FD CMRR = dc_gain_db + cmrr_cm_db — the CM residual with the differential gain folded back in, so it is a true rejection figure (the SE unity-buffer cmrr_db already includes it). This is the FD paper column.
  - psrr_vdd_db
  - psrr_cm_db        # psrr_vdd_diff: RAW CM-referred supply residual; same role as cmrr_cm_db
  - psrr_cm_corr_db   # DERIVED (scoreboard.record, FD cells only): physical FD PSRR+ = dc_gain_db + psrr_cm_db; the FD paper column
  - psrr_vss_db
  - icmr_range       # input common-mode range (buffer-connected linearity sweep)
  - icmr_min
  - icmr_max
  - slew_rate
  - t_settle
  - i_supply
  - vn_in
  - vn_in_integrated # noise: TOTAL input-referred rms noise over the bench's swept band (ngspice inoise_total) — the paper's noise column
  - thd_pct
  - iip3_dbv
  - im3_dbc
  - loopgain_db      # stb: low-frequency loop-gain magnitude of the Middlebrook probe
  - ugf_loop_hz      # stb: loop unity-gain crossover frequency
  - pm_loop_deg      # stb: phase margin at the loop crossover; -999 sentinel = no crossover (FAILS a min spec by design)
  - gm_loop_db       # stb: gain margin at the phase crossover; -999 sentinel = none
  - vos
  - vocm            # dc_op_diff: settled output COMMON mode (voutp+voutn)/2 — where a CMFB'd
                    #   cell's CM loop actually landed vs the commanded reference (the static
                    #   CM error); on a cell with no CM loop it is the ratioed knife-edge value
  - tc_ppm
  - area_um2
  - fom_s
  - fom_l
  - cm_interior_pts  # dc_cm_bias_sweep: # of sampled internal-bias points with vocm inside VCM+/-VBAND (0 = no interior operating point)
  - zcm_lf_ohm       # ac_cm_reg: low-frequency closed-loop CM output impedance (servo stiffness)
  - zcm_peak_ohm     # ac_cm_reg: sweep-maximum CM output impedance
  - cm_peaking_db    # ac_cm_reg: 20log10(peak/lf) — large peaking flags an underdamped CM loop
  - cm_kick_v        # tran_cm_kick: settled vocm displacement under the CM current kick
  - cm_resid_v       # tran_cm_kick: post-release residual (nonzero flags CM latch-up)
  - t_cm_settle      # tran_cm_kick: recovery time after the kick releases
  - cm_plant_delta   # dc_cmfb_plant_sign: vocm(hi)-vocm(lo) of the open-loop actuation sweep; SIGN = plant parity (- inverting -> canonical servo, + non-inverting -> -inv servo)
  - vcmfb_bal        # dc_cmfb_plant_sign: actuation voltage where vocm crosses the CM ref (must be in-rail)
  - vocm_lim_min     # dc_cmfb_plant_sign: achievable output-CM window floor (ref below it can never regulate)
  - vocm_lim_max     # dc_cmfb_plant_sign: achievable output-CM window ceiling
templates:
  - dc_cmfb_plant_sign       # open-loop CMFB actuation sweep: plant parity (which servo polarity), in-rail balance, achievable-CM window
  - dc_cm_bias_sweep         # output-CM sensitivity to one internal bias knob (alterparam 5-point sweep)
  - ac_cm_reg                # closed-loop CM output impedance vs f (CM-loop health, freq domain)
  - tran_cm_kick             # CM disturbance recovery (CM-loop health, time domain)
  - ac_open_loop
  - ac_open_loop_biaswrap   # open-loop gain in closed-loop bias (AnalogGym Lfb/Cin trick)
  - ac_open_loop_biaswrap_ibias  # the same bias-wrap for ibias-port DUTs (large systematic offset)
  - ac_open_loop_diff       # differential-output, self-biased open-loop AC (no ibias port)
  - ac_closed_loop
  - ac_closed_loop_selfbias  # the same buffer gain/BW bench for self-biased DUTs (no ibias port)
  - psrr_vdd                 # positive-supply rejection in the unity-buffer config (PSRR+)
  - psrr_vdd_selfbias        # the same PSRR+ bench for self-biased DUTs (no ibias port)
  - cmrr_vcm                 # common-mode rejection in the unity-buffer config
  - cmrr_vcm_selfbias        # the same CMRR bench for self-biased DUTs (no ibias port)
  - dc_op
  - dc_op_biaswrap          # self-biased single-ended DC op point + i_supply (Lfb DC-feedback bias)
  - dc_op_diff              # differential-output, self-biased DC op point (vos/vocm)
  - dc_sweep
  - noise
  - noise_biaswrap          # self-biased single-ended input-referred noise (Lfb/Cin bias-wrap)
  - noise_biaswrap_ibias    # input-referred noise in closed-loop bias for large-offset ibias DUTs
  - noise_diff              # differential-output, self-biased input-referred noise
  - tran_step
  - tran_step_biaswrap      # self-biased single-ended unity-gain step settling (follower)
  - thd            # large-signal harmonic distortion (buffer sine; PSS on Spectre)
  - thd_diff                # the same coherent-DFT THD for FD DUTs (beta=1/2 follower; drive split about VCM)
  - thd_selfbias            # the same THD for self-biased SE DUTs (no ibias port)
  - iip3           # two-tone intercept (common-fundamental tones; PSS on Spectre)
  - iip3_diff               # two-tone intercept, FD network (same grid/bins as iip3)
  - iip3_selfbias           # two-tone intercept for self-biased SE DUTs
  - tran_step_diff          # differential-output, self-biased unity-gain step settling
  - linearity
  - linearity_selfbias      # the same ICMR sweep for self-biased DUTs (no ibias port)
  - stb            # loop-gain probe (VIPRB marker -> iprobe; stb analysis on Spectre)
  - stb_diff                # differential-loop probe: CM-pinned VCVS follower + antiphase Middlebrook pair
  - stb_selfbias            # the same loop probe for self-biased SE DUTs (no ibias port)
  - cmrr_vcm_diff           # FD CMRR: differential response to a CM ride; >200 dB = solver-resolution cap, cmrr_cm_db is the physical discriminator
  - psrr_vdd_diff           # FD PSRR+: differential response to a vdd ride; same >200 dB caveat, psrr_cm_db discriminates
