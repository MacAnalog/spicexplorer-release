# Sizing for the tsmc-n65 binding — generated by `analog-db add-binding` from the
# gf180mcu sizing (geometry re-noted to tsmc-n65's unit convention + bin-clamped).
# A starting point; re-tune defaults/bounds for tsmc-n65 device physics as needed.
schema: spicexplorer/sizing@1
pdk: tsmc-n65
variables:
- name: x_dut_xmbp_w
  default: 10.844u
  min: 2u
  max: 64u
  unit: m
  description: On-chip reference PMOS (diode, vdd->ibias). Primary power/PSRR trade knob.
- name: x_dut_xmbp_l
  default: 2u
  min: 0.5u
  max: 10u
  unit: m
  description: Reference PMOS length; longer = lower current, better matching.
- name: x_dut_xmb0_w
  default: 12u
  min: 2u
  max: 100u
  unit: m
  description: Bias-mirror NMOS diode (the mirror-rail unit device).
- name: x_dut_xmb0_l
  default: 2u
  min: 0.5u
  max: 10u
  unit: m
  description: Mirror-rail channel length (shared by XMBC/XMBO for matching).
- name: x_dut_xmbc_w
  default: 8.316u
  min: 2u
  max: 100u
  unit: m
  description: Tail sink (stage-1 current). With XMBO this sets the gm1/gm5 balance.
- name: x_dut_xmbc_m
  default: '1'
  is_integer: true
  min: 1
  max: 8
  description: Tail mirror multiplicity (the drawing uses nf=2 here).
- name: x_dut_xmbo_w
  default: 4u
  min: 2u
  max: 100u
  unit: m
  description: Stage-2 sink (output-stage current). Seeded 2x the tail.
- name: x_dut_xmbo_m
  default: '1'
  is_integer: true
  min: 1
  max: 8
  description: Output-sink multiplicity.
- name: x_dut_xm1_w
  default: 86.42u
  min: 4u
  max: 100u
  unit: m
  description: Input pair (XM2 tied to it - matched pair).
- name: x_dut_xm1_l
  default: 0.7u
  min: 0.28u
  max: 10u
  unit: m
- name: x_dut_xm3_w
  default: 20u
  min: 2u
  max: 100u
  unit: m
  description: PMOS mirror load (XM4 tied to it - matched mirror; mismatch here IS offset).
- name: x_dut_xm3_l
  default: 1u
  min: 0.28u
  max: 10u
  unit: m
- name: x_dut_xm5_w
  default: 37.76u
  min: 4u
  max: 100u
  unit: m
  description: Stage-2 common-source PMOS driver.
- name: x_dut_xm5_l
  default: 2.646u
  min: 0.28u
  max: 10u
  unit: m
- name: r_z
  default: 30.853k
  min: 100
  max: 50k
  unit: ohm
  description: Nulling resistor. MUST stay free - see header.
- name: c_comp
  default: 4.508p
  min: 0.2p
  max: 20p
  unit: F
  description: Miller capacitor. MUST stay free - see header.

# Per-PDK re-bias. This circuit is authored on a 3.3 V rail; the tsmc-n65 registry is a
# 1.2 V CORE kit with no IO/thick-oxide device, so the authored rail would put 3.3 V across
# a 1.2 V oxide and read gm/ID off a grid that stops at 1.8 V. Re-biased to the kit rail
# (3.3 V -> 1.2 V; VCM 0.8*1.2/3.3). The circuit is therefore characterised on tsmc-n65 at a DIFFERENT operating
# point than on gf180mcu/sky130/ihp-sg13g2 -- intentional (owner decision), and it means
# its tsmc-n65 row is not directly comparable to its open-PDK rows.
analysis_params:
  VDD: 1.2
  VCM: 0.291
