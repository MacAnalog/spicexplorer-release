# Spectre ANALYSIS-CONFIG template database (engine-level, PDK-agnostic, NDA-clean).
#
# One entry per Spectre analysis type the platform can compose into a closed-lane deck —
# the data-driven source the platform's `spectre_templates.bench_analyses` renders from
# (with a built-in fallback when this file is absent). The per-class map that says WHICH
# templates a testbench composes lives in `_shared/classes/<class>/spectre-benches.yaml`;
# the SKILL calculator expressions that read the results live in `calculator.yaml` beside
# this file.
#
# Template syntax:
#   {NAME}    — substituted from the render context (bench params UPPERCASE, parsed to
#               numerics + platform-computed extras like RAIL/IIP3_FUND; missing = error).
#   [ ... ]   — optional segment: kept only when every {NAME} inside it resolves.
# Numerics render as plain %.10g — NEVER SPICE eng suffixes (Spectre reads `M` as mega but
# `m` as milli; `100MEG` is a landmine).
#
# Statement NAMES are load-bearing (the PSF key contract): the bridge keys results off the
# PSF file names, which come from the analysis statement names — `ac ac` -> ac.ac,
# `dcOp dc` -> dcOp.dc (op node voltages under dc_*), `pss pss` -> pss.fd.pss/pss.td.pss,
# `stb stb` -> stb.stb. Rename one and the platform's readers stop finding it.
schema: spicexplorer/spectre-analyses@1
description: >-
  Spectre analysis statement templates (AC, DC op/sweep, noise, tran, PSS, STB) composed
  per-testbench by the platform's closed (Spectre) lane.
templates:
  dc_op:
    statement: "dcOp dc"
    psf: dcOp.dc
    notes: >-
      Operating point. Composed as the first analysis of most benches; the deck-level
      `finalTimeOP info what=oppoint` dump (added by the platform) carries the per-device
      OP scalars that OCEAN's OP()/pv() read.
  ac:
    statement: "ac ac start={FSTART} stop={FSTOP} dec={PPD}"
    psf: ac.ac
    notes: >-
      Small-signal frequency sweep. The bench identity (open-loop, closed-loop, CMRR,
      PSRR) lives in the DECK stimulus (which source carries mag=1), not here.
  dc_sweep:
    statement: "dc dc dev={DEV} param=dc start={START} stop={STOP} step={STEP}"
    psf: dc.dc
    notes: >-
      Swept-source DC transfer (the linearity/ICMR bench). Compose WITHOUT the dc_op
      sibling — `dcOp dc` also writes a `.dc` PSF and the reader prefers the exact
      `dc.dc` name, but two `.dc` files invite confusion.
  dc_sweep_down:
    statement: "dcdown dc dev={DEV} param=dc start={STOP} stop={START} step=-{STEP}"
    psf: dcdown.dc
    notes: >-
      The REVERSE leg of a two-direction sweep (the comparator hysteresis bench): the
      same source swept STOP→START with a negated step. Composes AFTER the forward
      `dc_sweep`; its own analysis name/PSF (`dcdown.dc`) so the two directions never
      collide on `dc.dc`. Callers pass the SAME START/STOP/STEP args as the up leg.
  temp_sweep:
    statement: "dctemp dc param=temp start={TSTART} stop={TSTOP} step={TSTEP}"
    psf: dctemp.dc
    notes: >-
      Ambient-temperature sweep (the temp_sensor class vocabulary): a plain `dc`
      analysis sweeping the simulator's own `temp` parameter — no dev= source. The
      abscissa in `dctemp.dc` is temperature in °C.
  noise:
    statement: "noise ( {OUT} {OUTN} ) noise start={FSTART} stop={FSTOP} dec={PPD}[ iprobe={IPROBE}]"
    psf: noise.noise
    notes: >-
      Small-signal noise: output density across (OUT, 0); `iprobe=` names the input
      SOURCE instance carrying the AC stimulus so Spectre also reports the
      input-referred spectrum.
  tran:
    statement: "tran tran stop={TSTOP}[ step={TSTEP}] errpreset=conservative"
    psf: tran.tran
    notes: >-
      Large-signal transient. `errpreset=conservative` keeps harmonic content honest (a
      loose tolerance manufactures numerical distortion) — required when the payload is
      a settling edge or an FFT.
  pss:
    statement: "pss pss fund={FUND} harms={HARMS}[ tstab={TSTAB}][ method={METHOD}] errpreset=conservative"
    defaults: {HARMS: 7}
    psf: pss.fd.pss
    notes: >-
      Periodic steady state. fd-PSF = per-harmonic COMPLEX phasors (sweep freq =
      [0, FUND, 2·FUND, …]); td-PSF = one steady-state period. THD reads the harmonics
      directly; two-tone IIP3 rides the SAME single-fund pss when both tones share a
      common fundamental (f1=N1·FUND, f2=N2·FUND — the IM3 products are then plain
      harmonics; no QPSS needed).
  stb:
    statement: "stb stb probe={PROBE} start={FSTART} stop={FSTOP} dec={PPD}"
    psf: stb.stb
    notes: >-
      Loop-gain / stability analysis. `probe=` names an `iprobe` instance in the
      feedback path — the class templates mark it with a 0 V source named VIPRB* that
      the platform's Spectre emitter translates to an iprobe. Results carry the
      loopGain wave (pm_loop / gain-margin / loop-gain-vs-f).
  pac:
    statement: "pac pac start={FSTART} stop={FSTOP} dec={PPD} maxsideband={MAXSB}"
    defaults: {MAXSB: 15}
    psf: pac.0.pac
    notes: >-
      Periodic AC riding a PRECEDING pss (compose pss first — the platform enforces the
      order). The golden gain/impedance analysis for chopper / switched-cap benches:
      the operating point is periodic (the chop clock), so a static `ac` on the frozen
      network is meaningless. Spectre writes one PSF per output sideband (pac.<k>.pac)
      plus a metadata-only pac.pac parent; the signal-band transfer is harmonic 0, so
      the platform reader pins `pac` to pac.0.pac (sidebands stay reachable as
      `pac.<k>`). The deck's small-signal marker (`ac <mag>` on the input source)
      translates to BOTH mag= and pacmag=, so the same stimulus serves ac and pac.
  pnoise:
    statement: "pnoise ( {OUT} {REF} ) pnoise start={FSTART} stop={FSTOP} dec={PPD} maxsideband={MAXSB}[ iprobe={IPROBE} refsideband={REFSB}]"
    defaults: {MAXSB: 7, REF: 0}
    psf: pnoise.pnoise
    notes: >-
      Periodic noise riding a PRECEDING pss — noise under the running large-signal
      clocks, folding in MAXSB sidebands of the periodic operating point (what a
      small-signal `noise` cannot see: chopped/modulated noise). Densities land in the
      swept pnoise.pnoise PSF (`out`/`in` V/√Hz); the registry integrates them via
      {meas: onoise_pnoise_total | inoise_pnoise_total}. `iprobe=` (with refsideband,
      0 = no frequency translation) names the input source for the input-referred
      spectrum — omit it for output-only reads (e.g. a differential (OUT REF) pair).
