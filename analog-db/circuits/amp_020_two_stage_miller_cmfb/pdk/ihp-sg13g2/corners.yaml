# Corner bundles for the ihp-sg13g2 binding (plan D-6): PDK corner libs stay OUT of repo;
# reference them by lib_file + section. The DB clones/tests PDK-free; sim tiers (T3/T4) are
# PDK-gated.
pdk: ihp-sg13g2
corners:
  tt: [{lib_file: cornerMOSlv.lib, section: mos_tt}, {lib_file: cornerRES.lib, section: res_typ}]
  ss: [{lib_file: cornerMOSlv.lib, section: mos_ss}, {lib_file: cornerRES.lib, section: res_wcs}]
  ff: [{lib_file: cornerMOSlv.lib, section: mos_ff}, {lib_file: cornerRES.lib, section: res_bcs}]
  sf: [{lib_file: cornerMOSlv.lib, section: mos_sf}, {lib_file: cornerRES.lib, section: res_typ}]
  fs: [{lib_file: cornerMOSlv.lib, section: mos_fs}, {lib_file: cornerRES.lib, section: res_typ}]
default_corner: tt
