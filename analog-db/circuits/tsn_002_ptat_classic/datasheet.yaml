# Datasheet (plan D-3/D-5/D-12). Validated against _shared/schema/datasheet.schema.json.
# Temperature-sensor metric sheet for the classic self-biased PTAT reference. Specs are loose
# open-PDK envelopes (AnalogGym reference values are TSMC-180nm) — the promotion goal is a
# converged, valid, non-NaN metric set on ihp-sg13g2 + sky130.
schema: spicexplorer/datasheet@1
cace_format: "5.2"
default_conditions:
  supply: {unit: V, typical: 1.5}
  corner: {typical: tt}
  temp:   {unit: degC, typical: 27}
metrics:
  v_out:
    display: "DC reference output"
    description: "PTAT reference node voltage at 27 degC, nominal supply."
    unit: V
    analysis: dc_op
    extract: {meas: v_out}
    spec: {min: 0.1, max: 1.15, unit: V}
  i_supply:
    display: "Supply current"
    description: "Total PTAT bias current drawn from the supply (the reference's power)."
    unit: A
    analysis: dc_op
    extract: {meas: i_supply}
    spec: {max: 1.0e-3, unit: A}
  v_out_25c:
    display: "Output at 25 degC"
    unit: V
    analysis: temp_sweep
    extract: {meas: v_out_25c}
    spec: {min: 0.1, max: 1.15, unit: V}
  sens_v_per_c:
    display: "Temperature slope"
    description: "dVout/dT over the sweep — PTAT (positive) for this reference."
    unit: "V/degC"
    analysis: temp_sweep
    extract: {meas: sens_v_per_c}
    spec: {min: 1.0e-5, unit: "V/degC"}
  tc_box_ppm:
    display: "Box-method spread"
    description: "(Vmax-Vmin)/Vavg/range over the temp sweep — informational."
    unit: "ppm/degC"
    analysis: temp_sweep
    extract: {meas: tc_box_ppm}
    spec: {min: any}
  line_sens_pct:
    display: "Line sensitivity"
    description: >-
      Output %-change over the supply sweep. The simple (non-cascode) PMOS mirror has finite output
      resistance, so line rejection is moderate (~22% ihp); a cascode mirror would tighten it.
    unit: "%"
    analysis: line_sweep
    extract: {meas: line_sens_pct}
    spec: {max: 35, unit: "%"}    # envelope covering both PDKs (ihp ~10%, sky130 ~31%)
  psr_db:
    display: "Low-frequency PSR"
    description: "Supply→output gain at the low-frequency edge (dB, lower is better)."
    unit: dB
    analysis: psrr
    extract: {meas: psr_db}
    spec: {max: 0, unit: dB}
