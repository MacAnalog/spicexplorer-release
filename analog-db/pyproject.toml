[project]
name = "spicexplorer-analog-db"
version = "0.0.0"
description = "SpiceXplorer analog circuit database — the canonical topology/circuit registry (super-DSL + datasheets + class libraries) and the tiered `verify` harness."
requires-python = ">=3.10"
dependencies = [
    "spicexplorer-core",            # project_root() anchoring + NetlistView (the read-only netlist seam)
    "spicexplorer-circuitgraph",    # abstract netlist -> cgraph.json + per-PDK lowering
    "spicexplorer-netlist2xschem",  # raw export draws each DUT's xschem .sch schematic (deterministic)
    "jsonschema>=4.18",             # validate the YAML docs against _shared/schema/*.json (the agent contract)
    "pyyaml>=6",                    # circuit.yaml / datasheet.yaml / analyses / sizing / class loaders
]

[project.optional-dependencies]
# netlist2tf is only needed for the symbolic cross-check tier; keep it out of the core dep set
# so a shallow/Tier-0 consumer stays light.
symbolic = ["spicexplorer-netlist2tf"]
# The PAM-4 HBT drawing's layout lane (drawings/pam4-driver-2-bit-dac-HBT/ported-netlists/layout/
# signoff.py) runs DRC/LVS through the platform's signoff package; nothing under src/ imports it.
layout = ["spicexplorer-signoff"]
# gm/ID LUT extraction + access: numpy builds the LUT arrays; pygmid is the LUT reader
# (its sweeper is Spectre-only, so extraction uses our ngspice decks). See _shared/GMID.md.
gmid = ["numpy>=1.24", "pygmid>=1.2"]

[project.scripts]
analog-db = "spicexplorer_analog_db.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spicexplorer_analog_db"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8", "pyright>=1.1.380"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "slow: out-of-the-fast-gate tests (deselect with -m 'not slow') — a real ngspice simulation against the IHP PDK (needs the platform api container / base image), or the xschem-gated schematic round-trip",
    "corpus: corpus-wide sweeps / per-binding parametrized checks that scale with the number of circuits — in the default and release-gate runs; deselect for the seconds-fast dev loop (-m 'not corpus and not slow')",
]

[tool.ruff]
line-length = 100
target-version = "py310"
# Vendored third-party reference corpora (kind: reference) are preserved as
# imported — never linted. The NEWCAS appendix is migrated byte-for-byte from the
# platform's examples/OTA/cascode/NEWCAS_SUBMISSION_APPENDIX (tests/test_tier3_migration.py
# compares it), so a `ruff --fix` sweep must never rewrite it either.
extend-exclude = ["**/reference/**", "**/artifacts/newcas2026/**"]

[tool.ruff.lint]
select = ["F", "E", "W", "I"]
ignore = ["E501", "E701", "E702"]

[tool.ruff.lint.per-file-ignores]
# Demo notebooks: imports live in the cells that use them; keep the cell flow.
# E741: `l` is the domain-standard channel-length symbol in sizing code.
# F811: a later cell re-importing a name it uses is the same cell-flow convention — it is
# what lets a cell be re-run on its own, not an accidental shadow.
"*.ipynb" = ["E402", "I001", "E741", "F811"]
# The same notebooks in marimo's .py format (notebooks/): the same two relaxations; E402 does
# not arise there, as marimo puts every cell in a function.
"notebooks/*.py" = ["I001", "E741"]
"campaigns/**" = ["E741"]
# The PAM-4 case-study notebooks, marimo .py files whose cells keep the code as authored in
# Jupyter: I001 and E741 as for *.ipynb (E402 does not arise: marimo puts every cell in a
# function), E401 and F401 for the one-line and unused imports the cells already had, and F841
# for a name no other cell reads, which marimo makes a local of the cell function (RUN_FULL, meta,
# post).
"drawings/pam4-driver-2-bit-dac-HBT/ported-netlists/notebooks/*.py" = ["I001", "E741", "E401", "F401", "F841"]
# Ported reference artifacts (`drawings/**`) and the per-PDK layout/signoff scripts under
# `circuits/*/pdk/**`: generator code carrying the same `l` = channel-length convention,
# and the same matplotlib-backend import ordering. These are preserved-as-authored
# artifacts, not library code — `src/` and `tests/` remain fully linted.
"drawings/**" = ["E741", "I001"]
"circuits/*/pdk/**" = ["E741", "I001", "E401", "F841"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
exclude = ["**/__pycache__", "**/.venv"]
# The harness imports platform packages that exist only in the platform's venv (CLAUDE.md,
# "borrow the platform venv"). In its normal place, examples/analog-db inside a platform checkout,
# that venv is ../../.venv. Without these two keys pyright reads the python on PATH and reports
# every platform import as unresolved (32 errors against 2 real ones on 2026-09-25). A standalone
# clone has no ../../.venv; pyright then falls back to the python on PATH, as before.
venvPath = "../.."
venv = ".venv"
