# Sizing for the ihp-sg13g2 binding — generated by `analog-db add-binding` from the
# gf180mcu sizing (geometry re-noted to ihp-sg13g2's unit convention + bin-clamped).
# NOTE: hand-corrected after generation — add-binding misread the gf180 bare-meters
# geometry as microns and clamped everything to the 0.18u/0.13u bin floor. gf180 and
# ihp both note geometry in meters and every gf180 value already sits inside IHP's
# [0.18u..10u]W/[0.13u..10u]L bins, so the correct conversion is the identity.
# A starting point; re-tune defaults/bounds for ihp-sg13g2 device physics as needed.
schema: spicexplorer/sizing@1
pdk: ihp-sg13g2
