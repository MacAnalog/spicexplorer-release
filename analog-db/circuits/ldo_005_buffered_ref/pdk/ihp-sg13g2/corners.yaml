# Corner bundles for ihp-sg13g2 (D-6) — HV MOS family (sg13_hv_*, 3.3 V rail): PDK libs stay out-of-repo, referenced by
# lib_file (+ section). Cross-PDK binding generated by `analog-db add-binding`.
pdk: ihp-sg13g2
corners:
  tt:
    - {lib_file: cornerMOShv.lib, section: mos_tt}
    - {lib_file: cornerRES.lib, section: res_typ}
    - {lib_file: cornerCAP.lib, section: cap_typ}
  ss:
    - {lib_file: cornerMOShv.lib, section: mos_ss}
    - {lib_file: cornerRES.lib, section: res_wcs}
    - {lib_file: cornerCAP.lib, section: cap_wcs}
  ff:
    - {lib_file: cornerMOShv.lib, section: mos_ff}
    - {lib_file: cornerRES.lib, section: res_bcs}
    - {lib_file: cornerCAP.lib, section: cap_bcs}
  sf:
    - {lib_file: cornerMOShv.lib, section: mos_sf}
    - {lib_file: cornerRES.lib, section: res_typ}
    - {lib_file: cornerCAP.lib, section: cap_typ}
  fs:
    - {lib_file: cornerMOShv.lib, section: mos_fs}
    - {lib_file: cornerRES.lib, section: res_typ}
    - {lib_file: cornerCAP.lib, section: cap_typ}
default_corner: tt
