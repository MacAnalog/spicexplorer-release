# AnalogGym analysis binding (noise).
# Band standardized 2026-08-01 (paper noise column): FSTART 1k -> 1 Hz, FSTOP 1G, so
# inoise_total is the ONE uniform condition across the corpus — total integrated
# input-referred noise, 1 Hz..1 MHz, unity/closed-loop bias config, CL=10p. ngspice
# inoise_total is already volts rms integrated over the swept band (datasheet metric
# vn_in_integrated, unit V).
schema: spicexplorer/analysis@1
id: noise
template: noise_biaswrap
description: "Input-referred noise via the AnalogGym self-bias bias-wrap (Lfb/Cin)."
enabled: true
params: {VDD: 1.8, VCM: 400m, CL: 10p, FSTART: 1, FSTOP: 1MEG, PPD: 50}
flags: []
produces: [vn_in_integrated]
