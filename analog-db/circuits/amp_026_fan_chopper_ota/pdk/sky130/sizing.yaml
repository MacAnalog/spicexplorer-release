# Sizing for the sky130 binding — generated by `analog-db add-binding` from the
# ihp-sg13g2 sizing (geometry re-noted to sky130's unit convention + bin-clamped).
# A starting point; re-tune defaults/bounds for sky130 device physics as needed.
schema: spicexplorer/sizing@1
pdk: sky130
variables:
- name: x_dut_xm1_w
  description: PMOS tail current-source width (gate vb4)
  default: 20
  min: 0.42
  max: 100
  unit: m
- name: x_dut_xm1_l
  description: 'vb4 PMOS current-source length (shared: tail + fold + output sources)'
  default: 1
  min: 0.15
  max: 10
  unit: m
- name: x_dut_xm2_w
  description: PMOS input pair width
  default: 20
  min: 0.42
  max: 200
  unit: m
- name: x_dut_xm2_l
  description: PMOS input pair length
  default: 0.5
  min: 0.15
  max: 10
  unit: m
- name: x_dut_xm4_w
