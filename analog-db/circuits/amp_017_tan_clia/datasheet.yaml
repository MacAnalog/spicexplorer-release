# Datasheet — AnalogGym single-objective benchmark specs (skill §6 / Eq. 5), extract-only.
# Conditions (cload/vcm/ibias) read from the AnalogGym design_variables.
schema: spicexplorer/datasheet@1
default_conditions:
  supply:
    unit: V
    typical: 1.8
  corner:
    typical: tt
  temp:
    unit: degC
    typical: 27
  cload:
    unit: F
    typical: 1e-11
  vcm:
    unit: V
    typical: 0.3
  ibias:
    unit: A
    typical: 6.3e-07
metrics:
  dc_gain_db:
    display: DC open-loop gain
    unit: dB
    analysis: ac_open_loop
    extract:
      meas: dcgain
    spec:
      min: 100
      unit: dB
  ugf_hz:
    display: Unity-gain frequency
    unit: Hz
    analysis: ac_open_loop
    extract:
      meas: ugf
    spec:
      min: any
      unit: Hz
  pm_deg:
    display: Phase margin
    unit: deg
    analysis: ac_open_loop
    extract:
      meas: pm
    spec:
      min: 45
      max: 90
      unit: deg
  vn_in_integrated:
    display: Total integrated input-referred noise (1 Hz - 1 MHz)
    description: ngspice inoise_total is volts rms already integrated over the swept
      band (standardized 1 Hz - 1 MHz, self-bias bias-wrap bench, CL=10p) — the paper's
      uniform noise column. Replaces the old vn_in entry, which bound the same measure
      under V/sqrt(Hz) (dimensionally wrong; inoise_total is not a spot density).
      NOTE the fresh gf180mcu tt read is 16.1 mV rms — enormous because the noise
      transfer peaks at the loop's instability at the landed sizing (see pm_loop_deg).
    unit: V
    analysis: noise
    extract:
      meas: inoise_total
  i_supply:
    display: Supply current
    unit: A
    analysis: dc_op
    extract:
      meas: i_supply
    spec:
      max: 0.00555556
  t_settle:
    display: Settling time
    unit: s
    analysis: tran_step
    extract:
      meas: t_settle
    spec:
      max: 1.0e-06
      unit: s
  psrr_vdd_db:
    display: Positive-supply rejection
    description: PSRR+ in the unity-buffer config, DC-band floor (design-review 2026-07-05 rollout).
    unit: dB
    analysis: psrr_vdd
    extract:
      meas: psrr_vdd_db
    spec:
      min: 20
      unit: dB
  cmrr_db:
    display: Common-mode rejection
    description: CMRR in the unity-buffer config, DC-band floor (design-review 2026-07-05 rollout).
    unit: dB
    analysis: cmrr_vcm
    extract:
      meas: cmrr_db
    spec:
      min: 40
      unit: dB
  thd_pct:
    display: Total harmonic distortion (100 mV @ 100 kHz, buffer)
    description: tran+FFT on ngspice; native PSS harmonics on Spectre. F0 = 100 kHz per
      the campaign ugf grid (fresh ugf 5.94 MHz @ gf180mcu tt, 2026-08-01). HONEST FAIL
      at the landed sizing — 15.6 % with gain_tone 1.83 (outside the SE trust band
      (0.5,1]) and non-power-series drive scaling (HD2 x0.76 / HD3 x2.9 on a drive
      halving) — the unity-gain loop is UNSTABLE (see pm_loop_deg) and the bench reads
      its limit cycle, not weak nonlinearity. See analyses/thd.yaml.
    unit: '%'
    analysis: thd
    extract:
      meas: thd_pct
      f0: 0.1e6
    spec:
      max: 2.0
      unit: '%'
  iip3_dbv:
    display: Input IP3 (two-tone 90/100 kHz, 6.25 mV/tone, buffer)
    description: Single-point IM3 extrapolation; tran+coherent DFT on ngspice, native
      PSS on Spectre. HONEST FAIL at the landed sizing (gf180mcu tt, 2026-08-01) —
      -31.2 dBV with a_im3 only ~6 dB above a_floor (trust check wants >= 20 dB),
      im5_im3_db -6.8 and gain_tone 1.96 — the unstable loop (see pm_loop_deg) dominates
      the bins, so this is not a valid intercept until the sizing is fixed. ampl_in
      below MUST track the analysis binding's ASIG (it is the intercept's input
      reference). See analyses/iip3.yaml.
    unit: dBV
    analysis: iip3
    extract:
      meas: iip3_dbv
      f1: 0.09e6
      f2: 0.1e6
      ampl_in: 0.00625
    spec:
      min: -10
      unit: dBV
  pm_loop_deg:
    display: Loop phase margin (stb, unity buffer)
    description: Phase margin of the Middlebrook-probed buffer loop (VIPRB marker) at
      the LAST 0 dB crossing (the PM-rescue convention); crosschecks ac_open_loop's
      pm_deg. Fresh gf180mcu tt 2026-08-01 reads -73.63 vs the bias-wrapped
      ac_open_loop pm -69.18 deg (4.4 deg apart — two different loop lanes, BOTH
      certify the loop UNSTABLE at the landed sizing; gm_loop -13.9 dB, and the
      tran_step/thd benches ring accordingly). -999 sentinel = no crossover (fails the
      min spec by design).
    unit: deg
    analysis: stb
    extract:
      meas: pm_loop
    spec:
      min: 45
      unit: deg
  loopgain_db:
    display: DC loop gain (stb, unity buffer)
    description: Loop-gain magnitude read at FSTART; matches ac_open_loop's dcgain to
      0.007 dB on this cell (131.75 vs 131.74, gf180mcu tt). Report-only.
    unit: dB
    analysis: stb
    extract:
      meas: loopgain_db
  ugf_loop_hz:
    display: Loop unity-gain frequency (stb)
    unit: Hz
    analysis: stb
    extract:
      meas: ugf_loop
  gm_loop_db:
    display: Loop gain margin (stb)
    description: Gain margin at the phase crossover; ngspice measure name is gm_loop
      (the Spectre bench emits gm_loop_db — the split is absorbed here). Negative here
      (-13.9 dB fresh @ gf180mcu tt) — the loop still has gain at the -180 deg
      crossing, i.e. unstable. -999 sentinel = no phase crossover in-band. Report-only.
    unit: dB
    analysis: stb
    extract:
      meas: gm_loop
