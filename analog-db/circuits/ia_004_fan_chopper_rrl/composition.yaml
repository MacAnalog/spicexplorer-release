# AUTHORED composite manifest (spicexplorer/composition@1, plan_hierarchical_composition
# P4-4 — the CCIA-02 composite: Fan's chopper CCIA + its ripple-reduction loop. A
# structurally-complete composer demonstration; the RRL demodulation-sign question
# (DRAWING_REVIEW §4.2) is NOT resolved here — see the honest limitation below (P4-4b).
schema: spicexplorer/composition@1
of: ia_004_fan_chopper_rrl
notes: >-
  Fan (JSSC 2011) ripple-reduction architecture: the RRL (sup_003) senses the
  CCIA output ripple capacitively (its Cs front end on voutp/voutn), demodulates
  it synchronously (its internal chopper's clk_ch_rrl wired to the SAME clk_chout
  pair that up-modulates the core's offset — the drawn CLK_CH_RRL_not polarity is
  baked inside sup_003), integrates it through a two-phase SC network, and injects
  the DC correction at the first-stage outputs out1_p/out1_n (taps; PRE output
  chopper — where the input pair's offset current lives). The correction is
  CROSS-wired to the taps (rrl voutp -> out1_n, voutn -> out1_p) as the intended
  negative-feedback orientation for sup_003's drawn clock polarity.
  CORE-CM CLOSURE (P4-4b, 2026-07-27 — supersedes the 2026-07-17 honest limitation):
  the composed core previously had no common-mode control, so once the SC clocks
  ran the output CM railed within ~1-2 ms and every clocked transient aborted —
  the RRL was structurally present but not demonstrable. Now closed with the
  cmfb_001 ideal resistive-sense servo (amp_030's pattern): Rm/Rm senses
  voutp/voutn, and the correction injects on the core's Vb4 — the shared PMOS
  current-source gate (tail + fold + output sources), the node amp_027 exposes
  as V_cmfb_ref (the vb1-injection attempt could not reach the railing tail).
  POLARITY IS MEASURED, NOT ASSUMED: on this core d(vocm)/d(vb4) is POSITIVE
  (vb4 -10 mV rails vocm to 0.009 V, +10 mV rails it to 1.17 V — the two-stage
  path inverts the naive single-stage sign), so the servo's canonical
  vcmfb = gm*rout*(vref - vocm) orientation IS negative feedback here.
  RANGE-REFERENCING (amp_030's principle, TIGHTENED live): the series {vb40}
  source carries the DC bias point (the block's committed vb4) and the servo
  contributes only a gain-0.1 correction (rout_val override 1k, gm*rout = 0.1,
  authority +/-60 mV). Gain 1 was NOT enough here: this core's vb4->vocm map is
  non-monotone (large vb4 cuts the PMOS sources off and vocm collapses), and the
  +/-0.6 V drive made the cut-off state self-consistent — a latched dead point,
  measured live (vocm 0.004, drive saturated +0.596). At +/-60 mV neither rail
  satisfies the loop equation and only the interior equilibrium survives.
  The composite, as instantiator, owns vb40/vcm_ref (plan D3).
instances:
  - name: main
    block: ia_002_fan_chopper_simple
    pin: db0af98f1e15
    ports:
      vinp: vinp
      vinn: vinn
      voutp: voutp
      voutn: voutn
      vref: vref
      clk_chin: clk_chin
      clk_chin_not: clk_chin_not
      clk_chfb: clk_chfb
      clk_chfb_not: clk_chfb_not
      clk_chout: clk_chout
      clk_chout_not: clk_chout_not
      vdd: vdd
      vss: vss
    taps: {out1_p: out1_p, out1_n: out1_n, vb4: vb4_ctl}
    # The composite owns the core's output-CM bias (plan D3): the ideal CM servo
    # below replaces the block's {vb4} knob source via the vb4 tap.
    omit: [Vb4]
  - name: rrl
    block: sup_003_rrl_sc_integrator
    # re-pinned 2026-07-20: sup_003 took the Fan Fig. 6 sense-ground symmetry fix
    # (DRAWING_REVIEW S7) + the chopper Vctl flip (S4.2). Was 15266f8af33a.
    pin: e5616a7d6d6d
    ports:
      vinp: voutp
      vinn: voutn
      voutp: out1_n
      voutn: out1_p
      clk_ch_rrl: clk_chout
      clk_ch_rrl_not: clk_chout_not
      clk_phi_1: clk_phi_1
      clk_phi_2: clk_phi_2
      vdd: vdd
      vss: vss
    # RRL authority scales with the chop period: at the registry's 5 kHz default the
    # per-phase SC integration window is 10x the 50 kHz one, so the block's 100u
    # compensation Gm makes the discrete-time RRL loop gain > 1 (measured live: the
    # clocked transient hard-diverges at ~1.2 ms). gm/10 restores the per-cycle loop
    # gain of the stable 50 kHz point; settle time stretches to ~5 ms (windows sit later).
    override: {gm_val: 10u}
  - name: cmfb
    block: cmfb_001_ideal_rsense_servo
    pin: 9c8861186398
    ports: {vinp: voutp, vinn: voutn, vcmfb: vcmfb_raw, vref: vref_cm, vdd: vdd, vss: vss}
    # gain-0.1 servo (gm 100u default x rout 1k): authority +/-60 mV. Gain 1 left the
    # LOW rail self-consistent (drive saturates at +0.6 -> vb4 ~1.15 -> PMOS sources
    # cut off -> vocm ~0 sustains the drive: a latched dead state, measured live).
    # At 0.1 neither rail satisfies vb4 = vb40 + 0.1*(vref - vocm(vb4)) — only the
    # interior equilibrium survives; loop gain ~ 0.1 x |dvocm/dvb4| (~58) ~ 6.
    override: {rout_val: 1k}
nets:
  - "Vrefcm vref_cm vss dc {vcm_ref}"
  - "Vb40 vb4_ctl vcmfb_raw dc {vb40}"
sizing:
  variables:
    - {name: vcm_ref, description: "Commanded output common-mode reference for the ideal CM servo (composite-owned)", default: 0.6, min: 0.0, max: 1.2, unit: V}
    - {name: vb40, description: "Series level shift carrying the core's Vb4 DC bias point (the block's committed vb4); the servo adds only the gain-1 correction around it (range-referencing — see notes)", default: 0.55, min: 0.0, max: 1.2, unit: V}
