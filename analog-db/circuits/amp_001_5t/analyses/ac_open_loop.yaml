# Analysis binding (plan D-4). Validated against _shared/schema/analysis.schema.json.
# Binds the amplifier-class ac_open_loop template to this circuit's conditions.
schema: spicexplorer/analysis@1
id: ac_open_loop
template: ac_open_loop
description: "Open-loop AC gain/phase for dc_gain_db, ugf_hz, pm_deg."
params:
  FSTART: 1k
  FSTOP: 100MEG
  PPD: 101
  CL: 50f
  VCM: 0.8
  VDD: 1.5
  IBIAS: 20u
flags: []                # bias_wrap not needed: 5T self-biases via the ibias mirror
produces: [dc_gain_db, ugf_hz, pm_deg]
