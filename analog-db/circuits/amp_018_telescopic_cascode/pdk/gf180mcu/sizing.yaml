# Sizing for the gf180mcu binding — generated by `analog-db add-binding` from the
# ihp-sg13g2 sizing (geometry re-noted to gf180mcu's unit convention + bin-clamped).
# A starting point; re-tune defaults/bounds for gf180mcu device physics as needed.
schema: spicexplorer/sizing@1
pdk: gf180mcu
variables:
- name: x_dut_xm1_w
  description: Input pair W
  default: 23.3u
  min: 0.22u
  max: 200u
  unit: m
- name: x_dut_xm1_l
  description: Input pair L
  default: 1.0u
  min: 0.28u
  max: 10u
  unit: m
- name: x_dut_xm1c_w
  description: NMOS cascode W
  default: 5.7u
  min: 0.22u
  max: 200u
  unit: m
- name: x_dut_xm1c_l
  description: NMOS cascode L
  default: 0.5u
  min: 0.28u
  max: 10u
  unit: m
- name: x_dut_xm3_w
  description: PMOS load W
  default: 4.7u
  min: 0.22u
  max: 200u
  unit: m
- name: x_dut_xm3_l
  description: PMOS load L
  default: 0.5u
  min: 0.28u
  max: 10u
  unit: m
- name: x_dut_xm3c_w
  description: PMOS cascode W
  default: 7.2u
  min: 0.22u
  max: 200u
  unit: m
- name: x_dut_xm3c_l
  description: PMOS cascode L
  default: 0.5u
  min: 0.28u
  max: 10u
  unit: m
- name: x_dut_xm5_w
  description: Tail W
  default: 4.95u
  min: 0.22u
  max: 200u
  unit: m
- name: x_dut_xm5_l
  description: Tail L
  default: 0.5u
  min: 0.28u
  max: 10u
  unit: m
- name: x_dut_xm5_ng
  description: Tail fingers
  default: 1
  min: 1
  max: 5
  is_integer: true
- name: x_dut_xm6_w
  description: Mirror ref W
  default: 8.3u
  min: 0.22u
  max: 200u
  unit: m
- name: x_dut_xm6_l
  description: Mirror ref L
  default: 0.5u
  min: 0.28u
  max: 10u
  unit: m
- name: x_dut_v_bias_1
  description: NMOS cascode bias
  default: 0.917
  min: 0
  max: 1.2
  unit: V
- name: x_dut_v_bias_2
  description: PMOS cascode bias
  default: 1.143
  min: 0
  max: 1.2
  unit: V
# Frozen per-device literals (P4 atomic sweep): defaults reproduce the authored
# netlist literals exactly; freeze keeps them out of the search space.
- {name: x_dut_xm1_m, description: "XM1 m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
- {name: x_dut_xm2_m, description: "XM2 m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
- {name: x_dut_xm1c_m, description: "XM1C m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
- {name: x_dut_xm2c_m, description: "XM2C m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
- {name: x_dut_xm3_m, description: "XM3 m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
- {name: x_dut_xm4_m, description: "XM4 m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
- {name: x_dut_xm3c_m, description: "XM3C m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
- {name: x_dut_xm4c_m, description: "XM4C m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
- {name: x_dut_xm5_m, description: "XM5 m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
- {name: x_dut_xm6_m, description: "XM6 m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
