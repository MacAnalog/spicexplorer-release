schema: spicexplorer/datasheet@1
default_conditions:
  supply:
    unit: V
    typical: 1.8
  corner:
    typical: tt
  temp:
    unit: degC
    typical: 27
  cload:
    unit: F
    typical: 1e-11
  vcm:
    unit: V
    typical: 0.24
  ibias:
    unit: A
    typical: 1.2499999999999999e-06
metrics:
  dc_gain_db:
    display: DC open-loop gain
    unit: dB
    analysis: ac_open_loop
    extract:
      meas: dcgain
    spec:
      min: 100
      unit: dB
  ugf_hz:
    display: Unity-gain frequency
    unit: Hz
    analysis: ac_open_loop
    extract:
      meas: ugf
    spec:
      unit: Hz
      min: 2000000.0
  pm_deg:
    display: Phase margin
    unit: deg
    analysis: ac_open_loop
    extract:
      meas: pm
    spec:
      unit: deg
      min: 60.0
      max: 90.0
  vn_in_integrated:
    display: Input-referred noise (total, 1 Hz - 1 MHz)
    description: Total integrated input-referred rms noise over the standardized
      1 Hz - 1 MHz band (ngspice inoise_total is already volts rms integrated over
      the swept band), unity/closed-loop bias config, CL=10p. Replaces the old vn_in
      entry that mapped inoise_total under V/sqrt(Hz) — that unit was dimensionally
      wrong for this measure.
    unit: V
    analysis: noise
    extract:
      meas: inoise_total
  i_supply:
    display: Supply current
    unit: A
    analysis: dc_op
    extract:
      meas: i_supply
    spec:
      max: 0.00555556
  t_settle:
    display: Settling time
    unit: s
    analysis: tran_step
    extract:
      meas: t_settle
    spec:
      max: 1.0e-06
      unit: s
  psrr_vdd_db:
    display: Positive-supply rejection
    description: PSRR+ in the unity-buffer config, DC-band floor (design-review 2026-07-05
      rollout).
    unit: dB
    analysis: psrr_vdd
    extract:
      meas: psrr_vdd_db
    spec:
      unit: dB
      min: 40.0
  cmrr_db:
    display: Common-mode rejection
    description: CMRR in the unity-buffer config, DC-band floor (design-review 2026-07-05
      rollout).
    unit: dB
    analysis: cmrr_vcm
    extract:
      meas: cmrr_db
    spec:
      min: 40
      unit: dB
  thd_pct:
    display: Total harmonic distortion (100 mV @ 10 kHz, buffer)
    description: tran+FFT on ngspice; native PSS harmonics on Spectre. F0 = 10 kHz per
      the campaign grid (this cell's fresh ugf = 2.126 MHz < 3 MHz -> 1 MHz grid / 100).
    unit: '%'
    analysis: thd
    extract:
      meas: thd_pct
      f0: 1.0e4
    spec:
      max: 2.0
      unit: '%'
  iip3_dbv:
    display: Input IP3 (two-tone 9/10 kHz, 6.25 mV/tone, buffer)
    description: Single-point IM3 extrapolation; tran+coherent DFT on ngspice, native
      PSS on Spectre. Tones 9/10 kHz per the campaign grid (fresh ugf = 2.126 MHz < 3 MHz
      -> 0.9/1.0 MHz grid / 100). ampl_in below MUST track the analysis binding's ASIG
      (it is the intercept's input reference).
    unit: dBV
    analysis: iip3
    extract:
      meas: iip3_dbv
      f1: 9.0e3
      f2: 1.0e4
      ampl_in: 0.00625
    spec:
      min: -10
      unit: dBV
  pm_loop_deg:
    display: Loop phase margin (stb, unity buffer)
    description: Middlebrook injection at the VIPRB marker; cross-checks ac_open_loop's
      pm_deg (same loop). -999 sentinel = no 0 dB crossing measured.
    unit: deg
    analysis: stb
    extract:
      meas: pm_loop
    spec:
      min: 60.0
      unit: deg
  loopgain_db:
    display: Low-frequency loop gain (stb)
    unit: dB
    analysis: stb
    extract:
      meas: loopgain_db
  ugf_loop_hz:
    display: Loop unity-gain crossover (stb)
    unit: Hz
    analysis: stb
    extract:
      meas: ugf_loop
  gm_loop_db:
    display: Loop gain margin (stb)
    description: Gain margin at the first -180 deg crossing; -999 sentinel = the loop
      phase never reaches -180 deg in-band (no gain margin to measure).
    unit: dB
    analysis: stb
    extract:
      meas: gm_loop
