# Analysis binding (plan D-4): universal noise template — input-referred noise.
# BAND STANDARDIZED 1 Hz .. 1 MHz (campaign 2026-08-01): the paper's noise column is ONE
# uniform condition — total integrated input-referred noise over 1 Hz - 1 MHz in the
# unity/closed-loop bias config, CL = 10p. ngspice `inoise_total` is already volts rms
# integrated over the swept band, so the datasheet binds it as vn_in_integrated (unit V).
# Was FSTART 1k / FSTOP 100MEG (vn_in, mis-declared V/sqrt(Hz)); PPD unchanged.
schema: spicexplorer/analysis@1
id: noise
template: noise
description: "Input-referred noise, integrated 1 Hz - 1 MHz (standard paper band)."
params:
  VDD: 1.5
  VCM: 0.8
  IBIAS: 20u
  CL: 10p
  FSTART: 1
  FSTOP: 1MEG  # in-band ceiling: every sizable amp's closed-loop BW is >=2 MHz; integrating past it turns inoise_total into an out-of-band artifact (inoise = onoise / a gain that has fallen below unity)
  PPD: 101
flags: []
produces: [vn_in_integrated]
