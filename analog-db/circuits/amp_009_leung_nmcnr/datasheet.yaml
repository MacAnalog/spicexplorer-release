schema: spicexplorer/datasheet@1
default_conditions:
  supply:
    unit: V
    typical: 1.8
  corner:
    typical: tt
  temp:
    unit: degC
    typical: 27
  cload:
    unit: F
    typical: 1e-11
  vcm:
    unit: V
    typical: 0.3
  ibias:
    unit: A
    typical: 3.0e-06
metrics:
  dc_gain_db:
    display: DC open-loop gain
    unit: dB
    analysis: ac_open_loop
    extract:
      meas: dcgain
    spec:
      min: 100
      unit: dB
  ugf_hz:
    display: Unity-gain frequency
    unit: Hz
    analysis: ac_open_loop
    extract:
      meas: ugf
    spec:
      unit: Hz
      min: 2000000.0
  pm_deg:
    display: Phase margin
    unit: deg
    analysis: ac_open_loop
    extract:
      meas: pm
    spec:
      unit: deg
      min: 60.0
      max: 90.0
  vn_in_integrated:
    display: Total integrated input-referred noise (1 Hz - 1 MHz)
    description: ngspice inoise_total is already volts rms integrated over the swept
      band (calibrated against the platform registry, amp_022@ihp 2.47e-4 V). Replaces
      the old vn_in entry, which mapped the same measure under V/sqrt(Hz) — dimensionally
      wrong. Uniform paper condition — closed-loop bias config, CL=10p (2026-08-01).
    unit: V
    analysis: noise
    extract:
      meas: inoise_total
  i_supply:
    display: Supply current
    unit: A
    analysis: dc_op
    extract:
      meas: i_supply
    spec:
      max: 0.00555556
  t_settle:
    display: Settling time
    unit: s
    analysis: tran_step
    extract:
      meas: t_settle
    spec:
      max: 1.0e-06
      unit: s
  psrr_vdd_db:
    display: Positive-supply rejection
    description: PSRR+ in the unity-buffer config, DC-band floor (design-review 2026-07-05
      rollout).
    unit: dB
    analysis: psrr_vdd
    extract:
      meas: psrr_vdd_db
    spec:
      unit: dB
      min: 40.0
  cmrr_db:
    display: Common-mode rejection
    description: CMRR in the unity-buffer config, DC-band floor (design-review 2026-07-05
      rollout).
    unit: dB
    analysis: cmrr_vcm
    extract:
      meas: cmrr_db
    spec:
      min: 40
      unit: dB
  thd_pct:
    display: Total harmonic distortion (100 mV @ 10 kHz, buffer)
    description: tran+FFT on ngspice; native PSS harmonics on Spectre. F0 = 10 kHz —
      the campaign grid divided by 100 for this cell's 1.44 MHz ugf (fresh ac_open_loop
      @ ihp-sg13g2 tt, 2026-08-01).
    unit: '%'
    analysis: thd
    extract:
      meas: thd_pct
      f0: 1.0e4
    spec:
      max: 2.0
      unit: '%'
  iip3_dbv:
    display: Input IP3 (two-tone 9/10 kHz, 6.25 mV/tone, buffer)
    description: Single-point IM3 extrapolation; tran+coherent DFT on ngspice, native
      PSS on Spectre. Tones at 9/10 kHz — the campaign grid divided by 100 for this
      cell's 1.44 MHz ugf. ampl_in below MUST track the analysis binding's ASIG (it
      is the intercept's input reference).
    unit: dBV
    analysis: iip3
    extract:
      meas: iip3_dbv
      f1: 9.0e3
      f2: 1.0e4
      ampl_in: 0.00625
    spec:
      min: -10
      unit: dBV
  pm_loop_deg:
    display: Loop phase margin (stb)
    description: TRUE unity-buffer loop phase margin by Middlebrook injection at the
      VIPRB marker; crosschecks ac_open_loop's pm_deg (same loop, independent route).
      -999 sentinel = no 0 dB crossing measured (fails a min spec by design).
    unit: deg
    analysis: stb
    extract:
      meas: pm_loop
    spec:
      min: 60.0
      unit: deg
  loopgain_db:
    display: DC loop gain (stb)
    description: Loop-gain magnitude at FSTART from the Middlebrook probe.
    unit: dB
    analysis: stb
    extract:
      meas: loopgain_db
  ugf_loop_hz:
    display: Loop unity-gain frequency (stb)
    description: Loop 0 dB crossover from the Middlebrook probe.
    unit: Hz
    analysis: stb
    extract:
      meas: ugf_loop
  gm_loop_db:
    display: Loop gain margin (stb)
    description: Gain margin at the first -180 deg crossing; -999 sentinel = the loop
      phase never reaches -180 deg inside the swept band (no gain margin to measure).
    unit: dB
    analysis: stb
    extract:
      meas: gm_loop
