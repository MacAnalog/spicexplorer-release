  kind: shared_geometry
  members: [XMA2, XMA4, XMA6, XMA8, XMA10, XMA12, XMB2, XMB4, XMB6, XMB8, XMB10, XMB12]
  tie: [w, l, m]
  description: The PMOS halves of all twelve bank transmission gates — same leg-matching argument
    as bank_tg_nmos; the n and p halves stay independent (different mobility).
- name: pseudo_r_quad
  kind: shared_geometry
  members: [XM1, XM2, XM3, XM4]
  tie: [w, l, m]
  description: Pseudo-resistor bias quad — all four anti-series diode-connected PMOS share one
    geometry so both summing nodes see the same DC servo path and the same (code-independent)
    HP corner pseudo-R x Cf.
- name: pair_cf
  kind: shared_geometry
  members: [CF1, CF2]
  tie: [Value]
  description: Feedback caps — the denominator of the -(1+code)*Cu/Cf gain; matched per side
