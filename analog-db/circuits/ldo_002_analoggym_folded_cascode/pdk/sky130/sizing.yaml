# Upstream sky130_ldo_rl / AnalogGym ldo_folded_cascode defaults (ldo_folded_cascode_vars.spice).
schema: spicexplorer/sizing@1
pdk: sky130
variables:
- name: x_dut_xm1_w
  default: '20'
- name: x_dut_xm1_l
  default: '1'
- name: x_dut_xm3_w
  default: '30'
- name: x_dut_xm3_l
  default: '0.5'
- name: x_dut_xm5_w
  default: '10'
- name: x_dut_xm5_l
  default: '0.5'
- name: x_dut_xm7_w
  default: '20'
- name: x_dut_xm7_l
  default: '2'
- name: x_dut_xm9_w
  default: '30'
- name: x_dut_xm9_l
  default: '0.5'
- name: x_dut_xmp_w
  default: '10'
- name: x_dut_xmp_l
  default: '0.5'
- name: x_dut_xmp_m
  default: '250'
- name: r_z
  default: 3k
- name: c_comp
  default: 2p
  description: "Upstream XCfb mim, M_Cfb=10 units of ~200 fF"
- name: vref_val
  default: 1.8
- name: vb1_val
  default: '1.0'
  description: "Upstream TB Vb1 (NMOS sink/tail rail)"
- name: vb2_val
  default: '0.025'
  description: "Upstream TB Vb2 (PMOS cascode gate rail, near-ground for deep cascode)"
- name: r_bleed
  default: 100k
  description: "Minimum-load bleed (import adaptation; upstream TBs never run true no-load)"
