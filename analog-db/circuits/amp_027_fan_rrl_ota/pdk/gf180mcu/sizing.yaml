# Sizing for the gf180mcu binding — generated by `analog-db add-binding` from the
# ihp-sg13g2 sizing (geometry re-noted to gf180mcu's unit convention + bin-clamped).
# A starting point; re-tune defaults/bounds for gf180mcu device physics as needed.
schema: spicexplorer/sizing@1
pdk: gf180mcu
variables:
- name: x_dut_xm1_w
  description: Main tail current source width (PMOS, gate vb3)
  default: 1.7623089602048373e-05
  min: 0.22u
  max: 100u
  unit: m
- name: x_dut_xm1_l
  description: Tail current-source length (shared with CMFB tail XM4)
  default: 1.369127501694859e-06
  min: 0.28u
  max: 10u
  unit: m
- name: x_dut_xm2_w
  description: PMOS input pair width
  default: 5.889049437027081e-05
  min: 0.22u
  max: 200u
  unit: m
- name: x_dut_xm2_l
  description: PMOS input pair length
  default: 1.6033732040870076e-06
  min: 0.28u
  max: 10u
  unit: m
- name: x_dut_xm4_w
  description: CMFB tail width (sets CMFB branch current vs XM1)
  default: 9.94615820750218e-05
  min: 0.22u
  max: 100u
  unit: m
- name: x_dut_xm5_w
  description: DDA-CMFB sense pair width
  default: 1.0451333631298199e-05
  min: 0.22u
  max: 50u
  unit: m
- name: x_dut_xm5_l
  description: DDA-CMFB sense pair length
  default: 1.3544484994578545e-06
  min: 0.28u
  max: 10u
  unit: m
- name: x_dut_xm6_w
  description: DDA-CMFB reference-half unit width (x2 parallel as drawn)
  default: 1.5274424179235197e-05
  min: 0.22u
  max: 50u
  unit: m
- name: x_dut_xm6_l
  description: DDA-CMFB reference-half length
  default: 1.6098583754463795e-06
  min: 0.28u
  max: 10u
  unit: m
- name: x_dut_xm9_w
  description: PMOS telescopic cascode width
  default: 9.187857450587903e-05
  min: 0.22u
  max: 100u
  unit: m
- name: x_dut_xm9_l
  description: PMOS telescopic cascode length
  default: 1.6789147317226054e-06
  min: 0.28u
  max: 5u
  unit: m
- name: x_dut_xm11_w
  description: NMOS telescopic cascode width
  default: 9.296521288010723e-05
  min: 0.22u
  max: 100u
  unit: m
- name: x_dut_xm11_l
  description: NMOS telescopic cascode length
  default: 2.3257966982671126e-06
  min: 0.28u
  max: 5u
  unit: m
- name: x_dut_xm13_w
  description: Output current-sink width (gate on CMFB bias)
  default: 5.8433283014360016e-05
  min: 0.22u
  max: 100u
  unit: m
- name: x_dut_xm15_w
  description: DDA diode-load width (cm_bias/cm_sense diodes)
  default: 2.016318826733622e-05
  min: 0.22u
  max: 50u
  unit: m
- name: x_dut_xm15_l
  description: DDA diode-load length (mirror L, also sets sink L)
  default: 9.487648744819404e-07
  min: 0.28u
  max: 10u
  unit: m
- name: vb1
  description: PMOS cascode gate bias (drawn as an external 0.5 V port) — re-tuned for gf180mcu 3.3 V (puts d1 ~2.0, input pair saturated)
  default: 1.1
  min: 0.0
  max: 3.3
  unit: V
- name: vb2
  description: NMOS cascode gate bias (drawn as an external 0.5 V port) — re-tuned for gf180mcu 3.3 V (VGS + sink Vds_sat)
  default: 1.2
  min: 0.0
  max: 3.3
  unit: V
- name: vb3
  description: PMOS tail gate bias (sets branch currents; drawn 0.5 V) — re-tuned for gf180mcu 3.3 V (VSG_tail=1.1, ~50 uA total)
  default: 2.2
  min: 0.0
  max: 3.3
  unit: V
- name: vb4
  description: Output common-mode reference into the DDA-CMFB (drawn 0.5 V) — re-tuned for gf180mcu 3.3 V (mid-rail output CM target)
  default: 1.65
  min: 0.0
  max: 3.3
  unit: V
- name: x_dut_xm1_m
  description: XM1 m (frozen literal)
  default: 1
  min: 1
  max: 16
  freeze: true
  is_integer: true
- name: x_dut_xm2_m
  description: XM2 m (frozen literal)
  default: 1
