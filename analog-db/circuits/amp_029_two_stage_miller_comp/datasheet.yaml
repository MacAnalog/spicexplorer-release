schema: spicexplorer/datasheet@1
cace_format: '5.2'
default_conditions:
  supply:
    unit: V
    typical: 1.2
  cload:
    unit: fF
    typical: 10000
  corner:
    typical: tt
  temp:
    unit: degC
    typical: 27
  vcm:
    unit: V
    typical: 0.6
metrics:
  dc_gain_db:
    display: DC open-loop differential gain
    description: "Differential large-signal DC gain. Measured at a TT-CENTERED knife-edge\
      \ bias: an interior operating point exists only inside a ~0.2 mV vbl window (vbl\
      \ default is centered to 4 decimals), so the value is honest at tt but NOT robust\
      \ \u2014 the fragility is the structural cm_interior_pts finding (see circuit.yaml\
      \ notes); amp_020 is the servo'd variant"
    unit: dB
    analysis: ac_open_loop
    extract:
      meas: dcgain
    spec:
      min: 50
      unit: dB
  ugf_hz:
    display: Unity-gain frequency
    unit: Hz
    analysis: ac_open_loop
    extract:
      meas: ugf
    spec:
      unit: Hz
      min: 5000000.0
  pm_deg:
    display: Phase margin
    description: Two-stage with per-side Miller R+C
    unit: deg
    analysis: ac_open_loop
    extract:
      meas: pm
    spec:
      unit: deg
      min: 60.0
      max: 90
  vos:
    display: Output offset
    description: "voutp - voutn at matched DC inputs; no CMFB \u2014 set by device\
      \ ratioing (corner-fragile)"
    unit: V
    analysis: dc_op
    extract:
      meas: vos
    spec:
      typ: 0
      max: 100e-3
      min: -100e-3
      unit: V
  i_supply:
    display: Supply current
    unit: A
    analysis: dc_op
    extract:
      meas: i_supply
    spec:
      max: 500e-6
      unit: A
  vn_in_integrated:
    display: Total integrated input-referred noise (1 Hz - 1 MHz, FD follower)
    description: ngspice inoise_total is volts rms already integrated over the swept
      band (standardized 1 Hz - 1 MHz, differential closed-loop bias config, CL=10p)
      \u2014 the paper's uniform noise column. Replaces the old vn_in entry, which bound
      the same measure over the narrower pre-campaign 1 Hz - 10 MHz band.
    unit: V
    analysis: noise
    extract:
      meas: inoise_total
  t_settle:
    display: Settling time
    description: Unity-gain differential-follower settling (see tran_step_diff.spice)
    unit: s
    analysis: tran_step
    extract:
      meas: t_settle
    spec:
      max: 5.0e-06
      unit: s
  cm_interior_pts:
    display: Interior operating points across the vbl sweep
    description: "STRUCTURAL: of 5 vbl samples bracketing the stage-1 flip window,\
      \ how many give vocm inside VCM+/-0.25 V. Measured 0 \u2014 the interior window\
      \ obeys width x CM-gain ~ 0.5 V (2026-07 sizing study: 0.2 mV at the 50 dB\
      \ sizing, 3.5 mV at a 37 dB min-L sizing, wide only in a 3.5 mA degenerate\
      \ regime 7x over the i_supply spec), so no gain-spec-compatible sizing can\
      \ put a sample inside it \u2014 this fail is the topology, not the sizing\
      \ (see circuit.yaml notes); a composed CMFB is the fix \u2014 LANDED as\
      \ amp_030_miller_cmfb_composite (this core + cmfb_001_ideal_rsense_servo via\
      \ the P4 composer), which measures 5/5 on the same sweep"
    unit: ''
    analysis: dc_cm_bias_sweep
    extract:
      meas: cm_interior_pts
    spec:
      min: 1
  thd_pct:
    display: Total harmonic distortion (100 mV diff @ 100 kHz, FD follower)
    description: tran + in-deck coherent DFT on the differential output of the
      unity-feedback FD follower (thd_diff); F0 = 100 kHz per the campaign grid
      (fresh ugf 24.4 MHz sits in the 3-30 MHz band). 999 sentinel = dead-output
      guard fired. HONEST FAIL ON THIS CELL — no CM control + knife-edge CM gain
      ~2500 converts the follower's inherent input-CM wobble to differential
      (gain_tone 4.79, outside the (2/3,2] live-gate; drive-halving moved HD2
      x8.7 not x2), so thd_pct characterizes the unregulated CM path, not the
      DUT's differential linearity. See analyses/thd.yaml; amp_030 is the fix.
    unit: '%'
    analysis: thd
    extract:
      meas: thd_pct
      f0: 0.1e6
    spec:
      max: 2.0
      unit: '%'
  iip3_dbv:
    display: Input IP3 (two-tone 90/100 kHz, 6.25 mV/tone, FD follower)
    description: Single-point IM3 extrapolation on the differential output
      (iip3_diff); tones per the campaign grid (fresh ugf 24.4 MHz -> 3-30 MHz
      band, grid /10). ampl_in below MUST track the analysis binding's ASIG (it
      is the intercept's input reference). -999 sentinel = dead-output guard.
      HONEST FAIL ON THIS CELL — gain_tone 15.1 (outside the (2/3,2] live-gate);
      the unregulated knife-edge CM path dominates the response, so the
      intercept characterizes CM conversion, not differential linearity (see
      analyses/iip3.yaml; amp_030 is the fix).
    unit: dBV
    analysis: iip3
    extract:
      meas: iip3_dbv
      f1: 0.09e6
      f2: 0.1e6
      ampl_in: 0.00625
    spec:
      min: -10
      unit: dBV
  pm_loop_deg:
    display: Loop phase margin (stb, FD loop)
    description: Phase margin of the antiphase-Middlebrook-probed differential
      loop (stb_diff, VIPRB/VIPRBM pair); crosschecks ac_open_loop's pm_deg —
      fresh ihp-sg13g2 tt ac_open_loop reads 24.06 deg at CL=10p (the marginal
      margin is the circuit, see analyses/stb.yaml). -999 sentinel = no
      crossover (fails the min spec by design).
    unit: deg
    analysis: stb
    extract:
      meas: pm_loop
    spec:
      min: 60
      unit: deg
  loopgain_db:
    display: DC loop gain (stb, FD loop)
    description: Loop-gain magnitude read at FSTART; bit-identical to
      ac_open_loop's dcgain on this cell. Report-only.
    unit: dB
    analysis: stb
    extract:
      meas: loopgain_db
  ugf_loop_hz:
    display: Loop unity-gain frequency (stb)
    unit: Hz
    analysis: stb
    extract:
      meas: ugf_loop
  gm_loop_db:
    display: Loop gain margin (stb)
    description: Gain margin at the phase crossover; ngspice measure name is
      gm_loop. -999 sentinel = no phase crossover in-band. Report-only.
    unit: dB
    analysis: stb
    extract:
      meas: gm_loop
  cmrr_db:
    display: Common-mode rejection (differential figure, FD loop)
    description: -db(voutp-voutn) under a 1 V CM ride (cmrr_vcm_diff), DC-band
      floor. NO spec BY DESIGN — on this perfectly symmetric FD netlist the
      differential figure saturates at the solver-resolution cap (~250-300 dB,
      matrix round-off, not physical rejection); a min-spec would silently pass
      any cell. The CM-path figure cmrr_cm_db is the physical discriminator.
    unit: dB
    analysis: cmrr_vcm
    extract:
      meas: cmrr_db
  cmrr_cm_db:
    display: CM-path rejection of a CM ride (cmrr_vcm)
    description: Output-CM response to the same 1 V CM ride — the always-physical,
      discriminating figure. NO spec — report-only companion to cmrr_db (whose
      differential figure is solver-capped on symmetric FD netlists). This cell
      has no CM servo (cm_control partial), so expect it weak vs amp_020.
    unit: dB
    analysis: cmrr_vcm
    extract:
      meas: cmrr_cm_db
  psrr_vdd_db:
    display: Positive-supply rejection (differential figure, FD loop)
    description: -db(voutp-voutn) under a 1 V vdd ripple (psrr_vdd_diff),
      DC-band floor. NO spec BY DESIGN — the supply disturbs both symmetric
      half-circuits identically, so the differential figure saturates at the
      solver-resolution cap (~250-300 dB, not physical); a min-spec would
      silently pass any cell. psrr_cm_db is the physical discriminator.
    unit: dB
    analysis: psrr_vdd
    extract:
      meas: psrr_vdd_db
  psrr_cm_db:
    display: CM-path supply rejection (psrr_vdd)
    description: Output-CM supply rejection through the cell's unregulated CM
      path (no CM servo) — the always-physical, discriminating figure. NO spec —
      report-only companion to psrr_vdd_db (whose differential figure is
      solver-capped on symmetric FD netlists).
    unit: dB
    analysis: psrr_vdd
    extract:
      meas: psrr_cm_db
