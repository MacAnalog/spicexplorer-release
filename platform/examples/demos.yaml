# Curated Studio demo registry — THE config file deciding what shows up under
# "Load a demo as a project" (the ⌘P overlay + Setup's "Load example…"), and in
# what order. Consumed by spicexplorer_api project_service.list_examples().
#
# Entries are examples/-relative paths to project_setup*.yaml files.
#   - reorder    → reorders the picker
#   - remove one → hides that demo (the file stays in the repo)
#   - delete THIS FILE → fall back to scanning examples/**/project_setup*.yaml
#
# Not listed (hidden on purpose): the analog-db mirror projections of the three
# classics (circuits/{amp_001_5t,amp_004_folded_cascode,amp_018_telescopic_cascode})
# — same circuits as the hand-written examples above, kept for the DB's own lanes.
demos:
  # Classic hand-written examples
  - OTA/5t-ota/ihp-sg13g2/sizing/project_setup.yaml
  - OTA/5t-ota/ihp-sg13g2/sizing/project_setup_advanced.yaml
  - OTA/5t-ota/ihp-sg13g2/sizing/project_setup_multicorner.yaml
  - OTA/cascode/ihp-sg13g2/sizing/project_setup.yaml
  - OTA/folded_cascode/ihp-sg13g2/sizing/project_setup.yaml
  # analog-db raw-deck demos (generated by `analog-db export-raw-project --demo`)
  - analog-db/circuits/amp_020_two_stage_miller_cmfb/project_setup.yaml
  - analog-db/circuits/amp_008_leung_nmcf/project_setup.yaml
  - analog-db/circuits/amp_019_ti_ldo_error/project_setup.yaml
  - analog-db/circuits/ldo_005_buffered_ref/project_setup.yaml
