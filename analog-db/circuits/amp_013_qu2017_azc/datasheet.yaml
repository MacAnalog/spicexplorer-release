schema: spicexplorer/datasheet@1
default_conditions:
  supply:
    unit: V
    typical: 1.8
  corner:
    typical: tt
  temp:
    unit: degC
    typical: 27
  cload:
    unit: F
    typical: 1e-11
  vcm:
    unit: V
    typical: 0.3
  ibias:
    unit: A
    typical: 1.0e-06
metrics:
  dc_gain_db:
    display: DC open-loop gain
    unit: dB
    analysis: ac_open_loop
    extract:
      meas: dcgain
    spec:
      min: 100
      unit: dB
  ugf_hz:
    display: Unity-gain frequency
    unit: Hz
    analysis: ac_open_loop
    extract:
      meas: ugf
    spec:
      unit: Hz
      min: 2000000.0
  pm_deg:
    display: Phase margin
    unit: deg
    analysis: ac_open_loop
    extract:
      meas: pm
    spec:
      unit: deg
      min: 60.0
      max: 90.0
  vn_in_integrated:
    display: Total integrated input-referred noise (1 Hz - 1 MHz, buffer)
    description: ngspice inoise_total is volts rms already integrated over the swept
      band (standardized 1 Hz - 1 MHz, unity/closed-loop bias config, CL=10p) — the
      paper's uniform noise column. Replaces the old vn_in entry, which bound the same
      measure under V/sqrt(Hz) (dimensionally wrong; inoise_total is not a spot
      density).
    unit: V
    analysis: noise
    extract:
      meas: inoise_total
  i_supply:
    display: Supply current
    unit: A
    analysis: dc_op
    extract:
      meas: i_supply
    spec:
      max: 0.00555556
  t_settle:
    display: Settling time
    unit: s
    analysis: tran_step
    extract:
      meas: t_settle
    spec:
      max: 1.0e-06
      unit: s
  psrr_vdd_db:
    display: Positive-supply rejection
    description: PSRR+ in the unity-buffer config, DC-band floor (design-review 2026-07-05
      rollout).
    unit: dB
    analysis: psrr_vdd
    extract:
      meas: psrr_vdd_db
    spec:
      unit: dB
      min: 40.0
  cmrr_db:
    display: Common-mode rejection
    description: CMRR in the unity-buffer config, DC-band floor (design-review 2026-07-05
      rollout).
    unit: dB
    analysis: cmrr_vcm
    extract:
      meas: cmrr_db
    spec:
      min: 40
      unit: dB
  thd_pct:
    display: Total harmonic distortion (100 mV @ 100 kHz, buffer)
    description: tran+FFT on ngspice; native PSS harmonics on Spectre. F0 = 100 kHz
      (campaign grid for the measured ugf 3.78 MHz). CAVEAT at the landed ihp-sg13g2
      sizing the unity buffer carries a real ~40 MHz limit cycle — recorded values are
      oscillation floor, not distortion (honest spec-fail); see analyses/thd.yaml.
    unit: '%'
    analysis: thd
    extract:
      meas: thd_pct
      f0: 1.0e5
    spec:
      max: 2.0
      unit: '%'
  iip3_dbv:
    display: Input IP3 (two-tone 90/100 kHz, 6.25 mV/tone, buffer)
    description: Single-point IM3 extrapolation; tran+coherent DFT on ngspice, native
      PSS on Spectre. Tones at 90/100 kHz (campaign grid for the measured ugf
      3.78 MHz); ampl_in below MUST track the analysis binding's ASIG (it is the
      intercept's input reference). CAVEAT at the landed ihp-sg13g2 sizing the unity
      buffer carries a real ~40 MHz limit cycle — recorded values are invalid; see
      analyses/iip3.yaml.
    unit: dBV
    analysis: iip3
    extract:
      meas: iip3_dbv
      f1: 0.09e6
      f2: 0.1e6
      ampl_in: 0.00625
    spec:
      min: -10
      unit: dBV
  pm_loop_deg:
    display: Loop phase margin (stb, unity buffer)
    description: Phase margin of the Middlebrook-probed buffer loop (VIPRB marker);
      crosschecks ac_open_loop's pm_deg — fresh ihp-sg13g2 tt reads 88.74 vs 88.76 deg.
      -999 sentinel = no crossover (fails the min spec by design). NOTE this certifies
      only the probed main loop — at the landed ihp sizing a local ~40 MHz limit cycle
      persists that this figure cannot see (see analyses/stb.yaml).
    unit: deg
    analysis: stb
    extract:
      meas: pm_loop
    spec:
      min: 60.0
      unit: deg
  loopgain_db:
    display: DC loop gain (stb, unity buffer)
    description: Loop-gain magnitude read at FSTART; matches ac_open_loop's dcgain on
      this cell (80.06 dB both routes, ihp-sg13g2 tt). Report-only.
    unit: dB
    analysis: stb
    extract:
      meas: loopgain_db
  ugf_loop_hz:
    display: Loop unity-gain frequency (stb)
    unit: Hz
    analysis: stb
    extract:
      meas: ugf_loop
  gm_loop_db:
    display: Loop gain margin (stb)
    description: Gain margin at the phase crossover; ngspice measure name is gm_loop
      (the Spectre bench emits gm_loop_db — the split is absorbed here). -999 sentinel =
      no phase crossover in-band. Report-only.
    unit: dB
    analysis: stb
    extract:
      meas: gm_loop
