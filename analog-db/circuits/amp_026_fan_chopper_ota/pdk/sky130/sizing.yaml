  default: 0.7
  min: 0.0
  max: 1.8
  unit: V
- name: vb4
  description: "PMOS current-source gate bias \u2014 tail + fold + output sources (re-tuned for
    sky130 vth at the 1.8 V re-bias)"
  default: 0.6
  min: 0.0
  max: 1.8
  unit: V
- name: x_dut_xm1_m
