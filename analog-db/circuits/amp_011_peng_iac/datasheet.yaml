schema: spicexplorer/datasheet@1
default_conditions:
  supply:
    unit: V
    typical: 1.8
  corner:
    typical: tt
  temp:
    unit: degC
    typical: 27
  cload:
    unit: F
    typical: 1e-11
  vcm:
    unit: V
    typical: 0.24
  ibias:
    unit: A
    typical: 1.2499999999999999e-06
metrics:
  dc_gain_db:
    display: DC open-loop gain
    unit: dB
    analysis: ac_open_loop
    extract:
      meas: dcgain
    spec:
      min: 100
      unit: dB
  ugf_hz:
    display: Unity-gain frequency
    unit: Hz
    analysis: ac_open_loop
    extract:
      meas: ugf
    spec:
      unit: Hz
      min: 2000000.0
  pm_deg:
    display: Phase margin
    unit: deg
    analysis: ac_open_loop
    extract:
      meas: pm
    spec:
      unit: deg
      min: 60.0
      max: 90.0
  vn_in_integrated:
    display: Integrated input-referred noise (1 Hz - 1 MHz)
    description: Total input-referred rms noise integrated over the standardized 1 Hz -
      1 MHz band, closed-at-DC bias config, CL=10p (campaign 2026-08-01). ngspice
      inoise_total is already volts rms integrated over the swept band — the old vn_in
      entry mapped this same measure under V/sqrt(Hz), which was dimensionally wrong;
      replaced, not renamed.
    unit: V
    analysis: noise
    extract:
      meas: inoise_total
  i_supply:
    display: Supply current
    unit: A
    analysis: dc_op
    extract:
      meas: i_supply
    spec:
      max: 0.00555556
  t_settle:
    display: Settling time
    unit: s
    analysis: tran_step
    extract:
      meas: t_settle
    spec:
      max: 1.0e-06
      unit: s
  psrr_vdd_db:
    display: Positive-supply rejection
    description: PSRR+ in the unity-buffer config, DC-band floor (design-review 2026-07-05
      rollout).
    unit: dB
    analysis: psrr_vdd
    extract:
      meas: psrr_vdd_db
    spec:
      unit: dB
      min: 40.0
  cmrr_db:
    display: Common-mode rejection
    description: CMRR in the unity-buffer config, DC-band floor (design-review 2026-07-05
      rollout).
    unit: dB
    analysis: cmrr_vcm
    extract:
      meas: cmrr_db
    spec:
      min: 40
      unit: dB
  thd_pct:
    display: Total harmonic distortion (100 mV @ 10 kHz, buffer)
    description: tran+FFT on ngspice; native PSS harmonics on Spectre. F0=10 kHz per the
      campaign grid (fresh ugf 1.76 MHz < 3 MHz -> /100). CAVEAT @ ihp-sg13g2 landed
      sizing 2026-08-01 - the DUT self-oscillates at ~2 MHz in the buffer and the tran
      aborts (sim_error is the honest record); see analyses/thd.yaml.
    unit: '%'
    analysis: thd
    extract:
      meas: thd_pct
      f0: 1.0e4
    spec:
      max: 2.0
      unit: '%'
  iip3_dbv:
    display: Input IP3 (two-tone 9/10 kHz, 6.25 mV/tone, buffer)
    description: Single-point IM3 extrapolation; tran+coherent DFT on ngspice, native
      PSS on Spectre. Tones 9/10 kHz per the campaign grid (fresh ugf 1.76 MHz < 3 MHz
      -> /100). ampl_in MUST track the analysis binding's ASIG (it is the intercept's
      input reference). CAVEAT @ ihp-sg13g2 landed sizing 2026-08-01 - the DUT
      self-oscillates in the buffer and the tran aborts (sim_error is the honest
      record); see analyses/iip3.yaml.
    unit: dBV
    analysis: iip3
    extract:
      meas: iip3_dbv
      f1: 9.0e3
      f2: 1.0e4
      ampl_in: 0.00625
    spec:
      min: -10
      unit: dBV
  pm_loop_deg:
    display: Loop phase margin (Middlebrook, unity buffer)
    description: Phase margin of the true external loop probed by voltage injection at
      the VIPRB marker, last 0 dB crossing; -999 sentinel = no crossing. Cross-checks
      ac_open_loop pm (measured delta ~1 deg @ ihp-sg13g2 tt 2026-08-01). NOTE this
      probe only breaks the external signal loop - at the ihp-sg13g2 landed sizing the
      DUT still self-oscillates via its internal self-bias loop (see analyses/stb.yaml).
    unit: deg
    analysis: stb
    extract:
      meas: pm_loop
    spec:
      min: 60.0
      unit: deg
  loopgain_db:
    display: Loop gain (DC-band, Middlebrook)
    unit: dB
    analysis: stb
    extract:
      meas: loopgain_db
  ugf_loop_hz:
    display: Loop unity-gain crossover
    unit: Hz
    analysis: stb
    extract:
      meas: ugf_loop
  gm_loop_db:
    display: Loop gain margin
    description: Gain margin at the first -180 deg loop-phase crossing; -999 sentinel =
      the loop phase never reaches -180 deg in-band (measured here - min excursion -106
      deg @ ihp-sg13g2 tt 2026-08-01).
    unit: dB
    analysis: stb
    extract:
      meas: gm_loop
