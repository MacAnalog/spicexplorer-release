# Analysis binding: large-signal THD in the DIFFERENTIAL unity-feedback follower
# (amplifier/thd_diff — tran_step_diff's network with the tone split +/- ASIG/2; this FD
# member has no `vout` node, so the SE thd template is structurally invalid here).
# ASIG = 0.05 (the campaign's LOW-SWING-CORE drive, not the 0.1 default) — MEASURED
# (2026-08-01, tt): this core's linear window is tiny and the loop gain collapses with
# amplitude: gain_tone = 1.04 at ASIG 0.1, 1.69 at 0.05, 2.01 at 0.025 (healthy ~1.94);
# thd_pct 23.4 / 12.5 / 7.5 % at those drives, and HD2/HD3 do NOT follow the x2/x4
# small-distortion scaling anywhere in that range — the cell is in gross distortion, a
# CIRCUIT limitation (hand-seeded sizing, class-AB stage with asymmetric push/pull), not a
# binding artifact (window coherent, guard passes, cm_drift_v ~ 5e-7 << ASIG). 0.05 keeps
# gain_tone inside the FD gate (2/3, 2] while staying comparable with the SE consumers'
# low-swing bindings; the ~12 % reading is an honest FAIL of the 2 % spec.
# Headroom is NOT the limiter: vocm ~ 0.5994 at vcmfb_ref = 0.6, vod_op ~ 1.2 mV, per-side
# excursion ~|vod_op|/2 + ASIG ~ 0.051 V about 0.6 clears the 1.2 V rails with wide margin.
# F0 GRID (campaign rule): FRESH ac_open_loop ugf = 10.32 MHz (2026-08-01, CL=10p; the
# scoreboard's 22.35 MHz predates the CL=10p standardization) -> 3-30 MHz bucket -> the
# 1 MHz reference grid divided by 10: F0 = 100 kHz.
# COHERENT WINDOW (whole F0 periods, EVEN count so cm_drift_v's half-window means stay
# tone-blind): TSTOP - TSTART = 160u = 16 whole periods; TSTEP = 20n = 1/(500*F0);
# TSTART = 40u = 4 whole periods >= 20x the FRESH tran_step t_settle (385.5 ns -> 7.7 us
# floor; 4 periods also clears the now-slower CM servo, cout_val 10p — see sizing.yaml).
# PREREQUISITE (2026-08-01): at the committed cout_val = 100f this bench was DEAD — the
# behavioral CMFB is transient-unstable and even the quiescent follower walks vcmfb to a
# rail within 20 us; the sizing.yaml cout_val -> 10p change is what makes this binding
# (and tran_step/iip3) live. TRUST CHECKS: gain_tone ~ 2 when live (guard threshold 2/3,
# thd_pct = 999 sentinel below it); cm_drift_v must be << ASIG or the output common mode
# was still walking through the DFT window and thd_pct is not trustworthy.
schema: spicexplorer/analysis@1
id: thd
template: thd_diff
description: "THD — FD unity-feedback follower, differential 50 mV tone at 100 kHz (low-swing core); tran + in-deck coherent DFT."
params: {VDD: 1.2, VCM: 0.6, CL: 10p, ASIG: 0.05, F0: 1.0e5, TSTEP: 20n, TSTART: 40u, TSTOP: 200u}
flags: []
produces: [thd_pct]
