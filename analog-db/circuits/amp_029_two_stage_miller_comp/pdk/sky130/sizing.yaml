# Sizing for the sky130 binding — generated by `analog-db add-binding` from the
# ihp-sg13g2 sizing (geometry re-noted to sky130's unit convention + bin-clamped).
# A starting point; re-tune defaults/bounds for sky130 device physics as needed.
schema: spicexplorer/sizing@1
pdk: sky130
variables:
- name: x_dut_xm1_w
  description: NMOS input pair width
  default: 10
  min: 0.42
  max: 100
  unit: m
- name: x_dut_xm1_l
  description: NMOS input pair length
  default: 0.5
  min: 0.15
  max: 10
  unit: m
- name: x_dut_xm3_w
  description: Stage-1 PMOS current-source load width
  default: 10
  min: 0.42
  max: 100
  unit: m
- name: x_dut_xm3_l
  description: Stage-1 load length (long for load gds)
  default: 1
  min: 0.15
  max: 10
  unit: m
- name: x_dut_xm5_w
  description: Stage-2 PMOS driver width
  default: 12
  min: 0.42
  max: 100
  unit: m
- name: x_dut_xm5_l
  description: Stage-2 PMOS driver length
  default: 0.5
  min: 0.15
  max: 10
  unit: m
- name: x_dut_xm6_w
  description: Bias diode width (ref current density)
  default: 2
  min: 0.42
  max: 50
  unit: m
- name: x_dut_xm6_l
  description: Bias diode length (mirror L for tail + sinks)
  default: 1
  min: 0.15
  max: 10
  unit: m
- name: x_dut_xm7_w
  description: Output sink width (mirror ratio vs XM6 sets stage-2 current)
  default: 6
  min: 0.42
  max: 100
  unit: m
- name: x_dut_xm8_w
  description: Tail mirror width (ratio vs XM6 sets the tail current)
  default: 2
  min: 0.42
  max: 100
  unit: m
- name: x_dut_r1_value
  description: Per-side Miller zero-nulling resistor
  default: 30k
  min: 100
  max: 50k
  unit: ohm
- name: x_dut_c1_value
  description: "Per-side Miller compensation cap (0.3p: the open-CM settle tail scales with the Miller\
    \ cap \u2014 1p put t_settle at 9.3 us vs the 5 us spec; 0.3p settles 3.1 us with pm 77)"
  default: 0.6p
  min: 0.05p
  max: 20p
  unit: F
- name: i_bias
  description: "Bias reference current into the XM6 diode (drawn as a 1 mA literal \u2014 re-seeded)"
  default: 20u
  min: 1u
  max: 500u
  unit: A
- name: vbl
  description: "Stage-1 PMOS load gate bias (the drawing's floating net X; knife-edge CM knob; see notes\
    \ \u2014 the sky130 tt interior window at VDD=1.8/VCM=0.9 is ~0.03-0.04 mV wide (0.64752-0.64755, fine\
    \ dc sweep 2026-08-03), so this default is centered to 5 decimals; ANY perturbation rails the OP,\
    \ which is the structural cm_interior_pts finding)"
  default: 0.64753
  min: 0.0
  max: 1.8
  unit: V
- name: x_dut_xm1_m
  description: XM1 m (frozen literal)
  default: 1
  min: 1
  max: 16
  freeze: true
  is_integer: true
- name: x_dut_xm3_m
  description: XM3 m (frozen literal)
  default: 1
  min: 1
  max: 16
  freeze: true
  is_integer: true
- name: x_dut_xm5_m
  description: XM5 m (frozen literal)
  default: 1
  min: 1
  max: 16
  freeze: true
  is_integer: true
- name: x_dut_xm6_m
  description: XM6 m (frozen literal)
  default: 1
  min: 1
  max: 16
  freeze: true
  is_integer: true
- name: x_dut_xm7_m
  description: XM7 m (frozen literal)
  default: 1
  min: 1
  max: 16
  freeze: true
  is_integer: true
- name: x_dut_xm8_m
  description: XM8 m (frozen literal)
  default: 1
  min: 1
  max: 16
  freeze: true
  is_integer: true

# Per-PDK re-bias (platform convention: analyses params are the AUTHORED operating point;
# per-PDK deltas live here — pattern: amp_017_tan_clia/pdk/FOUNDRY-n65). amp_029 is authored
# on the ihp-sg13g2 1.2 V rail; sky130's 01v8 devices run the registry 1.8 V rail
# (bare-um convention), VCM at mid-rail. vbl re-centered for this rail (see its entry).
analysis_params:
  VDD: 1.8
  VCM: 0.9
