[project]
name = "spicexplorer-core"
version = "0.0.0"
description = "SpiceXplorer shared kernel: SPICE engine, eng-parse, env detection, PVT primitives, logging, workspace paths."
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2",          # eng.parse_value, spice_engine.storage
    "spicelib>=1.5,<1.6",  # spice_engine.spicelib (1.6 dropped ParameterNotFoundError/ComponentNotFoundError from base_editor)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spicexplorer_core"]
