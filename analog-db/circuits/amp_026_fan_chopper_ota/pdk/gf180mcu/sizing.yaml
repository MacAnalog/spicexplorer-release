# Per-PDK re-bias (platform convention: analyses params are the AUTHORED operating point;
# per-PDK deltas live here). amp_026 is authored on the ihp-sg13g2 1.2 V lv rail; gf180mcu's
# 03v3 core devices (nfet vth ~0.75, pfet |vth| ~0.9) are dead at 1.2 V. Re-biased to the
# gf180mcu nominal 3.3 V rail. VCM picked via a coarse dc sweep at 3.3 V: the fold-node
# interior window is VCM ~0.2-2.2 (above ~2.2 the PMOS tail rails); 1.2 leaves ~0.84 V tail
# VSD headroom. vb1..vb4 defaults re-tuned above to match.
analysis_params:
  VDD: 3.3
  VCM: 1.2
