# Dropout: sweep Vin upward at heavy load; Vin - Vout at the first sweep point in regulation.
schema: spicexplorer/analysis@1
id: dropout
template: dropout
description: "Vin swept 1.0 -> 1.8 V at 10 mA; dropout = Vin - Vout at the first sweep point in regulation."
params:
  ILOAD: 10m
  VDD_START: 1.0
  VDD_STOP: 1.8
  VDD_STEP: 0.01
flags: []
produces: [v_dropout]
