# Datasheet (plan D-3/D-5). Specs = the legacy folded_cascode project_setup target_specs;
# `optimize` blocks carry the projection fields verbatim (P3 generator).
schema: spicexplorer/datasheet@1
default_conditions:
  supply: {unit: V, typical: 1.8}
  cload:  {unit: pF, typical: 5}
  corner: {typical: tt}
  temp:   {unit: degC, typical: 27}
  vcm:    {unit: V, typical: 0.9}
  ibias:  {unit: uA, typical: 34}
metrics:
  ugf_hz:
    display: "Unity-gain frequency"
    unit: Hz
    analysis: ac_open_loop
    extract: {meas: ugf}
    spec: {min: 20.0e6, typ: 21.0e6, unit: Hz}
    optimize: {spec_name: ugf, testbench: tb_ac, sim_type: ac, goal: exact, target: 21.0e6,
               range: 1.0e6, tolerance: 1.0e5, weight: 100.0, log_scale: false,
               error_type: relative-sigmoid, enable: true}
  dc_gain_db:
    display: "DC open-loop gain"
    unit: dB
    analysis: ac_open_loop
    extract: {meas: dcgain}
    symbolic:
      tool: netlist2tf
      call: open_loop_gain
      args: {output: [vout, vss], input: [vinp, vinn], scale: db}
    spec: {min: 55, unit: dB}
    optimize: {spec_name: dcgain, testbench: tb_ac, sim_type: ac, goal: exceed, target: 55,
               range: 100, tolerance: 5, weight: 100.0, error_type: relative-sigmoid, enable: true}
  pm_deg:
    display: "Phase margin"
    unit: deg
    analysis: ac_open_loop
    extract: {meas: pm}
    spec: {min: 40, typ: 70, unit: deg}
    optimize: {spec_name: pm, testbench: tb_ac, sim_type: ac, goal: exact, target: 70,
               range: 45, tolerance: 30, weight: 100.0, error_type: relative-sigmoid, enable: true}
  vn_in:
    display: "Input-referred noise"
    unit: "V/sqrt(Hz)"
    analysis: noise
    extract: {meas: inoise_total}
    spec: {max: any}
  i_supply:
    display: "Supply current"
    unit: A
    analysis: dc_op
    extract: {meas: i_supply}
    spec: {max: 1.0e-3, unit: A}
  t_settle:
    display: "Settling time"
    unit: s
    analysis: tran_step
    extract: {meas: t_settle}
    spec: {max: any}
  psrr_vdd_db:
    display: "Positive-supply rejection"
    description: "PSRR+ in the unity-buffer config, DC-band floor (design-review 2026-07-05 rollout)."
    unit: dB
    analysis: psrr_vdd
    extract: {meas: psrr_vdd_db}
    spec: {min: 20, unit: dB}
  cmrr_db:
    display: "Common-mode rejection"
    description: "CMRR in the unity-buffer config, DC-band floor (design-review 2026-07-05 rollout)."
    unit: dB
    analysis: cmrr_vcm
    extract: {meas: cmrr_db}
    spec: {min: 40, unit: dB}
