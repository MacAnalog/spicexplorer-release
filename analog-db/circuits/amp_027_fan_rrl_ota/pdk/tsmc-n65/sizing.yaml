# Sizing for the tsmc-n65 binding — generated by `analog-db add-binding` from the
# ihp-sg13g2 sizing (geometry re-noted to tsmc-n65's unit convention + bin-clamped).
# A starting point; re-tune defaults/bounds for tsmc-n65 device physics as needed.
schema: spicexplorer/sizing@1
pdk: tsmc-n65
variables:
- name: x_dut_xm1_w
  description: Main tail current source width (PMOS, gate vb3)
  default: 20u
  min: 0.15u
  max: 100u
  unit: m
- name: x_dut_xm1_l
  description: Tail current-source length (shared with CMFB tail XM4)
  default: 1u
  min: 0.13u
  max: 10u
  unit: m
- name: x_dut_xm2_w
  description: PMOS input pair width
  default: 20u
  min: 0.15u
  max: 200u
  unit: m
- name: x_dut_xm2_l
  description: PMOS input pair length
  default: 0.5u
  min: 0.13u
  max: 10u
  unit: m
- name: x_dut_xm4_w
  description: CMFB tail width (sets CMFB branch current vs XM1)
  default: 10u
  min: 0.15u
  max: 100u
  unit: m
- name: x_dut_xm5_w
  description: DDA-CMFB sense pair width
  default: 4u
  min: 0.15u
  max: 50u
  unit: m
- name: x_dut_xm5_l
  description: DDA-CMFB sense pair length
  default: 0.5u
  min: 0.13u
  max: 10u
  unit: m
- name: x_dut_xm6_w
  description: DDA-CMFB reference-half unit width (x2 parallel as drawn)
  default: 4u
  min: 0.15u
  max: 50u
  unit: m
- name: x_dut_xm6_l
  description: DDA-CMFB reference-half length
  default: 0.5u
  min: 0.13u
  max: 10u
  unit: m
- name: x_dut_xm9_w
  description: PMOS telescopic cascode width
  default: 10u
  min: 0.15u
  max: 100u
  unit: m
- name: x_dut_xm9_l
  description: PMOS telescopic cascode length
  default: 0.3u
  min: 0.13u
  max: 5u
  unit: m
- name: x_dut_xm11_w
  description: NMOS telescopic cascode width
  default: 5u
  min: 0.15u
  max: 100u
  unit: m
- name: x_dut_xm11_l
  description: NMOS telescopic cascode length
  default: 0.3u
  min: 0.13u
  max: 5u
  unit: m
- name: x_dut_xm13_w
  description: Output current-sink width (gate on CMFB bias)
  default: 6u
  min: 0.15u
  max: 100u
  unit: m
- name: x_dut_xm15_w
  description: DDA diode-load width (cm_bias/cm_sense diodes)
  default: 2u
  min: 0.15u
  max: 50u
  unit: m
- name: x_dut_xm15_l
  description: DDA diode-load length (mirror L, also sets sink L)
  default: 1u
  min: 0.13u
  max: 10u
  unit: m
- name: vb1
  description: PMOS cascode gate bias (drawn as an external 0.5 V port)
  default: 0.45
  min: 0.0
  max: 1.2
  unit: V
- name: vb2
  description: NMOS cascode gate bias (drawn as an external 0.5 V port)
  default: 0.75
  min: 0.0
  max: 1.2
  unit: V
- name: vb3
  description: PMOS tail gate bias (sets branch currents; drawn 0.5 V)
  default: 0.55
  min: 0.0
  max: 1.2
  unit: V
- name: vb4
  description: Output common-mode reference into the DDA-CMFB (drawn 0.5 V)
  default: 0.6
  min: 0.0
  max: 1.2
  unit: V
- name: x_dut_xm1_m
  description: XM1 m (frozen literal)
  default: 1
  min: 1
  max: 16
  freeze: true
  is_integer: true
- name: x_dut_xm2_m
  description: XM2 m (frozen literal)
  default: 1
  min: 1
  max: 16
  freeze: true
  is_integer: true
