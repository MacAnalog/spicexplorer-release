# Sizing for the gf180mcu binding — generated by `analog-db add-binding` from the
# ihp-sg13g2 sizing (geometry re-noted to gf180mcu's unit convention + bin-clamped).
# A starting point; re-tune defaults/bounds for gf180mcu device physics as needed.
schema: spicexplorer/sizing@1
pdk: gf180mcu
variables:
- name: x_dut_xm1_w
  description: Input pair width
  default: 2u
  min: 0.22u
  max: 20u
  unit: m
- name: x_dut_xm1_l
  description: Input pair length
  default: 0.5u
  min: 0.28u
  max: 10u
  unit: m
- name: x_dut_xm3_w
  description: Stage-1 PMOS load width
  default: 2u
  min: 0.22u
  max: 20u
  unit: m
- name: x_dut_xm3_l
  description: Stage-1 PMOS load length
  default: 0.5u
  min: 0.28u
  max: 10u
  unit: m
- name: x_dut_xm5_w
  description: Stage-2 PMOS pull-up width (output vocm is knife-edge sensitive to this — see README)
  default: 66.8u
  min: 0.22u
  max: 95u
  unit: m
- name: x_dut_xm5_l
  description: Stage-2 PMOS pull-up length
  default: 0.5u
  min: 0.28u
  max: 10u
  unit: m
- name: x_dut_xm7_w
  description: Stage-2 NMOS pull-down width
  default: 4u
  min: 0.22u
  max: 20u
  unit: m
- name: x_dut_xm7_l
  description: Stage-2 NMOS pull-down length
  default: 0.5u
  min: 0.28u
  max: 10u
  unit: m
- name: x_dut_xm6_w
  description: Diode-connected bias-ref width
  default: 2u
  min: 0.22u
  max: 20u
  unit: m
- name: x_dut_xm6_l
  description: Diode-connected bias-ref length
  default: 0.5u
  min: 0.28u
  max: 10u
  unit: m
- name: x_dut_xm8_w
  description: Input-pair tail-sink width
  default: 2u
  min: 0.22u
  max: 20u
  unit: m
- name: x_dut_xm8_l
  description: Input-pair tail-sink length
  default: 0.5u
  min: 0.28u
  max: 10u
  unit: m
- name: i_bias
  description: Internal bias-reference current (sets ref/tail/outsink mirror currents)
  default: 50u
  min: 1u
  max: 500u
  unit: A
- name: x_dut_r1_value
  description: Per-side Miller compensation resistor
  default: 2k
  min: 100
  max: 50k
  unit: ohm
- name: x_dut_c1_value
  description: Per-side Miller compensation cap
  default: 1p
  min: 0.05p
  max: 20p
  unit: F
- name: x_dut_r3_value
  description: CM-servo direct-averaging resistor leg
  default: 5k
  min: 500
  max: 100k
  unit: ohm
- name: x_dut_r5_value
  description: CM-servo HF-shaping resistor leg
  default: 5k
  min: 500
  max: 100k
  unit: ohm
- name: x_dut_c3_value
  description: CM-servo HF-shaping cap
  default: 0.5p
  min: 0.02p
  max: 10p
  unit: F
# Frozen per-device literals (P4 atomic sweep): defaults reproduce the authored
# netlist literals exactly; freeze keeps them out of the search space.
- {name: x_dut_xm1_m, description: "XM1 m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
- {name: x_dut_xm2_m, description: "XM2 m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
- {name: x_dut_xm3_m, description: "XM3 m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
- {name: x_dut_xm4_m, description: "XM4 m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
- {name: x_dut_xm5_m, description: "XM5 m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
- {name: x_dut_xm9_m, description: "XM9 m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
- {name: x_dut_xm7_m, description: "XM7 m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
- {name: x_dut_xm10_m, description: "XM10 m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
- {name: x_dut_xm6_m, description: "XM6 m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
- {name: x_dut_xm8_m, description: "XM8 m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
