# Design variables for the ihp-sg13g2 binding. Validated against sizing.schema.json.
# XM3/XM4 mirror share (x_pmirror_*); the NMOS pair shares length (x_dut_xm0_l) but the degenerated
# leg XM0 is intentionally wider than the diode XM1 (x_dut_xm0_w > x_dut_xm1_w) so the Vgs mismatch
# develops a PTAT current across R0 (x_r0). Geometry adapted from the AnalogGym 180nm core.
schema: spicexplorer/sizing@1
pdk: ihp-sg13g2
variables:
  - {name: x_dut_xm3_w, description: "PMOS mirror device width",       default: 2.0u, min: 0.18u, max: 10u, unit: m}
  - {name: x_dut_xm3_l, description: "PMOS mirror device length",      default: 1.0u, min: 0.13u, max: 10u, unit: m}
  - {name: x_dut_xm0_w,    description: "Degenerated NMOS (XM0) width",   default: 8.0u, min: 0.18u, max: 20u, unit: m}
  - {name: x_dut_xm1_w,  description: "Diode NMOS (XM1) width",         default: 2.0u, min: 0.18u, max: 10u, unit: m}
  - {name: x_dut_xm0_l,   description: "NMOS pair length",              default: 1.0u, min: 0.13u, max: 10u, unit: m}
  - {name: x_r0,        description: "Degeneration resistor (ohms)",   default: 20000, min: 1000, max: 500000, unit: ohm}
  # Frozen per-device literals (P4 atomic sweep): defaults reproduce the authored
  # netlist literals exactly; freeze keeps them out of the search space.
  - {name: x_dut_xm3_m, description: "XM3 m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
  - {name: x_dut_xm4_m, description: "XM4 m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
  - {name: x_dut_xm0_m, description: "XM0 m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
  - {name: x_dut_xm1_m, description: "XM1 m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
