# Analysis binding for the SELF-BIASED reference amp (no ibias port) — uses the class's
# ibias-free template variant so no external current source is left driving a dangling node.
# VCM = 0.8 V is this block's TRUE in-LDO input common mode (it sits on VREF, and the divider
# tap on vinn regulates to the same level) — NOT amp_032's 1.2 V. On gf180 6 V devices this is
# a low CM for an NMOS input pair, so the tail-sink headroom is the thing to watch here.
schema: spicexplorer/analysis@1
id: cmrr_vcm
template: cmrr_vcm_selfbias
description: "CMRR (Adm/Acm) - 1 V AC common-mode on both inputs of the unity buffer, DC-band floor."
params: {VDD: 3.3, VCM: 0.8, CL: 10p, FSTART: 1k, FSTOP: 1G, PPD: 101}
flags: []
produces: [cmrr_db]
