[project]
name = "spicexplorer"
version = "0.1.0"
description = "SpiceXplorer circuit optimizer — the first platform tool (keeps the historical `spicexplorer` import name)."
requires-python = ">=3.10"
dependencies = [
    "spicexplorer-core",
    "dacite>=1.9",
    "nevergrad>=1.0",
    "numpy>=2.2",
    "pandas>=2.2.3",
    "plotly>=7.0.0",
    "psf_utils>=1.8",
    "PyYAML>=6.0.1",
    "tqdm>=4.70.0",
]

[project.optional-dependencies]
# torch ships ONLY here (owner ruling 2026-09-07): ax-platform's botorch stack brings it. Everything
# else in the platform — the scoring path, the frequency-response helpers, plotting — is numpy.
# Install with `uv sync --extra ax` / pip install 'spicexplorer[ax]'. On Linux the root's
# [tool.uv.sources] pins torch to the CPU wheel index.
ax = [
    "ax-platform>=1.3.1; python_version >= '3.11'",
    # named explicitly (botorch pulls it anyway) so the root's `torch` source applies: uv applies a
    # [tool.uv.sources] entry only to a package a member names directly — as a transitive dep the
    # CUDA wheel came down (5.3 GB venv) instead of the pinned CPU index.
    "torch>=2.14.0; python_version >= '3.11'",
]
# The layout-flow backend (`sim_engine: layout`, backends/layout.py) drives the leaf tools
# spicexplorer-layout (generator build) + spicexplorer-signoff (DRC/LVS/PEX runners). They
# are imported LAZILY inside the backend, so an ngspice-only install never needs them; the
# gdsfactory stack itself runs in a foreign interpreter (`gds_python`), and the heavy tools
# (klayout exe, kpex, PDK decks) are discovered at run time. Install with
# `uv sync --extra layout` / pip install 'spicexplorer[layout]'.
layout = ["spicexplorer-layout", "spicexplorer-signoff"]
[project.scripts]
# `spicexplorer-optimize project_setup.yaml [--budget N …]` — run one project through the
# orchestrator (any sim_engine); ephemeral overrides, best point printed at the end.
spicexplorer-optimize = "spicexplorer.optimization.run_project:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spicexplorer"]
