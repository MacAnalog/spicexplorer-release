# Analysis binding: loop-gain / stability probe of the DIFFERENTIAL loop (class stb_diff
# template — this cell is self-biased with voutp/voutn, so the SE unity-buffer probe does
# not fit). The differential unity feedback is closed by the template's CM-pinned VCVS
# network (input CM held at VCM = the ac_open_loop_diff operating point) and the loop is
# broken by antiphase Middlebrook injection at the VIPRB/VIPRBM marker pair; the probed
# transmission is exactly Add, so pm_loop crosschecks ac_open_loop's pm_deg (fresh ihp tt
# 2026-08-01: dcgain 61.72 dB / ugf 12.33 MHz / pm 25.13 deg — a MARGINAL loop at this
# hand-seeded sizing; pm_loop is expected to read the same ~25 deg, honestly failing the
# datasheet's min-60 spec).
# FSTART 0.01 is the class value (see stb.spice "CHOOSING FSTART"); gm_loop = -999 is the
# "no phase crossover in-band" sentinel, not a failure. NO Spectre lane: stb_diff has no
# spectre-benches.yaml entry (a native differential stb needs a diffstbprobe pair).
# REPORTING: `produces:` names the DATASHEET METRIC IDS this bench feeds (the class
# vocabulary registers pm_loop_deg/loopgain_db/ugf_loop_hz/gm_loop_db); the raw measures
# (loopgain_db/ugf_loop/pm_loop/gm_loop/pm_loop_first/phref_dev/phref_ok) ride the
# recorded analyses block.
schema: spicexplorer/analysis@1
id: stb
template: stb_diff
description: "Differential loop gain (stb) — loopgain_db/ugf_loop/pm_loop/gm_loop by antiphase Middlebrook injection at the VIPRB/VIPRBM pair (ngspice only)."
# FSTART 0.01 -> 1e-4 (2026-08-04): the stb bench anchors phase at its first swept point and
# blanks pm_loop/gm_loop to the -999 sentinel when |phref_dev| > 30 deg. For a high-gain amp
# the dominant pole f_p = UGF/A0 is sub-Hz, so 0.01 Hz already sits PAST it — and because
# every stabilising move lowers UGF (hence f_p), the guard fires HARDER on a correct fix than
# on the broken design. Measured on amp_006@gf180: the committed (unstable) sizing reports
# pm_loop -16.5, while the stabilised one reports -999 at 0.01 Hz and +66.0 at 1e-4. pm_loop
# and gm_loop are FSTART-INVARIANT; only the guard moves.
params:
  VDD: 1.2
  VCM: 0.6
  CL: 10p
  FSTART: 1e-4     # class value; see the stb template's "CHOOSING FSTART"
  FSTOP: 1G
  PPD: 101
flags: []
produces: [pm_loop_deg, loopgain_db, ugf_loop_hz, gm_loop_db]
