# Generic device kind -> ihp-sg13g2 device name. Cross-PDK binding generated by
# `analog-db add-binding` (per-topology override of circuitgraph's built-in table).
pdk: ihp-sg13g2
devices:
  nmos: {model: sg13_hv_nmos}   # 3.3 V rail (TI original): HV family, not lv
  pmos: {model: sg13_hv_pmos}   # 3.3 V rail (TI original): HV family, not lv
