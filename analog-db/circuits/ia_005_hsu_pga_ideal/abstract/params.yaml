  kind: shared_geometry
  members: [CA1, CB1]
  tie: [m]
  description: The always-in fixed unit cap of each bank (m=1) — cross-bank side matching; the
    weighting knobs stay per-bit (binary identity), never tied bit-to-bit.
- name: caps_bit0_m
  kind: shared_geometry
  members: [CA2, CB2]
  tie: [m]
  description: Bit-D0 switched cap of each bank (m=1) — cross-bank side matching.
