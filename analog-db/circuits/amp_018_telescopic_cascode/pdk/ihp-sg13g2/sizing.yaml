# Design variables for the ihp-sg13g2 binding. Names = the NEWCAS-optimized X_DUT_* knobs
# (lowercased; SPICE params are case-insensitive). Bounds = the legacy project_setup
# tech-constraint values. Defaults = the BEST NEWCAS run (LhsDE 2026-02-07, score 48.34 —
# distilled to results/newcas2026_best.json).
schema: spicexplorer/sizing@1
pdk: ihp-sg13g2
variables:
  - {name: x_dut_xm1_w,    description: "Input pair W",         default: 6.116280667583133e-07,  min: 0.18u, max: 200u, unit: m}
  - {name: x_dut_xm1_l,    description: "Input pair L",         default: 7.791216446889749e-07,   min: 0.18u, max: 10u,  unit: m}
  - {name: x_dut_xm1c_w,  description: "NMOS cascode W",       default: 6.96391065616068e-06,  min: 0.18u, max: 200u, unit: m}
  - {name: x_dut_xm1c_l,  description: "NMOS cascode L",       default: 9.920210290687422e-07,   min: 0.18u, max: 10u,  unit: m}
  - {name: x_dut_xm3_w,    description: "PMOS load W",          default: 1.7141886411301278e-06,  min: 0.18u, max: 200u, unit: m}
  - {name: x_dut_xm3_l,    description: "PMOS load L",          default: 5.45823761118433e-06,   min: 0.18u, max: 10u,  unit: m}
  - {name: x_dut_xm3c_w,  description: "PMOS cascode W",       default: 8.795623406543892e-06,  min: 0.18u, max: 200u, unit: m}
  - {name: x_dut_xm3c_l,  description: "PMOS cascode L",       default: 3.883557926921232e-07,   min: 0.18u, max: 10u,  unit: m}
  - {name: x_dut_xm5_w,      description: "Tail W",               default: 4.7008952481424335e-06, min: 0.18u, max: 200u, unit: m}
  - {name: x_dut_xm5_l,      description: "Tail L",               default: 3.7679599937261675e-06,   min: 0.18u, max: 10u,  unit: m}
  - {name: x_dut_xm5_ng,     description: "Tail fingers",         default: 2,        min: 1,     max: 5, is_integer: true}
  - {name: x_dut_xm6_w,      description: "Mirror ref W",         default: 8.145207701283387e-06, min: 0.18u, max: 200u, unit: m}
  - {name: x_dut_xm6_l,      description: "Mirror ref L",         default: 4.815201971218506e-06,   min: 0.18u, max: 10u,  unit: m}
  - {name: x_dut_v_bias_1,  description: "NMOS cascode bias",    default: 0.509,    min: 0,     max: 1.2,  unit: V}
  - {name: x_dut_v_bias_2,  description: "PMOS cascode bias",    default: 1.032,    min: 0,     max: 1.2,  unit: V}
  # Frozen per-device literals (P4 atomic sweep): defaults reproduce the authored
  # netlist literals exactly; freeze keeps them out of the search space.
  - {name: x_dut_xm1_m, description: "XM1 m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
  - {name: x_dut_xm2_m, description: "XM2 m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
  - {name: x_dut_xm1c_m, description: "XM1C m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
  - {name: x_dut_xm2c_m, description: "XM2C m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
  - {name: x_dut_xm3_m, description: "XM3 m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
  - {name: x_dut_xm4_m, description: "XM4 m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
  - {name: x_dut_xm3c_m, description: "XM3C m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
  - {name: x_dut_xm4c_m, description: "XM4C m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
  - {name: x_dut_xm5_m, description: "XM5 m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
  - {name: x_dut_xm6_m, description: "XM6 m (frozen literal)", default: 1, min: 1, max: 16, freeze: true, is_integer: true}
