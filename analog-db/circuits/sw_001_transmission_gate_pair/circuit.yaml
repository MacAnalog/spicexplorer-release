provenance:
  source: drawings/ccia-02-QinwenFan-chopper-ripple-reduction (hand-drawn xschem, transmission_gate_pair.sym)
  paper: "Q. Fan, F. Sebastiano, J. H. Huijsing, K. A. A. Makinwa, \"A 1.8 uW 60 nV/sqrt(Hz) Capacitively-Coupled Chopper Instrumentation Amplifier in 65 nm CMOS for Wireless Sensor Nodes\", IEEE JSSC 46(7):1534-1543, Jul. 2011"
  aliases: [transmission_gate_pair]
  designer: "Noorizadeh (schematic capture, after Fan et al.)"
  notes: >-
    The unit switch instanced throughout the CCIA's chopper and SC networks.
    The rails vdd/vss exist ONLY as the bulk connections of the two pass
