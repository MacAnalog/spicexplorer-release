# Analysis binding for the SELF-BIASED AnalogGym DUT (no ibias port) — the class's
# ibias-free template variant, same unity-buffer DC op point tran_step_biaswrap already
# proves out (Vfb wire vinn<-vout; the biaswrap Lfb/Cin is only needed to OPEN the loop).
# THD in the unity buffer: tran + the template's in-deck coherent DFT (ngspice); the Spectre
# lane composes a native pss at F0.
# F0 GRID: fresh ac_open_loop @ ihp-sg13g2 tt (2026-08-01, landed sizing) reads ugf =
# 34.84 MHz >= 30 MHz -> the campaign's top grid, F0 = 1 MHz. Do NOT trust the recorded
# scoreboard ugf (3.1 MHz) — it predates the CL=500p -> 10p standardization.
# COHERENT WINDOW (whole F0 periods, template header): TSTOP = 20u leaves 16 whole periods
# after TSTART = 4u; TSTEP = 2n = 1/(500*F0). TSTART: t_settle is UNMEASURABLE at CL=10p
# (see below) — the step transient decays into its steady limit cycle within ~2 us
# (envelope constant from 2 us on, measured on the tran_step raw), so 4u = 4 whole periods
# discards ~2x that decay. ASIG = 0.1 (class default; VCM = 0.3 +/- 0.1 V clears the
# 0/1.8 V rails with the buffer's ~15 mV systematic offset included).
# KNOWN CIRCUIT LIMITATION (not a binding artifact): this CFCC 3-stage OTA (Chong & Chan
# JSSC 2012) is compensated FOR LARGE CAPACITIVE LOADS (500 pF class); at the corpus-
# standard CL = 10p the unity-gain loop is UNSTABLE — fresh ac_open_loop pm = -63.1 deg,
# stb pm_loop = -63.4 deg, and the tran_step buffer sustains a bounded ~21 MHz limit cycle
# (9.2 mV pk-pk, constant 2 us..200 us). MEASURED in THIS bench's raw (2026-08-01): the
# oscillation injection-locks to 20 MHz = 20*F0 at 6.4 mV amplitude and rides the tone, so
# thd_pct = 1.54 % is the real large-signal behaviour at CL=10p (harmonics 2-5 only — the
# locked 20 MHz component is NOT counted in it), gain_tone = 1.009 sits just above the SE
# (0.5,1] band (closed-loop peaking of the unstable loop), and the drive-halving check
# FAILS: ASIG 0.1 -> 0.05 scales HD2 x1.70 (expect ~x2) and HD3 x1.45 (expect ~x4) — the
# a3/a4 bins are oscillation-intermod-polluted, not clean polynomial distortion. Honest
# values, kept; re-tune the SIZING (or the load class), not this window.
# REPORTING: `produces:` names DATASHEET METRIC IDS (analysis.schema.json). The template
# also prints thd_db, a1..a5, a1_in, gain_tone, vout_op; those ride the recorded
# `corners.<corner>.analyses.thd.measures` block. gain_tone < 0.5 means the dead-output
# guard fired and thd_pct is the 999 sentinel, not a measurement.
schema: spicexplorer/analysis@1
id: thd
template: thd_selfbias
description: "THD — unity-buffer large-signal sine; tran + in-deck coherent DFT (ngspice) / native PSS (Spectre)."
params: {VDD: 1.8, VCM: 300m, CL: 10p, ASIG: 0.1, F0: 1.0e6, TSTEP: 2n, TSTART: 4u, TSTOP: 20u, HARMS: 7}
flags: []
produces: [thd_pct]
