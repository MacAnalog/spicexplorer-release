# Analysis binding: two-tone IIP3 in the unity buffer (class template). 50 mV tones at
# 0.9/1.0 MHz on the 100 kHz common fundamental; TSTOP covers 10 beat periods.
# ngspice runs the tran; the Spectre lane composes a native pss at 100 kHz.
schema: spicexplorer/analysis@1
id: iip3
template: iip3
description: "IIP3 — two-tone intermodulation intercept; tran+FFT (ngspice) / native PSS (Spectre)."
params: {VDD: 1.5, VCM: 0.8, IBIAS: 20u, CL: 50f, ASIG: 0.05, F1: 0.9e6, F2: 1.0e6, TSTEP: 25n, TSTOP: 100u}
flags: []
produces: []
